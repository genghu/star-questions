        // 当前数据集索引
        let currentDatasetIndex = 0;

        // 获取当前数据点
        function getCurrentDataPoints() {
            return allDatasets[currentDatasetIndex];

        // 更新表格显示
        function updateTable() {

        // 刷新参数
        function refreshParams() {
            currentDatasetIndex = (currentDatasetIndex + 1) % allDatasets.length;
            updateTable();

            // 重置状态
            hasSubmitted = false;
            userScore = 0;

            // 根据新数据范围重置线位置
            const range = getDataRange();
            const midX = (range.minX + range.maxX) / 2;
            const midY = (range.minY + range.maxY) / 2;
            lineStart = {x: range.minX, y: midY};
            lineEnd = {x: range.maxX, y: midY};

            // 隐藏反馈和得分
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('scoreDisplay').style.display = 'none';
            document.getElementById('showCorrectBtn').style.display = 'none';

            drawPlot();
        }

        // 计算最小二乘回归线的实际值
        function calculateRegressionLine(points) {
            const n = points.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;

            points.forEach(point => {
                sumX += point.x;
                sumY += point.y;
                sumXY += point.x * point.y;
                sumX2 += point.x * point.x;
            });

            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            return {slope, intercept};
        }

        // 获取当前回归线
        function getCurrentRegression() {
            return calculateRegressionLine(getCurrentDataPoints());
        }
        
        // 绘图变量
        let canvas, ctx;
        let lineStart = {x: 1, y: 1};
        let lineEnd = {x: 10, y: 10};
        let draggingPoint = null;
        let userScore = 0;
        let hasSubmitted = false;
        let results = []; // 存储每道题的结果 [{correct: true/false, datasetIndex: 0}, ...]
        
        // 初始化画布
        function initCanvas() {
            canvas = document.createElement('canvas');
            const plotDiv = document.getElementById('scatterPlot');
            plotDiv.innerHTML = '';
            plotDiv.appendChild(canvas);

            const rect = plotDiv.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx = canvas.getContext('2d');

            // 根据当前数据范围初始化线位置
            const range = getDataRange();
            const midX = (range.minX + range.maxX) / 2;
            const midY = (range.minY + range.maxY) / 2;

            // 初始线位置 (在数据范围中间)
            lineStart = {x: range.minX, y: midY};
            lineEnd = {x: range.maxX, y: midY};

            // 添加事件监听器
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);

            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);

            drawPlot();
        }
        
        // 获取当前数据的范围
        function getDataRange() {
            const points = getCurrentDataPoints();
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            points.forEach(point => {
                minX = Math.min(minX, point.x);
                maxX = Math.max(maxX, point.x);
                minY = Math.min(minY, point.y);
                maxY = Math.max(maxY, point.y);
            });

            // 添加10%的边距
            const marginX = (maxX - minX) * 0.1 || 1;
            const marginY = (maxY - minY) * 0.1 || 1;

            return {
                minX: minX - marginX,
                maxX: maxX + marginX,
                minY: minY - marginY,
                maxY: maxY + marginY
            };
        }

        // 绘制散点图和线
        function drawPlot() {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;
            const plotWidth = width - 2 * padding;
            const plotHeight = height - 2 * padding;

            // 获取当前数据范围
            const range = getDataRange();
            const rangeX = range.maxX - range.minX;
            const rangeY = range.maxY - range.minY;

            // 清除画布
            ctx.clearRect(0, 0, width, height);

            // 绘制坐标轴
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;

            // X轴
            ctx.beginPath();
            ctx.moveTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.stroke();

            // Y轴
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.stroke();

            // 坐标轴标签
            ctx.fillStyle = '#475569';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('x', width / 2, height - 10);
            ctx.textAlign = 'left';
            ctx.fillText('y', 10, height / 2);

            // 绘制网格
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 0.5;

            // 计算刻度间隔
            const tickCount = 5;
            const tickStepX = rangeX / tickCount;
            const tickStepY = rangeY / tickCount;

            // 垂直网格线和X轴刻度标签
            for (let i = 0; i <= tickCount; i++) {
                const value = range.minX + i * tickStepX;
                const x = padding + (i / tickCount) * plotWidth;
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, height - padding);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(Math.round(value), x, height - padding + 15);
            }

            // 水平网格线和Y轴刻度标签
            for (let i = 0; i <= tickCount; i++) {
                const value = range.maxY - i * tickStepY;
                const y = padding + (i / tickCount) * plotHeight;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '12px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(Math.round(value), padding - 5, y + 4);
            }

            // 绘制数据点
            getCurrentDataPoints().forEach(point => {
                const plotX = padding + ((point.x - range.minX) / rangeX) * plotWidth;
                const plotY = height - padding - ((point.y - range.minY) / rangeY) * plotHeight;

                // 点
                ctx.fillStyle = '#3b82f6';
                ctx.beginPath();
                ctx.arc(plotX, plotY, 5, 0, Math.PI * 2);
                ctx.fill();

                // 点边框
                ctx.strokeStyle = '#1d4ed8';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // 绘制用户拖动的线
            const startX = padding + ((lineStart.x - range.minX) / rangeX) * plotWidth;
            const startY = height - padding - ((lineStart.y - range.minY) / rangeY) * plotHeight;
            const endX = padding + ((lineEnd.x - range.minX) / rangeX) * plotWidth;
            const endY = height - padding - ((lineEnd.y - range.minY) / rangeY) * plotHeight;

            ctx.strokeStyle = hasSubmitted ? (userScore >= 95 ? '#10b981' : '#ef4444') : '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // 绘制线的控制点
            drawControlPoint(startX, startY, 'start');
            drawControlPoint(endX, endY, 'end');

            // 更新方程显示
            const slope = (lineEnd.y - lineStart.y) / (lineEnd.x - lineStart.x);
            const intercept = lineStart.y - slope * lineStart.x;

            document.getElementById('slopeValue').textContent = slope.toFixed(3);
            document.getElementById('interceptValue').textContent = intercept.toFixed(3);
        }
        
        // 绘制控制点
        function drawControlPoint(x, y, type) {
            ctx.fillStyle = type === 'start' ? '#10b981' : '#ef4444';
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // 将屏幕坐标转换为数据坐标
        function screenToData(x, y) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;
            const plotWidth = width - 2 * padding;
            const plotHeight = height - 2 * padding;

            const range = getDataRange();
            const rangeX = range.maxX - range.minX;
            const rangeY = range.maxY - range.minY;

            const dataX = ((x - padding) / plotWidth) * rangeX + range.minX;
            const dataY = ((height - padding - y) / plotHeight) * rangeY + range.minY;

            return {x: dataX, y: dataY};
        }
        
        // 事件处理函数
        function handleMouseDown(e) {
            if (hasSubmitted) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 计算当前线的控制点屏幕坐标
            const range = getDataRange();
            const rangeX = range.maxX - range.minX;
            const rangeY = range.maxY - range.minY;
            const padding = 40;

            const startX = padding + ((lineStart.x - range.minX) / rangeX) * (canvas.width - 2 * padding);
            const startY = canvas.height - padding - ((lineStart.y - range.minY) / rangeY) * (canvas.height - 2 * padding);
            const endX = padding + ((lineEnd.x - range.minX) / rangeX) * (canvas.width - 2 * padding);
            const endY = canvas.height - padding - ((lineEnd.y - range.minY) / rangeY) * (canvas.height - 2 * padding);

            // 检查是否点击了控制点
            const distToStart = Math.sqrt((x - startX) ** 2 + (y - startY) ** 2);
            const distToEnd = Math.sqrt((x - endX) ** 2 + (y - endY) ** 2);

            if (distToStart < 15) {
                draggingPoint = 'start';
            } else if (distToEnd < 15) {
                draggingPoint = 'end';
            }
        }

        function handleMouseMove(e) {
            if (!draggingPoint || hasSubmitted) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dataPoint = screenToData(x, y);

            // 限制点在数据范围内
            const range = getDataRange();
            dataPoint.x = Math.max(range.minX, Math.min(range.maxX, dataPoint.x));
            dataPoint.y = Math.max(range.minY, Math.min(range.maxY, dataPoint.y));

            if (draggingPoint === 'start') {
                lineStart = dataPoint;
            } else if (draggingPoint === 'end') {
                lineEnd = dataPoint;
            }

            drawPlot();
        }

        function handleMouseUp() {
            draggingPoint = null;
        }

        // 触摸事件处理
        function handleTouchStart(e) {
            e.preventDefault();
            if (hasSubmitted) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            // 计算当前线的控制点屏幕坐标
            const range = getDataRange();
            const rangeX = range.maxX - range.minX;
            const rangeY = range.maxY - range.minY;
            const padding = 40;

            const startX = padding + ((lineStart.x - range.minX) / rangeX) * (canvas.width - 2 * padding);
            const startY = canvas.height - padding - ((lineStart.y - range.minY) / rangeY) * (canvas.height - 2 * padding);
            const endX = padding + ((lineEnd.x - range.minX) / rangeX) * (canvas.width - 2 * padding);
            const endY = canvas.height - padding - ((lineEnd.y - range.minY) / rangeY) * (canvas.height - 2 * padding);

            const distToStart = Math.sqrt((x - startX) ** 2 + (y - startY) ** 2);
            const distToEnd = Math.sqrt((x - endX) ** 2 + (y - endY) ** 2);

            if (distToStart < 20) {
                draggingPoint = 'start';
            } else if (distToEnd < 20) {
                draggingPoint = 'end';
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!draggingPoint || hasSubmitted) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            const dataPoint = screenToData(x, y);

            // 限制点在数据范围内
            const range = getDataRange();
            dataPoint.x = Math.max(range.minX, Math.min(range.maxX, dataPoint.x));
            dataPoint.y = Math.max(range.minY, Math.min(range.maxY, dataPoint.y));

            if (draggingPoint === 'start') {
                lineStart = dataPoint;
            } else if (draggingPoint === 'end') {
                lineEnd = dataPoint;
            }

            drawPlot();
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            draggingPoint = null;
        }
        
        // 计算用户线与实际回归线的相似度得分
        function calculateScore() {
            const userSlope = (lineEnd.y - lineStart.y) / (lineEnd.x - lineStart.x);
            const userIntercept = lineStart.y - userSlope * lineStart.x;
            const currentRegression = getCurrentRegression();

            // 计算斜率误差
            const slopeError = Math.abs(userSlope - currentRegression.slope) / Math.abs(currentRegression.slope);

            // 计算截距误差
            const interceptError = Math.abs(userIntercept - currentRegression.intercept) / (Math.abs(currentRegression.intercept) + 0.1);

            // 计算数据点到线的距离平方和
            let userSumSquares = 0;
            let actualSumSquares = 0;

            getCurrentDataPoints().forEach(point => {
                const userY = userSlope * point.x + userIntercept;
                const actualY = currentRegression.slope * point.x + currentRegression.intercept;

                userSumSquares += Math.pow(point.y - userY, 2);
                actualSumSquares += Math.pow(point.y - actualY, 2);
            });
            
            const fitError = Math.abs(userSumSquares - actualSumSquares) / (actualSumSquares + 0.1);
            
            // 综合得分 (100分制)
            const slopeScore = Math.max(0, 100 - slopeError * 200);
            const interceptScore = Math.max(0, 100 - interceptError * 100);
            const fitScore = Math.max(0, 100 - fitError * 50);
            
            userScore = Math.round((slopeScore * 0.4 + interceptScore * 0.3 + fitScore * 0.3) * 10) / 10;
            
            return userScore;
        }
        
        // 提交答案
        document.getElementById('submitBtn').addEventListener('click', function() {
            hasSubmitted = true;
            const score = calculateScore();
            const isCorrect = score >= 95;

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');
            const correctEquation = document.getElementById('correctEquation');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const resultIcons = document.getElementById('resultIcons');

            // 记录结果
            results.push({correct: isCorrect, datasetIndex: currentDatasetIndex});

            resultIcons.innerHTML = results.map(r =>
                `<div class="result-icon ${r.correct ? 'correct' : 'incorrect'}">${r.correct ? '✓' : '✗'}</div>`
            ).join('');

            if (isCorrect) {
                feedback.className = 'feedback correct';
                feedbackTitle.textContent = '很好！';
                feedbackText.textContent = `你绘制的回归线与实际最小二乘回归线非常接近。最小二乘回归线是使所有数据点到直线的垂直距离的平方和最小的直线。`;
            } else {
                feedback.className = 'feedback incorrect';
                feedbackTitle.textContent = '需要改进';
                feedbackText.textContent = `你绘制的回归线与实际最小二乘回归线有一定差距。尝试调整直线，使其更均匀地分布在数据点两侧。`;
            }
            
            correctEquation.textContent = `实际最小二乘回归线方程: y = ${getCurrentRegression().slope.toFixed(3)}x + ${getCurrentRegression().intercept.toFixed(3)}`;

            feedback.style.display = 'block';

            // 显示"显示正确答案"按钮
            document.getElementById('showCorrectBtn').style.display = 'inline-block';

            // 滚动到反馈区域
            feedback.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        });

        // 下一题
        document.getElementById('resetBtn').addEventListener('click', function() {
            refreshParams();
        });

        document.getElementById('showCorrectBtn').addEventListener('click', function() {

            const currentDataPoints = getCurrentDataPoints();
            const currentRegression = getCurrentRegression();

            const studentIntercept = lineStart.y - studentSlope * lineStart.x;

            // 设置线为实际回归线
            lineStart = {x: 1, y: currentRegression.slope * 1 + currentRegression.intercept};
            lineEnd = {x: 10, y: currentRegression.slope * 10 + currentRegression.intercept};

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');
            const correctEquation = document.getElementById('correctEquation');

            feedback.className = 'feedback correct';
            feedbackTitle.textContent = '正确答案与计算过程';

            // 计算详细过程
            const n = currentDataPoints.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            currentDataPoints.forEach(point => {
                sumX += point.x;
                sumY += point.y;
                sumXY += point.x * point.y;
                sumX2 += point.x * point.x;
                sumY2 += point.y * point.y;
            });
            const meanX = sumX / n;
            const meanY = sumY / n;

            // 构建计算过程HTML
            let calculationHTML = `
                <div style="background-color: #f0f9ff; padding: 15px; border-radius: 8px; margin-top: 15px;">
                    <h4 style="color: #0369a1; margin-bottom: 10px;">📊 最小二乘回归线计算过程</h4>

                            y = ${studentSlope.toFixed(3)}x + ${studentIntercept.toFixed(3)}
                        </p>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <strong>第一步：计算基本统计量</strong>
                        <ul style="margin: 8px 0; padding-left: 20px;">

                            <li>Σx = ${sumX.toFixed(2)}，均值 x̄ = ${meanX.toFixed(4)}</li>
                            <li>Σy = ${sumY.toFixed(2)}，均值 ȳ = ${meanY.toFixed(4)}</li>
                            <li>Σxy = ${sumXY.toFixed(4)}</li>
                            <li>Σx² = ${sumX2.toFixed(4)}</li>
                        </ul>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <strong>第二步：计算斜率 b</strong>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif;">
                            b = (n·Σxy - Σx·Σy) / (n·Σx² - (Σx)²)
                        </p>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif;">
                            b = (${n} × ${sumXY.toFixed(4)} - ${sumX.toFixed(2)} × ${sumY.toFixed(2)}) / (${n} × ${sumX2.toFixed(4)} - ${sumX.toFixed(2)}²)
                        </p>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif;">
                            b = (${(n * sumXY).toFixed(4)} - ${(sumX * sumY).toFixed(4)}) / (${(n * sumX2).toFixed(4)} - ${(sumX * sumX).toFixed(4)})
                        </p>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif; color: #0369a1; font-weight: 600;">
                            b = ${(n * sumXY - sumX * sumY).toFixed(4)} / ${(n * sumX2 - sumX * sumX).toFixed(4)} = ${currentRegression.slope.toFixed(4)}
                        </p>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <strong>第三步：计算截距 a</strong>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif;">
                            a = ȳ - b·x̄
                        </p>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif;">
                            a = ${meanY.toFixed(4)} - ${currentRegression.slope.toFixed(4)} × ${meanX.toFixed(4)}
                        </p>
                        <p style="margin: 8px 0; font-family: 'Cambria Math', serif; color: #0369a1; font-weight: 600;">
                            a = ${meanY.toFixed(4)} - ${(currentRegression.slope * meanX).toFixed(4)} = ${currentRegression.intercept.toFixed(4)}
                        </p>
                    </div>

                    <div style="background-color: #dcfce7; padding: 12px; border-radius: 6px; margin-top: 10px;">
                        <strong style="color: #166534;">✅ 正确答案：</strong>
                        <p style="font-size: 1.2rem; font-family: 'Cambria Math', serif; color: #166534; font-weight: 600; margin-top: 5px;">
                            y = ${currentRegression.slope.toFixed(3)}x + ${currentRegression.intercept.toFixed(3)}
                        </p>
                    </div>
                </div>
            `;

            feedbackText.innerHTML = '这是数据的最小二乘回归线。这条直线最小化了所有数据点到直线的垂直距离的平方和。' + calculationHTML;
            correctEquation.textContent = '';
