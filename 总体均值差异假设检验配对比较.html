<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值差异假设检验配对比较 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f9ff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 60, 150, 0.1);
            padding: 30px;
            overflow: hidden;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #e1ecff;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-text {
            flex: 1;
            min-width: 300px;
        }
        h1 {
            color: #2c5aa0;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #666;
            font-size: 1rem;
        }
        .refresh-params-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }
        .question-section {
            margin-bottom: 40px;
            padding: 25px;
            background-color: #f8fbff;
            border-radius: 10px;
            border-left: 5px solid #4a86e8;
        }
        .question-title {
            font-weight: 600;
            color: #2c5aa0;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .question-content {
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .data-table th, .data-table td {
            border: 1px solid #d1e0ff;
            padding: 12px 15px;
            text-align: center;
        }
        .data-table th {
            background-color: #e6f0ff;
            color: #2c5aa0;
            font-weight: 600;
        }
        .data-table tr:nth-child(even) {
            background-color: #f8fbff;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option {
            padding: 15px 20px;
            background-color: white;
            border: 2px solid #d1e0ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        .option:hover {
            background-color: #eef5ff;
            border-color: #a0c1ff;
            transform: translateY(-2px);
        }
        .option.selected {
            border-color: #4a86e8;
            background-color: #e6f0ff;
        }
        .option.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }
        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background-color: #e1ecff;
            color: #2c5aa0;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .option-text {
            flex-grow: 1;
        }
        .formula {
            font-family: 'Cambria Math', serif;
            background-color: #f0f7ff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #submitBtn {
            background-color: #4a86e8;
            color: white;
        }
        #submitBtn:hover {
            background-color: #3a76d8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(74, 134, 232, 0.3);
        }
        #resetBtn {
            background-color: #f0f0f0;
            color: #555;
        }
        #resetBtn:hover {
            background-color: #e0e0e0;
            transform: translateY(-3px);
        }
        .results {
            margin-top: 40px;
            padding: 25px;
            background-color: #f0f7ff;
            border-radius: 10px;
            display: none;
        }
        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .score {
            font-size: 1.5rem;
            color: #2c5aa0;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
            border-left: 4px solid #4a86e8;
        }
        .feedback.correct {
            border-left-color: #2ecc71;
        }
        .feedback.incorrect {
            border-left-color: #e74c3c;
        }
        .answer-key {
            font-weight: 600;
            color: #2c5aa0;
        }
        .explanation {
            margin-top: 10px;
            color: #555;
        }
        .show-explanation-btn {
            display: none;
            margin: 10px 0;
            padding: 10px 20px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            header {
                flex-direction: column;
                text-align: center;
            }
            .question-section {
                padding: 15px;
            }
            .data-table {
                font-size: 0.9rem;
            }
            .data-table th, .data-table td {
                padding: 8px 10px;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-text">
                <h1>总体均值差异假设检验配对比较</h1>
                <div class="subtitle">交互式答题练习 - 请根据题目内容选择正确答案</div>
            </div>
            <button class="refresh-params-btn" id="refreshParamsBtn">
                <span>↻</span> 刷新参数
            </button>
        </header>

        <div class="question-section" id="backgroundSection">
            <div class="question-title">题目背景</div>
            <div class="question-content" id="backgroundContent">
                <!-- 动态生成 -->
            </div>

            <table class="data-table" id="dataTable">
                <!-- 动态生成 -->
            </table>

            <div class="question-content" id="questionInstruction">
                <!-- 动态生成 -->
            </div>
        </div>

        <div id="questionsContainer">
            <!-- 动态生成 -->
        </div>

        <div class="controls">
            <button id="submitBtn">提交答案</button>
            <button id="resetBtn">重新作答</button>
        </div>

        <div id="results" class="results">
            <div class="score">得分: <span id="scoreValue">0</span>/6</div>
            <div id="feedbackContainer">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    product: "轮胎",
                    brand1: "品牌1",
                    brand2: "品牌2",
                    measureUnit: "英寸",
                    testCondition: "所有汽车在标准测试道路上行驶20,000英里后",
                    n: 10,
                    data: [
                        { car: 1, b1: 0.241, b2: 0.112, diff: 0.129 },
                        { car: 2, b1: 0.217, b2: 0.175, diff: 0.042 },
                        { car: 3, b1: 0.300, b2: 0.159, diff: 0.141 },
                        { car: 4, b1: 0.263, b2: 0.224, diff: 0.039 },
                        { car: 5, b1: 0.224, b2: 0.215, diff: 0.009 },
                        { car: 6, b1: 0.323, b2: 0.083, diff: 0.240 },
                        { car: 7, b1: 0.398, b2: 0.108, diff: 0.290 },
                        { car: 8, b1: 0.264, b2: 0.145, diff: 0.119 },
                        { car: 9, b1: 0.316, b2: 0.107, diff: 0.209 },
                        { car: 10, b1: 0.222, b2: 0.217, diff: 0.005 }
                    ],
                    meanDiff: 0.122,
                    stdDiff: 0.100,
                    tValue: 3.858,
                    df: 9,
                    criticalValue: 2.262,
                    conclusion: "yes"
                },
                {
                    product: "机油",
                    brand1: "品牌A",
                    brand2: "品牌B",
                    measureUnit: "毫升",
                    testCondition: "所有汽车在标准测试条件下运行5,000公里后",
                    n: 8,
                    data: [
                        { car: 1, b1: 0.85, b2: 0.92, diff: -0.07 },
                        { car: 2, b1: 0.78, b2: 0.88, diff: -0.10 },
                        { car: 3, b1: 0.92, b2: 0.95, diff: -0.03 },
                        { car: 4, b1: 0.81, b2: 0.89, diff: -0.08 },
                        { car: 5, b1: 0.88, b2: 0.93, diff: -0.05 },
                        { car: 6, b1: 0.75, b2: 0.86, diff: -0.11 },
                        { car: 7, b1: 0.90, b2: 0.94, diff: -0.04 },
                        { car: 8, b1: 0.82, b2: 0.91, diff: -0.09 }
                    ],
                    meanDiff: -0.071,
                    stdDiff: 0.029,
                    tValue: -6.928,
                    df: 7,
                    criticalValue: 2.365,
                    conclusion: "yes"
                },
                {
                    product: "刹车片",
                    brand1: "品牌X",
                    brand2: "品牌Y",
                    measureUnit: "毫米",
                    testCondition: "所有汽车在标准测试条件下进行100次紧急制动后",
                    n: 12,
                    data: [
                        { car: 1, b1: 1.2, b2: 1.1, diff: 0.1 },
                        { car: 2, b1: 1.3, b2: 1.2, diff: 0.1 },
                        { car: 3, b1: 1.1, b2: 1.0, diff: 0.1 },
                        { car: 4, b1: 1.4, b2: 1.3, diff: 0.1 },
                        { car: 5, b1: 1.0, b2: 1.1, diff: -0.1 },
                        { car: 6, b1: 1.2, b2: 1.1, diff: 0.1 },
                        { car: 7, b1: 1.3, b2: 1.2, diff: 0.1 },
                        { car: 8, b1: 1.1, b2: 1.2, diff: -0.1 },
                        { car: 9, b1: 1.4, b2: 1.3, diff: 0.1 },
                        { car: 10, b1: 1.2, b2: 1.1, diff: 0.1 },
                        { car: 11, b1: 1.3, b2: 1.2, diff: 0.1 },
                        { car: 12, b1: 1.1, b2: 1.1, diff: 0.0 }
                    ],
                    meanDiff: 0.075,
                    stdDiff: 0.087,
                    tValue: 2.986,
                    df: 11,
                    criticalValue: 2.201,
                    conclusion: "yes"
                },
                {
                    product: "空气滤清器",
                    brand1: "品牌M",
                    brand2: "品牌N",
                    measureUnit: "克",
                    testCondition: "所有汽车在标准测试条件下运行10,000公里后",
                    n: 9,
                    data: [
                        { car: 1, b1: 15.2, b2: 14.8, diff: 0.4 },
                        { car: 2, b1: 14.8, b2: 15.0, diff: -0.2 },
                        { car: 3, b1: 15.5, b2: 14.9, diff: 0.6 },
                        { car: 4, b1: 14.9, b2: 15.1, diff: -0.2 },
                        { car: 5, b1: 15.3, b2: 14.7, diff: 0.6 },
                        { car: 6, b1: 15.0, b2: 15.0, diff: 0.0 },
                        { car: 7, b1: 15.4, b2: 14.6, diff: 0.8 },
                        { car: 8, b1: 14.7, b2: 15.2, diff: -0.5 },
                        { car: 9, b1: 15.1, b2: 14.9, diff: 0.2 }
                    ],
                    meanDiff: 0.189,
                    stdDiff: 0.423,
                    tValue: 1.340,
                    df: 8,
                    criticalValue: 2.306,
                    conclusion: "no"
                },
                {
                    product: "火花塞",
                    brand1: "品牌P",
                    brand2: "品牌Q",
                    measureUnit: "毫米",
                    testCondition: "所有汽车在标准测试条件下运行15,000公里后",
                    n: 7,
                    data: [
                        { car: 1, b1: 0.85, b2: 0.82, diff: 0.03 },
                        { car: 2, b1: 0.88, b2: 0.85, diff: 0.03 },
                        { car: 3, b1: 0.82, b2: 0.84, diff: -0.02 },
                        { car: 4, b1: 0.90, b2: 0.86, diff: 0.04 },
                        { car: 5, b1: 0.84, b2: 0.83, diff: 0.01 },
                        { car: 6, b1: 0.87, b2: 0.85, diff: 0.02 },
                        { car: 7, b1: 0.86, b2: 0.88, diff: -0.02 }
                    ],
                    meanDiff: 0.013,
                    stdDiff: 0.023,
                    tValue: 1.496,
                    df: 6,
                    criticalValue: 2.447,
                    conclusion: "no"
                }
            ];

            let currentParamIndex = 0;
            let userAnswers = {};

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染背景
                document.getElementById('backgroundContent').innerHTML = `
一个消费品测试小组正在评估两个相互竞争的${params.product}品牌：${params.brand1}和${params.brand2}。磨损程度可能因汽车类型而有很大差异，该小组试图通过将两个品牌安装在同一随机样本的${params.n}辆汽车上来消除这种影响。具体来说，每辆汽车的前轮各装有一个品牌，其中一半随机选择的汽车在左前轮安装${params.brand1}，其余的在左前轮安装${params.brand2}。${params.testCondition}，记录磨损量（以${params.measureUnit}为单位），如表1所示。`;

                // 渲染数据表
                let tableHtml = `
                    <thead>
                        <tr>
                            <th>汽车</th>
                            <th>${params.brand1}</th>
                            <th>${params.brand2}</th>
                            <th>差值 (${params.brand1} - ${params.brand2})</th>
                        </tr>
                    </thead>
                    <tbody>
                `;
                params.data.forEach(row => {
                    tableHtml += `<tr><td>${row.car}</td><td>${row.b1}</td><td>${row.b2}</td><td>${row.diff}</td></tr>`;
                });
                tableHtml += '</tbody>';
                document.getElementById('dataTable').innerHTML = tableHtml;

                // 渲染问题说明
                document.getElementById('questionInstruction').innerHTML = `
基于这些数据，该消费者小组能否在0.05的显著性水平下，得出两个品牌的平均磨损存在差异的结论？通过执行关于μ<sub>d</sub>（即带下标字母"d"的μ）的假设检验来回答此问题，μ<sub>d</sub>是两个品牌磨损的总体均值差。假设该差异总体服从正态分布。
执行双尾检验。然后回答以下问题。将中间计算至少保留三位小数，并按照问题要求四舍五入你的答案。`;

                // 渲染问题
                const questionsHtml = `
                    <div class="question-section">
                        <div class="question-title">1. 原假设：</div>
                        <div class="question-content">H<sub>0</sub>:</div>
                        <div class="options-container">
                            <div class="option" data-question="1" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">μ<sub>d</sub> = 0</div>
                            </div>
                            <div class="option" data-question="1" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">μ<sub>d</sub> ≠ 0</div>
                            </div>
                        </div>
                    </div>

                    <div class="question-section">
                        <div class="question-title">2. 备择假设：</div>
                        <div class="question-content">H<sub>1</sub>:</div>
                        <div class="options-container">
                            <div class="option" data-question="2" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">μ<sub>d</sub> = 0</div>
                            </div>
                            <div class="option" data-question="2" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">μ<sub>d</sub> ≠ 0</div>
                            </div>
                        </div>
                    </div>

                    <div class="question-section">
                        <div class="question-title">3. 检验统计量的类型：</div>
                        <div class="options-container">
                            <div class="option" data-question="3" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">Z</div>
                            </div>
                            <div class="option" data-question="3" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">t</div>
                            </div>
                        </div>
                        <div class="question-content" style="margin-top: 20px;">自由度（如适用）：</div>
                        <div class="options-container">
                            <div class="option" data-question="3b" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">${params.n - 2}</div>
                            </div>
                            <div class="option" data-question="3b" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">${params.df}</div>
                            </div>
                            <div class="option" data-question="3b" data-option="c">
                                <div class="option-letter">C</div>
                                <div class="option-text">${params.n}</div>
                            </div>
                        </div>
                    </div>

                    <div class="question-section">
                        <div class="question-title">4. 检验统计量的值：</div>
                        <div class="question-content">（四舍五入到至少三位小数。）</div>
                        <div class="options-container">
                            <div class="option" data-question="4" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">${(Math.abs(params.tValue) * 0.6).toFixed(3)}</div>
                            </div>
                            <div class="option" data-question="4" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">${Math.abs(params.tValue).toFixed(3)}</div>
                            </div>
                            <div class="option" data-question="4" data-option="c">
                                <div class="option-letter">C</div>
                                <div class="option-text">${(Math.abs(params.tValue) * 1.2).toFixed(3)}</div>
                            </div>
                        </div>
                    </div>

                    <div class="question-section">
                        <div class="question-title">5. 在0.05显著性水平下的两个临界值：</div>
                        <div class="question-content">（四舍五入到至少三位小位。）</div>
                        <div class="options-container">
                            <div class="option" data-question="5" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">-${(params.criticalValue * 0.9).toFixed(3)} 和 ${(params.criticalValue * 0.9).toFixed(3)}</div>
                            </div>
                            <div class="option" data-question="5" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">-${params.criticalValue.toFixed(3)} 和 ${params.criticalValue.toFixed(3)}</div>
                            </div>
                            <div class="option" data-question="5" data-option="c">
                                <div class="option-letter">C</div>
                                <div class="option-text">-${(params.criticalValue * 1.1).toFixed(3)} 和 ${(params.criticalValue * 1.1).toFixed(3)}</div>
                            </div>
                        </div>
                    </div>

                    <div class="question-section">
                        <div class="question-title">6. 在0.05水平下，消费者小组能否得出两个品牌的平均磨损存在差异的结论？</div>
                        <div class="options-container">
                            <div class="option" data-question="6" data-option="a">
                                <div class="option-letter">A</div>
                                <div class="option-text">是</div>
                            </div>
                            <div class="option" data-question="6" data-option="b">
                                <div class="option-letter">B</div>
                                <div class="option-text">否</div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('questionsContainer').innerHTML = questionsHtml;

                // 渲染反馈
                const feedbackHtml = `
                    <div class="feedback" id="feedback1">
                        <div class="answer-key">1. 原假设：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 A: μ<sub>d</sub> = 0。原假设通常假设没有差异或没有效应，因此对于配对均值差异检验，原假设是总体均值差为0。</div>
                    </div>
                    <div class="feedback" id="feedback2">
                        <div class="answer-key">2. 备择假设：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 B: μ<sub>d</sub> ≠ 0。题目要求检验"两个品牌的平均磨损存在差异"，这是一个双尾检验，所以备择假设是均值差不为0。</div>
                    </div>
                    <div class="feedback" id="feedback3">
                        <div class="answer-key">3. 检验统计量的类型：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 B: t。由于总体标准差未知，且样本量较小(n=${params.n})，应使用t检验。自由度是 n-1 = ${params.df}。</div>
                    </div>
                    <div class="feedback" id="feedback4">
                        <div class="answer-key">4. 检验统计量的值：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 B: ${Math.abs(params.tValue).toFixed(3)}。根据题目提供的计算：t = (${params.meanDiff} - 0) / (${params.stdDiff} / √${params.n}) ≈ ${Math.abs(params.tValue).toFixed(3)}。</div>
                    </div>
                    <div class="feedback" id="feedback5">
                        <div class="answer-key">5. 在0.05显著性水平下的两个临界值：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 B: -${params.criticalValue.toFixed(3)} 和 ${params.criticalValue.toFixed(3)}。对于双尾t检验，自由度为${params.df}，显著性水平α=0.05，临界值为±t<sub>0.025,${params.df}</sub> = ±${params.criticalValue.toFixed(3)}。</div>
                    </div>
                    <div class="feedback" id="feedback6">
                        <div class="answer-key">6. 在0.05水平下，消费者小组能否得出两个品牌的平均磨损存在差异的结论？</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">正确答案是 ${params.conclusion === 'yes' ? 'A' : 'B'}: ${params.conclusion === 'yes' ? '是' : '否'}。因为检验统计量|t|=${Math.abs(params.tValue).toFixed(3)} ${params.conclusion === 'yes' ? '>' : '<'} ${params.criticalValue.toFixed(3)}，${params.conclusion === 'yes' ? '落在拒绝域内，所以拒绝原假设，可以认为两个品牌的平均磨损存在差异' : '未落在拒绝域内，所以不能拒绝原假设，不能认为两个品牌的平均磨损存在显著差异'}。</div>
                    </div>
                    <div class="feedback" style="margin-top: 25px; background-color: #e6f0ff;">
                        <div class="answer-key">总结：</div>
                        <button class="show-explanation-btn" style="display:none;">查看答案解析</button>
                        <div class="explanation" style="display:none;">这是一个配对样本t检验的典型案例。通过在同一组汽车上测试两个品牌，消除了汽车类型对磨损的影响。检验结果显示，在0.05显著性水平下，${params.conclusion === 'yes' ? '两个品牌的平均磨损存在显著差异' : '不能认为两个品牌的平均磨损存在显著差异'}。</div>
                    </div>
                `;
                document.getElementById('feedbackContainer').innerHTML = feedbackHtml;

                // 重新初始化用户答案
                userAnswers = { 1: null, 2: null, 3: null, '3b': null, 4: null, 5: null, 6: null };

                // 重新绑定选项点击事件
                bindOptionEvents();

                // 重新绑定解析按钮事件
                bindExplanationEvents();
            }

            function bindOptionEvents() {
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionId = this.getAttribute('data-question');
                        const optionValue = this.getAttribute('data-option');

                        document.querySelectorAll(`.option[data-question="${questionId}"]`).forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        this.classList.add('selected');
                        userAnswers[questionId] = optionValue;
                    });
                });
            }

            function bindExplanationEvents() {
                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        var explanation = this.nextElementSibling;
                        if (explanation) {
                            if (explanation.style.display === 'none' || explanation.style.display === '') {
                                explanation.style.display = 'block';
                                this.textContent = '隐藏答案解析';
                            } else {
                                explanation.style.display = 'none';
                                this.textContent = '查看答案解析';
                            }
                        }
                    });
                });
            }

            function getCorrectAnswers() {
                const params = questionParams[currentParamIndex];
                return {
                    1: 'a',
                    2: 'b',
                    3: 'b',
                    '3b': 'b',
                    4: 'b',
                    5: 'b',
                    6: params.conclusion === 'yes' ? 'a' : 'b'
                };
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                userAnswers = { 1: null, 2: null, 3: null, '3b': null, 4: null, 5: null, 6: null };

                // 隐藏结果区域
                document.getElementById('results').classList.remove('show');

                // 隐藏解析按钮和解析内容
                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.style.display = 'none';
                    btn.textContent = '查看答案解析';
                });
                document.querySelectorAll('.explanation').forEach(exp => {
                    exp.style.display = 'none';
                });

                // 清除反馈样式
                document.querySelectorAll('.feedback').forEach(feedback => {
                    feedback.classList.remove('correct', 'incorrect');
                });

                // 启用提交按钮
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = '提交答案';
                submitBtn.style.backgroundColor = '#4a86e8';

                // 重新渲染
                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refreshParamsBtn').addEventListener('click', function() {
                refreshParams();
            });

            // 提交按钮事件
            document.getElementById('submitBtn').addEventListener('click', function() {
                const correctAnswers = getCorrectAnswers();
                let score = 0;
                const totalQuestions = Object.keys(correctAnswers).length;

                for (const [questionId, correctAnswer] of Object.entries(correctAnswers)) {
                    const userAnswer = userAnswers[questionId];
                    const options = document.querySelectorAll(`.option[data-question="${questionId}"]`);

                    if (userAnswer) {
                        const userOption = document.querySelector(`.option[data-question="${questionId}"][data-option="${userAnswer}"]`);
                        if (userOption) {
                            if (userAnswer === correctAnswer) {
                                score++;
                                userOption.classList.add('correct');
                            } else {
                                userOption.classList.add('incorrect');
                            }
                        }
                    }

                    const feedbackElement = document.getElementById(`feedback${questionId.replace('3b', '3')}`);
                    if (feedbackElement) {
                        if (userAnswer === correctAnswer) {
                            feedbackElement.classList.add('correct');
                        } else {
                            feedbackElement.classList.add('incorrect');
                        }
                    }
                }

                document.getElementById('scoreValue').textContent = score;
                document.getElementById('results').classList.add('show');

                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.style.display = 'inline-block';
                });

                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

                this.disabled = true;
                this.textContent = '已提交';
                this.style.backgroundColor = '#aaa';
            });

            // 重新作答按钮事件
            document.getElementById('resetBtn').addEventListener('click', function() {
                userAnswers = { 1: null, 2: null, 3: null, '3b': null, 4: null, 5: null, 6: null };

                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                });

                document.getElementById('results').classList.remove('show');

                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.style.display = 'none';
                    btn.textContent = '查看答案解析';
                });
                document.querySelectorAll('.explanation').forEach(exp => {
                    exp.style.display = 'none';
                });

                document.querySelectorAll('.feedback').forEach(feedback => {
                    feedback.classList.remove('correct', 'incorrect');
                });

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = '提交答案';
                submitBtn.style.backgroundColor = '#4a86e8';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
