<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝叶斯定理 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }


        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 100, 150, 0.1);
            overflow: hidden;
            padding: 30px;
        }


        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            margin-bottom: 40px;
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #3498db;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-title {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #34495e;
            white-space: pre-line;
        }

        .notation-box {
            background-color: #e8f4fc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px dashed #3498db;
        }

        .notation-box h3 {
            color: #2980b9;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .notation-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .notation-item {
            padding: 8px 12px;
            background-color: white;
            border-radius: 8px;
            border-left: 3px solid #3498db;
        }

        .formula-box {
            background-color: #f1f8ff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
            color: #2c3e50;
            border: 1px solid #d1e3f8;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .option {
            background-color: white;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.15);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            background-color: #3498db;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e0e7ff;
        }

        #reset-btn:hover {
            background-color: #e9ecef;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.1);
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background-color: #f8fafc;
            display: none;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }

        .result-icon.correct {
            background-color: #2ecc71;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
        }

        .result-title {
            font-size: 1.8rem;
            color: #2c3e50;
        }

        .result-content {
            font-size: 1.1rem;
            color: #34495e;
            margin-bottom: 20px;
        }

        .score-container {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .score-box {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            min-width: 150px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }

        .score-label {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .explanation-box {
            background-color: #e8f4fc;
            border-radius: 10px;
            padding: 25px;
            margin-top: 25px;
            border-left: 5px solid #3498db;
        }

        .explanation-title {
            color: #2980b9;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1.1rem;
            color: #2c3e50;
            line-height: 1.7;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .highlight {
            background-color: #fffacd;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> 贝叶斯定理</h1>
            <p class="subtitle">交互式概率问题 - 根据已知条件计算条件概率</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <div class="question-title">贝叶斯定理问题</div>
                <button class="refresh-params-btn" id="refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                    刷新参数
                </button>
            </div>

            <div class="question-content" id="question-content">
                <!-- 动态生成 -->
            </div>

            <div class="notation-box" id="notation-box">
                <h3><i class="fas fa-list-ul"></i> 符号表示</h3>
                <div class="notation-list" id="notation-list">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="formula-box" id="formula-box">
                我们需要求的条件概率： P(C|O) = P(C intersection O) / P(O)
            </div>

            <div class="question-content" id="given-conditions">
                <!-- 动态生成 -->
            </div>

            <h3 style="margin: 25px 0 15px 0; color: #2c3e50;">请选择正确答案:</h3>

            <div class="options-container" id="options-container">
                <!-- 动态生成 -->
            </div>

            <div class="controls">
                <button id="submit-btn">
                    <i class="fas fa-paper-plane"></i> 提交答案
                </button>
                <button id="reset-btn">
                    <i class="fas fa-redo-alt"></i> 重新作答
                </button>
            </div>
        </div>

        <div class="result-container" id="result-container">
            <div class="result-header">
                <div class="result-icon" id="result-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="result-title" id="result-title">答案正确!</div>
            </div>

            <div class="result-content" id="result-content">
                您选择了 <span id="user-answer" class="highlight">0.42</span>。
            </div>

            <div class="score-container">
                <div class="score-box">
                    <div class="score-value" id="score-value">1/1</div>
                    <div class="score-label">得分</div>
                </div>

                <div class="score-box">
                    <div class="score-value" id="accuracy-value">100%</div>
                    <div class="score-label">正确率</div>
                </div>

                <div class="score-box">
                    <div class="score-value" id="attempts-value">1</div>
                    <div class="score-label">尝试次数</div>
                </div>
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-box" id="explanation-section" style="display:none;">
                <div class="explanation-title">
                    <i class="fas fa-lightbulb"></i> 解题步骤与贝叶斯定理应用
                </div>
                <div class="explanation-content" id="explanation-content">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 贝叶斯定理问题: P(C|O) = P(O|C) * P(C) / [P(O|C) * P(C) + P(O|B) * P(B)]
            const questionParams = [
                {
                    name: 'Archie',
                    context: '赶去学校参加考试',
                    vehicle1: '开车',
                    vehicle2: '坐公交车',
                    probOnTimeCar: 0.5,      // P(O|C)
                    probLateBus: 0.3,       // P(N|B)
                    coinFlip: true,         // 抛硬币选择
                    answer: '0.42',
                    options: ['0.36', '0.42', '0.50', '0.58'],
                    calculation: {
                        probOnTimeBus: 0.7,  // P(O|B) = 1 - P(N|B)
                        probCar: 0.5,        // P(C)
                        probBus: 0.5,        // P(B)
                        numerator: 0.25,     // P(O|C) * P(C)
                        denominator: 0.60,   // P(O|C) * P(C) + P(O|B) * P(B)
                        result: 0.4167
                    }
                },
                {
                    name: '小明',
                    context: '去看电影',
                    vehicle1: '骑车',
                    vehicle2: '坐地铁',
                    probOnTimeCar: 0.7,
                    probLateBus: 0.2,
                    coinFlip: true,
                    answer: '0.54',
                    options: ['0.46', '0.50', '0.54', '0.61'],
                    calculation: {
                        probOnTimeBus: 0.8,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.35,
                        denominator: 0.65,
                        result: 0.5385
                    }
                },
                {
                    name: '小红',
                    context: '去上班',
                    vehicle1: '开车',
                    vehicle2: '坐公交',
                    probOnTimeCar: 0.6,
                    probLateBus: 0.25,
                    coinFlip: true,
                    answer: '0.52',
                    options: ['0.44', '0.48', '0.52', '0.56'],
                    calculation: {
                        probOnTimeBus: 0.75,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.30,
                        denominator: 0.575,
                        result: 0.5217
                    }
                },
                {
                    name: '小李',
                    context: '去参加面试',
                    vehicle1: '打车',
                    vehicle2: '坐地铁',
                    probOnTimeCar: 0.8,
                    probLateBus: 0.15,
                    coinFlip: true,
                    answer: '0.62',
                    options: ['0.54', '0.58', '0.62', '0.66'],
                    calculation: {
                        probOnTimeBus: 0.85,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.40,
                        denominator: 0.65,
                        result: 0.6154
                    }
                },
                {
                    name: '小王',
                    context: '去机场',
                    vehicle1: '开车',
                    vehicle2: '坐机场大巴',
                    probOnTimeCar: 0.65,
                    probLateBus: 0.35,
                    coinFlip: true,
                    answer: '0.51',
                    options: ['0.43', '0.47', '0.51', '0.55'],
                    calculation: {
                        probOnTimeBus: 0.65,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.325,
                        denominator: 0.6375,
                        result: 0.5098
                    }
                },
                {
                    name: '小张',
                    context: '去约会',
                    vehicle1: '骑车',
                    vehicle2: '坐公交',
                    probOnTimeCar: 0.75,
                    probLateBus: 0.4,
                    coinFlip: true,
                    answer: '0.67',
                    options: ['0.59', '0.63', '0.67', '0.71'],
                    calculation: {
                        probOnTimeBus: 0.6,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.375,
                        denominator: 0.5625,
                        result: 0.6667
                    }
                },
                {
                    name: '小陈',
                    context: '去参加婚礼',
                    vehicle1: '开车',
                    vehicle2: '坐高铁',
                    probOnTimeCar: 0.55,
                    probLateBus: 0.1,
                    coinFlip: true,
                    answer: '0.42',
                    options: ['0.34', '0.38', '0.42', '0.46'],
                    calculation: {
                        probOnTimeBus: 0.9,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.275,
                        denominator: 0.65,
                        result: 0.4231
                    }
                },
                {
                    name: '小刘',
                    context: '去参加比赛',
                    vehicle1: '骑车',
                    vehicle2: '打车',
                    probOnTimeCar: 0.85,
                    probLateBus: 0.2,
                    coinFlip: true,
                    answer: '0.63',
                    options: ['0.55', '0.59', '0.63', '0.67'],
                    calculation: {
                        probOnTimeBus: 0.8,
                        probCar: 0.5,
                        probBus: 0.5,
                        numerator: 0.425,
                        denominator: 0.675,
                        result: 0.6296
                    }
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionContent = document.getElementById('question-content');
                const notationList = document.getElementById('notation-list');
                const givenConditions = document.getElementById('given-conditions');
                const optionsContainer = document.getElementById('options-container');
                const explanationContent = document.getElementById('explanation-content');

                // 渲染问题内容
                questionContent.innerHTML = `
                    ${params.name}今天早上必须${params.context}，但他起晚了。他可以${params.vehicle2}，也可以开他那辆不太可靠的汽车。如果他开车，根据以往经验，${params.name}知道他能顺利到达而不抛锚的概率是${params.probOnTimeCar}。然而，去${params.context.replace('去', '')}的${params.vehicle2.replace('坐', '')}有${Math.round(params.probLateBus * 100)}%的几率会晚点. ${params.name}决定通过抛硬币来选择出行方式.假设${params.name}确实准时赶到了.那么他开车的概率是多少?将你的答案四舍五入到两位小数。
                `;

                // 渲染符号列表
                notationList.innerHTML = `
                    <div class="notation-item"><span class="highlight">C</span> 表示${params.name}${params.vehicle1}去的事件</div>
                    <div class="notation-item"><span class="highlight">O</span> 表示${params.name}准时到达的事件</div>
                    <div class="notation-item"><span class="highlight">B</span> 表示${params.name}${params.vehicle2}去的事件</div>
                    <div class="notation-item"><span class="highlight">N</span> 表示${params.name}未能准时到达的事件</div>
                `;

                // 渲染已知条件
                const probOnTimeBus = 1 - params.probLateBus;
                givenConditions.innerHTML = `
                    已知条件:
                    <ul style="margin-left: 20px; margin-top: 10px;">
                        <li>P(O|C) = ${params.probOnTimeCar} (${params.vehicle1.replace('坐', '').replace('开', '')}准时到达的概率)</li>
                        <li>p(N|B) = ${params.probLateBus} (${params.vehicle2.replace('坐', '')}迟到的概率)</li>
                        <li>p(O|B) = ${probOnTimeBus} (${params.vehicle2.replace('坐', '').replace('开', '')}准时的概率)</li>
                        <li>p(C) = p(B) = 0.5 (抛硬币选择出行方式)</li>
                    </ul>
                `;

                // 渲染选项
                optionsContainer.innerHTML = params.options.map((opt, idx) => `
                    <div class="option" data-value="${opt}" ${opt === params.answer ? 'data-correct="true"' : ''}>
                        <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                        <div class="option-text">${opt}</div>
                    </div>
                `).join('');

                // 渲染解析
                const calc = params.calculation;
                explanationContent.innerHTML = `
                    <p>根据贝叶斯定理:</p>
                    <p class="math">P(C|O) = P(O|C) * P(C) / [ P(O|C) * P(C) + P(O|B) * P(B) ]</p>
                    <p>代入已知数值:</p>
                    <p class="math">P(C|O) = (${params.probOnTimeCar} * ${calc.probCar}) / [ (${params.probOnTimeCar} * ${calc.probCar}) + (${calc.probOnTimeBus} * ${calc.probBus}) ]</p>
                    <p class="math">P(C|O) = ${calc.numerator} / [ ${calc.numerator} + ${calc.probOnTimeBus * calc.probBus} ] = ${calc.numerator} / ${calc.denominator} = ${calc.result.toFixed(4)}</p>
                    <p>四舍五入到两位小数:<span class="highlight">${params.answer}</span></p>
                    <p style="margin-top: 15px;">因此,在已知${params.name}准时到达的条件下,他开车的概率约为${params.answer}.</p>
                `;

                // 重新绑定选项点击事件
                bindOptionEvents();
            }

            function bindOptionEvents() {
                const options = document.querySelectorAll('.option');
                options.forEach(option => {
                    option.addEventListener('click', function() {
                        if (isSubmitted) return;

                        // 移除之前的选择
                    options.forEach(opt => opt.classList.remove('selected'));

                    // 设置当前选择
                    this.classList.add('selected');
                    selectedOption = this.getAttribute('data-value');
                });
            });
            }


            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);


                currentParamIndex = newIndex;
                renderQuestion();

                // 清除选中状态
                selectedOption = null;

                // 隐藏结果和解析
                const resultContainer = document.getElementById('result-container');
                resultContainer.style.display = 'none';
                const explanationSection = document.getElementById('explanation-section');
                explanationSection.style.display = 'none';
                const showExpBtn = document.getElementById('show-explanation-btn');
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';
            }

            // ==================== 事件处理 ====================

            let selectedOption = null;
            let isSubmitted = false;
            let attempts = 0;
            let correctAnswers = 0;

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const resultContainer = document.getElementById('result-container');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultContent = document.getElementById('result-content');
            const userAnswerSpan = document.getElementById('user-answer');
            const scoreValue = document.getElementById('score-value');
            const accuracyValue = document.getElementById('accuracy-value');
            const attemptsValue = document.getElementById('attempts-value');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');

            // 刷新参数按钮
            refreshBtn.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (!selectedOption) {
                    alert('请先选择一个答案!');
                    return;
                }

                if (isSubmitted) return;

                attempts++;
                isSubmitted = true;

                // 显示结果容器
                resultContainer.style.display = 'block';

                const params = questionParams[currentParamIndex];

                // 检查答案
                const isCorrect = selectedOption === params.answer;

                // 更新选项样式
                document.querySelectorAll('.option').forEach(option => {
                    const optionValue = option.getAttribute('data-value');

                    // Only mark incorrect, don't reveal correct answer
                    if (optionValue === selectedOption && !isCorrect) {
                        option.classList.add('incorrect');
                    }

                    // 禁用所有选项
                    option.style.pointerEvents = 'none';
                });

                // 更新结果显示
                if (isCorrect) {
                    correctAnswers++;
                    resultIcon.className = 'result-icon correct';
                    resultIcon.innerHTML = '<i class="fas fa-check"></i>';
                    resultTitle.textContent = '答案正确!';
                    resultContent.innerHTML = `您选择了 <span class="highlight">${selectedOption}</span>。`;
                } else {
                    resultIcon.className = 'result-icon incorrect';
                    resultIcon.innerHTML = '<i class="fas fa-times"></i>';
                    resultTitle.textContent = '答案不正确';
                    resultContent.innerHTML = `您选择了 <span class="highlight">${selectedOption}</span>。`;
                }

                // 更新统计数据
                updateStats();

                // 显示解析按钮
                showExplanationBtn.style.display = 'inline-block';
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                // 重置状态
                isSubmitted = false;
                selectedOption = null;

                // 重置选项样式
                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                    option.style.pointerEvents = 'auto';
                });

                // 隐藏结果容器
                resultContainer.style.display = 'none';

                // 滚动到问题区域
                document.querySelector('.question-container').scrollIntoView({ behavior: 'smooth' });
            });

            // 更新统计数据
            function updateStats() {
                scoreValue.textContent = `${correctAnswers}/${attempts}`;

                const accuracy = attempts > 0 ? Math.round((correctAnswers / attempts) * 100) : 0;
                accuracyValue.textContent = `${accuracy}%`;

                attemptsValue.textContent = attempts;
            }

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
