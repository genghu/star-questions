            background-color: #1a5fb4;
            border-radius: 4px;
            margin-right: 12px;
        }

            cursor: pointer;
            font-size: 0.9rem;

        }

            margin-bottom: 15px;
        }

            padding: 15px;
            text-align: center;

        }

        .histogram-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e6f0ff;
        }

            background-color: #f8fafd;
        }

        .histogram-table tr:hover {
            background-color: #e6f0ff;
        }

            padding: 20px;
            border-radius: 10px;

            font-family: 'Cambria Math', serif;
            font-size: 1.1rem;
            text-align: center;
            border: 1px dashed #4dabf7;

            background-color: #f0f7ff;
            border-radius: 12px;

        .input-label {

            font-weight: 600;

            color: #1a5fb4;

        </section>

        <section class="answer-input-section">

            <label class="input-label" for="userAnswer">请输入你的答案（至少保留一位小数）：</label>
            <input type="number" id="userAnswer" class="answer-input" step="0.1">

            <div class="button-group">
                <button id="submitBtn" class="btn btn-primary">
                    <span class="btn-icon">✓</span> 提交答案
                </button>
            </div>
        </section>

        <section id="feedbackCorrect" class="feedback-section feedback-correct">
            <h3 class="feedback-title"><span class="feedback-icon">✓</span> 回答正确！</h3>
            <p>恭喜你！你的答案 <span class="highlight" id="correctAnswerDisplay"></span> 是正确的。</p>
            <div class="calculation-steps" id="calcStepsCorrect">
                <!-- 动态生成 -->
            </div>
        </section>

        <section id="feedbackIncorrect" class="feedback-section feedback-incorrect">
            <h3 class="feedback-title"><span class="feedback-icon">✗</span> 回答不正确</h3>
            <p>你的答案 <span class="highlight" id="incorrectAnswerDisplay"></span> 不正确。</p>
            <p><strong>提示：</strong>确保你使用了正确的组中值，并且将所有组的加权和除以总频数。点击"查看答案解析"了解详细计算过程。</p>
        </section>

        <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
        <div class="explanation-section" id="explanation-section" style="display:none;">
            <div class="calculation-steps" id="explanationContent">
                <!-- 动态生成 -->
            </div>
        </section>

                {
                    description: "一项针对100名上班族每日咖啡饮用杯数的调查结果",
                    totalStudents: 100,
                    dataLabel: "咖啡杯数",
                    countLabel: "名上班族",
                    questionLabel: "上班族的平均每日咖啡饮用杯数",
                    histogramTitle: "每日咖啡饮用杯数分布直方图",
                    ranges: [
                        { range: "0 到 1", freq: 15, midpoint: 0.5 },
                        { range: "1 到 2", freq: 32, midpoint: 1.5 },
                        { range: "2 到 3", freq: 28, midpoint: 2.5 },
                        { range: "3 到 4", freq: 18, midpoint: 3.5 },
                        { range: "4 到 5", freq: 7, midpoint: 4.5 }
                    ],
                    answer: 2.2
                },
                {
                    description: "一项针对135名健身爱好者每日运动时长（分钟）的调查结果",
                    totalStudents: 135,
                    dataLabel: "运动时长",
                    countLabel: "名健身爱好者",
                    questionLabel: "健身爱好者的平均每日运动时长",
                    histogramTitle: "每日运动时长分布直方图",
                    ranges: [
                        { range: "10 到 20", freq: 18, midpoint: 15 },
                        { range: "20 到 30", freq: 35, midpoint: 25 },
                        { range: "30 到 40", freq: 42, midpoint: 35 },
                        { range: "40 到 50", freq: 28, midpoint: 45 },
                        { range: "50 到 60", freq: 12, midpoint: 55 }
                    ],
                    answer: 33.6
                },
                {
                    description: "一项针对110名城市居民每周外出就餐支出（元）的调查结果",
                    totalStudents: 110,
                    dataLabel: "外出就餐支出",
                    countLabel: "名居民",
                    questionLabel: "居民的平均每周外出就餐支出",
                    histogramTitle: "每周外出就餐支出分布直方图",
                    ranges: [
                        { range: "50 到 100", freq: 22, midpoint: 75 },
                        { range: "100 到 150", freq: 38, midpoint: 125 },
                        { range: "150 到 200", freq: 28, midpoint: 175 },
                        { range: "200 到 250", freq: 15, midpoint: 225 },
                        { range: "250 到 300", freq: 7, midpoint: 275 }
                    ],
                    answer: 150.9
                },
                {
                    description: "一项针对100人每日饮水量（升）的调查结果",
                    totalStudents: 100,
                    dataLabel: "饮水量",
                    countLabel: "人",
                    questionLabel: "人的平均每日饮水量",
                    histogramTitle: "每日饮水量分布直方图",
                    ranges: [
                        { range: "1 到 1.5", freq: 12, midpoint: 1.25 },
                        { range: "1.5 到 2", freq: 28, midpoint: 1.75 },
                        { range: "2 到 2.5", freq: 35, midpoint: 2.25 },
                        { range: "2.5 到 3", freq: 18, midpoint: 2.75 },
                        { range: "3 到 3.5", freq: 7, midpoint: 3.25 }
                    ],
                    answer: 2.2
                }
            ];

            let currentParamIndex = 0;

            // 获取DOM元素
            const userAnswerInput = document.getElementById('userAnswer');
            const submitBtn = document.getElementById('submitBtn');
            const refreshParamsBtn = document.getElementById('refreshParamsBtn');
            const feedbackCorrect = document.getElementById('feedbackCorrect');
            const feedbackIncorrect = document.getElementById('feedbackIncorrect');
            const correctAnswerDisplay = document.getElementById('correctAnswerDisplay');
            const incorrectAnswerDisplay = document.getElementById('incorrectAnswerDisplay');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionContent = document.getElementById('questionContent');

                questionContent.innerHTML = `
                    <p>某期刊刚刚发布了${params.description}。以下直方图总结了这${params.totalStudents}${params.countLabel}的${params.dataLabel}信息：</p>
                    <div class="histogram-container">
                        <h3 class="histogram-title">${params.histogramTitle}</h3>
                        <canvas id="histogramCanvas" width="600" height="350"></canvas>
                        <div class="histogram-legend">
                            <div class="legend-item">
                                <div class="legend-color" style="background-color: #4dabf7;"></div>
                                <span>频数 (${params.countLabel}数)</span>
                            </div>
                        </div>
                    </div>
                    <p><strong>问题：</strong>根据直方图，估计${params.questionLabel}。中间计算至少保留四位小数，最终答案至少保留一位小数。</p>
                `;

                // 绘制直方图
                drawHistogram(params);
            }

            // 绘制直方图函数
            function drawHistogram(params) {
                const canvas = document.getElementById('histogramCanvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                // 清除画布
                ctx.clearRect(0, 0, width, height);

                // 设置边距
                const margin = { top: 30, right: 30, bottom: 60, left: 60 };
                const chartWidth = width - margin.left - margin.right;
                const chartHeight = height - margin.top - margin.bottom;

                // 数据
                const data = params.ranges;
                const maxFreq = Math.max(...data.map(d => d.freq));

                // 绘制背景
                ctx.fillStyle = '#f8fafd';
                ctx.fillRect(margin.left, margin.top, chartWidth, chartHeight);

                // 绘制网格线
                ctx.strokeStyle = '#e6f0ff';
                ctx.lineWidth = 1;
                const ySteps = 5;
                for (let i = 0; i <= ySteps; i++) {
                    const y = margin.top + (chartHeight / ySteps) * i;
                    ctx.beginPath();
                    ctx.moveTo(margin.left, y);
                    ctx.lineTo(width - margin.right, y);
                    ctx.stroke();
                }

                // 绘制直方图条形（无间隙）
                const barWidth = chartWidth / data.length;
                const colors = ['#4dabf7', '#5cb8ff', '#6dc4ff', '#7ed0ff', '#8fdcff'];
                const darkerColors = ['#2d8bdb', '#3da0ef', '#4dacf3', '#5db8f7', '#6dc4fb'];

                // 解析范围获取边界值
                const boundaries = [];
                data.forEach((d, i) => {
                    const parts = d.range.split(' 到 ');
                    if (i === 0) boundaries.push(parseInt(parts[0]));
                    boundaries.push(parseInt(parts[1]));
                });

                data.forEach((d, i) => {
                    const x = margin.left + i * barWidth;
                    const barHeight = (d.freq / maxFreq) * chartHeight;
                    const y = margin.top + chartHeight - barHeight;

                    // 绘制条形渐变
                    const gradient = ctx.createLinearGradient(x, y, x, margin.top + chartHeight);
                    gradient.addColorStop(0, colors[i % colors.length]);
                    gradient.addColorStop(1, darkerColors[i % darkerColors.length]);

                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, barWidth, barHeight);

                    // 绘制条形边框
                    ctx.strokeStyle = darkerColors[i % darkerColors.length];
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, barWidth, barHeight);

                    // 在条形上方显示频数值
                    ctx.fillStyle = '#1a5fb4';
                    ctx.font = 'bold 14px Segoe UI, Microsoft YaHei, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(d.freq, x + barWidth / 2, y - 8);
                });

                // 绘制X轴刻度和标签（在每个边界位置）
                ctx.fillStyle = '#5d7ea3';
                ctx.font = '12px Segoe UI, Microsoft YaHei, sans-serif';
                ctx.textAlign = 'center';

                boundaries.forEach((boundary, i) => {
                    const x = margin.left + i * barWidth;
                    // 绘制刻度线
                    ctx.strokeStyle = '#1a5fb4';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, margin.top + chartHeight);
                    ctx.lineTo(x, margin.top + chartHeight + 5);
                    ctx.stroke();
                    // 绘制刻度标签
                    ctx.fillText(boundary.toString(), x, margin.top + chartHeight + 20);
                });

                // 绘制Y轴
                ctx.strokeStyle = '#1a5fb4';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(margin.left, margin.top);
                ctx.lineTo(margin.left, margin.top + chartHeight);
                ctx.stroke();

                // Y轴标签
                ctx.fillStyle = '#1a5fb4';
                ctx.font = 'bold 14px Segoe UI, Microsoft YaHei, sans-serif';
                ctx.textAlign = 'center';
                ctx.save();
                ctx.translate(20, margin.top + chartHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText('频数', 0, 0);
                ctx.restore();

                // Y轴刻度
                ctx.fillStyle = '#5d7ea3';
                ctx.font = '12px Segoe UI, Microsoft YaHei, sans-serif';
                ctx.textAlign = 'right';
                for (let i = 0; i <= ySteps; i++) {
                    const value = Math.round(maxFreq - (maxFreq / ySteps) * i);
                    const y = margin.top + (chartHeight / ySteps) * i;
                    ctx.fillText(value.toString(), margin.left - 10, y + 4);
                }

                // 绘制X轴
                ctx.strokeStyle = '#1a5fb4';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(margin.left, margin.top + chartHeight);
                ctx.lineTo(width - margin.right, margin.top + chartHeight);
                ctx.stroke();

                // X轴标签
                ctx.fillStyle = '#1a5fb4';
                ctx.font = 'bold 14px Segoe UI, Microsoft YaHei, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(params.dataLabel, width / 2, height - 10);
            }

            function renderExplanation() {
                const params = questionParams[currentParamIndex];
                const calcStepsCorrect = document.getElementById('calcStepsCorrect');
                const explanationContent = document.getElementById('explanationContent');

                let tableRows = '';
                params.ranges.forEach(r => {
                    tableRows += `<tr><td>${r.range}</td><td>${r.freq}</td><td>${r.midpoint}</td></tr>`;
                });

                let weightedProducts = params.ranges.map(r => `${r.freq} × ${r.midpoint} = ${(r.freq * r.midpoint).toLocaleString()}`);
                let weightedSum = params.ranges.reduce((sum, r) => sum + r.freq * r.midpoint, 0);

                calcStepsCorrect.innerHTML = `
                    <h4>数据表格：</h4>
                    <table class="histogram-table">
                        <thead>
                            <tr>
                                <th>${params.dataLabel}</th>
                                <th>频数</th>
                                <th>组中值</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <h4>详细计算步骤：</h4>
                    <div class="calculation-step">
                        <p><strong>步骤 1:</strong> 计算每个组的加权和 (频数 × 组中值)</p>
                        ${weightedProducts.map(p => `<p>${p}</p>`).join('')}
                    </div>
                    <div class="calculation-step">
                        <p><strong>步骤 2:</strong> 计算加权总和</p>
                        <p>${weightedProducts.join(' + ')} = <span class="highlight">${weightedSum.toLocaleString()}</span></p>
                    </div>
                    <div class="calculation-step">
                        <p><strong>步骤 3:</strong> 除以总频数 (数据总数)</p>
                        <p>${weightedSum.toLocaleString()} ÷ ${params.totalStudents} = <span class="highlight">${(weightedSum / params.totalStudents).toFixed(4)}...</span></p>
                    </div>
                    <div class="calculation-step">
                        <p><strong>步骤 4:</strong> 保留一位小数</p>
                        <p>${(weightedSum / params.totalStudents).toFixed(4)} ≈ <span class="highlight">${params.answer}</span></p>
                    </div>
                    <div class="calculation-step">
                        <p><strong>公式应用:</strong> x̄ ≈ (${params.ranges.map(r => `${r.freq}×${r.midpoint}`).join(' + ')}) / ${params.totalStudents} ≈ ${params.answer}</p>
                    </div>
                `;

                document.getElementById('explanationContent').innerHTML = `
                    <h4>数据表格：</h4>
                    <table class="histogram-table">
                        <thead>
                            <tr>
                                <th>${params.dataLabel}</th>
                                <th>频数</th>
                                <th>组中值</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <h4>正确计算过程：</h4>
                    <div class="calculation-step">
                        <p>使用分组数据均值估计公式：x̄ ≈ Σ(fᵢ × Mᵢ) / n</p>
                    </div>
                    <div class="calculation-step">
                        <p>加权和 = (${params.ranges.map(r => `${r.freq}×${r.midpoint}`).join(') + (')}) = ${weightedSum.toLocaleString()}</p>
                    </div>
                    <div class="calculation-step">
                        <p>均值 = ${weightedSum.toLocaleString()} ÷ ${params.totalStudents} = ${(weightedSum / params.totalStudents).toFixed(4)} ≈ ${params.answer}</p>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;

                // 清除输入
                userAnswerInput.value = '';

                // 隐藏所有反馈
                feedbackCorrect.style.display = 'none';
                feedbackIncorrect.style.display = 'none';

                // 隐藏解析
                showExplanationBtn.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';
                explanationSection.style.display = 'none';

                // 重新渲染
                renderQuestion();
                renderExplanation();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            refreshParamsBtn.addEventListener('click', function() {
                refreshParams();
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(userAnswerInput.value);
                const params = questionParams[currentParamIndex];

                if (isNaN(userAnswer)) {
                    alert('请输入有效的数字答案！');
                    return;
                }

                // 检查答案是否正确（允许0.15的误差）
                const isCorrect = Math.abs(userAnswer - params.answer) <= 0.15;

                renderExplanation();

                if (isCorrect) {
                    feedbackCorrect.style.display = 'block';
                    feedbackIncorrect.style.display = 'none';
                    correctAnswerDisplay.textContent = userAnswer.toFixed(1);
                } else {
                    feedbackIncorrect.style.display = 'block';
                    feedbackCorrect.style.display = 'none';
                    incorrectAnswerDisplay.textContent = userAnswer.toFixed(1);
                }

                // 显示答案解析按钮
                showExplanationBtn.style.display = 'inline-block';
            });

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 添加键盘支持
            userAnswerInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });

            // ==================== 初始化 ====================
            renderQuestion();
            renderExplanation();
        });
    </script>
