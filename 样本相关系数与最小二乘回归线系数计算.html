                        { data: [[50,95], [60,118], [70,142], [80,168], [90,195], [100,224], [110,254], [120,286], [130,320], [140,355]], xBar: 95, yBar: 215.7, sX: 27.39, sY: 82.58, b1: 2.975, b0: -66.93, r: 0.987 },
                        { data: [[80,168], [90,192], [100,218], [110,246], [120,276], [130,308], [140,342], [150,378], [160,416], [170,456]], xBar: 125, yBar: 300, sX: 27.39, sY: 90.67, b1: 3.263, b0: -107.88, r: 0.986 },
                        { data: [[55,108], [68,138], [81,170], [94,204], [107,240], [120,278], [133,318], [146,360], [159,404], [172,450]], xBar: 103.5, yBar: 267, sX: 37.11, sY: 103.74, b1: 2.752, b0: -17.83, r: 0.985 },
                        { data: [[75,155], [85,180], [95,207], [105,236], [115,267], [125,300], [135,335], [145,372], [155,411], [165,452]], xBar: 120, yBar: 291.5, sX: 27.39, sY: 92.52, b1: 3.325, b0: -107.50, r: 0.984 }
                    ]
                },
                {
                    // 背景6: 年龄与反应时间
                    title: "年龄与反应时间分析",
                    description: `反应时间是指从刺激出现到个体做出反应的时间间隔。研究表明，随着年龄增长，人的信息处理速度会逐渐下降，反应时间相应延长。这种变化在中年后更为明显，但个体差异也很大，与健康状况、生活方式等因素有关。`,
                    dataNote: "以下数据记录了10名不同年龄段受试者在简单反应时测试中的年龄 x（岁）和平均反应时间 y（毫秒）。",
                    xLabel: "年龄, x (岁)",
                    yLabel: "反应时间, y (ms)",
                    xAxisName: "年龄 x",
                    yAxisName: "反应时间 y",
                    datasets: [
                        { data: [[20,215], [25,222], [30,230], [35,242], [40,258], [45,278], [50,302], [55,330], [60,362], [65,398]], xBar: 42.5, yBar: 283.7, sX: 13.69, sY: 56.89, b1: 4.085, b0: 110.08, r: 0.983 },
                        { data: [[22,218], [28,228], [34,242], [40,260], [46,282], [52,308], [58,338], [64,372], [70,410], [76,452]], xBar: 49, yBar: 311, sX: 17.55, sY: 72.04, b1: 4.025, b0: 113.77, r: 0.980 },
                        { data: [[18,212], [24,220], [30,232], [36,248], [42,268], [48,292], [54,320], [60,352], [66,388], [72,428]], xBar: 45, yBar: 296, sX: 17.55, sY: 68.95, b1: 3.860, b0: 122.30, r: 0.983 },
                        { data: [[25,225], [30,234], [35,246], [40,262], [45,282], [50,306], [55,334], [60,366], [65,402], [70,442]], xBar: 47.5, yBar: 309.9, sX: 13.69, sY: 67.48, b1: 4.828, b0: 80.57, r: 0.979 },
                        { data: [[20,210], [27,224], [34,242], [41,264], [48,290], [55,320], [62,354], [69,392], [76,434], [83,480]], xBar: 51.5, yBar: 321, sX: 20.40, sY: 84.74, b1: 4.075, b0: 111.14, r: 0.980 }
                    ]
                }
            ];

            // 随机初始化第一个题目
            const initialScenarioIndex = Math.floor(Math.random() * questionScenarios.length);
            let currentScenario = questionScenarios[initialScenarioIndex];
            const initialDataIndex = Math.floor(Math.random() * currentScenario.datasets.length);
            let currentParams = currentScenario.datasets[initialDataIndex];

            // Draw scatter plot
            function drawScatterPlot(data, b1, b0, xBar, yBar, xAxisName, yAxisName) {
                const canvas = document.getElementById('scatterCanvas');
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                // Clear canvas
                ctx.clearRect(0, 0, width, height);

                // Margins
                const marginLeft = 50;
                const marginRight = 30;
                const marginTop = 30;
                const marginBottom = 50;

                const plotWidth = width - marginLeft - marginRight;
                const plotHeight = height - marginTop - marginBottom;

                // Get data range
                const xValues = data.map(d => d[0]);
                const yValues = data.map(d => d[1]);
                const dataXMin = Math.min(...xValues);
                const dataXMax = Math.max(...xValues);
                const dataYMin = Math.min(...yValues);
                const dataYMax = Math.max(...yValues);

                // Calculate axis ranges with padding (10% of range)
                const xRange = dataXMax - dataXMin;
                const yRange = dataYMax - dataYMin;
                const xPadding = Math.max(xRange * 0.1, 1);
                const yPadding = Math.max(yRange * 0.1, 0.1);

                const xMin = dataXMin - xPadding;
                const xMax = dataXMax + xPadding;
                const yMin = dataYMin - yPadding;
                const yMax = dataYMax + yPadding;

                // Scale functions
                const scaleX = x => marginLeft + (x - xMin) / (xMax - xMin) * plotWidth;
                const scaleY = y => marginTop + plotHeight - (y - yMin) / (yMax - yMin) * plotHeight;

                // Draw background
                ctx.fillStyle = '#f8fbfe';
                ctx.fillRect(marginLeft, marginTop, plotWidth, plotHeight);

                // Draw grid
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 0.5;

                // Vertical grid lines
                for (let i = 0; i <= 5; i++) {
                    const x = marginLeft + i * plotWidth / 5;
                    ctx.beginPath();
                    ctx.moveTo(x, marginTop);
                    ctx.lineTo(x, marginTop + plotHeight);
                    ctx.stroke();
                }

                // Horizontal grid lines
                for (let i = 0; i <= 5; i++) {
                    const y = marginTop + i * plotHeight / 5;
                    ctx.beginPath();
                    ctx.moveTo(marginLeft, y);
                    ctx.lineTo(marginLeft + plotWidth, y);
                    ctx.stroke();
                }

                // Draw axes
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;

                // X axis
                ctx.beginPath();
                ctx.moveTo(marginLeft, marginTop + plotHeight);
                ctx.lineTo(marginLeft + plotWidth, marginTop + plotHeight);
                ctx.stroke();

                // Y axis
                ctx.beginPath();
                ctx.moveTo(marginLeft, marginTop);
                ctx.lineTo(marginLeft, marginTop + plotHeight);
                ctx.stroke();

                // Draw axis labels
                ctx.fillStyle = '#333';
                ctx.font = '12px Segoe UI';
                ctx.textAlign = 'center';

                // X axis label
                ctx.fillText(xAxisName, marginLeft + plotWidth / 2, height - 10);

                // Y axis label
                ctx.save();
                ctx.translate(15, marginTop + plotHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText(yAxisName, 0, 0);
                ctx.restore();

                // Draw tick labels
                ctx.font = '10px Segoe UI';

                // Determine decimal places based on range
                const yDecimals = yRange < 10 ? 2 : (yRange < 100 ? 1 : 0);

                // X axis ticks
                for (let i = 0; i <= 5; i++) {
                    const val = xMin + i * (xMax - xMin) / 5;
                    const x = scaleX(val);
                    ctx.textAlign = 'center';
                    ctx.fillText(val.toFixed(0), x, marginTop + plotHeight + 15);
                }

                // Y axis ticks
                for (let i = 0; i <= 5; i++) {
                    const val = yMin + i * (yMax - yMin) / 5;
                    const y = scaleY(val);
                    ctx.textAlign = 'right';
                    ctx.fillText(val.toFixed(yDecimals), marginLeft - 5, y + 4);
                }

                // Draw regression line (clipped to data x range)
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);

                // Calculate regression line endpoints at data boundaries
                const regX1 = dataXMin;
                const regX2 = dataXMax;
                const regY1 = b0 + b1 * regX1;
                const regY2 = b0 + b1 * regX2;

                ctx.beginPath();
                ctx.moveTo(scaleX(regX1), scaleY(regY1));
                ctx.lineTo(scaleX(regX2), scaleY(regY2));
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw data points
                ctx.fillStyle = '#4a90e2';
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 1.5;

                data.forEach(([x, y]) => {
                    const px = scaleX(x);
                    const py = scaleY(y);

                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });

                // Draw mean point
                ctx.fillStyle = '#27ae60';
                ctx.beginPath();
                ctx.arc(scaleX(xBar), scaleY(yBar), 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#1e8449';
                ctx.stroke();
            }

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanation');
                if (explanation.style.display === 'none') {
                    explanation.style.display = 'block';
                    this.textContent = '📖 隐藏答案解析';
                } else {
                    explanation.style.display = 'none';
                    this.textContent = '📖 查看答案解析';
                }
            });

            // 正确答案 (will be updated dynamically)
            let correctAnswers = {
                q1: currentParams.b0,
                q2: currentParams.r
            };

            // 容差
            const tolerance1 = 0.01; // y截距容差
            const tolerance2 = 0.01; // 相关系数容差

            // 是否已提交
            let submitted = false;

            // 答题历史记录
            let answerHistory = [];

            // 更新答题历史显示
            function updateResultHistory() {
                const historyContainer = document.getElementById('result-history');
                historyContainer.innerHTML = answerHistory.map(isCorrect =>
                    `<div class="result-icon ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓' : '✗'}</div>`
                ).join('');
            }

            // Render question with current parameters
            function renderQuestion() {
                const scenario = currentScenario;
                const params = currentParams;

                // Update subtitle
                document.getElementById('scenario-title').textContent = `回归与相关 - ${scenario.title}`;

                // Update scenario description
                document.getElementById('scenario-description').textContent = scenario.description;
                document.getElementById('scenario-data-note').textContent = scenario.dataNote;

                // Update table headers
                document.getElementById('x-header').innerHTML = scenario.xLabel;
                document.getElementById('y-header').innerHTML = scenario.yLabel;

                // Render data table
                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = params.data.map(([x, y]) =>
                    `<tr><td>${x}</td><td>${y}</td></tr>`
                ).join('');

                // Update slope display
                document.getElementById('slope-display').innerHTML =
                    `最小二乘回归线的斜率 <span class="math">b₁ ≈ ${params.b1.toFixed(4)}</span>`;

                // Draw scatter plot
                drawScatterPlot(params.data, params.b1, params.b0, params.xBar, params.yBar, scenario.xAxisName, scenario.yAxisName);

                // Update correct answers
                correctAnswers.q1 = params.b0;
                correctAnswers.q2 = params.r;

                // Clear input fields
                document.getElementById('input1').value = '';
                document.getElementById('input2').value = '';
                document.getElementById('input1').classList.remove('correct', 'incorrect');
                document.getElementById('input2').classList.remove('correct', 'incorrect');

                // Update explanation content
                const calc1 = params.yBar - params.b1 * params.xBar;
                document.getElementById('explanation-calc1').innerHTML =
                    `代入已知值：<span class="math">b₀ = ${params.yBar.toFixed(4)} - (${params.b1.toFixed(4)}) × ${params.xBar.toFixed(4)} = ${params.yBar.toFixed(4)} + ${(params.b1 * params.xBar).toFixed(5)} = ${calc1.toFixed(5)} ≈ ${params.b0}</span>`;

                const ratio = params.sX / params.sY;
                document.getElementById('explanation-calc2').innerHTML =
                    `代入已知值：<span class="math">r = ${params.b1.toFixed(4)} × (${params.sX.toFixed(4)} / ${params.sY.toFixed(4)}) = ${params.b1.toFixed(4)} × ${ratio.toFixed(4)} ≈ ${params.r}</span>`;

                const relation = params.r > 0 ? '正' : '负';
                const strength = Math.abs(params.r) > 0.9 ? '强烈' : (Math.abs(params.r) > 0.7 ? '较强' : '较弱');
                document.getElementById('explanation-interpret').innerHTML =
                    `样本相关系数 <span class="math">r = ${params.r}</span> 表明两个变量之间存在${strength}的${relation}线性关系。`;
            }

            // Initial render
            renderQuestion();

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                if (submitted) return;

                let score = 0;
                let allAnswered = true;

                // 检查问题1
                const feedback1 = document.getElementById('feedback1');
                const input1 = document.getElementById('input1');
                const userAnswer1 = parseFloat(input1.value.trim());

                if (!isNaN(userAnswer1)) {
                    const isCorrect1 = Math.abs(userAnswer1 - correctAnswers.q1) <= tolerance1;
                    if (isCorrect1) score++;

                    input1.classList.add(isCorrect1 ? 'correct' : 'incorrect');
                    feedback1.innerHTML = `问题1: 你的答案是 ${userAnswer1}，${isCorrect1 ? '正确！' : `不正确。正确答案是 ${correctAnswers.q1}`}`;
                    feedback1.className = `feedback ${isCorrect1 ? 'correct' : 'incorrect'}`;
                    feedback1.style.display = 'block';
                } else {
                    allAnswered = false;
                    feedback1.textContent = '请先输入问题1的答案';
                    feedback1.className = 'feedback incorrect';
                    feedback1.style.display = 'block';
                }

                // 检查问题2
                const feedback2 = document.getElementById('feedback2');
                const input2 = document.getElementById('input2');
                const userAnswer2 = parseFloat(input2.value.trim());

                if (!isNaN(userAnswer2)) {
                    const isCorrect2 = Math.abs(userAnswer2 - correctAnswers.q2) <= tolerance2;
                    if (isCorrect2) score++;

                    input2.classList.add(isCorrect2 ? 'correct' : 'incorrect');
                    feedback2.innerHTML = `问题2: 你的答案是 ${userAnswer2}，${isCorrect2 ? '正确！' : `不正确。正确答案是 ${correctAnswers.q2}`}`;
                    feedback2.className = `feedback ${isCorrect2 ? 'correct' : 'incorrect'}`;
                    feedback2.style.display = 'block';
                } else {
                    allAnswered = false;
                    feedback2.textContent = '请先输入问题2的答案';
                    feedback2.className = 'feedback incorrect';
                    feedback2.style.display = 'block';
                }

                if (allAnswered) {
                    submitted = true;

                    // 记录答题结果（全对为正确，有错为错误）
                    const isAllCorrect = score === 2;
                    answerHistory.push(isAllCorrect);

                    // 更新答题记录显示
                    updateResultHistory();

                    document.getElementById('score-display').style.display = 'block';

                    // 显示答案解析按钮
                    document.getElementById('show-explanation-btn').style.display = 'inline-block';

                    // 滚动到结果区域
                    document.getElementById('score-display').scrollIntoView({ behavior: 'smooth' });
                }
            });

            // 下一题按钮事件
            document.getElementById('next-btn').addEventListener('click', function() {
                // Select random scenario
                const scenarioIndex = Math.floor(Math.random() * questionScenarios.length);
                currentScenario = questionScenarios[scenarioIndex];

                // Select random dataset within scenario
                const dataIndex = Math.floor(Math.random() * currentScenario.datasets.length);
                currentParams = currentScenario.datasets[dataIndex];

                // Reset state
                submitted = false;

                // Hide feedback and explanation
                document.getElementById('feedback1').style.display = 'none';
                document.getElementById('feedback2').style.display = 'none';
                document.getElementById('explanation').style.display = 'none';
                document.getElementById('show-explanation-btn').style.display = 'none';

                // Keep score-display visible to show history, but don't reset score
                // document.getElementById('score').textContent = '0';

                // Re-render
                renderQuestion();

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
