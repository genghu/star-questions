<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体比例差置信区间 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 100, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .question-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-title i {
            color: #3498db;
        }

        .question-content {
            font-size: 1.05rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            background-color: #f0f8ff;
            padding: 3px 8px;
            border-radius: 5px;
            margin: 0 3px;
            border: 1px dashed #b0c4de;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #e1e8ed;
        }

        .data-table th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }

        .data-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .answer-option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .answer-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.15);
            border-color: #3498db;
        }

        .answer-option.selected {
            border-color: #3498db;
            background-color: #ebf5fb;
        }

        .answer-option.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-option.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .answer-option.correct .option-letter {
            background-color: #2ecc71;
        }

        .answer-option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(149, 165, 166, 0.3);
        }

        .feedback {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background-color: #f8fafc;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback-title {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-display {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .score-value {
            font-weight: bold;
            color: #3498db;
            font-size: 1.5rem;
        }

        .explanation {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #3498db;
        }

        .explanation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .formula {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 1.1rem;
            border: 1px solid #b0c4de;
        }

        .result {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 15px;
            padding: 10px;
            background-color: #f8fafc;
            border-radius: 8px;
            text-align: center;
        }

        .correct-answer {
            color: #2ecc71;
        }

        .incorrect-answer {
            color: #e74c3c;
        }

        .normal-dist-img {
            max-width: 300px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-options {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 总体比例差置信区间</h1>
            <p class="subtitle">交互式答题与解析 - 置信区间与假设检验</p>
        </header>

        <div class="question-container">
            <div class="question-title">
                <div class="question-title-left">
                    <i class="fas fa-question-circle"></i> 题目内容
                </div>
                <button class="refresh-params-btn" id="refreshBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                    刷新参数
                </button>
            </div>

            <div class="question-content" id="questionContent">
                <!-- 动态生成 -->
            </div>

            <div class="question-title" style="margin-top: 30px;">
                <i class="fas fa-tasks"></i> 请选择正确答案
            </div>

            <div class="answer-options" id="answerOptions">
                <!-- 动态生成 -->
            </div>

            <div class="controls">
                <button id="submit-btn">
                    <i class="fas fa-paper-plane"></i> 提交答案
                </button>
                <button id="reset-btn">
                    <i class="fas fa-redo"></i> 重新作答
                </button>
            </div>
        </div>

        <div class="feedback" id="feedback">
            <div class="feedback-title">
                <i class="fas fa-chart-line"></i> 答题结果与解析
            </div>

            <div class="score-display">
                您的得分: <span class="score-value" id="score-value">0</span> / 100
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanation-section" style="display:none;">
                <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                <div id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    n1: 375, x1: 93, n2: 200, x2: 58,
                    p1Hat: 0.248, p2Hat: 0.290,
                    confidence: 99, zValue: 2.576,
                    lower: -0.143, upper: 0.059,
                    group1: '第一个城市', group2: '第二个城市',
                    topic: '高中生饮酒',
                    context: '一位社会学家正在研究两个主要城市高中生饮酒的普遍程度。'
                },
                {
                    n1: 400, x1: 160, n2: 350, x2: 105,
                    p1Hat: 0.400, p2Hat: 0.300,
                    confidence: 95, zValue: 1.960,
                    lower: 0.029, upper: 0.171,
                    group1: '男性', group2: '女性',
                    topic: '支持政策',
                    context: '一项研究调查了男性和女性对某项政策的支持情况。'
                },
                {
                    n1: 500, x1: 175, n2: 400, x2: 180,
                    p1Hat: 0.350, p2Hat: 0.450,
                    confidence: 90, zValue: 1.645,
                    lower: -0.152, upper: -0.048,
                    group1: '地区A', group2: '地区B',
                    topic: '产品满意度',
                    context: '某公司调查了两个地区顾客对产品的满意度。'
                },
                {
                    n1: 300, x1: 126, n2: 250, x2: 75,
                    p1Hat: 0.420, p2Hat: 0.300,
                    confidence: 95, zValue: 1.960,
                    lower: 0.040, upper: 0.200,
                    group1: '实验组', group2: '对照组',
                    topic: '治疗效果',
                    context: '一项医学研究比较了实验组和对照组的治疗效果。'
                },
                {
                    n1: 450, x1: 135, n2: 380, x2: 171,
                    p1Hat: 0.300, p2Hat: 0.450,
                    confidence: 99, zValue: 2.576,
                    lower: -0.232, upper: -0.068,
                    group1: '年轻组', group2: '年长组',
                    topic: '网购习惯',
                    context: '一项市场调查比较了不同年龄段人群的网购习惯。'
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let selectedOption = null;
            let isSubmitted = false;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染题目内容
                document.getElementById('questionContent').innerHTML = `
                    <p>${params.context}在从${params.group1}随机抽取的样本中，有 <span class="math">${params.x1}</span> 人表示${params.topic}，样本量为 <span class="math">${params.n1}</span>；在从${params.group2}随机（且独立）抽取的样本中，有 <span class="math">${params.x2}</span> 人表示${params.topic}，样本量为 <span class="math">${params.n2}</span>。</p>

                    <p>设 <span class="math">p₁</span> 为${params.group1}中${params.topic}的总体比例，<span class="math">p₂</span> 为${params.group2}中${params.topic}的总体比例。求 <span class="math">p₁ - p₂</span> 的 ${params.confidence}% 置信区间。</p>

                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>组别</th>
                                <th>样本量 (n)</th>
                                <th>${params.topic}人数 (x)</th>
                                <th>样本比例 (p̂)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${params.group1}</td>
                                <td>${params.n1}</td>
                                <td>${params.x1}</td>
                                <td>${params.x1}/${params.n1} ≈ ${params.p1Hat.toFixed(3)}</td>
                            </tr>
                            <tr>
                                <td>${params.group2}</td>
                                <td>${params.n2}</td>
                                <td>${params.x2}</td>
                                <td>${params.x2}/${params.n2} ≈ ${params.p2Hat.toFixed(3)}</td>
                            </tr>
                        </tbody>
                    </table>

                    <p>中间计算至少保留三位小数。最终答案至少保留三位小数。</p>

                    <div class="formula">
                        ( p̂₁ - p̂₂ ) ± z<sub>α/2</sub> × √[ (p̂₁q̂₁/n₁) + (p̂₂q̂₂/n₂) ]
                    </div>

                    <p>其中 <span class="math">z<sub>α/2</sub></span> 是标准正态分布右侧面积为 <span class="math">α/2</span> 的 z 值。对于 ${params.confidence}% 置信区间，<span class="math">z<sub>α/2</sub> ≈ ${params.zValue.toFixed(3)}</span>。</p>

                    <div style="text-align: center; margin: 20px 0;">
                        <div style="display: inline-block; padding: 15px; background-color: #f0f8ff; border-radius: 10px; border: 1px solid #b0c4de;">
                            <p><strong>标准正态分布示意图</strong></p>
                            <p>z<sub>α/2</sub> ≈ ${params.zValue.toFixed(3)}</p>
                            <div style="position: relative; height: 60px; width: 300px; margin: 10px auto; background: linear-gradient(to right, #e8f4f8, #c3cfe2); border-radius: 5px;">
                                <div style="position: absolute; left: 50%; transform: translateX(-50%); height: 100%; width: 2px; background-color: #2c3e50;"></div>
                                <div style="position: absolute; left: 10%; top: 10px; font-size: 0.8rem;">-z<sub>α/2</sub></div>
                                <div style="position: absolute; right: 10%; top: 10px; font-size: 0.8rem;">z<sub>α/2</sub></div>
                            </div>
                        </div>
                    </div>
                `;

                // 生成选项
                const options = generateOptions(params);
                document.getElementById('answerOptions').innerHTML = options.map((opt, idx) => `
                    <div class="answer-option" data-option="${String.fromCharCode(65 + idx)}">
                        <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                        <div class="option-text">
                            <strong>下限:</strong> ${opt.lower.toFixed(3)}<br>
                            <strong>上限:</strong> ${opt.upper.toFixed(3)}
                        </div>
                    </div>
                `).join('');

                // 渲染解析
                renderExplanation(params);
            }

            function generateOptions(params) {
                const diff = params.p1Hat - params.p2Hat;
                const q1Hat = 1 - params.p1Hat;
                const q2Hat = 1 - params.p2Hat;
                const se = Math.sqrt((params.p1Hat * q1Hat / params.n1) + (params.p2Hat * q2Hat / params.n2));
                const margin = params.zValue * se;

                // 正确答案
                const correctOption = {
                    lower: params.lower,
                    upper: params.upper
                };

                // 生成干扰项
                const options = [correctOption];

                // 干扰项1：使用错误的z值
                const wrongZ1 = params.confidence === 99 ? 1.960 : 2.576;
                const margin1 = wrongZ1 * se;
                options.push({
                    lower: parseFloat((diff - margin1).toFixed(3)),
                    upper: parseFloat((diff + margin1).toFixed(3))
                });

                // 干扰项2：使用不同的SE计算
                const wrongSE = se * 1.15;
                const margin2 = params.zValue * wrongSE;
                options.push({
                    lower: parseFloat((diff - margin2).toFixed(3)),
                    upper: parseFloat((diff + margin2).toFixed(3))
                });

                // 干扰项3：使用不同的SE计算
                const wrongSE2 = se * 0.85;
                const margin3 = params.zValue * wrongSE2;
                options.push({
                    lower: parseFloat((diff - margin3).toFixed(3)),
                    upper: parseFloat((diff + margin3).toFixed(3))
                });

                // 打乱选项顺序
                return shuffleArray(options);
            }

            function shuffleArray(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            }

            function renderExplanation(params) {
                const diff = params.p1Hat - params.p2Hat;
                const q1Hat = 1 - params.p1Hat;
                const q2Hat = 1 - params.p2Hat;
                const se = Math.sqrt((params.p1Hat * q1Hat / params.n1) + (params.p2Hat * q2Hat / params.n2));
                const margin = params.zValue * se;

                document.getElementById('explanationContent').innerHTML = `
                    <p>根据题目数据：</p>
                    <ul style="margin-left: 20px; margin-bottom: 15px;">
                        <li><span class="math">n₁ = ${params.n1}</span>, <span class="math">x₁ = ${params.x1}</span>, <span class="math">p̂₁ = ${params.x1}/${params.n1} ≈ ${params.p1Hat.toFixed(3)}</span>, <span class="math">q̂₁ = 1 - ${params.p1Hat.toFixed(3)} = ${q1Hat.toFixed(3)}</span></li>
                        <li><span class="math">n₂ = ${params.n2}</span>, <span class="math">x₂ = ${params.x2}</span>, <span class="math">p̂₂ = ${params.x2}/${params.n2} ≈ ${params.p2Hat.toFixed(3)}</span>, <span class="math">q̂₂ = 1 - ${params.p2Hat.toFixed(3)} = ${q2Hat.toFixed(3)}</span></li>
                    </ul>

                    <p>首先验证正态近似条件：</p>
                    <ul style="margin-left: 20px; margin-bottom: 15px;">
                        <li><span class="math">n₁p̂₁ = ${params.n1} × ${params.p1Hat.toFixed(3)} = ${(params.n1 * params.p1Hat).toFixed(0)} > 5</span></li>
                        <li><span class="math">n₁q̂₁ = ${params.n1} × ${q1Hat.toFixed(3)} = ${(params.n1 * q1Hat).toFixed(0)} > 5</span></li>
                        <li><span class="math">n₂p̂₂ = ${params.n2} × ${params.p2Hat.toFixed(3)} = ${(params.n2 * params.p2Hat).toFixed(0)} > 5</span></li>
                        <li><span class="math">n₂q̂₂ = ${params.n2} × ${q2Hat.toFixed(3)} = ${(params.n2 * q2Hat).toFixed(0)} > 5</span></li>
                    </ul>
                    <p>所有条件满足，可以使用正态近似。</p>

                    <p>计算标准误差：</p>
                    <div class="formula">
                        SE = √[ (p̂₁q̂₁/n₁) + (p̂₂q̂₂/n₂) ] = √[ (${params.p1Hat.toFixed(3)}×${q1Hat.toFixed(3)}/${params.n1}) + (${params.p2Hat.toFixed(3)}×${q2Hat.toFixed(3)}/${params.n2}) ] ≈ ${se.toFixed(4)}
                    </div>

                    <p>对于${params.confidence}%置信区间，<span class="math">z<sub>α/2</sub> ≈ ${params.zValue.toFixed(3)}</span></p>

                    <p>计算置信区间：</p>
                    <div class="formula">
                        (p̂₁ - p̂₂) ± z<sub>α/2</sub> × SE = (${params.p1Hat.toFixed(3)} - ${params.p2Hat.toFixed(3)}) ± ${params.zValue.toFixed(3)} × ${se.toFixed(4)} ≈ ${diff.toFixed(3)} ± ${margin.toFixed(3)}
                    </div>

                    <div class="formula">
                        下限: ${diff.toFixed(3)} - ${margin.toFixed(3)} = ${params.lower.toFixed(3)}<br>
                        上限: ${diff.toFixed(3)} + ${margin.toFixed(3)} = ${params.upper.toFixed(3)}
                    </div>

                    <div class="result">
                        <p>因此，<span class="math">p₁ - p₂</span> 的${params.confidence}%置信区间为：</p>
                        <p style="font-size: 1.3rem; color: #2c3e50; margin-top: 10px;">(${params.lower.toFixed(3)}, ${params.upper.toFixed(3)})</p>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                selectedOption = null;
                isSubmitted = false;

                // 重置UI
                document.querySelectorAll('.answer-option').forEach(opt => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                });
                document.getElementById('feedback').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanation-section').style.display = 'none';
                document.getElementById('score-value').textContent = '0';
                document.getElementById('score-value').style.color = '#3498db';

                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refreshBtn').addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanation-section');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 选项点击事件
            document.getElementById('answerOptions').addEventListener('click', function(e) {
                const option = e.target.closest('.answer-option');
                if (!option || isSubmitted) return;

                // 移除之前的选择
                document.querySelectorAll('.answer-option').forEach(opt => opt.classList.remove('selected'));

                // 设置当前选择
                option.classList.add('selected');
                selectedOption = option.getAttribute('data-option');
            });

            // 提交答案
            document.getElementById('submit-btn').addEventListener('click', function() {
                if (!selectedOption) {
                    alert('请先选择一个答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;

                // 显示反馈
                document.getElementById('feedback').classList.add('show');

                // 计算得分 - 检查选中的选项是否是正确答案
                const params = questionParams[currentParamIndex];
                const selectedElement = document.querySelector(`.answer-option[data-option="${selectedOption}"]`);
                const selectedText = selectedElement.querySelector('.option-text').textContent;
                const correctLower = params.lower.toFixed(3);
                const correctUpper = params.upper.toFixed(3);

                const isCorrect = selectedText.includes(correctLower) && selectedText.includes(correctUpper);

                const scoreValue = document.getElementById('score-value');
                if (isCorrect) {
                    scoreValue.textContent = '100';
                    scoreValue.style.color = '#2ecc71';
                    selectedElement.classList.add('correct');
                } else {
                    scoreValue.textContent = '0';
                    scoreValue.style.color = '#e74c3c';
                    selectedElement.classList.add('incorrect');
                }

                // 滚动到反馈区域
                document.getElementById('feedback').scrollIntoView({ behavior: 'smooth' });

                // Show explanation buttons after submit
                document.getElementById('show-explanation-btn').style.display = 'block';
            });

            // 重新作答
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置所有选项
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                });

                // 隐藏反馈
                document.getElementById('feedback').classList.remove('show');

                // 重置状态
                selectedOption = null;
                isSubmitted = false;
                document.getElementById('score-value').textContent = '0';
                document.getElementById('score-value').style.color = '#3498db';

                // Hide explanation buttons and sections
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanation-section').style.display = 'none';

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
