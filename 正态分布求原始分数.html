<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正态分布求原始分数 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-weight: bold;
            color: #0052cc;
        }

        .formula-box {
            background-color: #f8fbff;
            border: 1px dashed #4d94ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }

        #next-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .feedback-container {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .incorrect-feedback {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
        }

        .stats {
            background-color: #e6f0ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .stats-title {
            font-size: 1rem;
            color: #0052cc;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .results-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 40px;
            align-items: center;
        }

        .result-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            animation: popIn 0.3s ease;
        }

        .result-icon.correct {
            background-color: #27ae60;
        }

        .result-icon.correct::after {
            content: '✓';
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
        }

        .result-icon.incorrect::after {
            content: '✗';
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .no-results {
            color: #999;
            font-size: 0.9rem;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>正态分布求原始分数</h1>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span>问题</span>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <label class="answer-label">请输入答案（保留一位小数）：</label>
                <input type="text" class="answer-input" id="answer-input">
                <div class="tolerance-hint">容差：±0.05</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">提交答案</button>
            <button id="next-btn">下一题 ⏩</button>
        </div>

        <div class="feedback-container" id="feedback">
            <div class="feedback-title" id="feedback-title-text"></div>
            <p id="feedback-text"></p>
            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation" id="explanation" style="display:none;">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">答题记录</div>
            <div class="results-container" id="results-container">
                <span class="no-results">尚未开始答题</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // direction: 'upper' 表示 P(X > x) = p，'lower' 表示 P(X < x) = p
            const questionParams = [
                // ===== P(X > x) = p 类型（上尾概率）=====
                {
                    context: '看电视时间',
                    mean: 6.5,
                    sigma: 1.7,
                    percentage: 15,
                    answer: 8.3,
                    zValue: 1.0364,
                    direction: 'upper'
                },
                {
                    context: '睡眠时间',
                    mean: 7.2,
                    sigma: 1.3,
                    percentage: 10,
                    answer: 8.9,
                    zValue: 1.2816,
                    direction: 'upper'
                },
                {
                    context: '阅读时间',
                    mean: 3.5,
                    sigma: 1.2,
                    percentage: 5,
                    answer: 5.5,
                    zValue: 1.6449,
                    direction: 'upper'
                },
                {
                    context: '运动时间',
                    mean: 2.0,
                    sigma: 0.8,
                    percentage: 20,
                    answer: 2.7,
                    zValue: 0.8416,
                    direction: 'upper'
                },
                {
                    context: '上网时间',
                    mean: 4.5,
                    sigma: 1.5,
                    percentage: 25,
                    answer: 5.5,
                    zValue: 0.6745,
                    direction: 'upper'
                },
                {
                    context: '学习时间',
                    mean: 5.0,
                    sigma: 1.4,
                    percentage: 10,
                    answer: 6.8,
                    zValue: 1.2816,
                    direction: 'upper'
                },
                {
                    context: '工作时间',
                    mean: 8.0,
                    sigma: 1.5,
                    percentage: 15,
                    answer: 9.6,
                    zValue: 1.0364,
                    direction: 'upper'
                },
                {
                    context: '通勤时间',
                    mean: 1.2,
                    sigma: 0.5,
                    percentage: 5,
                    answer: 2.0,
                    zValue: 1.6449,
                    direction: 'upper'
                },
                {
                    context: '娱乐时间',
                    mean: 3.0,
                    sigma: 1.0,
                    percentage: 10,
                    answer: 4.3,
                    zValue: 1.2816,
                    direction: 'upper'
                },
                {
                    context: '购物时间',
                    mean: 1.5,
                    sigma: 0.6,
                    percentage: 15,
                    answer: 2.1,
                    zValue: 1.0364,
                    direction: 'upper'
                },
                {
                    context: '做饭时间',
                    mean: 1.8,
                    sigma: 0.5,
                    percentage: 20,
                    answer: 2.2,
                    zValue: 0.8416,
                    direction: 'upper'
                },
                {
                    context: '社交时间',
                    mean: 2.5,
                    sigma: 0.9,
                    percentage: 10,
                    answer: 3.7,
                    zValue: 1.2816,
                    direction: 'upper'
                },
                {
                    context: '游戏时间',
                    mean: 2.0,
                    sigma: 0.7,
                    percentage: 5,
                    answer: 3.2,
                    zValue: 1.6449,
                    direction: 'upper'
                },
                {
                    context: '锻炼时间',
                    mean: 1.0,
                    sigma: 0.4,
                    percentage: 15,
                    answer: 1.4,
                    zValue: 1.0364,
                    direction: 'upper'
                },
                {
                    context: '休息时间',
                    mean: 0.8,
                    sigma: 0.3,
                    percentage: 25,
                    answer: 1.0,
                    zValue: 0.6745,
                    direction: 'upper'
                },
                {
                    context: '喝咖啡时间',
                    mean: 0.5,
                    sigma: 0.2,
                    percentage: 10,
                    answer: 0.8,
                    zValue: 1.2816,
                    direction: 'upper'
                },
                {
                    context: '打电话时间',
                    mean: 1.2,
                    sigma: 0.4,
                    percentage: 5,
                    answer: 1.9,
                    zValue: 1.6449,
                    direction: 'upper'
                },
                {
                    context: '看新闻时间',
                    mean: 0.6,
                    sigma: 0.25,
                    percentage: 15,
                    answer: 0.9,
                    zValue: 1.0364,
                    direction: 'upper'
                },
                {
                    context: '练琴时间',
                    mean: 1.5,
                    sigma: 0.5,
                    percentage: 20,
                    answer: 1.9,
                    zValue: 0.8416,
                    direction: 'upper'
                },
                // ===== P(X < x) = p 类型（下尾概率）=====
                {
                    context: '娱乐时间',
                    mean: 3.0,
                    sigma: 1.0,
                    percentage: 10,
                    answer: 1.7,
                    zValue: -1.2816,
                    direction: 'lower'
                },
                {
                    context: '购物时间',
                    mean: 1.5,
                    sigma: 0.6,
                    percentage: 5,
                    answer: 0.5,
                    zValue: -1.6449,
                    direction: 'lower'
                },
                {
                    context: '做饭时间',
                    mean: 1.8,
                    sigma: 0.5,
                    percentage: 15,
                    answer: 1.3,
                    zValue: -1.0364,
                    direction: 'lower'
                },
                {
                    context: '社交时间',
                    mean: 2.5,
                    sigma: 0.9,
                    percentage: 20,
                    answer: 1.7,
                    zValue: -0.8416,
                    direction: 'lower'
                },
                {
                    context: '游戏时间',
                    mean: 2.0,
                    sigma: 0.7,
                    percentage: 25,
                    answer: 1.5,
                    zValue: -0.6745,
                    direction: 'lower'
                },
                {
                    context: '锻炼时间',
                    mean: 1.0,
                    sigma: 0.4,
                    percentage: 10,
                    answer: 0.5,
                    zValue: -1.2816,
                    direction: 'lower'
                },
                {
                    context: '休息时间',
                    mean: 0.8,
                    sigma: 0.3,
                    percentage: 5,
                    answer: 0.3,
                    zValue: -1.6449,
                    direction: 'lower'
                },
                {
                    context: '喝咖啡时间',
                    mean: 0.5,
                    sigma: 0.2,
                    percentage: 15,
                    answer: 0.3,
                    zValue: -1.0364,
                    direction: 'lower'
                },
                {
                    context: '打电话时间',
                    mean: 1.2,
                    sigma: 0.4,
                    percentage: 20,
                    answer: 0.9,
                    zValue: -0.8416,
                    direction: 'lower'
                },
                {
                    context: '看新闻时间',
                    mean: 0.6,
                    sigma: 0.25,
                    percentage: 25,
                    answer: 0.4,
                    zValue: -0.6745,
                    direction: 'lower'
                },
                {
                    context: '练琴时间',
                    mean: 1.5,
                    sigma: 0.5,
                    percentage: 10,
                    answer: 0.9,
                    zValue: -1.2816,
                    direction: 'lower'
                },
                {
                    context: '写作时间',
                    mean: 0.9,
                    sigma: 0.35,
                    percentage: 5,
                    answer: 0.3,
                    zValue: -1.6449,
                    direction: 'lower'
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionText = document.getElementById('question-text');
                const explanation = document.getElementById('explanation');
                const isUpper = params.direction === 'upper';

                // 根据方向生成不同的题目文本
                if (isUpper) {
                    // P(X > x) = p 类型
                    questionText.innerHTML = `
                        <p>一篇报纸文章报道，人们平均每天花费 <span class="math">${params.mean}</span> 小时${params.context}，标准差为 <span class="math">${params.sigma}</span> 小时。一位心理学家希望采访每天${params.context}最多的 <span class="math">${params.percentage}%</span> 的人群.她假设人们每天${params.context}服从正态分布.一个人每天至少要进行多少小时${params.context}才有资格接受采访？将中间计算至少保留到四位小数.将你的答案四舍五入到一位小数.</p>
                    `;
                } else {
                    // P(X < x) = p 类型
                    questionText.innerHTML = `
                        <p>一篇报纸文章报道，人们平均每天花费 <span class="math">${params.mean}</span> 小时${params.context}，标准差为 <span class="math">${params.sigma}</span> 小时.一位心理学家希望研究每天${params.context}最少的 <span class="math">${params.percentage}%</span> 的人群.她假设人们每天${params.context}服从正态分布.一个人每天最多进行多少小时${params.context}才属于这个群体？将中间计算至少保留到四位小数.将你的答案四舍五入到一位小数.</p>
                    `;
                }

                // 渲染解析
                if (isUpper) {
                    explanation.innerHTML = `
                        <h3>题目解析：</h3>
                        <p><strong>第一步：确定z值</strong></p>
                        <p>根据题目，我们需要找到标准正态分布的上${params.percentage}%分位数 z，使得 P(Z > z) = ${params.percentage / 100}.</p>
                        <p>查标准正态分布表，当上尾概率为 ${params.percentage / 100} 时，对应的 z 值为 <span class="math">${params.zValue}</span>.</p>

                        <p><strong>第二步:计算原始分数</strong></p>
                        <p>使用逆z变换公式：<span class="math">x = μ + z × σ</span></p>
                        <p>代入已知值：<span class="math">μ = ${params.mean}</span>, <span class="math">σ = ${params.sigma}</span>, <span class="math">z = ${params.zValue}</span></p>
                        <p>计算：<span class="math">x = ${params.mean} + ${params.zValue} × ${params.sigma}</span></p>
                        <p><span class="math">x = ${params.mean} + ${(params.zValue * params.sigma).toFixed(4)}</span></p>
                        <p><span class="math">x = ${(params.mean + params.zValue * params.sigma).toFixed(4)}</span></p>

                        <p><strong>第三步:四舍五入</strong></p>
                        <p>将结果四舍五入到一位小数：<span class="math">x ≈ ${params.answer}</span> 小时</p>

                        <p><strong>结论</strong></p>
                        <p>因此，一个人每天至少要进行 <span class="math">${params.answer}</span> 小时${params.context}才有资格接受采访.</p>
                    `;
                } else {
                    explanation.innerHTML = `
                        <h3>题目解析：</h3>
                        <p><strong>第一步:确定z值</strong></p>
                        <p>根据题目，我们需要找到标准正态分布的下${params.percentage}%分位数 z，使得 P(Z < z) = ${params.percentage / 100}.</p>
                        <p>查标准正态分布表， 当下尾概率为 ${params.percentage / 100} 时，对应的 z 值为 <span class="math">${params.zValue}</span>.</p>

                        <p><strong>第二步:计算原始分数</strong></p>
                        <p>使用逆z变换公式：<span class="math">x = μ + z × σ</span></p>
                        <p>代入已知值：<span class="math">μ = ${params.mean}</span>, <span class="math">σ = ${params.sigma}</span>, <span class="math">z = ${params.zValue}</span></p>
                        <p>计算：<span class="math">x = ${params.mean} + (${params.zValue}) × ${params.sigma}</span></p>
                        <p><span class="math">x = ${params.mean} + ${(params.zValue * params.sigma).toFixed(4)}</span></p>
                        <p><span class="math">x = ${(params.mean + params.zValue * params.sigma).toFixed(4)}</span></p>

                        <p><strong>第三步:四舍五入</strong></p>
                        <p>将结果四舍五入到一位小数：<span class="math">x ≈ ${params.answer}</span> 小时</p>

                        <p><strong>结论</strong></p>
                        <p>因此，一个人每天最多进行 <span class="math">${params.answer}</span> 小时${params.context}才属于${params.context}最少的 ${params.percentage}% 人群.</p>
                    `;
                }
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 清除输入和反馈
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈和解析
                const feedback = document.getElementById('feedback');
                feedback.classList.remove('show');
                explanation.style.display = 'none';
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // ==================== 事件处理 ====================

            let isSubmitted = false;
            let answerResults = []; // 记录答题结果

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title-text');
            const feedbackText = document.getElementById('feedback-text');
            const resultsContainer = document.getElementById('results-container');
            const showExpBtn = document.getElementById('show-explanation-btn');
            const explanation = document.getElementById('explanation');
            const answerInput = document.getElementById('answer-input');
            const feedbackInline = document.getElementById('feedback-inline');

            // 下一题按钮
            nextBtn.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExpBtn.addEventListener('click', function() {
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 添加结果图标
            function addResultIcon(isCorrect) {
                answerResults.push(isCorrect);

                // 清除"尚未开始答题"提示
                if (answerResults.length === 1) {
                    resultsContainer.innerHTML = '';
                }

                // 创建图标
                const icon = document.createElement('div');
                icon.className = `result-icon ${isCorrect ? 'correct' : 'incorrect'}`;
                resultsContainer.appendChild(icon);
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(answerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请先输入一个有效的数字！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                const params = questionParams[currentParamIndex];
                const tolerance = 0.05;
                const isCorrect = Math.abs(userAnswer - params.answer) <= tolerance;
                // 添加结果图标
                addResultIcon(isCorrect);
                // 更新反馈
                if (isCorrect) {
                    answerInput.classList.add('correct');
                    feedbackInline.textContent = '正确!';
                    feedbackInline.className = 'feedback-inline correct';
                    feedbackTitle.textContent = "回答正确!";
                    feedbackText.textContent = `请输入了 ${userAnswer.toFixed(1)}，这是正确答案。`;
                    feedback.classList.remove('incorrect-feedback');
                    feedback.classList.add('correct-feedback');
                } else {
                    answerInput.classList.add('incorrect');
                    feedbackInline.textContent = `不正确.正确答案是 ${params.answer}`;
                    feedbackInline.className = 'feedback-inline incorrect';
                    feedbackTitle.textContent = "回答错误!";
                    feedbackText.textContent = `请输入了 ${userAnswer.toFixed(1)}，但正确答案是 ${params.answer}。`;
                    feedback.classList.remove('correct-feedback');
                    feedback.classList.add('incorrect-feedback');
                }

                // 显示反馈
                feedback.classList.add('show');
                // 显示解析按钮
                showExpBtn.style.display = 'inline-block';
                // 禁用输入
                answerInput.disabled = true;
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
