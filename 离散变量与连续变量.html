<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散变量与连续变量 - 交互式答题</title>
    <style>
        :root {
            --primary-blue: #3498db;
            --light-blue: #e3f2fd;
            --dark-blue: #2980b9;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
            --neutral-gray: #ecf0f1;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--neutral-gray);
        }

        h1 {
            color: var(--dark-blue);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .instructions {
            background-color: var(--light-blue);
            border-left: 5px solid var(--primary-blue);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
        }

        .question-container {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .question-container:hover {
            transform: translateY(-3px);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--neutral-gray);
        }

        .question-title {
            font-size: 1.4rem;
            color: var(--dark-blue);
            font-weight: 600;
        }

        .question-number {
            background-color: var(--primary-blue);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .option {
            flex: 1 1 calc(50% - 15px);
            min-width: 200px;
            background-color: var(--neutral-gray);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            padding: 18px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .option:hover {
            background-color: #d5dbdb;
            transform: scale(1.02);
        }

        .option.selected {
            border-color: var(--primary-blue);
            background-color: var(--light-blue);
            color: var(--dark-blue);
        }

        .option.correct {
            border-color: var(--success-green);
            background-color: rgba(46, 204, 113, 0.1);
            color: #27ae60;
        }

        .option.incorrect {
            border-color: var(--error-red);
            background-color: rgba(231, 76, 60, 0.1);
            color: #c0392b;
        }

        .explanation {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background-color: #f9f9f9;
            border-radius: var(--border-radius);
            padding: 0 20px;
            margin-top: 10px;
        }

        .explanation.show {
            max-height: 500px;
            padding: 20px;
            margin-top: 15px;
        }

        .explanation h4 {
            color: var(--dark-blue);
            margin-bottom: 10px;
        }

        .explanation p {
            margin-bottom: 10px;
        }

        .example {
            background-color: white;
            border-left: 3px solid var(--primary-blue);
            padding: 10px 15px;
            margin: 15px 0;
            font-style: italic;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: var(--primary-blue);
            color: white;
        }

        #submit-btn:hover {
            background-color: var(--dark-blue);
            transform: translateY(-2px);
        }

        #reset-btn {
            background-color: var(--text-light);
            color: white;
        }

        #reset-btn:hover {
            background-color: #6c7a7d;
            transform: translateY(-2px);
        }

        .results {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 25px;
            margin-top: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-blue);
            margin: 15px 0;
        }

        .score-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .correct-answers {
            color: var(--success-green);
            font-weight: bold;
        }

        .total-questions {
            color: var(--text-dark);
            font-weight: bold;
        }


        @media (max-width: 768px) {
            .option {
                flex: 1 1 100%;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            button {
                width: 100%;
            }

            h1 {
                font-size: 1.8rem;
            }
        }

        .math-example {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .math-number {
            background-color: var(--light-blue);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <header>
        <h1>离散变量与连续变量 <button id="refresh-btn" style="margin-left: 15px; padding: 8px 16px; background: linear-gradient(135deg, #34a853, #2ecc71); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(52, 168, 83, 0.3);">刷新参数</button></h1>
        <p class="subtitle">随机变量与分布 - 交互式答题练习</p>
    </header>

    <div class="instructions">
        <p><strong>说明：</strong>以下变量中，哪些最好被视为连续的，哪些是离散的？请点击每个问题的相应答案来表明您的选择。提交后可以查看详细解析。</p>
    </div>

    <div id="questions-container">
        <!-- 问题将通过JavaScript动态生成 -->
    </div>

    <div class="controls">
        <button id="submit-btn">提交答案</button>
        <button id="reset-btn">重新作答</button>
    </div>

    <div class="results" id="results-container">
        <h2>答题结果</h2>
        <div class="score" id="score">0/4</div>
        <p class="score-text">您答对了 <span class="correct-answers" id="correct-count">0</span> 题，共 <span class="total-questions" id="total-questions">4</span> 题</p>
        <p id="result-message"></p>
    </div>

    <button class="show-explanation-btn" id="show-explanation-btn" style="display:none;">查看答案解析</button>
    <div class="explanation-section" id="explanation-section" style="display:none;">

        <div class="question-container" style="margin-top: 0;">
            <h3 class="question-title" style="color: var(--dark-blue); font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px dashed var(--neutral-gray); padding-bottom: 10px;">关键概念</h3>
            <div class="question-text">
                <p><strong>离散变量：</strong>其可能值可以被计数（通常是整数）。</p>
                <p style="margin-top: 10px;"><strong>连续变量：</strong>其可能值构成一个实数区间（可以取区间内的任何值）。</p>
                <p style="margin-top: 15px; padding: 10px; background-color: var(--light-blue); border-radius: var(--border-radius);"><strong>记忆技巧：</strong>离散变量通常在数量被<strong>计数</strong>时出现（"……的数量"），连续变量通常在数量被<strong>测量</strong>时出现。</p>
            </div>
        </div>

    </div>



    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // 所有题目数据池
            const allQuestions = [
                // 原有题目
                {
                    title: "某市今年的总降雪量。",
                    text: "总降雪量可以是（非负）实数区间内的任何数字。例如，它可以是128.6厘米，或161.2厘米，或介于其间的任何数字。",
                    isDiscrete: false,
                    explanation: `<p>总降雪量可以是（非负）实数区间内的任何数字。例如，它可以是128.6厘米，或161.2厘米，或介于其间的任何数字。因此，该变量是<strong>连续的</strong>。</p><p>连续变量是指其可能值构成一个实数区间的变量。</p>`
                },
                {
                    title: "在一个有35名学生的班级中，从第一次期中考试到第二次期中考试分数提高的学生人数。",
                    text: "分数提高的学生人数必须是整数。具体来说，它必须是数字0, 1, 2, ..., 35中的一个。",
                    isDiscrete: true,
                    explanation: `<p>分数提高的学生人数必须是整数。具体来说，它必须是数字0, 1, 2, ..., 35中的一个。（它不能是两个整数之间的数字，比如14.68。）这意味着该变量是<strong>离散的</strong>。</p><p>离散变量是指其可能值可以被计数的变量。</p>`
                },
                {
                    title: "一辆国产汽车的燃油效率（升/百公里油耗）。",
                    text: "燃油效率可以是任何正值。例如，它可以是6.2升/百公里，8.5升/百公里，或介于其间的任何值。",
                    isDiscrete: false,
                    explanation: `<p>燃油效率可以是任何正值。例如，它可以是6.2升/百公里，8.5升/百公里，或介于其间的任何值。因为该变量可以在某个区间内取任何值，所以该变量是<strong>连续的</strong>。</p><p>连续变量通常在数量被测量时出现。</p>`
                },
                {
                    title: "辐照后培养皿上受损染色体的数量。",
                    text: "受损染色体的数量必然是一个整数。（它可以是0, 1, 2, 3，或直到培养皿上染色体总数的任何整数。）",
                    isDiscrete: true,
                    explanation: `<p>受损染色体的数量必然是一个整数。整数之间的值是被排除的。因此，该变量是<strong>离散的</strong>。</p><p>离散变量通常在数量被计数时出现（"……的数量"）。</p>`
                },
                // 新增题目 - 离散变量
                {
                    title: "抛掷硬币10次，正面朝上的次数。",
                    text: "正面朝上的次数必须是整数0, 1, 2, ..., 10中的一个。",
                    isDiscrete: true,
                    explanation: `<p>正面朝上的次数必须是整数0, 1, 2, ..., 10中的一个。不可能出现3.5次正面朝上。因此，该变量是<strong>离散的</strong>。</p><p>计数结果通常是离散变量。</p>`
                },
                {
                    title: "一天内进入某商店的顾客人数。",
                    text: "顾客人数必须是整数。可以是0人、1人、2人等。",
                    isDiscrete: true,
                    explanation: `<p>顾客人数必须是整数。不可能有半个人进入商店。因此，该变量是<strong>离散的</strong>。</p><p>人数统计是典型的离散变量。</p>`
                },
                {
                    title: "一本书的页数。",
                    text: "页数必须是整数。一本书可以有100页、250页等。",
                    isDiscrete: true,
                    explanation: `<p>页数必须是整数。不可能有一本书有123.5页。因此，该变量是<strong>离散的</strong>。</p><p>计数类变量都是离散的。</p>`
                },
                {
                    title: "一个家庭中孩子的数量。",
                    text: "孩子数量必须是整数。可以是0个、1个、2个、3个等。",
                    isDiscrete: true,
                    explanation: `<p>孩子数量必须是整数。不可能有2.3个孩子。因此，该变量是<strong>离散的</strong>。</p><p>人数统计是离散变量的典型例子。</p>`
                },
                {
                    title: "掷一枚骰子得到的点数。",
                    text: "骰子点数只能是1, 2, 3, 4, 5, 6中的一个整数。",
                    isDiscrete: true,
                    explanation: `<p>骰子点数只能是1, 2, 3, 4, 5, 6这六个整数之一。不可能掷出3.7点。因此，该变量是<strong>离散的</strong>。</p><p>有限个可能值的变量是离散的。</p>`
                },
                {
                    title: "一个班级的学生人数。",
                    text: "学生人数必须是整数。可以是20人、35人、42人等。",
                    isDiscrete: true,
                    explanation: `<p>学生人数必须是整数。不可能有32.5个学生。因此，该变量是<strong>离散的</strong>。</p><p>计数人数得到的是离散变量。</p>`
                },
                {
                    title: "一个月内的下雨天数。",
                    text: "下雨天数必须是整数。可以是0天、5天、12天等。",
                    isDiscrete: true,
                    explanation: `<p>下雨天数必须是整数。不可能有7.3个下雨天。因此，该变量是<strong>离散的</strong>。</p><p>天数计数是离散变量。</p>`
                },
                {
                    title: "停车场内汽车的数量。",
                    text: "汽车数量必须是整数。可以是0辆、50辆、120辆等。",
                    isDiscrete: true,
                    explanation: `<p>汽车数量必须是整数。不可能有45.5辆车。因此，该变量是<strong>离散的</strong>。</p><p>物品计数都是离散变量。</p>`
                },
                {
                    title: "一场足球比赛的进球数。",
                    text: "进球数必须是整数。可以是0个、1个、2个、3个等。",
                    isDiscrete: true,
                    explanation: `<p>进球数必须是整数。不可能进2.5个球。因此，该变量是<strong>离散的</strong>。</p><p>得分计数是离散变量。</p>`
                },
                {
                    title: "医院当天出生的婴儿数量。",
                    text: "婴儿数量必须是整数。可以是0个、5个、12个等。",
                    isDiscrete: true,
                    explanation: `<p>婴儿数量必须是整数。不可能出生3.7个婴儿。因此，该变量是<strong>离散的</strong>。</p><p>人数统计是离散变量的典型例子。</p>`
                },
                {
                    title: "一枚硬币抛掷后正面或反面的结果。",
                    text: "结果只能是正面或反面两种可能。",
                    isDiscrete: true,
                    explanation: `<p>结果只能是有限的几种可能（正面或反面）。因此，该变量是<strong>离散的</strong>。</p><p>分类变量也是离散变量的一种。</p>`
                },
                {
                    title: "一个小时内收到的电子邮件数量。",
                    text: "邮件数量必须是整数。可以是0封、5封、23封等。",
                    isDiscrete: true,
                    explanation: `<p>邮件数量必须是整数。不可能收到12.3封邮件。因此，该变量是<strong>离散的</strong>。</p><p>计数类变量都是离散的。</p>`
                },
                // 新增题目 - 连续变量
                {
                    title: "一个人的体重（公斤）。",
                    text: "体重可以是任何正值。例如65.3公斤、72.85公斤等。",
                    isDiscrete: false,
                    explanation: `<p>体重可以是任何正值，可以精确到小数点后任意位数。例如65.3公斤或72.85公斤。因此，该变量是<strong>连续的</strong>。</p><p>测量类变量通常是连续的。</p>`
                },
                {
                    title: "房间的温度（摄氏度）。",
                    text: "温度可以是任何实数值。例如23.5°C、18.72°C等。",
                    isDiscrete: false,
                    explanation: `<p>温度可以是任何实数值。可以是23.5°C、18.72°C或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>温度是典型的连续测量变量。</p>`
                },
                {
                    title: "运动员完成100米赛跑的时间（秒）。",
                    text: "时间可以是任何正值。例如9.58秒、10.23秒、11.456秒等。",
                    isDiscrete: false,
                    explanation: `<p>时间可以是任何正值，可以精确到毫秒甚至更高精度。因此，该变量是<strong>连续的</strong>。</p><p>时间测量是连续变量。</p>`
                },
                {
                    title: "一株植物的高度（厘米）。",
                    text: "高度可以是任何非负实数。例如15.3厘米、42.7厘米等。",
                    isDiscrete: false,
                    explanation: `<p>高度可以是任何非负实数。可以是15.3厘米、42.7厘米或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>长度测量是连续变量。</p>`
                },
                {
                    title: "杯子中水的体积（毫升）。",
                    text: "体积可以是任何非负实数。例如250.5毫升、333.33毫升等。",
                    isDiscrete: false,
                    explanation: `<p>体积可以是任何非负实数。可以是250.5毫升、333.33毫升或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>体积测量是连续变量。</p>`
                },
                {
                    title: "手机电池剩余电量百分比。",
                    text: "电量百分比可以是0到100之间的任何实数。例如67.8%、42.35%等。",
                    isDiscrete: false,
                    explanation: `<p>电量百分比可以是0到100之间的任何实数。可以是67.8%、42.35%等。因此，该变量是<strong>连续的</strong>。</p><p>百分比测量是连续变量。</p>`
                },
                {
                    title: "环境中声音的强度（分贝）。",
                    text: "声音强度可以是任何非负实数。例如45.3分贝、78.92分贝等。",
                    isDiscrete: false,
                    explanation: `<p>声音强度可以是任何非负实数。可以是45.3分贝、78.92分贝或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>物理量测量通常是连续的。</p>`
                },
                {
                    title: "房间内的光照强度（勒克斯）。",
                    text: "光照强度可以是任何非负实数。例如320.5勒克斯、550勒克斯等。",
                    isDiscrete: false,
                    explanation: `<p>光照强度可以是任何非负实数。可以是320.5勒克斯、550勒克斯或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>物理测量量是连续变量。</p>`
                },
                {
                    title: "患者的血压值（毫米汞柱）。",
                    text: "血压可以是任何正值。例如120/80毫米汞柱，可以是118.5/79.3等。",
                    isDiscrete: false,
                    explanation: `<p>血压可以是任何正值。可以是118.5毫米汞柱、125.7毫米汞柱等。因此，该变量是<strong>连续的</strong>。</p><p>医学测量通常是连续变量。</p>`
                },
                {
                    title: "电路中的电流强度（安培）。",
                    text: "电流可以是任何实数值。例如2.5安培、0.753安培等。",
                    isDiscrete: false,
                    explanation: `<p>电流可以是任何实数值。可以是2.5安培、0.753安培或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>电学测量是连续变量。</p>`
                },
                {
                    title: "一块金属的重量（克）。",
                    text: "重量可以是任何非负实数。例如125.6克、2345.78克等。",
                    isDiscrete: false,
                    explanation: `<p>重量可以是任何非负实数。可以是125.6克、2345.78克或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>重量测量是连续变量。</p>`
                },
                {
                    title: "汽车行驶的距离（公里）。",
                    text: "距离可以是任何非负实数。例如12.5公里、156.78公里等。",
                    isDiscrete: false,
                    explanation: `<p>距离可以是任何非负实数。可以是12.5公里、156.78公里或介于其间的任何值。因此，该变量是<strong>连续的</strong>。</p><p>距离测量是连续变量。</p>`
                },
                {
                    title: "一名学生的考试分数（百分制）。",
                    text: "分数理论上可以是1到100之间的任何实数。例如85.5分、92.35分等。",
                    isDiscrete: false,
                    explanation: `<p>分数理论上可以是1到100之间的任何实数。可以是85.5分、92.35分等。因此，该变量是<strong>连续的</strong>。</p><p>虽然实际中常取整数，但分数本质上是连续的测量。</p>`
                }
            ];

            let currentQuestions = [];
            let questions = [];
            let usedQuestionIndices = new Set(); // 记录已使用过的题目索引

            let refreshCount = 0; // 记录刷新次数

            // 随机选择n道题目（排除已使用过的）
            function selectRandomQuestions(n) {
                // 获取未被使用的题目索引
                const availableIndices = [];
                for (let i = 0; i < allQuestions.length; i++) {
                    if (!usedQuestionIndices.has(i)) {
                        availableIndices.push(i);
                    }
                }

                // 如果可用题目不足，重置已使用记录
                if (availableIndices.length < n) {
                    usedQuestionIndices.clear();
                    for (let i = 0; i < allQuestions.length; i++) {
                        availableIndices.push(i);
                    }
                }

                // 随机打乱可用索引
                const shuffledIndices = availableIndices.sort(() => Math.random() - 0.5);
                const selectedIndices = shuffledIndices.slice(0, n);

                // 记录本次使用的题目索引
                selectedIndices.forEach(idx => usedQuestionIndices.add(idx));

                return selectedIndices.map((qIndex, index) => {
                    const q = allQuestions[qIndex];
                    return {
                        id: index + 1,
                        title: `(${String.fromCharCode(97 + index)}) ${q.title}`,
                        text: q.text,
                        options: [
                            { text: "离散", correct: q.isDiscrete },
                            { text: "连续", correct: !q.isDiscrete }
                        ],
                        explanation: `<h4>解析：</h4>${q.explanation}`
                    };
                });
            }

            const questionsContainer = document.getElementById('questions-container');
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const resultsContainer = document.getElementById('results-container');
            const scoreElement = document.getElementById('score');
            const correctCountElement = document.getElementById('correct-count');
            const totalQuestionsElement = document.getElementById('total-questions');
            const resultMessageElement = document.getElementById('result-message');

            // 初始化题目
            function renderQuestions() {
                questionsContainer.innerHTML = '';

                questions.forEach((question, index) => {
                    const questionElement = document.createElement('div');
                    questionElement.className = 'question-container';
                    questionElement.dataset.questionId = question.id;

                    let optionsHTML = '';
                    question.options.forEach((option, optionIndex) => {
                        optionsHTML += `
                            <div class="option" data-option-index="${optionIndex}">
                                ${option.text}
                            </div>
                        `;
                    });

                    questionElement.innerHTML = `
                        <div class="question-header">
                            <div class="question-title">${question.title}</div>
                            <div class="question-number">${question.id}</div>
                        </div>
                        <div class="question-text">${question.text}</div>
                        <div class="options-container">
                            ${optionsHTML}
                        </div>
                        <div class="explanation" id="explanation-${question.id}">
                            ${question.explanation}
                        </div>
                    `;

                    questionsContainer.appendChild(questionElement);
                });

                // 添加选项点击事件
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionContainer = this.closest('.question-container');
                        const questionId = parseInt(questionContainer.dataset.questionId);
                        const optionIndex = parseInt(this.dataset.optionIndex);

                        // 清除同一问题中其他选项的选中状态
                        questionContainer.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 选中当前选项
                        this.classList.add('selected');

                        // 存储用户选择
                        questions[questionId - 1].userAnswer = optionIndex;
                    });
                });

                // 初始化结果
                updateResults();
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                let allAnswered = true;
                let correctCount = 0;

                questions.forEach(question => {
                    const questionElement = document.querySelector(`[data-question-id="${question.id}"]`);
                    const explanationElement = document.getElementById(`explanation-${question.id}`);

                    // 检查是否已回答
                    if (question.userAnswer === undefined) {
                        allAnswered = false;
                        return;
                    }

                    // 不再高亮正确答案，只标记用户选择的答案
                    const options = questionElement.querySelectorAll('.option');
                    options.forEach((option, index) => {
                        option.classList.remove('selected', 'correct', 'incorrect');

                        if (index === question.userAnswer) {
                            option.classList.add('selected');
                            if (!question.options[index].correct) {
                                option.classList.add('incorrect');
                            }
                        }
                    });

                    // 计算正确数量
                    if (question.options[question.userAnswer].correct) {
                        correctCount++;
                    }
                });

                if (!allAnswered) {
                    alert('请先回答所有问题再提交！');
                    return;
                }

                // 显示结果
                updateResults(correctCount);
                resultsContainer.classList.add('show');

                // 显示答案解析按钮
                var showBtn = document.getElementById('show-explanation-btn');
                if (showBtn) {
                    showBtn.style.display = 'inline-block';
                    showBtn.onclick = function() {
                        var explanationSection = document.getElementById('explanation-section');
                        if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                            explanationSection.style.display = 'block';
                            // 显示所有解析
                            questions.forEach(question => {
                                const explanationElement = document.getElementById(`explanation-${question.id}`);
                                if (explanationElement) {
                                    explanationElement.classList.add('show');
                                }
                            });
                            this.textContent = '隐藏答案解析';
                        } else {
                            explanationSection.style.display = 'none';
                            // 隐藏所有解析
                            questions.forEach(question => {
                                const explanationElement = document.getElementById(`explanation-${question.id}`);
                                if (explanationElement) {
                                    explanationElement.classList.remove('show');
                                }
                            });
                            this.textContent = '查看答案解析';
                        }
                    };
                }

                // 滚动到结果区域
                resultsContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                questions.forEach(question => {
                    question.userAnswer = undefined;
                });

                renderQuestions();
                resultsContainer.classList.remove('show');

                // 重置答案解析按钮和区域
                var showBtn = document.getElementById('show-explanation-btn');
                var explanationSection = document.getElementById('explanation-section');
                if (showBtn) {
                    showBtn.style.display = 'none';
                    showBtn.textContent = '查看答案解析';
                }
                if (explanationSection) {
                    explanationSection.style.display = 'none';
                }

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // 更新结果
            function updateResults(correctCount = 0) {
                const totalQuestions = questions.length;
                const percentage = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;

                scoreElement.textContent = `${correctCount}/${totalQuestions}`;
                correctCountElement.textContent = correctCount;
                totalQuestionsElement.textContent = totalQuestions;

            }

            // 初始渲染
            questions = selectRandomQuestions(4);
            renderQuestions();

            // 刷新参数按钮 - 选择新的随机题目
            document.getElementById('refresh-btn').addEventListener('click', function() {
                // 选择新的随机题目
                questions = selectRandomQuestions(4);

                // 重置所有状态
                renderQuestions();
                resultsContainer.classList.remove('show');

                // 重置答案解析按钮和区域
                var showBtn = document.getElementById('show-explanation-btn');
                var explanationSection = document.getElementById('explanation-section');
                if (showBtn) {
                    showBtn.style.display = 'none';
                    showBtn.textContent = '查看答案解析';
                }
                if (explanationSection) {
                    explanationSection.style.display = 'none';
                }

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
