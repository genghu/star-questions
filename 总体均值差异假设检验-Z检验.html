<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值差异假设检验 Z检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.4;
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        .info-box {
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-left: 4px solid #3498db;
            font-size: 0.9rem;
        }

        .info-box p {
            margin-bottom: 4px;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.1);
        }

        .question-title {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin-right: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .options-container-2col {
            grid-template-columns: repeat(2, 1fr);
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .option:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 0.85rem;
        }

        .fill-blank-input {
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            width: 120px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
            font-size: 0.85rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 3px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 3px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        #submitBtn {
            background-color: #3498db;
            color: white;
        }

        #submitBtn:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        #resetBtn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #resetBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.3);
        }

        .toggle-explanation-btn {
            display: none;
            margin: 10px auto;
            padding: 8px 20px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(155, 89, 182, 0.3);
        }

        .toggle-explanation-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(155, 89, 182, 0.4);
        }

        .toggle-explanation-btn.show {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .result-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .result-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .result-icon.correct {
            background-color: #2ecc71;
            color: white;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
            color: white;
        }

        .result-icon:hover {
            transform: scale(1.1);
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .score-text {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid #f39c12;
            font-size: 0.85rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .explanation h5 {
            color: #2980b9;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .explanation p {
            margin-bottom: 3px;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 4px;
            padding: 8px;
            margin: 6px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 3px solid #3498db;
            font-size: 0.85rem;
        }

        .critical-value {
            display: inline-block;
            padding: 2px 6px;
            background-color: #f1c40f;
            border-radius: 3px;
            margin: 0 2px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .options-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 8px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .fill-blank-input {
                width: 100%;
            }
        }
    </style>
    </head>

            <div class="score-value" id="scoreValue">0/6</div>
            <div class="score-text" id="scoreMessage"></div>
        </div>
    </div>

                        const selectedOption = question.querySelector('.option.selected');
                        const correctOption = question.querySelector('.option[data-correct="true"]');

                        question.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('correct', 'incorrect');
                        });

                        if (selectedOption) {
                            const isCorrect = selectedOption.dataset.correct === 'true';
                            if (isCorrect) {
                                score++;
                                selectedOption.classList.add('correct');
                                feedback.textContent = '正确！';
                                feedback.className = 'feedback correct show';
                            } else {
                                selectedOption.classList.add('incorrect');
                                if (correctOption) correctOption.classList.add('correct');
                                feedback.textContent = '不正确。';
                                feedback.className = 'feedback incorrect show';
                            }
                        } else {
                            if (correctOption) correctOption.classList.add('correct');
                            feedback.textContent = '请先选择一个答案！';
                            feedback.className = 'feedback incorrect show';
                        }
                    }
                });

                // 记录历史
                const isAllCorrect = score === totalQuestions;
                quizHistory.push(isAllCorrect);

                // 更新分数显示
                document.getElementById('scoreValue').textContent = `${score}/${totalQuestions}`;
                document.getElementById('scoreMessage').textContent = isAllCorrect ? '太棒了！这套题全对了！' : `这套题答对了 ${score}/${totalQuestions} 道，继续加油！`;

                // 显示答案解析按钮
                document.getElementById('toggle-explanation-btn').classList.add('show');

                // 更新历史记录显示
                updateHistoryDisplay();
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                refreshQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // 显示/隐藏答案解析按钮
            document.getElementById('toggle-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('combined-explanation');
                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                } else {
                    explanation.classList.add('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 隐藏答案解析';
                }
            });

            // 初始化
            refreshQuestion();
        });
    </script>
</body>
</html>
