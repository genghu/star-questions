<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立事件概率练习</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-section {
            background-color: #f8fbff;
            border-left: 5px solid #4d94ff;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #003366;
        }

        .question-details {
            background-color: #e6f2ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .refresh-btn {
            background-color: #34a853;
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-left: auto;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background-color: #2d9248;
        }

        .answer-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .answer-input-section {
            background-color: white;
            border: 2px solid #c2d9ff;
            border-radius: 10px;
            padding: 25px;
            margin-top: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .input-group label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0052cc;
            white-space: nowrap;
        }

        .answer-input {
            width: 150px;
            padding: 12px 15px;
            font-size: 1.2rem;
            border: 2px solid #c2d9ff;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            border-color: #0052cc;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .answer-input.correct {
            border-color: #00cc66;
            background-color: #e6ffe6;
        }

        .answer-input.incorrect {
            border-color: #ff6666;
            background-color: #ffe6e6;
        }

        .input-hint {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #003d99;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.3);
        }

        #reset-btn {
            background-color: #f0f7ff;
            color: #0052cc;
            border: 2px solid #c2d9ff;
        }

        #reset-btn:hover {
            background-color: #e6f2ff;
            transform: translateY(-2px);
        }

        .feedback {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct {
            background-color: #e6ffe6;
            border: 2px solid #00cc66;
            color: #006600;
        }

        .feedback.incorrect {
            background-color: #ffe6e6;
            border: 2px solid #ff6666;
            color: #990000;
        }

        .feedback-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-icon {
            font-size: 1.5rem;
        }

        .score-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 10px;
            border: 2px dashed #c2d9ff;
        }

        .score-text {
            font-size: 1.3rem;
            color: #0052cc;
            font-weight: bold;
        }

        .explanation {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0f7ff;
            border-radius: 10px;
            border-left: 4px solid #4d94ff;
        }

        .explanation h3 {
            color: #0052cc;
            margin-bottom: 15px;
        }

        .explanation p {
            margin-bottom: 10px;
        }

        .formula {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            text-align: center;
            border: 1px solid #c2d9ff;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-option {
                padding: 15px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>独立事件概率</h1>
            <p class="subtitle">小数答案 - 概率计算练习</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span style="color: #0052cc; font-weight: 600;">题目</span>
                <button class="refresh-btn" id="refresh-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    刷新参数
                </button>
            </div>
            <div class="question-section">
                <p class="question-text" id="questionText">
                    一个转盘有 10 个等大小的扇形，其中 3 个是蓝色，7 个是黄色。转动转盘，同时抛掷一枚均匀的硬币。求转盘停在蓝色区域且硬币抛出为反面的概率？
                </p>
                <p class="question-details"><strong>要求：</strong>不要四舍五入你的答案。</p>
            </div>

            <div class="answer-input-section" id="answer-input-section">
                <div class="input-group">
                    <label for="user-answer">请输入概率值：</label>
                    <input type="text" id="user-answer" class="answer-input" autocomplete="off">
                </div>
                <p class="input-hint">提示：不要四舍五入你的答案，使用容差为 0.001 的数值验证</p>
            </div>

            <div class="controls">
                <button id="submit-btn">提交答案</button>
                <button id="reset-btn">重新作答</button>
            </div>

            <div id="feedback" class="feedback">
                <div class="feedback-title">
                    <span class="feedback-icon" id="feedback-icon"></span>
                    <span id="feedback-text"></span>
                </div>
                <p id="feedback-detail"></p>
            </div>

            <div class="score-container">
                <p class="score-text">得分: <span id="score">0</span> / 1</p>
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanationSection">
                <h3>题目解析</h3>
                <div id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    totalSectors: 10,
                    blueSectors: 3,
                    coinSides: 2,
                    targetSide: '反面',
                    probBlue: 0.3,
                    probCoin: 0.5,
                    answer: '0.15',
                    options: ['0.15', '0.3', '0.5', '0.35']
                },
                {
                    totalSectors: 8,
                    blueSectors: 5,
                    coinSides: 2,
                    targetSide: '正面',
                    probBlue: 0.625,
                    probCoin: 0.5,
                    answer: '0.3125',
                    options: ['0.3125', '0.625', '0.5', '0.25']
                },
                {
                    totalSectors: 12,
                    blueSectors: 4,
                    coinSides: 2,
                    targetSide: '反面',
                    probBlue: 0.333,
                    probCoin: 0.5,
                    answer: '0.1667',
                    options: ['0.1667', '0.333', '0.5', '0.25']
                },
                {
                    totalSectors: 6,
                    blueSectors: 2,
                    coinSides: 2,
                    targetSide: '正面',
                    probBlue: 0.333,
                    probCoin: 0.5,
                    answer: '0.1667',
                    options: ['0.1667', '0.333', '0.5', '0.0833']
                },
                {
                    totalSectors: 20,
                    blueSectors: 8,
                    coinSides: 2,
                    targetSide: '反面',
                    probBlue: 0.4,
                    probCoin: 0.5,
                    answer: '0.2',
                    options: ['0.2', '0.4', '0.5', '0.25']
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let isSubmitted = false;
            let score = 0;
            const TOLERANCE = 0.001; // Tolerance for numerical comparison

            const userAnswerInput = document.getElementById('user-answer');

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染问题文本
                document.getElementById('questionText').innerHTML = `
                    一个转盘有 ${params.totalSectors} 个等大小的扇形，其中 ${params.blueSectors} 个是蓝色，${params.totalSectors - params.blueSectors} 个是黄色。
                    转动转盘，同时抛掷一枚均匀的硬币。求转盘停在蓝色区域且硬币抛出为${params.targetSide}的概率？
                `;

                // 清空输入框
                if (userAnswerInput) {
                    userAnswerInput.value = '';
                    userAnswerInput.classList.remove('correct', 'incorrect');
                    userAnswerInput.disabled = false;
                }

                // 渲染解析
                document.getElementById('explanationContent').innerHTML = `
                    <p>事件"停在蓝色"不影响事件"得到${params.targetSide}"，此类事件为独立事件。</p>
                    <p>为了求两个独立事件 A 和 B 同时发生的概率，我们将两个事件的概率相乘：</p>
                    <div class="formula">P(A 与 B) = P(A) * P(B)</div>
                    <p>我们要求"停在蓝色"和"得到${params.targetSide}"的概率：</p>
                    <div class="formula">P(停在蓝色 且 得到${params.targetSide}) = P(停在蓝色) * P(得到${params.targetSide})</div>
                    <p><strong>计算 P(停在蓝色)：</strong>转盘有 ${params.totalSectors} 个等大小的扇形，其中 ${params.blueSectors} 个是蓝色。</p>
                    <div class="formula">P(停在蓝色) = ${params.blueSectors} / ${params.totalSectors} = ${params.answer}</div>
                    <p><strong>计算 P(得到${params.targetSide})：</strong>抛掷一枚均匀硬币，结果正面或反面可能性相同。</p>
                    <div class="formula">P(得到${params.targetSide}) = 1 / 2 = 0.5</div>
                    <p><strong>计算最终概率：</strong></p>
                    <div class="formula">P(停在蓝色 且 得到${params.targetSide}) = ${params.answer} * 0.5 = ${params.answer}</div>
                    <p><strong>答案：${params.answer}</strong></p>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                isSubmitted = false;

                // 重置UI
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';
                document.getElementById('score').textContent = '0';

                renderQuestion();
            }

            // 刷新参数按钮
            document.getElementById('refresh-btn').addEventListener('click', refreshParams);

            // 显示答案解析按钮
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanationSection');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            const submitBtn = document.getElementById('submit-btn');
            const feedback = document.getElementById('feedback');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackText = document.getElementById('feedback-text');
            const feedbackDetail = document.getElementById('feedback-detail');
            const scoreElement = document.getElementById('score');

            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(userAnswerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请输入有效的数字答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;

                const params = questionParams[currentParamIndex];
                const correctAnswer = parseFloat(params.answer);

                // 使用容差验证答案
                const isCorrect = Math.abs(userAnswer - correctAnswer) <= TOLERANCE;

                // 更新输入框样式
                if (isCorrect) {
                    userAnswerInput.classList.add('correct');
                    feedback.className = 'feedback correct';
                    feedbackIcon.textContent = '✓';
                    feedbackText.textContent = '回答正确！';
                    feedbackDetail.textContent = '你正确地计算出了独立事件的概率。';
                    score = 1;
                } else {
                    userAnswerInput.classList.add('incorrect');
                    feedback.className = 'feedback incorrect';
                    feedbackIcon.textContent = '✗';
                    feedbackText.textContent = '回答不正确。';
                    feedbackDetail.textContent = '正确答案是 ' + correctAnswer + '。请查看下面的解析了解计算方法。';
                    score = 0;
                }

                // 禁用输入框
                userAnswerInput.disabled = true;

                feedback.style.display = 'block';
                document.getElementById('show-explanation-btn').style.display = 'inline-block';
                scoreElement.textContent = score;

                feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 重新作答
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置输入框
                userAnswerInput.value = '';
                userAnswerInput.classList.remove('correct', 'incorrect');
                userAnswerInput.disabled = false;

                // 隐藏反馈
                feedback.style.display = 'none';

                // 重置状态
                isSubmitted = false;
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
