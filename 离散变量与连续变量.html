<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散变量与连续变量 - 交互式答题</title>
    <style>
        :root {
            --primary-blue: #3498db;
            --light-blue: #e3f2fd;
            --dark-blue: #2980b9;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
            --neutral-gray: #ecf0f1;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--neutral-gray);
        }

        h1 {
            color: var(--dark-blue);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .instructions {
            background-color: var(--light-blue);
            border-left: 5px solid var(--primary-blue);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
        }

        .question-container {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .question-container:hover {
            transform: translateY(-3px);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--neutral-gray);
        }

        .question-title {
            font-size: 1.4rem;
            color: var(--dark-blue);
            font-weight: 600;
        }

        .question-number {
            background-color: var(--primary-blue);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .option {
            flex: 1 1 calc(50% - 15px);
            min-width: 200px;
            background-color: var(--neutral-gray);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            padding: 18px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .option:hover {
            background-color: #d5dbdb;
            transform: scale(1.02);
        }

        .option.selected {
            border-color: var(--primary-blue);
            background-color: var(--light-blue);
            color: var(--dark-blue);
        }

        .option.correct {
            border-color: var(--success-green);
            background-color: rgba(46, 204, 113, 0.1);
            color: #27ae60;
        }

        .option.incorrect {
            border-color: var(--error-red);
            background-color: rgba(231, 76, 60, 0.1);
            color: #c0392b;
        }

        .explanation {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background-color: #f9f9f9;
            border-radius: var(--border-radius);
            padding: 0 20px;
            margin-top: 10px;
        }

        .explanation.show {
            max-height: 500px;
            padding: 20px;
            margin-top: 15px;
        }

        .explanation h4 {
            color: var(--dark-blue);
            margin-bottom: 10px;
        }

        .explanation p {
            margin-bottom: 10px;
        }

        .example {
            background-color: white;
            border-left: 3px solid var(--primary-blue);
            padding: 10px 15px;
            margin: 15px 0;
            font-style: italic;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: var(--primary-blue);
            color: white;
        }

        #submit-btn:hover {
            background-color: var(--dark-blue);
            transform: translateY(-2px);
        }

        #reset-btn {
            background-color: var(--text-light);
            color: white;
        }

        #reset-btn:hover {
            background-color: #6c7a7d;
            transform: translateY(-2px);
        }

        .results {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 25px;
            margin-top: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-blue);
            margin: 15px 0;
        }

        .score-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .correct-answers {
            color: var(--success-green);
            font-weight: bold;
        }

        .total-questions {
            color: var(--text-dark);
            font-weight: bold;
        }


        @media (max-width: 768px) {
            .option {
                flex: 1 1 100%;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }

        .math-example {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .math-number {
            background-color: var(--light-blue);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <header>
        <h1>离散变量与连续变量 <button id="refresh-btn" style="margin-left: 15px; padding: 8px 16px; background: linear-gradient(135deg, #34a853, #2ecc71); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(52, 168, 83, 0.3);">刷新参数</button></h1>
        <p class="subtitle">随机变量与分布 - 交互式答题练习</p>
    </header>

    <div class="instructions">
        <p><strong>说明：</strong>以下变量中，哪些最好被视为连续的，哪些是离散的？请点击每个问题的相应答案来表明您的选择。提交后可以查看详细解析。</p>
        <p><strong>关键概念：</strong>离散变量的可能值可以被计数（通常是整数），连续变量的可能值构成一个实数区间（可以取区间内的任何值）。</p>
    </div>

    <div id="questions-container">
        <!-- 问题将通过JavaScript动态生成 -->
    </div>

    <div class="controls">
        <button id="submit-btn">提交答案</button>
        <button id="reset-btn">重新作答</button>
    </div>

    <div class="results" id="results-container">
        <h2>答题结果</h2>
        <div class="score" id="score">0/4</div>
        <p class="score-text">您答对了 <span class="correct-answers" id="correct-count">0</span> 题，共 <span class="total-questions" id="total-questions">4</span> 题</p>
        <p id="result-message"></p>
    </div>

    <button class="show-explanation-btn" id="show-explanation-btn" style="display:none;">查看答案解析</button>
    <div class="explanation-section" id="explanation-section" style="display:none;">
        <h3>答案解析</h3>
        <p>点击每道题目下方的区域可查看详细解析。</p>
    </div>



    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // 显示答案解析按钮点击事件
            document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    var explanation = this.nextElementSibling;
                    if (explanation) {
                        if (explanation.style.display === 'none' || explanation.style.display === '') {
                            explanation.style.display = 'block';
                            this.textContent = '隐藏答案解析';
                        } else {
                            explanation.style.display = 'none';
                            this.textContent = '查看答案解析';
                        }
                    }
                });
            });

            // 题目数据
            const questions = [
                {
                    id: 1,
                    title: "(a) 明尼阿波利斯市今年的总降雪量。",
                    text: "总降雪量可以是（非负）实数区间内的任何数字。例如，它可以是50.62英寸，或63.47英寸，或介于其间的任何数字。",
                    options: [
                        { text: "离散", correct: false },
                        { text: "连续", correct: true }
                    ],
                    explanation: `
                        <h4>解析：</h4>
                        <p>总降雪量可以是（非负）实数区间内的任何数字。例如，它可以是50.62英寸，或63.47英寸，或介于其间的任何数字。（如果降雪量以英寸以外的单位测量，类似的评论也适用。）因此，该变量是<strong>连续的</strong>。</p>
                        <div class="math-example">
                            <span class="math-number">50.62</span>
                            <span class="math-number">63.47</span>
                        </div>
                        <p>连续变量是指其可能值构成一个实数区间的变量。对于任何连续变量，其可能值包括一个没有任何间隔的数字范围。</p>
                    `
                },
                {
                    id: 2,
                    title: "(b) 在一个有35名学生的班级中，从第一次期中考试到第二次期中考试分数提高的学生人数。",
                    text: "分数提高的学生人数必须是整数。具体来说，它必须是数字0, 1, 2, ..., 35中的一个。",
                    options: [
                        { text: "离散", correct: true },
                        { text: "连续", correct: false }
                    ],
                    explanation: `
                        <h4>解析：</h4>
                        <p>分数提高的学生人数必须是整数。具体来说，它必须是数字0, 1, 2, ..., 35中的一个。（它不能是两个整数之间的数字，比如14.68。）这意味着该变量是<strong>离散的</strong>。</p>
                        <div class="math-example">
                            <span class="math-number">0, 1, 2, ..., 35</span>
                        </div>
                        <p>离散变量是指其可能值可以被计数的变量，这意味着其可能值对应于整数集的某个子集。因此，如果变量只能取整数值，那么它就是离散的。</p>
                    `
                },
                {
                    id: 3,
                    title: "(c) 一辆美国制造汽车的燃油效率（以每加仑英里数计）。",
                    text: "燃油效率可以是任何正值。例如，它可以是14.8英里每加仑，或59.16英里每加仑，或介于其间的任何值。",
                    options: [
                        { text: "离散", correct: false },
                        { text: "连续", correct: true }
                    ],
                    explanation: `
                        <h4>解析：</h4>
                        <p>燃油效率可以是任何正值。例如，它可以是14.8英里每加仑，或59.16英里每加仑，或介于其间的任何值。因为该变量可以在某个区间内取任何值，且没有值被排除，所以该变量是<strong>连续的</strong>。</p>
                        <div class="math-example">
                            <span class="math-number">14.8</span>
                            <span class="math-number">59.16</span>
                        </div>
                        <p>连续变量通常在数量被测量时出现，而离散变量通常在数量被计数时出现。</p>
                    `
                },
                {
                    id: 4,
                    title: "(d) 辐照后培养皿上受损染色体的数量。",
                    text: "受损染色体的数量必然是一个整数。（它可以是0, 1, 2, 3，或直到培养皿上染色体总数的任何整数。）",
                    options: [
                        { text: "离散", correct: true },
                        { text: "连续", correct: false }
                    ],
                    explanation: `
                        <h4>解析：</h4>
                        <p>受损染色体的数量必然是一个整数。（它可以是0, 1, 2, 3，或直到培养皿上染色体总数的任何整数。）整数之间的值是被排除的。因此，该变量是<strong>离散的</strong>。</p>
                        <div class="math-example">
                            <span class="math-number">0</span>
                            <span class="math-number">1</span>
                            <span class="math-number">2</span>
                            <span class="math-number">3</span>
                        </div>
                        <p>离散变量通常在数量被计数时出现（"……的数量"），而连续变量通常在数量被测量时出现。</p>
                    `
                }
            ];

            const questionsContainer = document.getElementById('questions-container');
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const resultsContainer = document.getElementById('results-container');
            const scoreElement = document.getElementById('score');
            const correctCountElement = document.getElementById('correct-count');
            const totalQuestionsElement = document.getElementById('total-questions');
            const resultMessageElement = document.getElementById('result-message');

            // 初始化题目
            function renderQuestions() {
                questionsContainer.innerHTML = '';
                
                questions.forEach((question, index) => {
                    const questionElement = document.createElement('div');
                    questionElement.className = 'question-container';
                    questionElement.dataset.questionId = question.id;
                    
                    let optionsHTML = '';
                    question.options.forEach((option, optionIndex) => {
                        optionsHTML += `
                            <div class="option" data-option-index="${optionIndex}">
                                ${option.text}
                            </div>
                        `;
                    });
                    
                    questionElement.innerHTML = `
                        <div class="question-header">
                            <div class="question-title">${question.title}</div>
                            <div class="question-number">${question.id}</div>
                        </div>
                        <div class="question-text">${question.text}</div>
                        <div class="options-container">
                            ${optionsHTML}
                        </div>
                        <div class="explanation" id="explanation-${question.id}">
                            ${question.explanation}
                        </div>
                    `;
                    
                    questionsContainer.appendChild(questionElement);
                });
                
                // 添加选项点击事件
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionContainer = this.closest('.question-container');
                        const questionId = parseInt(questionContainer.dataset.questionId);
                        const optionIndex = parseInt(this.dataset.optionIndex);
                        
                        // 清除同一问题中其他选项的选中状态
                        questionContainer.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        
                        // 选中当前选项
                        this.classList.add('selected');
                        
                        // 存储用户选择
                        questions[questionId - 1].userAnswer = optionIndex;
                    });
                });
                
                // 初始化结果
                updateResults();
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                let allAnswered = true;
                let correctCount = 0;

                questions.forEach(question => {
                    const questionElement = document.querySelector(`[data-question-id="${question.id}"]`);
                    const explanationElement = document.getElementById(`explanation-${question.id}`);

                    // 检查是否已回答
                    if (question.userAnswer === undefined) {
                        allAnswered = false;
                        return;
                    }

                    // 不再高亮正确答案，只标记用户选择的答案
                    const options = questionElement.querySelectorAll('.option');
                    options.forEach((option, index) => {
                        option.classList.remove('selected', 'correct', 'incorrect');

                        if (index === question.userAnswer) {
                            option.classList.add('selected');
                            if (!question.options[index].correct) {
                                option.classList.add('incorrect');
                            }
                        }
                    });

                    // 不自动显示解析
                    // explanationElement.classList.add('show');

                    // 计算正确数量
                    if (question.options[question.userAnswer].correct) {
                        correctCount++;
                    }
                });

                if (!allAnswered) {
                    alert('请先回答所有问题再提交！');
                    return;
                }

                // 显示结果
                updateResults(correctCount);
                resultsContainer.classList.add('show');

                // 显示答案解析按钮
                var showBtn = document.getElementById('show-explanation-btn');
                if (showBtn) {
                    showBtn.style.display = 'inline-block';
                    showBtn.onclick = function() {
                        var explanationSection = document.getElementById('explanation-section');
                        if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                            explanationSection.style.display = 'block';
                            // 显示所有解析
                            questions.forEach(question => {
                                const explanationElement = document.getElementById(`explanation-${question.id}`);
                                if (explanationElement) {
                                    explanationElement.classList.add('show');
                                }
                            });
                            this.textContent = '隐藏答案解析';
                        } else {
                            explanationSection.style.display = 'none';
                            // 隐藏所有解析
                            questions.forEach(question => {
                                const explanationElement = document.getElementById(`explanation-${question.id}`);
                                if (explanationElement) {
                                    explanationElement.classList.remove('show');
                                }
                            });
                            this.textContent = '查看答案解析';
                        }
                    };
                }

                // 滚动到结果区域
                resultsContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                questions.forEach(question => {
                    question.userAnswer = undefined;
                });
                
                renderQuestions();
                resultsContainer.classList.remove('show');
                
                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // 更新结果
            function updateResults(correctCount = 0) {
                const totalQuestions = questions.length;
                const percentage = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
                
                scoreElement.textContent = `${correctCount}/${totalQuestions}`;
                correctCountElement.textContent = correctCount;
                totalQuestionsElement.textContent = totalQuestions;
                
                // 根据得分显示不同消息
                let message = '';
                if (correctCount === totalQuestions) {
                    message = '太棒了！您完全理解了离散变量与连续变量的区别！';
                } else if (correctCount >= totalQuestions * 0.7) {
                    message = '做得不错！您对离散变量和连续变量有较好的理解。';
                } else if (correctCount >= totalQuestions * 0.5) {
                    message = '还可以，但需要进一步理解离散变量和连续变量的区别。';
                } else {
                    message = '需要更多练习来区分离散变量和连续变量。请查看解析以加深理解。';
                }
                
                resultMessageElement.textContent = message;
            }

            // 初始渲染
            renderQuestions();
        });
    </script>
</body>
</html>
