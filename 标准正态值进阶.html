<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准正态值进阶 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-weight: bold;
            color: #0052cc;
        }

        .formula-box {
            background-color: #f8fbff;
            border: 1px dashed #4d94ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }

        #next-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .feedback-container {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .incorrect-feedback {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .step {
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #4d94ff;
            padding-bottom: 10px;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .stats {
            background-color: #e6f0ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .stats-title {
            font-size: 1rem;
            color: #0052cc;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            min-height: 40px;
        }

        .result-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            animation: popIn 0.3s ease;
        }

        .result-icon.correct {
            background-color: #27ae60;
        }

        .result-icon.correct::after {
            content: "✓";
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
        }

        .result-icon.incorrect::after {
            content: "✗";
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .stats-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #b3d1ff;
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0052cc;
        }

        .summary-label {
            font-size: 0.85rem;
            color: #6699ff;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>标准正态值 进阶</h1>
            <p class="subtitle">交互式答题与解析</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span>问题</span>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <label class="answer-label">请输入c的值（保留两位小数）：</label>
                <input type="text" class="answer-input" id="answer-input">
                <div class="tolerance-hint">容差：±0.01</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">提交答案</button>
            <button id="next-btn">下一题</button>
        </div>

        <div class="feedback-container" id="feedback">
            <div class="feedback-title" id="feedback-title-text"></div>
            <p id="feedback-text"></p>
            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation" id="explanation" style="display:none;">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">答题记录</div>
            <div class="result-icons" id="result-icons">
                <!-- 动态生成图标 -->
            </div>
            <div class="stats-summary">
                <div class="summary-item">
                    <div class="summary-value" id="correct-count">0</div>
                    <div class="summary-label">正确</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="incorrect-count">0</div>
                    <div class="summary-label">错误</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 每个参数集包含：z1(下界), probability(区间概率), answer(c的值)
            const questionParams = [
                {
                    z1: -0.96,
                    probability: 0.7923,
                    probZ1: 0.1685,
                    probZ1Right: 0.8315,
                    probTail: 0.0392,
                    answer: 1.76
                },
                {
                    z1: -1.25,
                    probability: 0.7549,
                    probZ1: 0.1056,
                    probZ1Right: 0.8944,
                    probTail: 0.1395,
                    answer: 1.08
                },
                {
                    z1: -0.52,
                    probability: 0.6862,
                    probZ1: 0.3015,
                    probZ1Right: 0.6985,
                    probTail: 0.0123,
                    answer: 2.25
                },
                {
                    z1: -1.65,
                    probability: 0.8212,
                    probZ1: 0.0495,
                    probZ1Right: 0.9505,
                    probTail: 0.1293,
                    answer: 1.13
                },
                {
                    z1: -0.84,
                    probability: 0.7305,
                    probZ1: 0.2005,
                    probZ1Right: 0.7995,
                    probTail: 0.0690,
                    answer: 1.48
                },
                // 新增15组参数
                {
                    z1: -0.50,
                    probability: 0.6247,
                    probZ1: 0.3085,
                    probZ1Right: 0.6915,
                    probTail: 0.0668,
                    answer: 1.50
                },
                {
                    z1: -1.00,
                    probability: 0.8186,
                    probZ1: 0.1587,
                    probZ1Right: 0.8413,
                    probTail: 0.0227,
                    answer: 2.00
                },
                {
                    z1: -0.75,
                    probability: 0.6677,
                    probZ1: 0.2266,
                    probZ1Right: 0.7734,
                    probTail: 0.1057,
                    answer: 1.25
                },
                {
                    z1: -1.50,
                    probability: 0.7745,
                    probZ1: 0.0668,
                    probZ1Right: 0.9332,
                    probTail: 0.1587,
                    answer: 1.00
                },
                {
                    z1: -2.00,
                    probability: 0.9710,
                    probZ1: 0.0228,
                    probZ1Right: 0.9772,
                    probTail: 0.0062,
                    answer: 2.50
                },
                {
                    z1: -0.25,
                    probability: 0.5865,
                    probZ1: 0.4013,
                    probZ1Right: 0.5987,
                    probTail: 0.0122,
                    answer: 2.25
                },
                {
                    z1: -1.75,
                    probability: 0.7333,
                    probZ1: 0.0401,
                    probZ1Right: 0.9599,
                    probTail: 0.2266,
                    answer: 0.75
                },
                {
                    z1: -1.35,
                    probability: 0.8793,
                    probZ1: 0.0885,
                    probZ1Right: 0.9115,
                    probTail: 0.0322,
                    answer: 1.85
                },
                {
                    z1: -0.67,
                    probability: 0.6568,
                    probZ1: 0.2514,
                    probZ1Right: 0.7486,
                    probTail: 0.0918,
                    answer: 1.33
                },
                {
                    z1: -1.10,
                    probability: 0.8095,
                    probZ1: 0.1357,
                    probZ1Right: 0.8643,
                    probTail: 0.0548,
                    answer: 1.60
                },
                {
                    z1: -0.85,
                    probability: 0.7845,
                    probZ1: 0.1977,
                    probZ1Right: 0.8023,
                    probTail: 0.0178,
                    answer: 2.10
                },
                {
                    z1: -1.40,
                    probability: 0.8905,
                    probZ1: 0.0808,
                    probZ1Right: 0.9192,
                    probTail: 0.0287,
                    answer: 1.90
                },
                {
                    z1: -0.60,
                    probability: 0.6107,
                    probZ1: 0.2743,
                    probZ1Right: 0.7257,
                    probTail: 0.1150,
                    answer: 1.20
                },
                {
                    z1: -2.25,
                    probability: 0.9848,
                    probZ1: 0.0122,
                    probZ1Right: 0.9878,
                    probTail: 0.0030,
                    answer: 2.75
                },
                {
                    z1: -0.35,
                    probability: 0.5874,
                    probZ1: 0.3632,
                    probZ1Right: 0.6368,
                    probTail: 0.0494,
                    answer: 1.65
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionText = document.getElementById('question-text');
                const explanation = document.getElementById('explanation');

                // 渲染问题文本
                questionText.innerHTML = `
                    <p>设 <span class="math">Z</span> 为标准正态随机变量。使用所提供的计算器或标准正态表确定 <span class="math">c</span> 的值。</p>
                    <div class="formula-box">
                        P(${params.z1} <= Z <= c) = ${params.probability}
                    </div>
                    <p>将你的中间计算至少保留四位小数。将你的答案四舍五入到两位小数。</p>
                `;

                // 渲染解析
                explanation.innerHTML = `
                    <h3>题目解析：</h3>
                    <p>题目要求我们找到值 <span class="math">c</span>，使得 <span class="math">P(${params.z1} <= Z <= c) = ${params.probability}</span>。也就是说，我们需要找到值 <span class="math">c</span>，使得标准正态密度曲线在 <span class="math">${params.z1}</span> 和 <span class="math">c</span> 之间的面积为 ${params.probability}。</p>

                    <div class="step">
                        <p><strong>步骤 1:</strong> 使用互补法则计算 <span class="math">P(Z > ${params.z1})</span>：</p>
                        <div class="formula-box">
                            P(Z > ${params.z1}) = 1 - P(Z <= ${params.z1}) = 1 - ${params.probZ1.toFixed(4)} = ${params.probZ1Right.toFixed(4)}
                        </div>
                    </div>

                    <div class="step">
                        <p><strong>步骤 2:</strong> 计算 <span class="math">P(Z > c)</span>：</p>
                        <div class="formula-box">
                            P(Z > c) = P(Z > ${params.z1}) - P(${params.z1} <= Z <= c) = ${params.probZ1Right.toFixed(4)} - ${params.probability} = ${params.probTail.toFixed(4)}
                        </div>
                    </div>

                    <div class="step">
                        <p><strong>步骤 3:</strong> 密度曲线在 <span class="math">c</span> 右侧的面积为 <span class="math">${params.probTail.toFixed(4)}</span>。因此，<span class="math">c</span> 是值 <span class="math">z<sub>${params.probTail.toFixed(4)}</sub></span>。通过标准正态表或计算器查找：</p>
                        <div class="formula-box">
                            c = ${params.answer.toFixed(2)}
                        </div>
                    </div>

                    <p><strong>正确答案：${params.answer.toFixed(2)}</strong></p>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 清除输入和反馈
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈和解析
                const feedback = document.getElementById('feedback');
                feedback.classList.remove('show');
                const explanation = document.getElementById('explanation');
                explanation.style.display = 'none';
                const showExpBtn = document.getElementById('show-explanation-btn');
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // ==================== 事件处理 ====================

            let isSubmitted = false;
            let correctCount = 0;
            let incorrectCount = 0;

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title-text');
            const feedbackText = document.getElementById('feedback-text');
            const correctCountElement = document.getElementById('correct-count');
            const incorrectCountElement = document.getElementById('incorrect-count');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanation = document.getElementById('explanation');
            const answerInput = document.getElementById('answer-input');
            const feedbackInline = document.getElementById('feedback-inline');
            const resultIconsContainer = document.getElementById('result-icons');

            // 添加结果图标
            function addResultIcon(isCorrect) {
                const icon = document.createElement('div');
                icon.className = `result-icon ${isCorrect ? 'correct' : 'incorrect'}`;
                resultIconsContainer.appendChild(icon);

                // 滚动到最新图标
                icon.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 下一题按钮
            nextBtn.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(answerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请先输入一个有效的数字答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;

                const params = questionParams[currentParamIndex];
                const tolerance = 0.01;
                const isCorrect = Math.abs(userAnswer - params.answer) <= tolerance;

                // 更新统计
                if (isCorrect) {
                    correctCount++;
                    answerInput.classList.add('correct');
                    feedbackInline.textContent = '正确！';
                    feedbackInline.className = 'feedback-inline correct';
                    feedbackTitle.textContent = "回答正确！";
                    feedbackText.textContent = `您输入了 ${userAnswer.toFixed(2)}，这是正确答案。`;
                    feedback.classList.remove('incorrect-feedback');
                    feedback.classList.add('correct-feedback');
                } else {
                    incorrectCount++;
                    answerInput.classList.add('incorrect');
                    feedbackInline.textContent = `不正确。正确答案是 ${params.answer.toFixed(2)}`;
                    feedbackInline.className = 'feedback-inline incorrect';
                    feedbackTitle.textContent = "回答错误！";
                    feedbackText.textContent = `您输入了 ${userAnswer.toFixed(2)}，但正确答案是 ${params.answer.toFixed(2)}。`;
                    feedback.classList.remove('correct-feedback');
                    feedback.classList.add('incorrect-feedback');
                }

                // 添加结果图标
                addResultIcon(isCorrect);

                // 更新统计显示
                correctCountElement.textContent = correctCount;
                incorrectCountElement.textContent = incorrectCount;

                // 显示反馈
                feedback.classList.add('show');

                // 显示解析按钮
                showExplanationBtn.style.display = 'inline-block';

                // 禁用输入
                answerInput.disabled = true;
            });

            // ==================== 初始化 ====================
            renderQuestion();

            // 初始统计显示
            correctCountElement.textContent = correctCount;
            incorrectCountElement.textContent = incorrectCount;
        });
    </script>
</body>
</html>
