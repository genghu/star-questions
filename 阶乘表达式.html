<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阶乘表达式 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-title {
            font-size: 1.5rem;
            color: #0052cc;
            font-weight: 600;
        }

        .question-content {
            background-color: #f8fbff;
            border-left: 4px solid #4d94ff;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .question-content p {
            margin-bottom: 15px;
        }

        .factorial-def {
            background-color: #e6f0ff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-style: italic;
        }

        .calculation {
            background-color: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .answer-section {
            margin-top: 25px;
        }

        .input-group {
            background-color: #f8fbff;
            border: 2px solid #cce0ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #4d94ff;
            box-shadow: 0 0 0 3px rgba(77, 148, 255, 0.2);
        }

        .input-group.correct {
            border-color: #00cc66;
            background-color: #e6ffe6;
        }

        .input-group.incorrect {
            border-color: #ff6666;
            background-color: #ffe6e6;
        }

        .input-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #0052cc;
            font-size: 1.1rem;
        }

        .answer-input {
            width: 100%;
            max-width: 250px;
            padding: 12px 16px;
            font-size: 1.2rem;
            border: 2px solid #cce0ff;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            border-color: #4d94ff;
            box-shadow: 0 0 0 3px rgba(77, 148, 255, 0.2);
        }

        .answer-input.correct {
            border-color: #00cc66;
            background-color: #ccffcc;
        }

        .answer-input.incorrect {
            border-color: #ff6666;
            background-color: #ffcccc;
        }

        .input-hint {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #6699ff;
        }

        .feedback-text {
            margin-top: 10px;
            font-weight: 600;
            display: none;
        }

        .feedback-text.correct {
            color: #00cc66;
            display: block;
        }

        .feedback-text.incorrect {
            color: #ff6666;
            display: block;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.3);
        }

        #reset-btn {
            background-color: #f0f7ff;
            color: #0052cc;
            border: 2px solid #cce0ff;
        }

        #reset-btn:hover {
            background-color: #e6f0ff;
            transform: translateY(-2px);
        }

        .result-container {
            margin-top: 40px;
            padding: 25px;
            background-color: #f8fbff;
            border-radius: 12px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-title {
            color: #0052cc;
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title i {
            font-size: 1.8rem;
        }

        .result-correct {
            color: #00cc66;
        }

        .result-incorrect {
            color: #ff6666;
        }

        .score-display {
            font-size: 1.3rem;
            margin: 15px 0;
            padding: 10px;
            background-color: #e6f0ff;
            border-radius: 8px;
            text-align: center;
        }

        .explanation {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #cce0ff;
        }

        .explanation h3 {
            color: #0052cc;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-input {
                max-width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            .question-content {
                padding: 15px;
            }
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>阶乘表达式</h1>
                <button class="refresh-btn" id="refresh-btn">
                    <span>&#8635;</span> 刷新参数
                </button>
            </div>
            <div class="subtitle">交互式数学答题 - 概率与阶乘</div>
        </header>

        <div class="question-container">
            <div class="question-header">
                <div class="question-title">题目：阶乘表达式求值</div>
            </div>

            <div class="question-content" id="question-content">
                <p>求下列表达式的值：</p>
                <p style="text-align: center; font-size: 1.4rem; margin: 20px 0; font-weight: bold;" id="expression">
                    (12! × 11!) ÷ (13! × 8!)
                </p>
                <p>如果你的答案不是整数，请将其写为精确分数。</p>
            </div>

            <div class="answer-section">
                <div class="input-group" id="input-group">
                    <div class="input-label">请输入你的答案：</div>
                    <input type="text" class="answer-input" id="answer-input">
                    <div class="input-hint">请以分数形式输入，如：330/19</div>
                    <div class="feedback-text" id="feedback-text"></div>
                </div>
            </div>
            
            <div class="controls">
                <button id="submit-btn">提交答案</button>
                <button id="reset-btn">重新作答</button>
            </div>
            
            <div class="result-container" id="result-container">
                <div class="result-title">
                    <span id="result-icon"></span>
                    <span id="result-text"></span>
                </div>

                <div class="score-display" id="score-display">
                    得分: <span id="score">0</span> / 1
                </div>

                <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
                <div class="explanation-section explanation" style="display:none;">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
        
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const resultIcon = document.getElementById('result-icon');
            const scoreDisplay = document.getElementById('score');
            const explanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.querySelector('.explanation-section');

            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    a: 12, b: 11, c: 13, d: 8,
                    expression: "(12! × 11!) ÷ (13! × 8!)",
                    numerator: 990,
                    denominator: 13,
                    steps: [
                        "13! = 13 × 12!，所以 12! ÷ 13! = 1 ÷ 13",
                        "11! = 11 × 10 × 9 × 8!，所以 11! ÷ 8! = 11 × 10 × 9 = 990",
                        "因此原式 = (1 ÷ 13) × 990 = 990 ÷ 13"
                    ]
                },
                {
                    a: 10, b: 9, c: 11, d: 6,
                    expression: "(10! × 9!) ÷ (11! × 6!)",
                    numerator: 504,
                    denominator: 11,
                    steps: [
                        "11! = 11 × 10!，所以 10! ÷ 11! = 1 ÷ 11",
                        "9! = 9 × 8 × 7 × 6!，所以 9! ÷ 6! = 9 × 8 × 7 = 504",
                        "因此原式 = (1 ÷ 11) × 504 = 504 ÷ 11"
                    ]
                },
                {
                    a: 8, b: 7, c: 9, d: 5,
                    expression: "(8! × 7!) ÷ (9! × 5!)",
                    numerator: 336,
                    denominator: 9,
                    steps: [
                        "9! = 9 × 8!，所以 8! ÷ 9! = 1 ÷ 9",
                        "7! = 7 × 6 × 5!，所以 7! ÷ 5! = 7 × 6 = 42",
                        "因此原式 = (1 ÷ 9) × 42 = 42 ÷ 9 = 14/3"
                    ]
                },
                {
                    a: 15, b: 10, c: 16, d: 7,
                    expression: "(15! × 10!) ÷ (16! × 7!)",
                    numerator: 720,
                    denominator: 16,
                    steps: [
                        "16! = 16 × 15!，所以 15! ÷ 16! = 1 ÷ 16",
                        "10! = 10 × 9 × 8 × 7!，所以 10! ÷ 7! = 10 × 9 × 8 = 720",
                        "因此原式 = (1 ÷ 16) × 720 = 720 ÷ 16 = 45"
                    ]
                },
                {
                    a: 14, b: 12, c: 15, d: 9,
                    expression: "(14! × 12!) ÷ (15! × 9!)",
                    numerator: 1320,
                    denominator: 15,
                    steps: [
                        "15! = 15 × 14!，所以 14! ÷ 15! = 1 ÷ 15",
                        "12! = 12 × 11 × 10 × 9!，所以 12! ÷ 9! = 12 × 11 × 10 = 1320",
                        "因此原式 = (1 ÷ 15) × 1320 = 1320 ÷ 15 = 88"
                    ]
                }
            ];

            let currentParamIndex = 0;
            let currentAnswer = '';
            let isSubmitted = false;

            // ==================== 辅助函数 ====================
            function gcd(a, b) {
                a = Math.abs(a);
                b = Math.abs(b);
                while (b) {
                    let t = b;
                    b = a % b;
                    a = t;
                }
                return a;
            }

            function simplifyFraction(numerator, denominator) {
                const g = gcd(numerator, denominator);
                return `${numerator / g}/${denominator / g}`;
            }

            // 标准化输入格式
            function normalizeAnswer(input) {
                return input.trim().replace(/\s+/g, '').toLowerCase();
            }

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const g = gcd(params.numerator, params.denominator);
                const simplifiedNum = params.numerator / g;
                const simplifiedDen = params.denominator / g;

                currentAnswer = `${simplifiedNum}/${simplifiedDen}`;

                // 更新表达式
                document.getElementById('expression').textContent = params.expression;

                // 更新解析内容
                renderExplanation(params, simplifiedNum, simplifiedDen);

                // 重置状态
                resetState();
            }

            function renderExplanation(params, num, den) {
                const stepsHTML = params.steps.map(step => `<li>${step}</li>`).join('');
                document.querySelector('.explanation-section').innerHTML = `
                    <h3>题目解析</h3>
                    <p>为了计算 ${params.expression}，我们可以利用阶乘的性质进行简化：</p>
                    <ol>${stepsHTML}</ol>
                    <p><strong>正确答案：</strong> ${num}/${den}</p>
                `;
            }

            function resetState() {
                isSubmitted = false;

                // 重置输入框
                document.getElementById('answer-input').value = '';

                // 移除所有样式
                document.getElementById('input-group').classList.remove('correct', 'incorrect');
                document.getElementById('answer-input').classList.remove('correct', 'incorrect');

                // 清除反馈文本
                document.getElementById('feedback-text').textContent = '';
                document.getElementById('feedback-text').className = 'feedback-text';

                // 隐藏结果和解析
                resultContainer.classList.remove('show');
                explanationSection.style.display = 'none';
                explanationBtn.style.display = 'none';
                explanationBtn.textContent = '查看答案解析';
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            refreshBtn.addEventListener('click', function() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();
            });

            // 显示答案解析按钮
            explanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (isSubmitted) return;

                const userAnswer = document.getElementById('answer-input').value;

                if (!userAnswer.trim()) {
                    alert('请先输入你的答案！');
                    return;
                }

                isSubmitted = true;

                const inputGroup = document.getElementById('input-group');
                const inputField = document.getElementById('answer-input');
                const feedbackText = document.getElementById('feedback-text');
                const normalizedUserAnswer = normalizeAnswer(userAnswer);

                const isCorrect = normalizedUserAnswer === currentAnswer;

                if (isCorrect) {
                    inputGroup.classList.add('correct');
                    inputField.classList.add('correct');
                    feedbackText.textContent = `正确！答案是 ${currentAnswer}`;
                    feedbackText.className = 'feedback-text correct';
                    resultText.textContent = '回答正确！';
                    resultText.className = 'result-correct';
                    resultIcon.innerHTML = '✓';
                    resultIcon.style.color = '#00cc66';
                    scoreDisplay.textContent = '1';
                } else {
                    inputGroup.classList.add('incorrect');
                    inputField.classList.add('incorrect');
                    feedbackText.textContent = `错误。正确答案是 ${currentAnswer}`;
                    feedbackText.className = 'feedback-text incorrect';
                    resultText.textContent = '回答不正确。';
                    resultText.className = 'result-incorrect';
                    resultIcon.innerHTML = '✗';
                    resultIcon.style.color = '#ff6666';
                    scoreDisplay.textContent = '0';
                }

                // 显示结果容器和解析按钮
                resultContainer.classList.add('show');
                explanationBtn.style.display = 'inline-block';

                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                resetState();
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
