<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于比例统计的合理推断 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 100, 150, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .refresh-params-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-container {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-content {
            font-size: 1.1rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .data-table th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .data-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eaeff5;
        }

        .data-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .data-table tr:hover {
            background-color: #e3f2fd;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .option-card {
            background-color: white;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.15);
            border-color: #3498db;
        }

        .option-card.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option-card.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .option-card.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .option-card.correct .option-letter {
            background-color: #2ecc71;
        }

        .option-card.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .blank-input {
            display: inline-block;
            width: 120px;
            padding: 8px 12px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            margin: 0 5px;
            background-color: #f8fafc;
        }

        .blank-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .feedback.correct {
            background-color: #e8f8ef;
            border-left: 5px solid #2ecc71;
            display: block;
        }

        .feedback.incorrect {
            background-color: #fdedec;
            border-left: 5px solid #e74c3c;
            display: block;
        }

        .feedback-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-content {
            font-size: 1.1rem;
            color: #34495e;
        }

        .score-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 15px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 700;
            color: #3498db;
            margin: 10px 0;
        }

        .score-text {
            font-size: 1.2rem;
            color: #7f8c8d;
        }

        .explanation {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border-left: 5px solid #f39c12;
        }

        .explanation-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1.1rem;
            color: #34495e;
        }

        .calculation {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            border: 1px dashed #bdc3c7;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: column;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- 动态生成 -->
    </div>

    <script>
        // 参数化数据集
        const questionParams = [
            {
                productA: { total: 100, noRelief: 24, relief: 76, noReliefPct: 24 },
                productB: { total: 50, noRelief: 17, relief: 33, noReliefPct: 34 },
                worseProduct: 'B',
                worsePct: 34,
                betterProduct: 'A',
                betterPct: 24
            },
            {
                productA: { total: 120, noRelief: 36, relief: 84, noReliefPct: 30 },
                productB: { total: 80, noRelief: 20, relief: 60, noReliefPct: 25 },
                worseProduct: 'A',
                worsePct: 30,
                betterProduct: 'B',
                betterPct: 25
            },
            {
                productA: { total: 200, noRelief: 50, relief: 150, noReliefPct: 25 },
                productB: { total: 150, noRelief: 60, relief: 90, noReliefPct: 40 },
                worseProduct: 'B',
                worsePct: 40,
                betterProduct: 'A',
                betterPct: 25
            },
            {
                productA: { total: 80, noRelief: 12, relief: 68, noReliefPct: 15 },
                productB: { total: 60, noRelief: 18, relief: 42, noReliefPct: 30 },
                worseProduct: 'B',
                worsePct: 30,
                betterProduct: 'A',
                betterPct: 15
            },
            {
                productA: { total: 150, noRelief: 45, relief: 105, noReliefPct: 30 },
                productB: { total: 100, noRelief: 20, relief: 80, noReliefPct: 20 },
                worseProduct: 'A',
                worsePct: 30,
                betterProduct: 'B',
                betterPct: 20
            }
        ];

        let currentParamIndex = 0;
        let userAnswers = { blank1: '', blank2: '', blank3: '', blank4: '' };
        let correctAnswers = {};
        let submitted = false;

        function renderQuestion() {
            const params = questionParams[currentParamIndex];
            const container = document.getElementById('main-container');

            // 设置正确答案
            correctAnswers = {
                blank1: params.worseProduct,
                blank2: String(params.worsePct),
                blank3: params.betterProduct,
                blank4: String(params.betterPct)
            };

            container.innerHTML = `
                <header>
                    <div>
                        <h1><i class="fas fa-chart-bar"></i> 基于比例统计的合理推断</h1>
                        <p class="subtitle">交互式答题练习 - 根据统计数据做出合理推断</p>
                    </div>
                    <button class="refresh-params-btn" onclick="refreshParams()">
                        <i class="fas fa-sync-alt"></i> 刷新参数
                    </button>
                </header>

                <div class="question-container">
                    <div class="question-title">
                        <i class="fas fa-question-circle"></i> 题目
                    </div>

                    <div class="question-content">
                        <p>在一项止痛药研究中，${params.productA.total} 人被给予产品 A，除 ${params.productA.noRelief} 人外均体验到缓解。在同一研究中，${params.productB.total} 人被给予产品 B，除 ${params.productB.noRelief} 人外均体验到缓解。</p>
                        <p>填写以下陈述中的空白，使该陈述尽可能最合理。</p>

                        <p style="margin: 25px 0; font-size: 1.2rem; font-weight: 600; color: #2c3e50; line-height: 2.2;">
                            产品 <input type="text" id="blank1" class="blank-input" size="3" autocomplete="off"> 在研究中表现更差，因为使用该产品有
                            <input type="text" id="blank2" class="blank-input" size="3" autocomplete="off">% 的人未能获得缓解，而使用产品
                            <input type="text" id="blank3" class="blank-input" size="3" autocomplete="off"> 仅有
                            <input type="text" id="blank4" class="blank-input" size="3" autocomplete="off">% 的人未能获得缓解。
                        </p>

                        <p style="color: #7f8c8d; font-size: 0.95rem; margin-top: 15px;">
                            <i class="fas fa-info-circle"></i> 提示：第一个和第三个空填 A 或 B，第二个和第四个空填数字。
                        </p>
                    </div>

                    <div class="controls">
                        <button class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-paper-plane"></i> 提交答案
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            <i class="fas fa-redo"></i> 重新作答
                        </button>
                    </div>

                    <div class="feedback" id="feedback">
                        <div class="feedback-title" id="feedbackTitle">
                            <i class="fas fa-check-circle"></i> 回答正确！
                        </div>
                        <div class="feedback-content" id="feedbackContent">
                            您的答案完全正确！
                        </div>
                    </div>

                    <div class="score-container" id="scoreContainer">
                        <h3><i class="fas fa-trophy"></i> 答题结果</h3>
                        <div class="score-value" id="scoreValue">0/4</div>
                        <div class="score-text" id="scoreText">您答对了 0 个空，共 4 个空</div>
                    </div>
                </div>

                <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
                <div class="explanation" id="explanation-section" style="display:none;">
                    <div class="explanation-title">
                        <i class="fas fa-lightbulb"></i> 题目解析
                    </div>
                    <div class="explanation-content" id="explanation-content">
                        <!-- 动态生成 -->
                    </div>
                </div>
            `;

            bindEvents(params);
        }

        function bindEvents(params) {
            const blankInputs = document.querySelectorAll('.blank-input');
            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackContent = document.getElementById('feedbackContent');
            const scoreContainer = document.getElementById('scoreContainer');
            const scoreValue = document.getElementById('scoreValue');
            const scoreText = document.getElementById('scoreText');

            // 提交答案
            submitBtn.addEventListener('click', function() {
                submitted = true;
                let correctCount = 0;
                let totalBlanks = 4;

                blankInputs.forEach(input => {
                    const blankId = input.id;
                    const userAnswer = input.value.trim().toUpperCase();
                    const correctAnswer = correctAnswers[blankId].toUpperCase();

                    if (userAnswer === correctAnswer) {
                        input.classList.add('correct');
                        input.classList.remove('incorrect');
                        correctCount++;
                    } else {
                        input.classList.add('incorrect');
                        input.classList.remove('correct');
                    }
                });

                if (correctCount === totalBlanks) {
                    feedbackTitle.innerHTML = '<i class="fas fa-check-circle"></i> 回答正确！';
                    feedbackContent.textContent = '恭喜！您完全正确地填写了所有空白。';
                    feedback.classList.remove('incorrect');
                    feedback.classList.add('correct');
                } else {
                    feedbackTitle.innerHTML = '<i class="fas fa-times-circle"></i> 回答不完全正确';
                    feedbackContent.textContent = `您答对了 ${correctCount} 个空，共 ${totalBlanks} 个空。点击"查看答案解析"了解正确答案。`;
                    feedback.classList.remove('correct');
                    feedback.classList.add('incorrect');
                }

                scoreValue.textContent = `${correctCount}/${totalBlanks}`;
                scoreText.textContent = `您答对了 ${correctCount} 个空，共 ${totalBlanks} 个空`;
                scoreContainer.classList.add('show');

                document.getElementById('show-explanation-btn').style.display = 'inline-block';
                feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                refreshParams();
            });

            // 显示答案解析按钮点击事件
            const showExpBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');
            const explanationContent = document.getElementById('explanation-content');

            showExpBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationContent.innerHTML = `
                        <p>我们希望确定哪个产品表现更差。为此，我们可以比较获得缓解的人的百分比，或者比较未能获得缓解的人的百分比。</p>

                        <div class="calculation">
                            <p><strong>对于产品 A：</strong></p>
                            <p>${params.productA.total} 人中有 ${params.productA.noRelief} 人未能获得缓解。</p>
                            <p>未能获得缓解的比例：${params.productA.noRelief} / ${params.productA.total} = ${params.productA.noReliefPct}%</p>
                            <p>获得缓解的比例：100% - ${params.productA.noReliefPct}% = ${100 - params.productA.noReliefPct}%</p>
                        </div>

                        <div class="calculation">
                            <p><strong>对于产品 B：</strong></p>
                            <p>${params.productB.total} 人中有 ${params.productB.noRelief} 人未能获得缓解。</p>
                            <p>未能获得缓解的比例：${params.productB.noRelief} / ${params.productB.total} = ${params.productB.noReliefPct}%</p>
                            <p>获得缓解的比例：100% - ${params.productB.noReliefPct}% = ${100 - params.productB.noReliefPct}%</p>
                        </div>

                        <p>因为使用产品 ${params.worseProduct} 有 ${params.worsePct}% 的人未能获得缓解，而使用产品 ${params.betterProduct} 有 ${params.betterPct}% 的人未能获得缓解，我们得出结论：<strong>产品 ${params.worseProduct} 在研究中表现更差</strong>。</p>

                        <p style="margin-top: 15px; font-weight: 600; color: #2c3e50;">
                            因此，完整答案是：<br>
                            产品 <span style="color: #2ecc71;">${params.worseProduct}</span> 在研究中表现更差，因为使用该产品有 <span style="color: #2ecc71;">${params.worsePct}</span>% 的人未能获得缓解，而使用产品 <span style="color: #2ecc71;">${params.betterProduct}</span> 仅有 <span style="color: #2ecc71;">${params.betterPct}</span>% 的人未能获得缓解。
                        </p>
                    `;
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });
        }

        function refreshParams() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questionParams.length);
            } while (newIndex === currentParamIndex && questionParams.length > 1);

            currentParamIndex = newIndex;
            userAnswers = { blank1: '', blank2: '', blank3: '', blank4: '' };
            submitted = false;
            renderQuestion();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderQuestion();
        });
    </script>
</body>
</html>
