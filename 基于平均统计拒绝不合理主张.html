<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于平均统计拒绝不合理主张 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .info-box {
            background-color: #e6f0ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 5px solid #0052cc;
        }

        .info-box h3 {
            color: #0052cc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-box h3 i {
            font-size: 1.2rem;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #003d99;
            font-weight: 600;
            line-height: 1.8;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option {
            background-color: #f8fbff;
            border: 2px solid #d9e6ff;
            border-radius: 10px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .option:hover {
            background-color: #e6f0ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.1);
        }

        .option.selected {
            border-color: #0052cc;
            background-color: #e6f0ff;
        }

        .option.correct {
            border-color: #00a86b;
            background-color: #e6fffa;
        }

        .option.incorrect {
            border-color: #ff4d4d;
            background-color: #ffe6e6;
        }

        .option-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #b3d1ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .option.selected .option-checkbox {
            background-color: #0052cc;
            border-color: #0052cc;
        }

        .option.selected .option-checkbox::after {
            content: "";
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
        }

        .option-text {
            flex-grow: 1;
        }

        .explanation {
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 5px solid #666;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .explanation h4 {
            color: #0052cc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation h4 i {
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #003d99;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.3);
        }

        #reset-btn {
            background-color: #f0f0f0;
            color: #333;
        }

        #reset-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .results {
            background-color: #e6f0ff;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .score {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0052cc;
            margin-bottom: 10px;
        }

        .score-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }

        .correct-answers {
            text-align: left;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .correct-answers h4 {
            color: #0052cc;
            margin-bottom: 15px;
            text-align: center;
        }

        .correct-answer-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .correct-answer-item:last-child {
            border-bottom: none;
        }

        .correct-answer-item i {
            color: #00a86b;
            font-size: 1.2rem;
        }

        .note {
            font-style: italic;
            color: #666;
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .option {
                padding: 15px;
            }
            
            button {
                padding: 12px 20px;
                width: 100%;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
        }

        .math-example {
            background-color: #f0f7ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            border-left: 4px solid #0052cc;
        }

        .highlight {
            background-color: #fffacd;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: 600;
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> 基于平均统计拒绝不合理主张 <button id="refresh-btn" style="margin-left: 15px; padding: 8px 16px; background: linear-gradient(135deg, #34a853, #2ecc71); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(52, 168, 83, 0.3);">刷新参数</button></h1>
            <p class="subtitle">描述性统计 - 交互式答题练习</p>
        </header>

        <div class="info-box">
            <h3><i class="fas fa-info-circle"></i> 题目背景</h3>
            <p>一家投资公司宣传称，去年其客户平均获得了8%的利润。假设这里的"平均"指的是均值，基于此信息，下列哪些主张必定为真？</p>
            <p><strong>注意：</strong>可能有多个陈述为真。如果没有一个陈述为真，请勾选相应的方框。</p>
        </div>

        <div class="question-container">
            <div class="question-text">
                我们被告知假设"平均"指的是均值，事实上这是"平均"一词最常见的用法。
                根据定义，客户百分比利润的均值等于其百分比利润的总和除以客户数量。我们使用这个定义来确定以下五个陈述中哪些必定为真。
            </div>

            <div class="options-container" id="options-container">
                <!-- 选项将通过JavaScript动态生成 -->
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation" id="explanation" style="display:none;">
                <h4><i class="fas fa-lightbulb"></i> 题目解析</h4>
                <div id="explanation-content">
                    <!-- 解析内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="reset-btn">
                <i class="fas fa-redo"></i> 重新作答
            </button>
        </div>

        <div class="results" id="results">
            <div class="score" id="score">0/5</div>
            <div class="score-text" id="score-text">您答对了 <span id="correct-count">0</span> 个陈述，答错了 <span id="incorrect-count">0</span> 个陈述</div>

            <p class="note">点击"查看答案解析"按钮了解详细解析。</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // 显示答案解析按钮点击事件
            document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    var questionId = this.getAttribute('data-question') || this.id;
                    var explanation;
                    if (questionId) {
                        explanation = this.nextElementSibling;
                    }
                    if (explanation) {
                        if (explanation.classList.contains('show')) {
                            explanation.classList.remove('show');
                            this.textContent = '查看答案解析';
                        } else {
                            explanation.classList.add('show');
                            this.textContent = '隐藏答案解析';
                        }
                    }
                });
            });

            // 题目数据
            const questionData = {
                title: "基于平均统计拒绝不合理的主张",
                statements: [
                    {
                        id: 1,
                        text: "两年前，他们的一些客户至少获得了8%的利润。",
                        correct: false,
                        explanation: "我们知道该投资公司的客户去年平均获得了8%的利润。我们并不确定该公司的客户两年前的表现如何。因此，此陈述不一定为真。"
                    },
                    {
                        id: 2,
                        text: "去年，他们至少有一位客户恰好获得了8%的利润。",
                        correct: false,
                        explanation: "此陈述不一定为真。例如，如果该公司只有两位客户，他们的利润分别是7%和9%，那么平均值将是8%，但没有客户在去年恰好获得8%的利润。"
                    },
                    {
                        id: 3,
                        text: "去年，超过一半的客户至少获得了8%的利润。",
                        correct: false,
                        explanation: "此陈述不一定为真。例如，如果该公司只有三位客户，他们去年的利润分别是7%、7%和10%，那么平均值将是8%，但只有三分之一的客户在去年至少获得了8%的利润。换句话说，在该例子中，只有不到一半的客户获得了至少8%的利润。"
                    },
                    {
                        id: 4,
                        text: "去年，他们的一些客户获得了8%或更多的利润。",
                        correct: true,
                        explanation: "如果去年每位客户的利润都少于8%，那么平均利润不可能为8%。因此，去年他们的一些客户必定获得了8%或更多的利润。因此，此陈述必定为真。"
                    },
                    {
                        id: 5,
                        text: "去年，他们所有的客户都获得了少于13%的利润。",
                        correct: false,
                        explanation: "此陈述不一定为真。例如，如果该公司只有两位客户，他们去年的利润分别是2%和14%，那么平均值将是8%，但'去年他们所有的客户都获得了少于13%的利润'这一陈述将是错误的。"
                    },
                    {
                        id: 6,
                        text: "以上陈述均不成立。",
                        correct: false,
                        explanation: "此陈述不正确，因为陈述4必定为真。"
                    }
                ]
            };

            // 初始化变量
            let selectedOptions = [];
            let submitted = false;

            // 获取DOM元素
            const optionsContainer = document.getElementById('options-container');
            const explanation = document.getElementById('explanation');
            const explanationContent = document.getElementById('explanation-content');
            const results = document.getElementById('results');
            const scoreElement = document.getElementById('score');
            const scoreText = document.getElementById('score-text');
            const correctCountElement = document.getElementById('correct-count');
            const incorrectCountElement = document.getElementById('incorrect-count');
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');

            // 生成选项
            function renderOptions() {
                optionsContainer.innerHTML = '';
                
                questionData.statements.forEach(statement => {
                    const optionElement = document.createElement('div');
                    optionElement.className = 'option';
                    optionElement.dataset.id = statement.id;
                    
                    optionElement.innerHTML = `
                        <div class="option-checkbox"></div>
                        <div class="option-text">${statement.text}</div>
                    `;
                    
                    optionElement.addEventListener('click', () => {
                        if (submitted) return;
                        
                        // 对于"以上陈述均不成立"选项，需要特殊处理
                        if (statement.id === 6) {
                            // 如果选择此项，则取消选择所有其他选项
                            selectedOptions = [6];
                            document.querySelectorAll('.option').forEach(opt => {
                                opt.classList.remove('selected');
                            });
                            optionElement.classList.add('selected');
                        } else {
                            // 如果选择其他选项，则取消选择"以上陈述均不成立"
                            const noneOption = document.querySelector('.option[data-id="6"]');
                            if (noneOption) {
                                noneOption.classList.remove('selected');
                            }
                            
                            // 从selectedOptions中移除6（如果存在）
                            const indexOfNone = selectedOptions.indexOf(6);
                            if (indexOfNone !== -1) {
                                selectedOptions.splice(indexOfNone, 1);
                            }
                            
                            // 切换当前选项的选择状态
                            const index = selectedOptions.indexOf(statement.id);
                            if (index === -1) {
                                selectedOptions.push(statement.id);
                                optionElement.classList.add('selected');
                            } else {
                                selectedOptions.splice(index, 1);
                                optionElement.classList.remove('selected');
                            }
                        }
                    });
                    
                    optionsContainer.appendChild(optionElement);
                });
            }

            // 显示解析
            function showExplanation() {
                let explanationHTML = '';
                
                questionData.statements.forEach(statement => {
                    explanationHTML += `
                        <div class="correct-answer-item">
                            <i class="fas ${statement.correct ? 'fa-check' : 'fa-times'}"></i>
                            <div>
                                <strong>陈述 ${statement.id}:</strong> ${statement.text}
                                <div class="math-example">${statement.explanation}</div>
                            </div>
                        </div>
                    `;
                });
                
                explanationContent.innerHTML = explanationHTML;
                // Explanation will be shown via button click
            }

            // 显示结果
            function showResults() {
                submitted = true;

                // 计算得分
                let correctCount = 0;
                let incorrectCount = 0;

                // 检查每个选项（只标记用户选择的错误答案，不显示正确答案）
                document.querySelectorAll('.option').forEach(option => {
                    const id = parseInt(option.dataset.id);
                    const statement = questionData.statements.find(s => s.id === id);

                    if (!statement) return;

                    // 用户是否选择了这个选项
                    const isSelected = selectedOptions.includes(id);

                    if (isSelected && statement.correct) {
                        // 用户选择了且是正确的
                        option.classList.add('correct');
                        correctCount++;
                    } else if (isSelected && !statement.correct) {
                        // 用户选择了但是错误的
                        option.classList.add('incorrect');
                        incorrectCount++;
                    } else if (!isSelected && statement.correct) {
                        // 用户没有选择但这是正确的（不显示正确答案）
                        incorrectCount++;
                    }
                });

                // 更新结果面板
                const totalOptions = questionData.statements.length - 1; // 减去"以上陈述均不成立"选项
                const score = correctCount;

                scoreElement.textContent = `${score}/${totalOptions}`;
                correctCountElement.textContent = correctCount;
                incorrectCountElement.textContent = incorrectCount;

                // 显示结果面板
                results.classList.add('show');

                // 显示答案解析按钮
                var showBtn = document.getElementById('show-explanation-btn');
                if (showBtn) {
                    showBtn.style.display = 'inline-block';
                }
                
                // 显示解析
                showExplanation();
                
                // 滚动到结果区域
                results.scrollIntoView({ behavior: 'smooth' });
            }

            // 重置答题
            function resetQuiz() {
                selectedOptions = [];
                submitted = false;

                // 重置选项样式
                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                });

                // 隐藏结果和解析
                results.classList.remove('show');
                explanation.style.display = 'none';

                // 隐藏答案解析按钮
                var showBtn = document.getElementById('show-explanation-btn');
                if (showBtn) {
                    showBtn.style.display = 'none';
                    showBtn.textContent = '查看答案解析';
                }

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // 显示答案解析按钮点击事件
            var showExpBtn = document.getElementById('show-explanation-btn');
            if (showExpBtn) {
                showExpBtn.addEventListener('click', function() {
                    if (explanation.style.display === 'none' || explanation.style.display === '') {
                        explanation.style.display = 'block';
                        this.textContent = '隐藏答案解析';
                    } else {
                        explanation.style.display = 'none';
                        this.textContent = '查看答案解析';
                    }
                });
            }

            // 事件监听
            submitBtn.addEventListener('click', showResults);
            resetBtn.addEventListener('click', resetQuiz);

            // 初始化
            renderOptions();
        });
    </script>
</body>
</html>
