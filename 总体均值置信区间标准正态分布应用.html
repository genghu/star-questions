<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值置信区间标准正态分布应用 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-weight: bold;
            color: #0052cc;
        }

        .formula-box {
            background-color: #f8fbff;
            border: 1px dashed #4d94ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .answer-input {
            width: 100%;
            max-width: 200px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }

        #next-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .feedback-container {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .incorrect-feedback {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
        }

        .stats {
            background-color: #e6f0ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .stats-title {
            font-size: 1rem;
            color: #0052cc;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .results-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 40px;
            align-items: center;
        }

        .result-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            animation: popIn 0.3s ease;
        }

        .result-icon.correct {
            background-color: #27ae60;
        }

        .result-icon.correct::after {
            content: '✓';
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
        }

        .result-icon.incorrect::after {
            content: '✗';
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .no-results {
            color: #999;
            font-size: 0.9rem;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .explanation-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .explanation-section.show {
            display: block;
        }

        .explanation-step {
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            border-left: 4px solid #4d94ff;
            margin-bottom: 15px;
        }

        .step-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0052cc;
        }

        .formula {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            text-align: center;
            margin: 10px 0;
            overflow-x: auto;
        }

        .note {
            background-color: #fef3c7;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }

            .input-row {
                flex-direction: column;
                gap: 15px;
            }

            .answer-input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>总体均值置信区间：标准正态分布的应用</h1>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span>问题</span>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <div class="input-row">
                    <div class="input-group">
                        <label class="answer-label" id="lowerLabel">置信区间的下限：</label>
                        <input type="text" class="answer-input" id="lower-input">
                    </div>
                    <div class="input-group">
                        <label class="answer-label" id="upperLabel">置信区间的上限：</label>
                        <input type="text" class="answer-input" id="upper-input">
                    </div>
                </div>
                <div class="tolerance-hint">容差：±0.15（四舍五入至一位小数）</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">提交答案</button>
            <button id="next-btn">下一题 ⏩</button>
        </div>

        <div class="feedback-container" id="feedback">
            <div class="feedback-title" id="feedback-title-text"></div>
            <p id="feedback-text"></p>
            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section" id="explanation">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">答题记录</div>
            <div class="results-container" id="results-container">
                <span class="no-results">尚未开始答题</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const parameterSets = [
                {
                    n: 90, xbar: 60, sigma: 11,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 58.1,
                    correctUpper: 61.9,
                    description: "自尊测试分数",
                    context: "自尊测试分数"
                },
                {
                    n: 120, xbar: 75.5, sigma: 15,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 72.8,
                    correctUpper: 78.2,
                    description: "智力测验分数",
                    context: "智力测验分数"
                },
                {
                    n: 200, xbar: 52.3, sigma: 8,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 50.8,
                    correctUpper: 53.8,
                    description: "生理指标测量值",
                    context: "生理指标测量值"
                },
                {
                    n: 150, xbar: 42.8, sigma: 6.5,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 41.9,
                    correctUpper: 43.7,
                    description: "每日睡眠时间（小时）",
                    context: "每日睡眠时间"
                },
                {
                    n: 100, xbar: 85.2, sigma: 12,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 82.8,
                    correctUpper: 87.6,
                    description: "技能测试成绩",
                    context: "技能测试成绩"
                },
                {
                    n: 80, xbar: 125.8, sigma: 18,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 122.5,
                    correctUpper: 129.1,
                    description: "灯泡寿命（小时）",
                    context: "灯泡寿命"
                },
                {
                    n: 250, xbar: 68.4, sigma: 10,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 67.2,
                    correctUpper: 69.6,
                    description: "成年男性身高（厘米）",
                    context: "成年男性身高"
                },
                {
                    n: 60, xbar: 23.5, sigma: 5.2,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 21.8,
                    correctUpper: 25.2,
                    description: "每周运动时间（小时）",
                    context: "每周运动时间"
                },
                {
                    n: 180, xbar: 4.35, sigma: 0.8,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 4.3,
                    correctUpper: 4.4,
                    description: "饮料容量（升）",
                    context: "饮料容量"
                },
                {
                    n: 110, xbar: 15800, sigma: 2500,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 15333,
                    correctUpper: 16267,
                    description: "员工月薪（元）",
                    context: "员工月薪"
                },
                {
                    n: 95, xbar: 72.3, sigma: 9.5,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 69.8,
                    correctUpper: 74.8,
                    description: "期末考试成绩",
                    context: "期末考试成绩"
                },
                {
                    n: 140, xbar: 6.8, sigma: 1.5,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 6.6,
                    correctUpper: 7.0,
                    description: "手机电池续航时间（小时）",
                    context: "手机电池续航时间"
                },
                {
                    n: 200, xbar: 35.6, sigma: 7.2,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 34.6,
                    correctUpper: 36.6,
                    description: "通勤时间（分钟）",
                    context: "通勤时间"
                },
                {
                    n: 75, xbar: 12.4, sigma: 2.8,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 11.6,
                    correctUpper: 13.2,
                    description: "人均消费（元）",
                    context: "人均消费"
                },
                {
                    n: 160, xbar: 82.5, sigma: 14,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 80.7,
                    correctUpper: 84.3,
                    description: "咖啡因含量（毫克）",
                    context: "咖啡因含量"
                },
                {
                    n: 130, xbar: 55.2, sigma: 8.5,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 53.7,
                    correctUpper: 56.7,
                    description: "每日使用时长（分钟）",
                    context: "每日使用时长"
                },
                {
                    n: 85, xbar: 2100, sigma: 320,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 2011,
                    correctUpper: 2189,
                    description: "汽车月销量（辆）",
                    context: "汽车月销量"
                },
                {
                    n: 220, xbar: 4.2, sigma: 0.65,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 4.1,
                    correctUpper: 4.3,
                    description: "蛋白质含量（克/100克）",
                    context: "蛋白质含量"
                },
                {
                    n: 100, xbar: 45.8, sigma: 6.8,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 44.5,
                    correctUpper: 47.1,
                    description: "课程完成进度（百分比）",
                    context: "课程完成进度"
                },
                {
                    n: 175, xbar: 28.9, sigma: 4.5,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 28.0,
                    correctUpper: 29.8,
                    description: "每周上网时长（小时）",
                    context: "每周上网时长"
                },
                {
                    n: 90, xbar: 520, sigma: 85,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 505.3,
                    correctUpper: 534.7,
                    description: "运动鞋日销量（双）",
                    context: "运动鞋日销量"
                },
                {
                    n: 125, xbar: 18.7, sigma: 3.2,
                    confidenceLevel: 95,
                    zValue: 1.96,
                    correctLower: 18.1,
                    correctUpper: 19.3,
                    description: "日均气温（摄氏度）",
                    context: "日均气温"
                },
                {
                    n: 70, xbar: 8.5, sigma: 1.4,
                    confidenceLevel: 99,
                    zValue: 2.576,
                    correctLower: 8.1,
                    correctUpper: 8.9,
                    description: "洗发水pH值",
                    context: "洗发水pH值"
                },
                {
                    n: 190, xbar: 62.4, sigma: 11,
                    confidenceLevel: 90,
                    zValue: 1.645,
                    correctLower: 61.1,
                    correctUpper: 63.7,
                    description: "数学成绩",
                    context: "数学成绩"
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = parameterSets[currentParamIndex];
                const questionText = document.getElementById('question-text');
                const explanation = document.getElementById('explanation');

                questionText.innerHTML = `
                    <p>某项${params.context}的标准差为 <span class="math">σ = ${params.sigma}</span>。一位研究者随机选取了 <span class="math">n = ${params.n}</span> 名个体进行测试，他们的平均得分为 <span class="math">x̄ = ${params.xbar}</span>。</p>
                    <p>构建一个 <span class="math">${params.confidenceLevel}%</span> 的置信区间，用于估计所有${params.context}的真实均值 <span class="math">μ</span>。</p>
                    <p>中间计算至少保留三位小数。最终答案四舍五入至一位小数。</p>
                `;

                document.getElementById('lowerLabel').textContent = `${params.confidenceLevel}% 置信区间的下限：`;
                document.getElementById('upperLabel').textContent = `${params.confidenceLevel}% 置信区间的上限：`;

                // 渲染解析
                const se = params.sigma / Math.sqrt(params.n);
                const me = params.zValue * se;

                explanation.innerHTML = `
                    <div class="explanation-step">
                        <div class="step-title">步骤 1: 理解问题与已知条件</div>
                        <p>我们需要构建总体均值 <span class="math">μ</span> 的 ${params.confidenceLevel}% 置信区间。</p>
                        <ul>
                            <li>样本容量: <span class="math">n = ${params.n}</span></li>
                            <li>样本均值: <span class="math">x̄ = ${params.xbar}</span></li>
                            <li>总体标准差: <span class="math">σ = ${params.sigma}</span> (已知)</li>
                            <li>置信水平: ${params.confidenceLevel}%</li>
                        </ul>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 2: 确定分布与临界值</div>
                        <p>由于样本容量较大 (n=${params.n})，根据中心极限定理，样本均值 <span class="math">x̄</span> 近似服从正态分布。</p>
                        <p>对于 ${params.confidenceLevel}% 置信区间，左右尾部的面积各为 ${(100-params.confidenceLevel)/2}% (α/2 = ${(100-params.confidenceLevel)/200})。</p>
                        <p>从标准正态分布表可知，对应的临界值为 <span class="math">z_{α/2} = ${params.zValue}</span>。</p>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 3: 计算标准误差</div>
                        <p>样本均值的标准误差为:</p>
                        <div class="formula">
                            SE = σ/√n = ${params.sigma}/√${params.n} = ${params.sigma}/${Math.sqrt(params.n).toFixed(4)} ≈ ${se.toFixed(3)}
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 4: 计算边际误差</div>
                        <p>边际误差 (Margin of Error) 为:</p>
                        <div class="formula">
                            ME = z_{α/2} × SE = ${params.zValue} × ${se.toFixed(3)} ≈ ${me.toFixed(3)}
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 5: 构建置信区间</div>
                        <p>${params.confidenceLevel}% 置信区间的公式为:</p>
                        <div class="formula">
                            x̄ ± z_{α/2} × (σ/√n)
                        </div>
                        <p>代入数值:</p>
                        <div class="formula">
                            下限: ${params.xbar} - ${me.toFixed(3)} = ${(params.xbar - me).toFixed(3)} ≈ <strong>${params.correctLower}</strong><br>
                            上限: ${params.xbar} + ${me.toFixed(3)} = ${(params.xbar + me).toFixed(3)} ≈ <strong>${params.correctUpper}</strong>
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 6: 解释结果</div>
                        <p>我们有 ${params.confidenceLevel}% 的置信度认为，所有${params.context}的真实均值 <span class="math">μ</span> 位于区间 (${params.correctLower}, ${params.correctUpper}) 内。</p>
                    </div>

                    <div class="note">
                        <strong>注意:</strong> 如果从一个已知标准差 σ 的总体中抽取一个容量为 n 的大随机样本，那么总体均值 μ 的 (1-α)100% 置信区间由下式给出:
                        <div class="formula">
                            ( x̄ - z_{α/2} × σ/√n , x̄ + z_{α/2} × σ/√n )
                        </div>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * parameterSets.length);
                } while (newIndex === currentParamIndex && parameterSets.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 清除输入和反馈
                lowerInput.value = '';
                upperInput.value = '';
                lowerInput.classList.remove('correct', 'incorrect');
                upperInput.classList.remove('correct', 'incorrect');
                lowerInput.disabled = false;
                upperInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈和解析
                feedback.classList.remove('show');
                explanation.classList.remove('show');
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // ==================== 事件处理 ====================

            let isSubmitted = false;
            let answerResults = []; // 记录答题结果

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title-text');
            const feedbackText = document.getElementById('feedback-text');
            const resultsContainer = document.getElementById('results-container');
            const showExpBtn = document.getElementById('show-explanation-btn');
            const explanation = document.getElementById('explanation');
            const lowerInput = document.getElementById('lower-input');
            const upperInput = document.getElementById('upper-input');
            const feedbackInline = document.getElementById('feedback-inline');

            // 下一题按钮
            nextBtn.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExpBtn.addEventListener('click', function() {
                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.textContent = '查看答案解析';
                } else {
                    explanation.classList.add('show');
                    this.textContent = '隐藏答案解析';
                }
            });

            // 添加结果图标
            function addResultIcon(isCorrect) {
                answerResults.push(isCorrect);

                // 清除"尚未开始答题"提示
                if (answerResults.length === 1) {
                    resultsContainer.innerHTML = '';
                }

                // 创建图标
                const icon = document.createElement('div');
                icon.className = `result-icon ${isCorrect ? 'correct' : 'incorrect'}`;
                resultsContainer.appendChild(icon);
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const lowerVal = parseFloat(lowerInput.value);
                const upperVal = parseFloat(upperInput.value);

                if (isNaN(lowerVal) || isNaN(upperVal)) {
                    alert('请先输入有效的数字！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                const params = parameterSets[currentParamIndex];
                const tolerance = 0.15;

                const lowerCorrect = Math.abs(lowerVal - params.correctLower) <= tolerance;
                const upperCorrect = Math.abs(upperVal - params.correctUpper) <= tolerance;
                const isCorrect = lowerCorrect && upperCorrect;

                // 添加结果图标
                addResultIcon(isCorrect);

                // 更新输入框样式
                if (lowerCorrect) {
                    lowerInput.classList.add('correct');
                } else {
                    lowerInput.classList.add('incorrect');
                }

                if (upperCorrect) {
                    upperInput.classList.add('correct');
                } else {
                    upperInput.classList.add('incorrect');
                }

                // 更新反馈
                if (isCorrect) {
                    feedbackInline.textContent = '正确!';
                    feedbackInline.className = 'feedback-inline correct';
                    feedbackTitle.textContent = "回答正确!";
                    feedbackText.textContent = `你正确地计算出了置信区间的下限 (${lowerVal}) 和上限 (${upperVal})。`;
                    feedback.classList.remove('incorrect-feedback');
                    feedback.classList.add('correct-feedback');
                } else {
                    let msg = '';
                    if (!lowerCorrect && !upperCorrect) {
                        msg = `下限和上限都不正确。正确答案：下限 = ${params.correctLower}，上限 = ${params.correctUpper}`;
                    } else if (!lowerCorrect) {
                        msg = `下限不正确，上限正确。正确下限 = ${params.correctLower}`;
                    } else {
                        msg = `下限正确，上限不正确。正确上限 = ${params.correctUpper}`;
                    }
                    feedbackInline.textContent = msg;
                    feedbackInline.className = 'feedback-inline incorrect';
                    feedbackTitle.textContent = "回答错误!";
                    feedbackText.textContent = `你的答案：下限 = ${lowerVal}，上限 = ${upperVal}。${msg}`;
                    feedback.classList.remove('correct-feedback');
                    feedback.classList.add('incorrect-feedback');
                }

                // 显示反馈
                feedback.classList.add('show');
                // 显示解析按钮
                showExpBtn.style.display = 'inline-block';
                // 禁用输入
                lowerInput.disabled = true;
                upperInput.disabled = true;
            });

            // 允许按Enter键提交
            lowerInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitBtn.click();
            });

            upperInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitBtn.click();
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
