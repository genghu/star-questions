<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散概率分布应用题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #0052cc;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e6f0ff;
        }
        .meta-info {
            background-color: #e6f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.9em;
            color: #0052cc;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .question-header h2 {
            color: #0052cc;
            margin: 0;
        }
        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }
        .question-section {
            background-color: #f9fbff;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        th, td {
            border: 1px solid #cce0ff;
            padding: 15px;
            text-align: center;
        }
        th {
            background-color: #e6f0ff;
            color: #0052cc;
            font-weight: 600;
        }
        .answer-table {
            max-width: 500px;
            margin: 30px auto;
        }
        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .option-card {
            background-color: white;
            border: 2px solid #e6f0ff;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
        }
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 82, 204, 0.15);
            border-color: #4d94ff;
        }
        .option-card.selected {
            border-color: #0052cc;
            background-color: #f0f7ff;
        }
        .option-card.correct {
            border-color: #28a745;
            background-color: #d4edda;
            color: #155724;
        }
        .option-card.incorrect {
            border-color: #dc3545;
            background-color: #f8d7da;
            color: #721c24;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #submitBtn {
            background-color: #0052cc;
            color: white;
        }
        #submitBtn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }
        #resetBtn {
            background-color: #6c757d;
            color: white;
        }
        #resetBtn:hover {
            background-color: #5a6268;
            transform: scale(1.05);
        }
        .feedback {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        .feedback.correct {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .feedback.incorrect {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .score {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
            color: #0052cc;
            font-weight: 600;
        }
        .explanation {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-top: 30px;
            border-left: 5px solid #17a2b8;
        }
        .explanation h3 {
            color: #17a2b8;
            margin-top: 0;
        }
        .math {
            font-family: 'Cambria Math', serif;
            font-style: italic;
        }
        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .answer-options {
                grid-template-columns: 1fr;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>离散概率分布应用题</h1>

        <div class="meta-info">
            <p><strong>主题：</strong>随机变量与分布 - 离散概率分布：应用题</p>
        </div>

        <div class="question-section">
            <div class="question-header">
                <h2>题目内容</h2>
                <button class="refresh-params-btn" id="refreshBtn">
                    <span>&#8635;</span> 刷新参数
                </button>
            </div>
            <div id="questionContent">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="answer-options" id="optionsContainer">
            <!-- 动态生成 -->
        </div>

        <div class="controls">
            <button id="submitBtn">提交答案</button>
            <button id="resetBtn">重新作答</button>
        </div>

        <div class="feedback" id="feedback">
            <h3 id="feedbackTitle"></h3>
            <p id="feedbackText"></p>
        </div>

        <div class="score" id="scoreDisplay">得分: 0/1</div>

        <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
        <div class="explanation-section explanation" id="explanation-section">
            <h3>题目解析与解答</h3>
            <div id="explanationContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    // 原题: X = -2R^2 - 4R + 1
                    scenario: '假设某个家庭的三个孩子的性别即将揭晓。因此，结果是"女孩"(g)和"男孩"(b)的三元组，我们将其写作 gbg、bbb 等。对于每个结果，令 R 为随机变量，用于计算每个结果中男孩的数量。例如，如果结果是 gbg，则 R(gbg) = 1。假设随机变量 X 根据 R 定义如下：X = -2R^2 - 4R + 1。',
                    formula: 'X = -2R^2 - 4R + 1',
                    xValues: [-3, -1, 5],
                    probabilities: ['3/8', '4/8', '1/8'],
                    outcomes: {
                        '-3': ['ggb', 'bgg', 'gbg'],
                        '-1': ['ggg', 'bgb', 'bbg', 'gbb'],
                        '5': ['bbb']
                    },
                    answer: 'A',
                    options: [
                        { values: [-3, -1, 5], probs: ['3/8', '4/8', '1/8'] },
                        { values: [-3, -1, 5], probs: ['1/8', '3/8', '4/8'] },
                        { values: [-3, -1, 1], probs: ['3/8', '4/8', '1/8'] },
                        { values: [-3, -1, 5], probs: ['3/8', '3/8', '2/8'] }
                    ]
                },
                {
                    // X = R^2 - 3R + 2
                    scenario: '某实验中有三个独立的硬币被同时抛掷。结果用"正面"(H)和"反面"(T)的三元组表示，如 HHT、TTT 等。对于每个结果，令 R 为随机变量，用于计算每个结果中正面的数量。假设随机变量 X 根据 R 定义如下：X = R^2 - 3R + 2。',
                    formula: 'X = R^2 - 3R + 2',
                    xValues: [2, 0, 2],
                    uniqueXValues: [0, 2],
                    probabilities: ['4/8', '4/8'],
                    outcomes: {
                        '0': ['HTT', 'THT', 'TTH'],
                        '2': ['HHH', 'HHT', 'HTH', 'THH', 'TTT']
                    },
                    answer: 'B',
                    options: [
                        { values: [0, 2], probs: ['3/8', '5/8'] },
                        { values: [0, 2], probs: ['3/8', '4/8'] },
                        { values: [0, 2], probs: ['3/8', '4/8'] },
                        { values: [0, 2], probs: ['3/8', '5/8'] }
                    ]
                },
                {
                    // X = 2R + 1
                    scenario: '某盒子里有三个球，每个球被随机抽出后放回，记录每次抽到红球(R)或蓝球(B)的结果。结果用三元组表示，如 RBB、RRR 等。对于每个结果，令 R 为随机变量，用于计算每个结果中红球的数量。假设随机变量 X 根据 R 定义如下：X = 2R + 1。',
                    formula: 'X = 2R + 1',
                    xValues: [1, 3, 5, 7],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomes: {
                        '1': ['BBB'],
                        '3': ['RBB', 'BRB', 'BBR'],
                        '5': ['RRB', 'RBR', 'BRR'],
                        '7': ['RRR']
                    },
                    answer: 'A',
                    options: [
                        { values: [1, 3, 5, 7], probs: ['1/8', '3/8', '3/8', '1/8'] },
                        { values: [1, 3, 5, 7], probs: ['1/8', '2/8', '4/8', '1/8'] },
                        { values: [0, 2, 4, 6], probs: ['1/8', '3/8', '3/8', '1/8'] },
                        { values: [1, 3, 5, 7], probs: ['2/8', '2/8', '2/8', '2/8'] }
                    ]
                },
                {
                    // X = -R^2 + 4
                    scenario: '某个电子设备有三个开关，每个开关可以是开(1)或关(0)状态。结果用三元组表示，如 101、111 等。对于每个结果，令 R 为随机变量，用于计算每个结果中开启状态开关的数量。假设随机变量 X 根据 R 定义如下：X = -R^2 + 4。',
                    formula: 'X = -R^2 + 4',
                    xValues: [4, 3, 0, -5],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomes: {
                        '4': ['000'],
                        '3': ['001', '010', '100'],
                        '0': ['011', '101', '110'],
                        '-5': ['111']
                    },
                    answer: 'C',
                    options: [
                        { values: [4, 3, 0, -5], probs: ['2/8', '2/8', '2/8', '2/8'] },
                        { values: [4, 3, 0], probs: ['1/8', '3/8', '4/8'] },
                        { values: [4, 3, 0, -5], probs: ['1/8', '3/8', '3/8', '1/8'] },
                        { values: [3, 0, -5], probs: ['3/8', '4/8', '1/8'] }
                    ]
                },
                {
                    // X = 3R - 6
                    scenario: '某骰子游戏同时掷三个骰子，只记录每个骰子是否为偶数(E)或奇数(O)。结果用三元组表示，如 EEO、OOO 等。对于每个结果，令 R 为随机变量，用于计算每个结果中偶数的数量。假设随机变量 X 根据 R 定义如下：X = 3R - 6。',
                    formula: 'X = 3R - 6',
                    xValues: [-6, -3, 0, 3],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomes: {
                        '-6': ['OOO'],
                        '-3': ['E00', '0E0', '00E'],
                        '0': ['EEO', 'EOE', 'OEE'],
                        '3': ['EEE']
                    },
                    answer: 'D',
                    options: [
                        { values: [-6, -3, 0, 3], probs: ['1/8', '2/8', '4/8', '1/8'] },
                        { values: [-6, -3, 0], probs: ['1/8', '3/8', '4/8'] },
                        { values: [-3, 0, 3], probs: ['3/8', '4/8', '1/8'] },
                        { values: [-6, -3, 0, 3], probs: ['1/8', '3/8', '3/8', '1/8'] }
                    ]
                },
                {
                    // X = R^3 - 6R
                    scenario: '某灯泡测试系统同时测试三个灯泡，每个灯泡可能是亮(L)或灭(D)状态。结果用三元组表示，如 LLD、DDD 等。对于每个结果，令 R 为随机变量，用于计算每个结果中亮灯的数量。假设随机变量 X 根据 R 定义如下：X = R^3 - 6R。',
                    formula: 'X = R^3 - 6R',
                    xValues: [0, -5, -4, 0],
                    uniqueXValues: [-5, -4, 0],
                    probabilities: ['3/8', '3/8', '2/8'],
                    outcomes: {
                        '0': ['LLL', 'DDD'],
                        '-5': ['LLD', 'LDL', 'DLL'],
                        '-4': ['LDD', 'DLD', 'DDL']
                    },
                    answer: 'B',
                    options: [
                        { values: [-5, -4, 0], probs: ['4/8', '2/8', '2/8'] },
                        { values: [-5, -4, 0], probs: ['3/8', '3/8', '2/8'] },
                        { values: [-5, -4], probs: ['4/8', '4/8'] },
                        { values: [-5, -4, 0], probs: ['3/8', '2/8', '3/8'] }
                    ]
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let selectedOption = null;
            let score = 0;
            let answered = false;

            const optionsContainer = document.getElementById('optionsContainer');
            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');
            const explanationContent = document.getElementById('explanationContent');

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染题目内容
                const questionContent = document.getElementById('questionContent');

                // 根据公式生成X值表
                let xValuesTable = '';
                const rValues = [0, 1, 1, 1, 2, 2, 2, 3]; // 对应各结果的R值
                const outcomes = ['ggg', 'ggb', 'gbg', 'bgg', 'gbb', 'bgb', 'bbg', 'bbb'];

                questionContent.innerHTML = `
                    <p>${params.scenario} X 的值因此为：</p>

                    <table>
                        <thead>
                            <tr>
                                <th>结果</th>
                                ${outcomes.map(o => `<th>${o}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>X 的值</strong></td>
                                ${params.xValues.map(v => `<td>${v}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>

                    <p>计算 X 的概率分布函数，即函数 p<sub>X</sub>(x)。首先，在第一行填入 X 的值。然后在第二行填入相应的概率。</p>

                    <table class="answer-table">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                ${params.xValues.filter((v, i, a) => a.indexOf(v) === i).map((v, i) => `<th id="cell${i+1}">?</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>P<sub>X</sub>(x)</strong></td>
                                ${params.xValues.filter((v, i, a) => a.indexOf(v) === i).map((v, i) => `<td id="cell${i+10}">?</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>

                    <p><strong>请从以下选项中选择正确的概率分布表：</strong></p>
                `;

                // 渲染选项
                const uniqueXValues = params.xValues.filter((v, i, a) => a.indexOf(v) === i);
                optionsContainer.innerHTML = params.options.map((opt, idx) => `
                    <div class="option-card" data-option="${String.fromCharCode(65 + idx)}">
                        <strong>选项 ${String.fromCharCode(65 + idx)}</strong><br>
                        X的值: ${opt.values.join(', ')}<br>
                        P<sub>X</sub>(x): ${opt.probs.join(', ')}
                    </div>
                `).join('');

                // 渲染解析
                const uniqueValues = params.xValues.filter((v, i, a) => a.indexOf(v) === i);
                const probMap = {};
                params.xValues.forEach(v => {
                    probMap[v] = (probMap[v] || 0) + 1;
                });

                explanationContent.innerHTML = `
                    <p>要计算 X 的概率分布 p<sub>X</sub>(x) 的值，我们使用定义 p<sub>X</sub>(x) = P(X = x)。由于所有结果等可能，后者的概率可以直接从 X 的定义得出。</p>
                    <p>根据公式 <span class="math">${params.formula}</span>，统计各X值对应的结果数量：</p>
                    <ul>
                        ${uniqueValues.map(v => {
                            const count = probMap[v];
                            return `<li>X 取值 ${v} 的结果共有 <strong>${count}</strong> 个</li>`;
                        }).join('')}
                    </ul>
                    <p>总共有 8 种等可能的结果，因此：</p>
                    <ul>
                        ${uniqueValues.map(v => {
                            const count = probMap[v];
                            return `<li>p<sub>X</sub>(${v}) = ${count}/8</li>`;
                        }).join('')}
                    </ul>
                    <p>因此，正确的概率分布表为：</p>
                    <table style="max-width: 400px; margin: 10px auto;">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                ${uniqueValues.map(v => `<th>${v}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>P<sub>X</sub>(x)</strong></td>
                                ${uniqueValues.map(v => `<td>${probMap[v]}/8</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                    <p>注意这些概率之和为 1 (${uniqueValues.map(v => `${probMap[v]}/8`).join(' + ')} = 8/8 = 1)。</p>
                `;

                // 重新绑定选项点击事件
                bindOptionEvents();

                // 重置状态
                selectedOption = null;
                answered = false;
                feedback.style.display = 'none';
                showExplanationBtn.style.display = 'none';
                explanationSection.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';
            }

            function bindOptionEvents() {
                const optionCards = document.querySelectorAll('.option-card');
                optionCards.forEach(card => {
                    card.addEventListener('click', function() {
                        if (answered) return;

                        optionCards.forEach(c => c.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedOption = this.getAttribute('data-option');
                    });
                });
            }

            // 刷新参数按钮
            refreshBtn.addEventListener('click', function() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (!selectedOption) {
                    alert('请先选择一个答案！');
                    return;
                }

                const params = questionParams[currentParamIndex];
                answered = true;

                const optionCards = document.querySelectorAll('.option-card');
                optionCards.forEach(card => {
                    card.style.cursor = 'default';
                });

                const isCorrect = selectedOption === params.answer;

                optionCards.forEach(card => {
                    const option = card.getAttribute('data-option');
                    if (option === selectedOption && !isCorrect) {
                        card.classList.add('incorrect');
                    }
                    card.classList.remove('selected');
                });

                score = isCorrect ? 1 : 0;
                scoreDisplay.textContent = `得分: ${score}/1`;

                feedback.style.display = 'block';
                showExplanationBtn.style.display = 'inline-block';

                if (isCorrect) {
                    feedback.classList.remove('incorrect');
                    feedback.classList.add('correct');
                    feedbackTitle.textContent = '回答正确！';
                    feedbackText.textContent = `你选择了选项 ${selectedOption}，这是正确的答案。`;
                } else {
                    feedback.classList.remove('correct');
                    feedback.classList.add('incorrect');
                    feedbackTitle.textContent = '回答错误！';
                    feedbackText.textContent = `你选择了选项 ${selectedOption}，正确答案是选项 ${params.answer}。`;
                }

                feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 重置答题
            resetBtn.addEventListener('click', function() {
                renderQuestion();
                score = 0;
                scoreDisplay.textContent = `得分: ${score}/1`;
            });

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
