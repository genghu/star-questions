<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡方拟合优度检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .content-section {
            margin-bottom: 40px;
        }

        h2 {
            color: #3498db;
            border-left: 5px solid #3498db;
            padding-left: 15px;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .table-container {
            overflow-x: auto;
            margin: 25px 0;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
            padding: 15px;
            text-align: center;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f8ff;
        }

        .question {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #3498db;
        }

        .question-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }

        .question-title i {
            margin-right: 10px;
            color: #3498db;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .option {
            background-color: white;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: #3498db;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background-color: #3498db;
            color: white;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
        }

        .results {
            margin-top: 40px;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 25px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .score {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-text {
            text-align: center;
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .feedback {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #3498db;
        }

        .feedback h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback h3 i {
            color: #3498db;
        }

        .math {
            font-family: "Cambria Math", serif;
            font-style: italic;
        }

        .highlight {
            background-color: #fffacd;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .answer-summary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .answer-item {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .answer-item.correct {
            border-top: 4px solid #2ecc71;
        }

        .answer-item.incorrect {
            border-top: 4px solid #e74c3c;
        }

        .answer-status {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .answer-item.correct .answer-status {
            color: #2ecc71;
        }

        .answer-item.incorrect .answer-status {
            color: #e74c3c;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- 动态生成 -->
    </div>

    <script>
        // 参数化数据集
        const questionParams = [
            {
                scenario: '埃灵顿公爵队是佐治亚州埃灵顿的一支小联盟棒球队。公爵队管理层根据以下估计制定了当前的促销计划：观看公爵队比赛的球迷中，15% 年龄在 0 到 12 岁，10% 年龄在 13 到 18 岁，30% 年龄在 19 到 35 岁，25% 年龄在 36 到 55 岁，20% 年龄超过 55 岁。一家为公爵队服务的统计咨询公司随机抽取了 160 名观看公爵队比赛的球迷进行调查。',
                categories: ['0 至 12', '13 至 18', '19 至 35', '36 至 55', '超过 55'],
                proportions: [0.15, 0.10, 0.30, 0.25, 0.20],
                observed: [26, 19, 65, 26, 24],
                expected: [24.00, 16.00, 48.00, 40.00, 32.00],
                chiComponents: [0.167, 0.563, 6.021, 4.900, 2.000],
                totalObs: 160,
                alpha: 0.05,
                df: 4,
                chiSquare: 13.65,
                criticalValue: 9.49,
                rejectH0: '是',
                testName: '埃灵顿公爵队球迷年龄分布假设检验'
            },
            {
                scenario: '某市场研究人员想知道消费者对四种品牌的偏好是否相同。如果消费者对四种品牌的偏好相同，每种品牌被选择的概率应为25%。研究人员随机调查了200名消费者。',
                categories: ['品牌A', '品牌B', '品牌C', '品牌D'],
                proportions: [0.25, 0.25, 0.25, 0.25],
                observed: [68, 42, 55, 35],
                expected: [50, 50, 50, 50],
                chiComponents: [6.48, 1.28, 0.50, 4.50],
                totalObs: 200,
                alpha: 0.05,
                df: 3,
                chiSquare: 12.76,
                criticalValue: 7.81,
                rejectH0: '是',
                testName: '消费者品牌偏好假设检验'
            },
            {
                scenario: '某遗传学家研究某种植物的花色遗传。根据孟德尔遗传定律，红花:粉花:白花的理论比例为9:3:4。研究人员观察了320株植物。',
                categories: ['红花', '粉花', '白花'],
                proportions: [9/16, 3/16, 4/16],
                observed: [175, 65, 80],
                expected: [180, 60, 80],
                chiComponents: [0.139, 0.417, 0],
                totalObs: 320,
                alpha: 0.01,
                df: 2,
                chiSquare: 0.56,
                criticalValue: 9.21,
                rejectH0: '否',
                testName: '植物花色遗传假设检验'
            },
            {
                scenario: '某工厂检查产品缺陷类型的分布。根据历史数据，四种缺陷类型A、B、C、D的比例应为30%、25%、25%、20%。质检部门随机抽取了400个产品进行检查。',
                categories: ['缺陷A', '缺陷B', '缺陷C', '缺陷D'],
                proportions: [0.30, 0.25, 0.25, 0.20],
                observed: [135, 95, 108, 62],
                expected: [120, 100, 100, 80],
                chiComponents: [1.875, 0.25, 0.64, 4.05],
                totalObs: 400,
                alpha: 0.05,
                df: 3,
                chiSquare: 6.82,
                criticalValue: 7.81,
                rejectH0: '否',
                testName: '产品缺陷类型分布假设检验'
            },
            {
                scenario: '假设一个骰子是公平的，每个面出现的概率应该相等（各1/6）。研究人员投掷骰子120次并记录每个面出现的次数。',
                categories: ['1点', '2点', '3点', '4点', '5点', '6点'],
                proportions: [1/6, 1/6, 1/6, 1/6, 1/6, 1/6],
                observed: [14, 24, 18, 22, 19, 23],
                expected: [20, 20, 20, 20, 20, 20],
                chiComponents: [1.8, 0.8, 0.2, 0.2, 0.05, 0.45],
                totalObs: 120,
                alpha: 0.05,
                df: 5,
                chiSquare: 3.50,
                criticalValue: 11.07,
                rejectH0: '否',
                testName: '骰子公平性假设检验'
            }
        ];

        let currentParamIndex = 0;
        let correctAnswers = {};
        let userAnswers = {};
        let submitted = false;

        function renderQuestion() {
            const params = questionParams[currentParamIndex];
            const container = document.getElementById('main-container');

            // 生成表格行
            let tableRows = '';
            for (let i = 0; i < params.categories.length; i++) {
                tableRows += `
                    <tr>
                        <td>${params.categories[i]}</td>
                        <td>${params.observed[i]}</td>
                        <td>${params.expected[i].toFixed(2)}</td>
                        <td>${params.chiComponents[i].toFixed(3)}</td>
                    </tr>
                `;
            }

            // 生成期望频数计算说明
            let expectedCalc = params.categories.map((cat, i) =>
                `${(params.proportions[i] * 100).toFixed(0)}%×${params.totalObs}=${params.expected[i].toFixed(2)}`
            ).join('，');

            container.innerHTML = `
                <header>
                    <h1><i class="fas fa-chart-bar"></i> 卡方拟合优度检验</h1>
                    <p class="subtitle">${params.testName} - 交互式答题</p>
                </header>

                <div class="content-section">
                    <h2>问题背景
                        <button class="refresh-params-btn" onclick="refreshParams()">
                            <i class="fas fa-sync-alt"></i> 刷新参数
                        </button>
                    </h2>
                    <p>${params.scenario}</p>
                </div>

                <div class="content-section">
                    <h2>表1：样本信息</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>类别</th>
                                    <th>观测频数 f<sub>O</sub></th>
                                    <th>期望频数 f<sub>E</sub></th>
                                    <th>(观测频数 - 期望频数)² / 期望频数</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                                <tr>
                                    <td><strong>总计</strong></td>
                                    <td><strong>${params.totalObs}</strong></td>
                                    <td><strong>${params.totalObs}.00</strong></td>
                                    <td><strong>${params.chiSquare.toFixed(2)}</strong></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p>期望频数计算：${expectedCalc}</p>
                    <p>卡方统计量 χ² = Σ[(f<sub>O</sub>-f<sub>E</sub>)²/f<sub>E</sub>] = ${params.chiSquare.toFixed(2)}</p>
                </div>

                <div class="content-section">
                    <h2>假设检验</h2>
                    <p><strong>原假设 H₀</strong>：观测分布与理论分布相同。</p>
                    <p><strong>备择假设 H₁</strong>：观测分布与理论分布不同。</p>
                    <p><strong>显著性水平 α</strong>：${params.alpha}</p>
                    <p><strong>自由度</strong>：类别数 - 1 = ${params.categories.length} - 1 = ${params.df}</p>
                </div>

                <div class="question">
                    <div class="question-title"><i class="fas fa-question-circle"></i> 1. 检验统计量的类型：</div>
                    <div class="options">
                        <div class="option" data-question="1" data-option="a">
                            <div class="option-letter">A</div>
                            <div class="option-text">Z</div>
                        </div>
                        <div class="option" data-question="1" data-option="b">
                            <div class="option-letter">B</div>
                            <div class="option-text">t</div>
                        </div>
                        <div class="option" data-question="1" data-option="c">
                            <div class="option-letter">C</div>
                            <div class="option-text">卡方</div>
                        </div>
                        <div class="option" data-question="1" data-option="d">
                            <div class="option-letter">D</div>
                            <div class="option-text">F</div>
                        </div>
                    </div>
                </div>

                <div class="question">
                    <div class="question-title"><i class="fas fa-question-circle"></i> 2. 检验统计量的值：（将答案四舍五入到至少两位小数。）</div>
                    <div class="options">
                        <div class="option" data-question="2" data-option="a">
                            <div class="option-letter">A</div>
                            <div class="option-text">${(params.chiSquare - 3.5).toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="2" data-option="b">
                            <div class="option-letter">B</div>
                            <div class="option-text">${params.chiSquare.toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="2" data-option="c">
                            <div class="option-letter">C</div>
                            <div class="option-text">${(params.chiSquare + 2.5).toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="2" data-option="d">
                            <div class="option-letter">D</div>
                            <div class="option-text">${(params.chiSquare + 5.0).toFixed(2)}</div>
                        </div>
                    </div>
                </div>

                <div class="question">
                    <div class="question-title"><i class="fas fa-question-circle"></i> 3. 在 ${params.alpha} 显著性水平下检验的临界值：（将答案四舍五入到至少两位小数。）</div>
                    <div class="options">
                        <div class="option" data-question="3" data-option="a">
                            <div class="option-letter">A</div>
                            <div class="option-text">${(params.criticalValue - 1.71).toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="3" data-option="b">
                            <div class="option-letter">B</div>
                            <div class="option-text">${params.criticalValue.toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="3" data-option="c">
                            <div class="option-letter">C</div>
                            <div class="option-text">${(params.criticalValue + 1.58).toFixed(2)}</div>
                        </div>
                        <div class="option" data-question="3" data-option="d">
                            <div class="option-letter">D</div>
                            <div class="option-text">${(params.criticalValue + 3.79).toFixed(2)}</div>
                        </div>
                    </div>
                </div>

                <div class="question">
                    <div class="question-title"><i class="fas fa-question-circle"></i> 4. 我们能否得出结论，观测分布与理论分布不同？使用 ${params.alpha} 的显著性水平。</div>
                    <div class="options">
                        <div class="option" data-question="4" data-option="a">
                            <div class="option-letter">A</div>
                            <div class="option-text">是</div>
                        </div>
                        <div class="option" data-question="4" data-option="b">
                            <div class="option-letter">B</div>
                            <div class="option-text">否</div>
                        </div>
                    </div>
                </div>

                <div class="question">
                    <div class="question-title"><i class="fas fa-question-circle"></i> 5. 自由度（如适用）：</div>
                    <div class="options">
                        <div class="option" data-question="5" data-option="a">
                            <div class="option-letter">A</div>
                            <div class="option-text">${params.df - 1}</div>
                        </div>
                        <div class="option" data-question="5" data-option="b">
                            <div class="option-letter">B</div>
                            <div class="option-text">${params.df}</div>
                        </div>
                        <div class="option" data-question="5" data-option="c">
                            <div class="option-letter">C</div>
                            <div class="option-text">${params.df + 1}</div>
                        </div>
                        <div class="option" data-question="5" data-option="d">
                            <div class="option-letter">D</div>
                            <div class="option-text">${params.totalObs - 1}</div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="submit-btn">
                        <i class="fas fa-paper-plane"></i> 提交答案
                    </button>
                    <button id="reset-btn">
                        <i class="fas fa-redo"></i> 重新作答
                    </button>
                </div>

                <div class="results" id="results">
                    <div class="score" id="score">0/5</div>
                    <div class="score-text" id="score-text"></div>

                    <div class="answer-summary" id="answer-summary">
                        <!-- 动态生成答题摘要 -->
                    </div>

                    <button class="show-explanation-btn" id="show-explanation-btn" style="display:none;">查看答案解析</button>
                    <div class="feedback explanation-section" id="explanation-content" style="display:none;">
                        <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                        <div id="explanation-text"></div>
                    </div>
                </div>
            `;

            // 设置正确答案
            correctAnswers = {
                1: "c", // 卡方
                2: "b", // chiSquare
                3: "b", // criticalValue
                4: params.rejectH0 === '是' ? "a" : "b",
                5: "b"  // df
            };

            bindOptionEvents();
            setupSubmitHandler();
        }

        function bindOptionEvents() {
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    if (submitted) return;
                    const question = this.getAttribute('data-question');
                    const selectedOption = this.getAttribute('data-option');

                    // 移除同一问题其他选项的选中状态
                    document.querySelectorAll(`.option[data-question="${question}"]`).forEach(opt => {
                        opt.classList.remove('selected');
                    });

                    // 添加当前选项的选中状态
                    this.classList.add('selected');

                    // 保存用户答案
                    userAnswers[question] = selectedOption;
                });
            });
        }

        function setupSubmitHandler() {
            document.getElementById('submit-btn').addEventListener('click', function() {
                // 检查是否所有问题都已作答
                const totalQuestions = Object.keys(correctAnswers).length;
                const answeredQuestions = Object.keys(userAnswers).length;

                if (answeredQuestions < totalQuestions) {
                    alert(`请完成所有题目！您已回答了 ${answeredQuestions}/${totalQuestions} 题。`);
                    return;
                }

                submitted = true;

                // 计算得分
                let score = 0;
                const answerSummary = document.getElementById('answer-summary');
                answerSummary.innerHTML = '';

                const params = questionParams[currentParamIndex];

                // 检查每个问题的答案
                for (const [question, correctAnswer] of Object.entries(correctAnswers)) {
                    const userAnswer = userAnswers[question];
                    const isCorrect = userAnswer === correctAnswer;

                    if (isCorrect) score++;

                    // 更新选项样式
                    const userSelectedOption = document.querySelector(`.option[data-question="${question}"][data-option="${userAnswer}"]`);

                    if (userSelectedOption) {
                        userSelectedOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                    }

                    // 创建答题摘要
                    const answerItem = document.createElement('div');
                    answerItem.className = `answer-item ${isCorrect ? 'correct' : 'incorrect'}`;

                    const questionTexts = {
                        "1": "检验统计量类型",
                        "2": "检验统计量值",
                        "3": "临界值",
                        "4": "结论",
                        "5": "自由度"
                    };

                    answerItem.innerHTML = `
                        <div class="answer-status">${isCorrect ? '✓ 正确' : '✗ 错误'}</div>
                        <div><strong>${questionTexts[question]}</strong></div>
                    `;

                    answerSummary.appendChild(answerItem);
                }

                // 显示得分
                document.getElementById('score').textContent = `${score}/${totalQuestions}`;

                // 显示评价文本
                const scoreText = document.getElementById('score-text');
                const percentage = (score / totalQuestions) * 100;

                if (percentage === 100) {
                    scoreText.textContent = "太棒了！您完全掌握了卡方拟合优度检验！";
                } else if (percentage >= 80) {
                    scoreText.textContent = "做得很好！您对卡方检验有很好的理解！";
                } else if (percentage >= 60) {
                    scoreText.textContent = "不错！您已经掌握了基本概念，可以再复习一下细节。";
                } else {
                    scoreText.textContent = "别灰心！建议您仔细阅读题目解析，理解卡方检验的原理。";
                }

                // 显示结果区域
                document.getElementById('results').classList.add('show');

                // 显示答案解析按钮
                const showBtn = document.getElementById('show-explanation-btn');
                showBtn.style.display = 'inline-block';
                showBtn.addEventListener('click', function() {
                    const explanation = document.getElementById('explanation-content');
                    if (explanation.style.display === 'none' || explanation.style.display === '') {
                        document.getElementById('explanation-text').innerHTML = `
                            <p><strong>1. 检验统计量的类型：</strong> 由于我们比较的是分类数据的观测频数与期望频数，使用卡方拟合优度检验，因此检验统计量是卡方(χ²)。</p>
                            <p><strong>2. 检验统计量的值：</strong> 根据表1计算，χ² = ${params.chiSquare.toFixed(2)}。</p>
                            <p><strong>3. 在 ${params.alpha} 显著性水平下检验的临界值：</strong> 自由度为${params.df}，α=${params.alpha}时，查卡方分布表得临界值为${params.criticalValue.toFixed(2)}。</p>
                            <p><strong>4. 结论：</strong> 由于检验统计量值${params.chiSquare.toFixed(2)} ${params.rejectH0 === '是' ? '>' : '<'} 临界值${params.criticalValue.toFixed(2)}，我们${params.rejectH0 === '是' ? '拒绝' : '不拒绝'}原假设。</p>
                            <p><strong>5. 自由度：</strong> 卡方拟合优度检验的自由度为类别数减1，本题有${params.categories.length}个类别，因此自由度为${params.df}。</p>
                        `;
                        explanation.style.display = 'block';
                        this.textContent = '隐藏答案解析';
                    } else {
                        explanation.style.display = 'none';
                        this.textContent = '查看答案解析';
                    }
                });

                // 滚动到结果区域
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

                // 禁用选项点击
                document.querySelectorAll('.option').forEach(option => {
                    option.style.pointerEvents = 'none';
                });

                // 更改提交按钮文本
                this.innerHTML = '<i class="fas fa-check"></i> 已提交';
                this.style.backgroundColor = '#2ecc71';
                this.disabled = true;
            });

            // 重新作答
            document.getElementById('reset-btn').addEventListener('click', function() {
                refreshParams();
            });
        }

        function refreshParams() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questionParams.length);
            } while (newIndex === currentParamIndex && questionParams.length > 1);

            currentParamIndex = newIndex;
            userAnswers = {};
            submitted = false;
            renderQuestion();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderQuestion();
        });
    </script>
</body>
</html>
