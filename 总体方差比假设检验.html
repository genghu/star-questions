<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体方差比假设检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.5;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 i {
            color: #3498db;
        }

        .problem-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .problem-info p {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.1);
        }

        .question-title {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 0.9rem;
        }

        .fill-blank-input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 150px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            font-size: 0.9rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 4px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 4px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #f39c12;
            font-size: 0.9rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .explanation h5 {
            color: #2980b9;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .explanation p {
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(52, 152, 219, 0.3);
        }

        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh-params-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .toggle-explanation-btn {
            display: none;
            margin: 15px auto;
            padding: 10px 24px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(155, 89, 182, 0.3);
        }

        .toggle-explanation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .toggle-explanation-btn.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .result-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .result-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .result-icon.correct {
            background-color: #2ecc71;
            color: white;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
            color: white;
        }

        .result-icon:hover {
            transform: scale(1.15);
        }

        .score-text {
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .score-text {
            font-size: 1rem;
            opacity: 0.9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 3px solid #3498db;
            font-size: 0.9rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
        }

        .data-table th {
            background-color: #3498db;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .data-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .critical-value {
            display: inline-block;
            padding: 3px 8px;
            background-color: #f1c40f;
            border-radius: 4px;
            margin: 0 3px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 12px;
            }

            .question-container {
                padding: 12px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .fill-blank-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 总体方差比假设检验</h1>
        </header>

        <div class="problem-info" id="problem-info">
            <!-- 动态生成 -->
        </div>

        <!-- 问题 1 -->
        <div class="question-container" id="q1">
            <div class="question-title">
                <span class="question-number">1</span>
                <span>原假设：H₀</span>
            </div>
            <div class="question-text" id="question-text-1">
                <p>选择正确的原假设表达式：</p>
            </div>
            <div class="options-container" id="options-container-1">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback1"></div>
        </div>

        <!-- 问题 2 -->
        <div class="question-container" id="q2">
            <div class="question-title">
                <span class="question-number">2</span>
                <span>备择假设：H₁</span>
            </div>
            <div class="question-text" id="question-text-2">
                <p>选择正确的备择假设表达式：</p>
            </div>
            <div class="options-container" id="options-container-2">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback2"></div>
        </div>

        <!-- 问题 3：检验类型与自由度（合并题） -->
        <div class="question-container" id="q3">
            <div class="question-title">
                <span class="question-number">3</span>
                <span>检验统计量的类型与自由度</span>
            </div>
            <div class="question-text" id="question-text-3">
                <p>① 选择正确的检验统计量类型：</p>
            </div>
            <div class="options-container" id="options-container-3">
                <!-- 动态生成 -->
            </div>
            <div id="df-input-area" style="margin-top: 15px; display: none;">
                <p>② 填写自由度：</p>
                <div id="df-input-fields" style="margin-top: 10px;">
                    <!-- 根据选择的检验类型动态生成 -->
                </div>
            </div>
            <div class="feedback" id="feedback3"></div>
        </div>

        <!-- 问题 4 -->
        <div class="question-container" id="q4">
            <div class="question-title">
                <span class="question-number">4</span>
                <span>检验统计量的值</span>
            </div>
            <div class="question-text" id="question-text-4">
                <p>计算检验统计量（至少保留三位小数）：</p>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
                    <span id="stat-label">统计量：</span>
                    <input type="text" id="answer-4" class="fill-blank-input">
                </div>
            </div>
            <div class="feedback" id="feedback4"></div>
        </div>

        <!-- 问题 5 -->
        <div class="question-container" id="q5">
            <div class="question-title">
                <span class="question-number">5</span>
                <span>p值</span>
            </div>
            <div class="question-text" id="question-text-5">
                <p>计算 p值（至少保留三位小数）：</p>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
                    <span>p值：</span>
                    <input type="text" id="answer-5" class="fill-blank-input">
                </div>
            </div>
            <div class="feedback" id="feedback5"></div>
        </div>

        <!-- 问题 6 -->
        <div class="question-container" id="q6">
            <div class="question-title">
                <span class="question-number">6</span>
                <span id="question-title-6">结论</span>
            </div>
            <div class="question-text" id="question-text-6">
                <p>我们能否得出两个总体方差存在差异的结论？</p>
            </div>
            <div class="options-container" id="options-container-6">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback6"></div>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="next-btn" class="refresh-params-btn">
                下一题 <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- 显示/隐藏答案解析按钮 -->
        <button id="toggle-explanation-btn" class="toggle-explanation-btn">
            <i class="fas fa-lightbulb"></i> 显示答案解析
        </button>

        <!-- 合并的答案解析区域 -->
        <div class="explanation" id="combined-explanation">
            <h4><i class="fas fa-calculator"></i> 答案解析</h4>
            <div id="combined-explanation-content">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="score-container" id="score-container">
            <div class="score-title">答题记录</div>
            <div class="result-icons" id="result-icons">
                <!-- 动态生成历史图标 -->
            </div>
            <div class="score-text" id="score-text"></div>
        </div>
    </div>

                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                } else {
                    explanation.classList.add('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 隐藏答案解析';
                }
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const params = questionParams[currentParamIndex];
                let score = 0;
                const totalQuestions = 7; // 问题1,2,3(检验类型),3(自由度),4,5,6
                const questionResults = {};

                // 检查选择题（问题1、2、3的检验类型部分、6）
                for (let i = 1; i <= 6; i++) {
                    if (i === 4 || i === 5) continue; // 跳过填空题

                    const options = document.querySelectorAll(`.option[data-question="${i}"]`);
                    const feedbackEl = document.getElementById(`feedback${i}`);
                    const correctOption = document.querySelector(`.option[data-question="${i}"][data-correct="true"]`);
                    const selectedOption = document.querySelector(`.option[data-question="${i}"].selected`);

                    // 清除之前的正确/错误状态
                    options.forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                    });

                    if (selectedOption) {
                        const isCorrect = selectedOption.getAttribute('data-correct') === 'true';
                        if (isCorrect) {
                            score++;
                            questionResults[i] = true;
                            selectedOption.classList.add('correct');
                            feedbackEl.textContent = '正确！';
                            feedbackEl.className = 'feedback correct';
                        } else {
                            questionResults[i] = false;
                            selectedOption.classList.add('incorrect');
                            if (correctOption) correctOption.classList.add('correct');
                            feedbackEl.textContent = '不正确。';
                            feedbackEl.className = 'feedback incorrect';
                        }
                    } else {
                        questionResults[i] = false;
                        if (correctOption) correctOption.classList.add('correct');
                        feedbackEl.textContent = '请先选择一个答案！';
                        feedbackEl.className = 'feedback incorrect';
                    }
                    feedbackEl.classList.add('show');
                }

                // 检查第3题的自由度部分（如果选择了F检验）
                if (selectedTestType === 'F') {
                    const feedback3df = document.getElementById('feedback3');
                    const input3df1 = document.getElementById('answer-3df1');
                    const input3df2 = document.getElementById('answer-3df2');

                    if (input3df1) input3df1.classList.remove('correct', 'incorrect');
                    if (input3df2) input3df2.classList.remove('correct', 'incorrect');

                    const userDf1 = parseInt(userAnswers['3df1']);
                    const userDf2 = parseInt(userAnswers['3df2']);
                    const df1Correct = !isNaN(userDf1) && userDf1 === params.df1;
                    const df2Correct = !isNaN(userDf2) && userDf2 === params.df2;

                    if (df1Correct && df2Correct) {
                        score++;
                        if (input3df1) input3df1.classList.add('correct');
                        if (input3df2) input3df2.classList.add('correct');
                        feedback3df.textContent += ' 自由度正确！';
                        feedback3df.className = 'feedback correct';
                    } else {
                        if (input3df1) input3df1.classList.add(df1Correct ? 'correct' : 'incorrect');
                        if (input3df2) input3df2.classList.add(df2Correct ? 'correct' : 'incorrect');
                        feedback3df.textContent += ` 自由度不正确。正确答案是 分子自由度=${params.df1}，分母自由度=${params.df2}。`;
                        feedback3df.className = 'feedback incorrect';
                    }
                }

                // 检查第4题（F值）
                const feedback4 = document.getElementById('feedback4');
                const input4 = document.getElementById('answer-4');
                const userAnswer4 = parseFloat(userAnswers[4]);
                const correctAnswer4 = params.fValue.toFixed(3);
                const tolerance4 = 0.01;

                if (input4) input4.classList.remove('correct', 'incorrect');

                if (userAnswers[4] && !isNaN(userAnswer4)) {
                    if (Math.abs(userAnswer4 - parseFloat(correctAnswer4)) <= tolerance4) {
                        score++;
                        questionResults[4] = true;
                        if (input4) input4.classList.add('correct');
                        feedback4.textContent = '正确！';
                        feedback4.className = 'feedback correct';
                    } else {
                        questionResults[4] = false;
                        if (input4) input4.classList.add('incorrect');
                        feedback4.textContent = `不正确。正确答案是 ${correctAnswer4}。`;
                        feedback4.className = 'feedback incorrect';
                    }
                } else {
                    questionResults[4] = false;
                    feedback4.textContent = `请输入答案。正确答案是 ${correctAnswer4}。`;
                    feedback4.className = 'feedback incorrect';
                }
                feedback4.classList.add('show');

                // 检查第5题（p值）
                const feedback5 = document.getElementById('feedback5');
                const input5 = document.getElementById('answer-5');
                const userAnswer5 = parseFloat(userAnswers[5]);
                const correctAnswer5 = params.pValue.toFixed(3);
                const tolerance5 = 0.01;

                if (input5) input5.classList.remove('correct', 'incorrect');

                if (userAnswers[5] && !isNaN(userAnswer5)) {
                    if (Math.abs(userAnswer5 - parseFloat(correctAnswer5)) <= tolerance5) {
                        score++;
                        questionResults[5] = true;
                        if (input5) input5.classList.add('correct');
                        feedback5.textContent = '正确！';
                        feedback5.className = 'feedback correct';
                    } else {
                        questionResults[5] = false;
                        if (input5) input5.classList.add('incorrect');
                        feedback5.textContent = `不正确。正确答案是 ${correctAnswer5}。`;
                        feedback5.className = 'feedback incorrect';
                    }
                } else {
                    questionResults[5] = false;
                    feedback5.textContent = `请输入答案。正确答案是 ${correctAnswer5}。`;
                    feedback5.className = 'feedback incorrect';
                }
                feedback5.classList.add('show');

                // 显示答案解析按钮
                const toggleBtn = document.getElementById('toggle-explanation-btn');
                toggleBtn.classList.add('show');
                toggleBtn.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                document.getElementById('combined-explanation').classList.remove('show');

                // 记录这套题目的结果到历史
                const isAllCorrect = (score === totalQuestions);
                quizHistory.push(isAllCorrect);

                // 更新历史记录显示
                updateHistoryDisplay();

                // 更新分数文本
                let message = '';
                if (isAllCorrect) {
                    message = '太棒了！这套题全对了！';
                } else {
                    message = `这套题答对了 ${score}/${totalQuestions} 道，继续加油！`;
                }
                document.getElementById('score-text').textContent = message;

                // 禁用提交按钮
                this.disabled = true;
                this.style.opacity = '0.6';
                this.style.cursor = 'not-allowed';

                document.getElementById('score-container').scrollIntoView({ behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
