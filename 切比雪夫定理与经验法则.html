<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切比雪夫定理与经验法则 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .problem-info {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #3498db;
        }

        .problem-info p {
            margin-bottom: 8px;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 35px;
            padding: 20px;
            border-radius: 15px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.1);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background-color: #3498db;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .question-type {
            background-color: #e8f4fc;
            color: #2980b9;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 1rem;
        }

        .fill-blank-input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 120px;
            transition: all 0.2s ease;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 5px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 5px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border-left: 5px solid #f39c12;
            font-size: 0.95rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .score-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-text {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 4px solid #3498db;
        }

        .rule-box {
            background-color: #f0f7ff;
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            border: 1px dashed #3498db;
        }

        .rule-title {
            color: #2980b9;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .params-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .params-header {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .question-container {
                padding: 15px;
            }
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bell-curve"></i> 切比雪夫定理与经验法则</h1>
            <p class="subtitle">描述性统计 - 交互式答题练习</p>
        </header>

        <div class="params-header">
            <div class="problem-info" id="problem-info" style="flex: 1;">
                <!-- 动态生成 -->
            </div>
            <button class="refresh-params-btn" id="refresh-params-btn">
                <span>&#8635;</span> 刷新参数
            </button>
        </div>

        <div class="rule-box">
            <div class="rule-title"><i class="fas fa-lightbulb"></i> 重要概念回顾</div>
            <p><strong>切比雪夫定理：</strong> 对于任何分布（无论形状如何），至少有 100(1 - 1/k^2)% 的测量值位于均值的 k 个标准差范围内（k > 1）。</p>
            <p><strong>经验法则：</strong> 对于钟形分布：
                <ul>
                    <li>大约 68% 的测量值位于均值 1 个标准差范围内</li>
                    <li>大约 95% 的测量值位于均值 2 个标准差范围内</li>
                    <li>大约 99.7% 的测量值位于均值 3 个标准差范围内</li>
                </ul>
            </p>
        </div>

        <!-- 问题 1 -->
        <div class="question-container" id="q1">
            <div class="question-header">
                <div class="question-number">1</div>
                <div class="question-type">切比雪夫定理</div>
            </div>
            <div class="question-text" id="question-text-1">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-1">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback1"></div>
            <button class="show-explanation-btn" data-question="1">查看答案解析</button>
            <div class="explanation" id="explanation1">
                <h4><i class="fas fa-calculator"></i> 解析</h4>
                <div id="explanation-content-1">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 问题 2 -->
        <div class="question-container" id="q2">
            <div class="question-header">
                <div class="question-number">2</div>
                <div class="question-type">切比雪夫定理</div>
            </div>
            <div class="question-text" id="question-text-2">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-2">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback2"></div>
            <button class="show-explanation-btn" data-question="2">查看答案解析</button>
            <div class="explanation" id="explanation2">
                <h4><i class="fas fa-calculator"></i> 解析</h4>
                <div id="explanation-content-2">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 问题 3 -->
        <div class="question-container" id="q3">
            <div class="question-header">
                <div class="question-number">3</div>
                <div class="question-type">经验法则</div>
            </div>
            <div class="question-text" id="question-text-3">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-3">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback3"></div>
            <button class="show-explanation-btn" data-question="3">查看答案解析</button>
            <div class="explanation" id="explanation3">
                <h4><i class="fas fa-calculator"></i> 解析</h4>
                <div id="explanation-content-3">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 问题 4 -->
        <div class="question-container" id="q4">
            <div class="question-header">
                <div class="question-number">4</div>
                <div class="question-type">经验法则</div>
            </div>
            <div class="question-text" id="question-text-4">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback4"></div>
            <button class="show-explanation-btn" data-question="4">查看答案解析</button>
            <div class="explanation" id="explanation4">
                <h4><i class="fas fa-calculator"></i> 解析</h4>
                <div id="explanation-content-4">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="reset-btn">
                <i class="fas fa-redo"></i> 重新作答
            </button>
        </div>

        <div class="score-container" id="score-container">
            <div class="score-title">你的得分</div>
            <div class="score-value" id="score-value">0/4</div>
            <div class="score-text" id="score-text"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    context: "血压研究",
                    mean: 130.9,
                    std: 6.3,
                    unit: "mmHg",
                    q1: { k: 2, lower: 118.3, upper: 143.5, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 121.45, upper: 140.35, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 118.3, upper: 143.5, answer: 95, answerOption: 'c' },
                    q4: { lower: 112.0, upper: 149.8 }
                },
                {
                    context: "身高研究",
                    mean: 165.2,
                    std: 8.5,
                    unit: "cm",
                    q1: { k: 2, lower: 148.2, upper: 182.2, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 152.45, upper: 177.95, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 148.2, upper: 182.2, answer: 95, answerOption: 'c' },
                    q4: { lower: 139.7, upper: 190.7 }
                },
                {
                    context: "体重研究",
                    mean: 68.5,
                    std: 12.4,
                    unit: "kg",
                    q1: { k: 2, lower: 43.7, upper: 93.3, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 49.9, upper: 87.1, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 43.7, upper: 93.3, answer: 95, answerOption: 'c' },
                    q4: { lower: 31.3, upper: 105.7 }
                },
                {
                    context: "考试成绩",
                    mean: 75.0,
                    std: 10.0,
                    unit: "分",
                    q1: { k: 2, lower: 55.0, upper: 95.0, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 60.0, upper: 90.0, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 55.0, upper: 95.0, answer: 95, answerOption: 'c' },
                    q4: { lower: 45.0, upper: 105.0 }
                },
                {
                    context: "心率研究",
                    mean: 72.0,
                    std: 8.0,
                    unit: "bpm",
                    q1: { k: 2, lower: 56.0, upper: 88.0, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 60.0, upper: 84.0, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 56.0, upper: 88.0, answer: 95, answerOption: 'c' },
                    q4: { lower: 48.0, upper: 96.0 }
                },
                {
                    context: "血糖研究",
                    mean: 100.0,
                    std: 15.0,
                    unit: "mg/dL",
                    q1: { k: 2, lower: 70.0, upper: 130.0, answer: 75, answerOption: 'b' },
                    q2: { k: 1.5, lower: 77.5, upper: 122.5, answer: 56, answerOption: 'a' },
                    q3: { k: 2, lower: 70.0, upper: 130.0, answer: 95, answerOption: 'c' },
                    q4: { lower: 55.0, upper: 145.0 }
                }
            ];

            let currentParamIndex = 0;

            // 用户选择的答案
            let userAnswers = {
                1: null,
                2: null,
                3: null,
                4: { lower: null, upper: null }
            };

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染问题背景
                document.getElementById('problem-info').innerHTML = `
                    <p><strong>问题背景：</strong>某项${params.context}报告称测量值的平均值为 <span class="highlight">${params.mean} ${params.unit}</span>，标准差为 <span class="highlight">${params.std} ${params.unit}</span>。</p>
                    <p>假设报告的信息是正确的，请完成以下关于测量值分布的陈述。</p>
                `;

                // 渲染问题1
                document.getElementById('question-text-1').innerHTML = `
                    <p>(a) 根据切比雪夫定理，至少有 _____% 的测量值位于 ${params.q1.lower} ${params.unit} 和 ${params.q1.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(1, params.q1.answerOption);

                // 渲染问题2
                document.getElementById('question-text-2').innerHTML = `
                    <p>(b) 根据切比雪夫定理，至少有 _____% 的测量值位于 ${params.q2.lower} ${params.unit} 和 ${params.q2.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(2, params.q2.answerOption);

                // 渲染问题3
                document.getElementById('question-text-3').innerHTML = `
                    <p>(c) 假设分布呈钟形。根据经验法则，大约有 _____% 的测量值位于 ${params.q3.lower} ${params.unit} 和 ${params.q3.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(3, params.q3.answerOption);

                // 渲染问题4 - 填空题
                document.getElementById('question-text-4').innerHTML = `
                    <p>(d) 假设分布呈钟形。根据经验法则，大约 99.7% 的测量值位于 _____${params.unit} 和 _____${params.unit} 之间。</p>
                    <p style="margin-top: 15px; font-weight: bold;">请在下方输入你的答案：</p>
                    <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span>下限：</span>
                            <input type="number" step="0.1" id="lower-bound" class="fill-blank-input">
                            <span>${params.unit}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span>上限：</span>
                            <input type="number" step="0.1" id="upper-bound" class="fill-blank-input">
                            <span>${params.unit}</span>
                        </div>
                    </div>
                `;

                // 渲染解析
                renderExplanations(params);

                // 重置用户答案
                userAnswers = {
                    1: null,
                    2: null,
                    3: null,
                    4: { lower: null, upper: null }
                };

                // 清除反馈
                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`feedback${i}`).classList.remove('show', 'correct', 'incorrect');
                    document.getElementById(`explanation${i}`).classList.remove('show');
                    const btn = document.querySelector(`.show-explanation-btn[data-question="${i}"]`);
                    if (btn) {
                        btn.style.display = 'none';
                        btn.textContent = '查看答案解析';
                    }
                }

                // 清除选项状态
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                });

                // 绑定事件
                bindEvents();
            }

            function renderOptions(questionNum, correctOption) {
                const options = [
                    { letter: 'a', text: '56%' },
                    { letter: 'b', text: '75%' },
                    { letter: 'c', text: questionNum === 3 ? '95%' : '84%' },
                    { letter: 'd', text: questionNum === 3 ? '99.7%' : '89%' }
                ];

                const container = document.getElementById(`options-container-${questionNum}`);
                container.innerHTML = options.map(opt => `
                    <div class="option" data-question="${questionNum}" data-option="${opt.letter}">
                        <div class="option-letter">${opt.letter.toUpperCase()}</div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `).join('');
            }

            function renderExplanations(params) {
                // 问题1解析
                document.getElementById('explanation-content-1').innerHTML = `
                    <p>已知均值 μ = ${params.mean}，标准差 σ = ${params.std}。</p>
                    <p>计算边界值与均值的距离：</p>
                    <div class="formula">
                        ${params.q1.lower} = ${params.mean} - 2 × ${params.std} (均值下方2个标准差)<br>
                        ${params.q1.upper} = ${params.mean} + 2 × ${params.std} (均值上方2个标准差)
                    </div>
                    <p>因此，k = 2。根据切比雪夫定理：</p>
                    <div class="formula">
                        100(1 - 1/2²)% = 100(1 - 1/4)% = 100 × 3/4% = 75%
                    </div>
                    <p>所以，<strong>至少有75%的测量值位于${params.q1.lower}和${params.q1.upper}之间</strong>。</p>
                `;

                // 问题2解析
                document.getElementById('explanation-content-2').innerHTML = `
                    <p>计算边界值与均值的距离：</p>
                    <div class="formula">
                        ${params.q2.lower} = ${params.mean} - 1.5 × ${params.std} (均值下方1.5个标准差)<br>
                        ${params.q2.upper} = ${params.mean} + 1.5 × ${params.std} (均值上方1.5个标准差)
                    </div>
                    <p>因此，k = 1.5。根据切比雪夫定理：</p>
                    <div class="formula">
                        100(1 - 1/1.5²)% = 100(1 - 1/2.25)% ≈ 100(1 - 0.444)% ≈ 55.56%
                    </div>
                    <p>所以，<strong>至少有约56%的测量值位于${params.q2.lower}和${params.q2.upper}之间</strong>。</p>
                `;

                // 问题3解析
                document.getElementById('explanation-content-3').innerHTML = `
                    <p>已知均值 μ = ${params.mean}，标准差 σ = ${params.std}。</p>
                    <p>与问题(a)相同，${params.q3.lower}和${params.q3.upper}分别位于均值下方和上方2个标准差处：</p>
                    <div class="formula">
                        ${params.q3.lower} = ${params.mean} - 2 × ${params.std}<br>
                        ${params.q3.upper} = ${params.mean} + 2 × ${params.std}
                    </div>
                    <p>根据经验法则，对于钟形分布：</p>
                    <div class="formula">
                        <strong>大约95%的测量值位于均值2个标准差范围内</strong>
                    </div>
                    <p>所以，<strong>大约95%的测量值位于${params.q3.lower}和${params.q3.upper}之间</strong>。</p>
                    <p><em>注意：与切比雪夫定理的"至少75%"相比，经验法则给出了更强的"大约95%"的结论，这是因为我们假设了分布是钟形的。</em></p>
                `;

                // 问题4解析
                document.getElementById('explanation-content-4').innerHTML = `
                    <p>根据经验法则，钟形分布中大约99.7%的测量值位于均值3个标准差范围内。</p>
                    <p>计算边界值：</p>
                    <div class="formula">
                        下限：${params.mean} - 3 × ${params.std} = ${params.q4.lower} ${params.unit}<br>
                        上限：${params.mean} + 3 × ${params.std} = ${params.q4.upper} ${params.unit}
                    </div>
                    <p>所以，<strong>大约99.7%的测量值位于${params.q4.lower} ${params.unit}和${params.q4.upper} ${params.unit}之间</strong>。</p>
                `;
            }

            function bindEvents() {
                // 选项点击事件
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionNum = this.getAttribute('data-question');
                        const optionValue = this.getAttribute('data-option');

                        // 清除同一问题的其他选项的选择状态
                        document.querySelectorAll(`.option[data-question="${questionNum}"]`).forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 设置当前选项为选中状态
                        this.classList.add('selected');

                        // 保存用户答案
                        userAnswers[questionNum] = optionValue;

                        // 隐藏之前的反馈
                        document.getElementById(`feedback${questionNum}`).classList.remove('show', 'correct', 'incorrect');
                    });
                });

                // 第四题输入框事件
                const lowerInput = document.getElementById('lower-bound');
                const upperInput = document.getElementById('upper-bound');

                if (lowerInput) {
                    lowerInput.addEventListener('input', function() {
                        userAnswers[4].lower = parseFloat(this.value);
                        document.getElementById('feedback4').classList.remove('show', 'correct', 'incorrect');
                    });
                }

                if (upperInput) {
                    upperInput.addEventListener('input', function() {
                        userAnswers[4].upper = parseFloat(this.value);
                        document.getElementById('feedback4').classList.remove('show', 'correct', 'incorrect');
                    });
                }
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 隐藏得分
                document.getElementById('score-container').classList.remove('show');
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refresh-params-btn').addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionId = this.getAttribute('data-question');
                    const explanation = document.getElementById(`explanation${questionId}`);
                    if (explanation) {
                        if (explanation.classList.contains('show')) {
                            explanation.classList.remove('show');
                            this.textContent = '查看答案解析';
                        } else {
                            explanation.classList.add('show');
                            this.textContent = '隐藏答案解析';
                        }
                    }
                });
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const params = questionParams[currentParamIndex];
                let score = 0;
                const totalQuestions = 4;

                const correctAnswers = {
                    1: params.q1.answerOption,
                    2: params.q2.answerOption,
                    3: params.q3.answerOption,
                    4: params.q4
                };

                // 检查前3题
                for (let i = 1; i <= 3; i++) {
                    const userAnswer = userAnswers[i];
                    const correctAnswer = correctAnswers[i];
                    const feedbackEl = document.getElementById(`feedback${i}`);
                    const options = document.querySelectorAll(`.option[data-question="${i}"]`);

                    // 清除之前的正确/错误状态
                    options.forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                    });

                    if (userAnswer === null) {
                        feedbackEl.textContent = '请先选择一个答案！';
                        feedbackEl.className = 'feedback incorrect';
                        feedbackEl.classList.add('show');
                        continue;
                    }

                    if (userAnswer === correctAnswer) {
                        score++;
                        feedbackEl.textContent = '正确！你的答案是正确的。';
                        feedbackEl.className = 'feedback correct';
                    } else {
                        const userOption = document.querySelector(`.option[data-question="${i}"][data-option="${userAnswer}"]`);
                        if (userOption) userOption.classList.add('incorrect');
                        feedbackEl.textContent = '不正确。';
                        feedbackEl.className = 'feedback incorrect';
                    }

                    feedbackEl.classList.add('show');
                    var showBtn = document.querySelector(`.show-explanation-btn[data-question="${i}"]`);
                    if (showBtn) {
                        showBtn.style.display = 'inline-block';
                    }
                }

                // 检查第4题 - 使用容差验证
                const feedback4 = document.getElementById('feedback4');
                const lowerInput = document.getElementById('lower-bound');
                const upperInput = document.getElementById('upper-bound');
                const tolerance = 0.5;  // 容差0.5

                if (userAnswers[4].lower === null || userAnswers[4].upper === null || !lowerInput || !upperInput) {
                    feedback4.textContent = '请填写下限和上限值！';
                    feedback4.className = 'feedback incorrect';
                    feedback4.classList.add('show');
                } else {
                    const lowerCorrect = Math.abs(userAnswers[4].lower - correctAnswers[4].lower) <= tolerance;
                    const upperCorrect = Math.abs(userAnswers[4].upper - correctAnswers[4].upper) <= tolerance;

                    // 添加视觉反馈
                    lowerInput.classList.remove('correct', 'incorrect');
                    upperInput.classList.remove('correct', 'incorrect');
                    lowerInput.classList.add(lowerCorrect ? 'correct' : 'incorrect');
                    upperInput.classList.add(upperCorrect ? 'correct' : 'incorrect');

                    if (lowerCorrect && upperCorrect) {
                        score++;
                        feedback4.textContent = '正确！你的答案是正确的。';
                        feedback4.className = 'feedback correct';
                    } else {
                        feedback4.textContent = '不正确。';
                        feedback4.className = 'feedback incorrect';
                    }

                    feedback4.classList.add('show');
                    var showBtn = document.querySelector('.show-explanation-btn[data-question="4"]');
                    if (showBtn) {
                        showBtn.style.display = 'inline-block';
                    }
                }

                // 显示得分
                const scoreContainer = document.getElementById('score-container');
                const scoreValue = document.getElementById('score-value');
                const scoreText = document.getElementById('score-text');

                scoreValue.textContent = `${score}/${totalQuestions}`;

                let percentage = (score / totalQuestions) * 100;
                let message = '';

                if (percentage === 100) {
                    message = '太棒了！你完全掌握了切比雪夫定理和经验法则！';
                } else if (percentage >= 75) {
                    message = '做得很好！你对这些概念有很好的理解。';
                } else if (percentage >= 50) {
                    message = '不错！但还有一些概念需要加强。';
                } else {
                    message = '请复习切比雪夫定理和经验法则，然后再次尝试。';
                }

                scoreText.textContent = message;
                scoreContainer.classList.add('show');

                // 滚动到得分区域
                scoreContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // 重置按钮事件
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置用户答案
                userAnswers = {
                    1: null,
                    2: null,
                    3: null,
                    4: { lower: null, upper: null }
                };

                // 清除所有选项的选择状态
                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                });

                // 清除所有反馈
                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`feedback${i}`).classList.remove('show', 'correct', 'incorrect');
                    document.getElementById(`explanation${i}`).classList.remove('show');
                    const btn = document.querySelector(`.show-explanation-btn[data-question="${i}"]`);
                    if (btn) {
                        btn.style.display = 'none';
                        btn.textContent = '查看答案解析';
                    }
                }

                // 清除输入框
                const lowerInput = document.getElementById('lower-bound');
                const upperInput = document.getElementById('upper-bound');
                if (lowerInput) lowerInput.value = '';
                if (upperInput) upperInput.value = '';

                // 隐藏得分
                document.getElementById('score-container').classList.remove('show');

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
