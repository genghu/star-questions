<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值差异的置信区间 - 标准正态分布应用</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
            white-space: pre-line;
        }

        .question-icon {
            font-size: 1.5em;
            margin-right: 8px;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-weight: bold;
            color: #0052cc;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .answer-input {
            width: 100%;
            max-width: 200px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }

        #next-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .feedback-container {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .incorrect-feedback {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
        }

        .stats {
            background-color: #e6f0ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .stats-title {
            font-size: 1rem;
            color: #0052cc;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .results-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 40px;
            align-items: center;
        }

        .result-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            animation: popIn 0.3s ease;
        }

        .result-icon.correct {
            background-color: #27ae60;
        }

        .result-icon.correct::after {
            content: '✓';
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
        }

        .result-icon.incorrect::after {
            content: '✗';
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .no-results {
            color: #999;
            font-size: 0.9rem;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .explanation-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .explanation-section.show {
            display: block;
        }

        .explanation-step {
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            border-left: 4px solid #4d94ff;
            margin-bottom: 15px;
        }

        .step-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0052cc;
        }

        .formula {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            text-align: center;
            margin: 10px 0;
            overflow-x: auto;
        }

        .note {
            background-color: #fef3c7;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }

            .input-row {
                flex-direction: column;
                gap: 15px;
            }

            .answer-input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>总体均值差异的置信区间</h1>
            <div class="subtitle">标准正态分布应用 - 交互式答题</div>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span>问题</span>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <div class="input-row">
                    <div class="input-group">
                        <label class="answer-label" id="lowerLabel">置信区间的下限：</label>
                        <input type="number" step="0.01" class="answer-input" id="lower-input">
                    </div>
                    <div class="input-group">
                        <label class="answer-label" id="upperLabel">置信区间的上限：</label>
                        <input type="number" step="0.01" class="answer-input" id="upper-input">
                    </div>
                </div>
                <div class="tolerance-hint">容差：±0.05（四舍五入至两位小数）</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">提交答案</button>
            <button id="next-btn">下一题 ⏩</button>
        </div>

        <div class="feedback-container" id="feedback">
            <div class="feedback-title" id="feedback-title-text"></div>
            <p id="feedback-text"></p>
            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section" id="explanation">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">答题记录</div>
            <div class="results-container" id="results-container">
                <span class="no-results">尚未开始答题</span>
            </div>
        </div>
    </div>

                    questionContext: "第一种信用卡用户的平均月消费 (μ₁) 与第二种信用卡用户的平均月消费 (μ₂) 之间的差值 μ₁ - μ₂"

                {

                    zValue: 1.96,
                    correctLower: 3.79,
                    correctUpper: 7.81,
                    description: "某食品研究机构比较两种饮料的咖啡因含量（mg/100mL）。第一种饮料检测了 275 个样本，平均咖啡因含量为 58.40 mg，标准差为 12.80 mg。第二种饮料检测了 290 个样本，平均咖啡因含量为 52.60 mg，标准差为 11.50 mg。由于样本量较大，可以用样本标准差估计总体标准差。",
                    questionContext: "第一种饮料的平均咖啡因含量 (μ₁) 与第二种饮料的平均咖啡因含量 (μ₂) 之间的差值 μ₁ - μ₂"
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = parameterSets[currentParamIndex];
                const questionText = document.getElementById('question-text');
                const explanation = document.getElementById('explanation');

                // 计算中间值
                const meanDiff = (params.xbar1 - params.xbar2).toFixed(2);
                const variance1 = (Math.pow(params.sigma1, 2) / params.n1).toFixed(6);
                const variance2 = (Math.pow(params.sigma2, 2) / params.n2).toFixed(6);
                const totalVariance = (parseFloat(variance1) + parseFloat(variance2)).toFixed(6);
                const stdError = Math.sqrt(parseFloat(totalVariance)).toFixed(4);
                const marginError = (params.zValue * parseFloat(stdError)).toFixed(4);

                // 渲染题目
                questionText.innerHTML = `<span class="question-icon">${params.icon}</span>${params.description}

构建一个 <span class="math">${params.confidenceLevel}%</span> 的置信区间，用于估计${params.questionContext}。

中间计算至少保留三位小数。答案至少保留两位小数。`;

                document.getElementById('lowerLabel').textContent = `${params.confidenceLevel}% 置信区间的下限：`;
                document.getElementById('upperLabel').textContent = `${params.confidenceLevel}% 置信区间的上限：`;

                // 渲染解析
                explanation.innerHTML = `
                    <div class="explanation-step">
                        <div class="step-title">步骤 1: 理解问题与已知条件</div>
                        <p>我们需要构建两个总体均值差异 <span class="math">μ₁ - μ₂</span> 的 ${params.confidenceLevel}% 置信区间。</p>
                        <ul>
                            <li>样本1: <span class="math">n₁ = ${params.n1}, x̄₁ = ${params.xbar1}, σ₁ = ${params.sigma1}</span></li>
                            <li>样本2: <span class="math">n₂ = ${params.n2}, x̄₂ = ${params.xbar2}, σ₂ = ${params.sigma2}</span></li>
                            <li>置信水平: ${params.confidenceLevel}%</li>
                        </ul>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 2: 确定临界值</div>
                        <p>由于两个样本容量都较大，根据中心极限定理，样本均值差的抽样分布近似服从正态分布。</p>
                        <p>对于 ${params.confidenceLevel}% 置信区间，对应的临界值为 <span class="math">z_{α/2} = ${params.zValue}</span>。</p>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 3: 计算样本均值差</div>
                        <div class="formula">
                            x̄₁ - x̄₂ = ${params.xbar1} - ${params.xbar2} = ${meanDiff}
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 4: 计算标准误差</div>
                        <p>两个独立样本均值差的标准误差为:</p>
                        <div class="formula">
                            SE = √(σ₁²/n₁ + σ₂²/n₂) = √(${params.sigma1}²/${params.n1} + ${params.sigma2}²/${params.n2})<br>
                            = √(${variance1} + ${variance2}) ≈ √${totalVariance} ≈ ${stdError}
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 5: 计算边际误差</div>
                        <p>边际误差 (Margin of Error) 为:</p>
                        <div class="formula">
                            ME = z_{α/2} × SE = ${params.zValue} × ${stdError} ≈ ${marginError}
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 6: 构建置信区间</div>
                        <p>${params.confidenceLevel}% 置信区间的公式为:</p>
                        <div class="formula">
                            ( (x̄₁ - x̄₂) - z_{α/2} × √(σ₁²/n₁ + σ₂²/n₂) , (x̄₁ - x̄₂) + z_{α/2} × √(σ₁²/n₁ + σ₂²/n₂) )
                        </div>
                        <p>代入数值:</p>
                        <div class="formula">
                            下限: ${meanDiff} - ${marginError} = ${(parseFloat(meanDiff) - parseFloat(marginError)).toFixed(2)} ≈ <strong>${params.correctLower}</strong><br>
                            上限: ${meanDiff} + ${marginError} = ${(parseFloat(meanDiff) + parseFloat(marginError)).toFixed(2)} ≈ <strong>${params.correctUpper}</strong>
                        </div>
                    </div>

                    <div class="explanation-step">
                        <div class="step-title">步骤 7: 解释结果</div>
                        <p>我们有 ${params.confidenceLevel}% 的置信度认为，${params.questionContext}位于区间 (<strong>${params.correctLower}</strong>, <strong>${params.correctUpper}</strong>) 内。</p>
                    </div>

                    <div class="note">
                        <strong>注意:</strong> 当从两个独立总体中各抽取一个大随机样本时，总体均值差异 μ₁ - μ₂ 的 (1-α)100% 置信区间由下式给出:
                        <div class="formula">
                            ( (x̄₁ - x̄₂) - z_{α/2} × √(σ₁²/n₁ + σ₂²/n₂) , (x̄₁ - x̄₂) + z_{α/2} × √(σ₁²/n₁ + σ₂²/n₂) )
                        </div>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * parameterSets.length);
                } while (newIndex === currentParamIndex && parameterSets.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 清除输入和反馈
                lowerInput.value = '';
                upperInput.value = '';
                lowerInput.classList.remove('correct', 'incorrect');
                upperInput.classList.remove('correct', 'incorrect');
                lowerInput.disabled = false;
                upperInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈和解析
                feedback.classList.remove('show');
                explanation.classList.remove('show');
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // ==================== 事件处理 ====================

            let isSubmitted = false;
            let answerResults = []; // 记录答题结果

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title-text');
            const feedbackText = document.getElementById('feedback-text');
            const resultsContainer = document.getElementById('results-container');
            const showExpBtn = document.getElementById('show-explanation-btn');
            const explanation = document.getElementById('explanation');
            const lowerInput = document.getElementById('lower-input');
            const upperInput = document.getElementById('upper-input');
            const feedbackInline = document.getElementById('feedback-inline');

            // 下一题按钮
            nextBtn.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExpBtn.addEventListener('click', function() {
                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.textContent = '查看答案解析';
                } else {
                    explanation.classList.add('show');
                    this.textContent = '隐藏答案解析';
                }
            });

            // 添加结果图标
            function addResultIcon(isCorrect) {
                answerResults.push(isCorrect);

                // 清除"尚未开始答题"提示
                if (answerResults.length === 1) {
                    resultsContainer.innerHTML = '';
                }

                // 创建图标
                const icon = document.createElement('div');
                icon.className = `result-icon ${isCorrect ? 'correct' : 'incorrect'}`;
                resultsContainer.appendChild(icon);
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const lowerVal = parseFloat(lowerInput.value);
                const upperVal = parseFloat(upperInput.value);

                if (isNaN(lowerVal) || isNaN(upperVal)) {
                    alert('请先输入有效的数字！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                const params = parameterSets[currentParamIndex];
                const tolerance = 0.05;

                const lowerCorrect = Math.abs(lowerVal - params.correctLower) <= tolerance;
                const upperCorrect = Math.abs(upperVal - params.correctUpper) <= tolerance;
                const isCorrect = lowerCorrect && upperCorrect;

                // 添加结果图标
                addResultIcon(isCorrect);

                // 更新输入框样式
                if (lowerCorrect) {
                    lowerInput.classList.add('correct');
                } else {
                    lowerInput.classList.add('incorrect');
                }

                if (upperCorrect) {
                    upperInput.classList.add('correct');
                } else {
                    upperInput.classList.add('incorrect');
                }

                // 更新反馈
                if (isCorrect) {
                    feedbackInline.textContent = '正确!';
                    feedbackInline.className = 'feedback-inline correct';
                    feedbackTitle.textContent = "回答正确!";
                    feedbackText.textContent = `你正确地计算出了置信区间的下限 (${lowerVal}) 和上限 (${upperVal})。`;
                    feedback.classList.remove('incorrect-feedback');
                    feedback.classList.add('correct-feedback');
                } else {
                    let msg = '';
                    if (!lowerCorrect && !upperCorrect) {
                        msg = `下限和上限都不正确。正确答案：下限 = ${params.correctLower}，上限 = ${params.correctUpper}`;
                    } else if (!lowerCorrect) {
                        msg = `下限不正确，上限正确。正确下限 = ${params.correctLower}`;
                    } else {
                        msg = `下限正确，上限不正确。正确上限 = ${params.correctUpper}`;
                    }
                    feedbackInline.textContent = msg;
                    feedbackInline.className = 'feedback-inline incorrect';
                    feedbackTitle.textContent = "回答错误!";
                    feedbackText.textContent = `你的答案：下限 = ${lowerVal}，上限 = ${upperVal}。${msg}`;
                    feedback.classList.remove('correct-feedback');
                    feedback.classList.add('incorrect-feedback');
                }

                // 显示反馈
                feedback.classList.add('show');
                // 显示解析按钮
                showExpBtn.style.display = 'inline-block';
                // 禁用输入
                lowerInput.disabled = true;
                upperInput.disabled = true;
            });

            // 允许按Enter键提交
            lowerInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitBtn.click();
            });

            upperInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitBtn.click();
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
