<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值差异假设检验 t检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.4;
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        .info-box {
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-left: 4px solid #3498db;
            font-size: 0.9rem;
        }

        .info-box p {
            margin-bottom: 4px;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.1);
        }

        .question-title {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin-right: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .options-container-2col {
            grid-template-columns: repeat(2, 1fr);
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .option:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 0.85rem;
        }

        .fill-blank-input {
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            width: 120px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
            font-size: 0.85rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 3px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 3px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        #submitBtn {
            background-color: #3498db;
            color: white;
        }

        #submitBtn:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        #resetBtn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        #resetBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.3);
        }

        .toggle-explanation-btn {
            display: none;
            margin: 10px auto;
            padding: 8px 20px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(155, 89, 182, 0.3);
        }

        .toggle-explanation-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(155, 89, 182, 0.4);
        }

        .toggle-explanation-btn.show {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .result-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .result-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .result-icon.correct {
            background-color: #2ecc71;
            color: white;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
            color: white;
        }

        .result-icon:hover {
            transform: scale(1.1);
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .score-text {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid #f39c12;
            font-size: 0.85rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .explanation h5 {
            color: #2980b9;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .explanation p {
            margin-bottom: 3px;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 4px;
            padding: 8px;
            margin: 6px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 3px solid #3498db;
            font-size: 0.85rem;
        }

        .critical-value {
            display: inline-block;
            padding: 2px 6px;
            background-color: #f1c40f;
            border-radius: 3px;
            margin: 0 2px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .options-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 8px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .fill-blank-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 总体均值差异假设检验：t检验</h1>
            <p class="subtitle">交互式答题系统 - 根据题目内容选择正确答案</p>
        </header>

        <div class="info-box" id="problemDescription">
        </div>

        <div id="questionsContainer"></div>

        <div class="controls">
            <button id="submitBtn"><i class="fas fa-paper-plane"></i> 提交答案</button>
            <button id="resetBtn"><i class="fas fa-redo"></i> 下一题</button>
        </div>

        <button id="toggle-explanation-btn" class="toggle-explanation-btn">
            <i class="fas fa-lightbulb"></i> 显示答案解析
        </button>

        <div class="explanation" id="combined-explanation">
            <h4><i class="fas fa-calculator"></i> 答案解析</h4>
            <div id="combined-explanation-content"></div>
        </div>

        <div class="score-container" id="score-container">
            <div class="score-title">答题记录</div>
            <div class="result-icons" id="result-icons"></div>
            <div class="score-value" id="scoreValue">0/7</div>
            <div class="score-text" id="scoreMessage"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Parameter sets with pre-computed answers for t-test
            // 分布：右尾6组(拒绝3,不拒绝3), 左尾4组(拒绝2,不拒绝2), 双尾10组(拒绝5,不拒绝5)
            const parameterSets = [
            // ========== 右尾检验 (6组) ==========
            // 拒绝 (3组)
            {
                n1: 15, xbar1: 85.6, s1: 8.2,
                n2: 12, xbar2: 79.3, s2: 7.8,
                alpha: 0.05,
                testDirection: "右尾",
                tStatistic: 2.027,
                df: 25,
                criticalValue: 1.708,
                rejectNull: "是",

                group2Name: "传统教学法",

            {

                n2: 14, xbar2: 41.2, s2: 5.8,

                rejectNull: "是",
                background: "某农业专家声称，新品种水稻的产量(μ₁)高于传统品种的产量(μ₂)。",
                group1Name: "新品种",
                group2Name: "传统品种",
                pooledVariance: 31.59
            },
            {
                n1: 19, xbar1: 56.8, s1: 7.2,
                n2: 21, xbar2: 52.4, s2: 6.8,
                alpha: 0.05,
                testDirection: "右尾",
                tStatistic: 1.987,
                df: 38,
                criticalValue: 1.686,
                rejectNull: "是",
                background: "某招聘网站声称，IT行业的平均起薪(μ₁)高于金融行业的平均起薪(μ₂)。",
                group1Name: "IT行业",
                group2Name: "金融行业",
                pooledVariance: 48.89
            },
            // 不拒绝 (3组)
            {
                n1: 13, xbar1: 11.008, s1: 2.293,

                background: "某制药公司声称，新药的治疗效果评分(μ₁)高于安慰剂组(μ₂)。",
                group1Name: "新药组",
                group2Name: "安慰剂组",
                pooledVariance: 51.93
            },
            {

                n2: 12, xbar2: 74.2, s2: 8.4,
                alpha: 0.05,
                testDirection: "右尾",
                tStatistic: 1.263,
                df: 20,
                criticalValue: 1.725,
                rejectNull: "否",

                group2Name: "旧产品",
                pooledVariance: 66.19
            },

            // ========== 左尾检验 (4组) ==========

            {

            {

            {

                criticalValue: 2.013,
                rejectNull: "是",

            {

                testDirection: "双尾",

            {

            {

            {

            },

                alpha: 0.05,
                testDirection: "双尾",

                df: 32,

                pooledVariance: 145.36
            }
        ];

        let currentParams = null;
        let userAnswers = {};
        let submitted = false;
        let quizHistory = [];

        // Fisher-Yates 洗牌算法
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function refreshQuestion() {
            // Reset state
            userAnswers = {};
            submitted = false;

            // Select random parameter set
            const randomIndex = Math.floor(Math.random() * parameterSets.length);
            currentParams = parameterSets[randomIndex];

            // Update problem description
            document.getElementById('problemDescription').innerHTML = `
                <p>${currentParams.background} ${currentParams.group1Name}有 <span class="highlight">${currentParams.n1}</span> 个样本，平均值为 <span class="highlight">${currentParams.xbar1}</span>，标准差为 <span class="highlight">${currentParams.s1}</span>。${currentParams.group2Name}有 <span class="highlight">${currentParams.n2}</span> 个样本，平均值为 <span class="highlight">${currentParams.xbar2}</span>，标准差为 <span class="highlight">${currentParams.s2}</span>。假设两个总体服从正态分布，且总体方差相等（未知）。在 <span class="highlight">${currentParams.alpha}</span> 的显著性水平下，是否有足够的证据支持该说法？执行<span class="highlight">${currentParams.testDirection}</span>检验，然后回答下面的问题。</p>
                <p style="margin-top: 8px; color: #666; font-size: 0.9rem;">中间计算请至少保留三位小数，并按照题目要求对答案进行四舍五入。</p>
            `;

            // Generate questions
            renderQuestions();

            // 隐藏解析
            document.getElementById('combined-explanation').classList.remove('show');
            document.getElementById('toggle-explanation-btn').classList.remove('show');

            // 更新历史记录显示
            updateHistoryDisplay();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            const testDir = currentParams.testDirection;
            const isRightTailed = testDir === "右尾";
            const isLeftTailed = testDir === "左尾";
            const isTwoTailed = testDir === "双尾";

            // 根据检验类型确定假设
            let h0Correct, h1Correct, h0Options, h1Options, h0Explanation, h1Explanation;

            if (isRightTailed) {
                h0Correct = "H₀: μ₁ - μ₂ ≤ 0";
                h1Correct = "H₁: μ₁ - μ₂ > 0";
                h0Options = [
                    { value: "H₀: μ₁ - μ₂ ≤ 0" },
                    { value: "H₀: μ₁ - μ₂ ≥ 0" },
                    { value: "H₀: μ₁ - μ₂ = 0" },
                    { value: "H₀: μ₁ ≠ μ₂" }
                ];
                h1Options = [
                    { value: "H₁: μ₁ - μ₂ > 0" },
                    { value: "H₁: μ₁ - μ₂ < 0" },
                    { value: "H₁: μ₁ - μ₂ ≠ 0" },
                    { value: "H₁: μ₁ - μ₂ = 0" }
                ];
                h0Explanation = '右尾检验中，原假设为μ₁ ≤ μ₂或等价的μ₁ - μ₂ ≤ 0。';
                h1Explanation = '右尾检验中，备择假设为μ₁ > μ₂或等价的μ₁ - μ₂ > 0。';
            } else if (isLeftTailed) {
                h0Correct = "H₀: μ₁ - μ₂ ≥ 0";
                h1Correct = "H₁: μ₁ - μ₂ < 0";
                h0Options = [
                    { value: "H₀: μ₁ - μ₂ ≥ 0" },
                    { value: "H₀: μ₁ - μ₂ ≤ 0" },
                    { value: "H₀: μ₁ - μ₂ = 0" },
                    { value: "H₀: μ₁ ≠ μ₂" }
                ];
                h1Options = [
                    { value: "H₁: μ₁ - μ₂ < 0" },
                    { value: "H₁: μ₁ - μ₂ > 0" },
                    { value: "H₁: μ₁ - μ₂ ≠ 0" },
                    { value: "H₁: μ₁ - μ₂ = 0" }
                ];
                h0Explanation = '左尾检验中，原假设为μ₁ ≥ μ₂或等价的μ₁ - μ₂ ≥ 0。';
                h1Explanation = '左尾检验中，备择假设为μ₁ < μ₂或等价的μ₁ - μ₂ < 0。';
            } else {
                h0Correct = "H₀: μ₁ - μ₂ = 0";
                h1Correct = "H₁: μ₁ - μ₂ ≠ 0";
                h0Options = [
                    { value: "H₀: μ₁ - μ₂ = 0" },
                    { value: "H₀: μ₁ - μ₂ ≥ 0" },
                    { value: "H₀: μ₁ - μ₂ ≤ 0" },
                    { value: "H₀: μ₁ > μ₂" }
                ];
                h1Options = [
                    { value: "H₁: μ₁ - μ₂ ≠ 0" },
                    { value: "H₁: μ₁ - μ₂ > 0" },
                    { value: "H₁: μ₁ - μ₂ < 0" },
                    { value: "H₁: μ₁ - μ₂ = 0" }
                ];
                h0Explanation = '双尾检验中，原假设为μ₁ = μ₂或等价的μ₁ - μ₂ = 0。';
                h1Explanation = '双尾检验中，备择假设为μ₁ ≠ μ₂或等价的μ₁ - μ₂ ≠ 0。';
            }

            // 生成结论解析
            let conclusionExplanation;
            if (isRightTailed) {
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 t = ${currentParams.tStatistic} > ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 t = ${currentParams.tStatistic} ≤ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            } else if (isLeftTailed) {
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 t = ${currentParams.tStatistic} < ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 t = ${currentParams.tStatistic} ≥ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            } else {
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 |t| = ${Math.abs(currentParams.tStatistic)} > ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 |t| = ${Math.abs(currentParams.tStatistic)} ≤ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            }

            const questions = [
                {
                    number: 1,
                    title: "原假设 H₀",
                    correctAnswer: h0Correct,
                    options: h0Options,
                    explanation: `原假设反映要检验的内容。${h0Explanation}`
                },
                {
                    number: 2,
                    title: "备择假设 H₁",
                    correctAnswer: h1Correct,
                    options: h1Options,
                    explanation: `备择假设与原假设对立。${h1Explanation}`
                },
                {
                    number: 3,
                    title: "检验统计量的类型",
                    correctAnswer: "t",
                    options: [
                        { value: "t" },
                        { value: "Z" },
                        { value: "卡方" },
                        { value: "F" }
                    ],
                    explanation: `由于总体方差未知但相等，使用两独立样本t检验。`
                },
                {
                    number: 4,
                    title: "自由度",
                    correctAnswer: currentParams.df,
                    isNumerical: true,
                    tolerance: 0.01,
                    explanation: `自由度 df = n₁ + n₂ - 2 = ${currentParams.n1} + ${currentParams.n2} - 2 = ${currentParams.df}`
                },
                {
                    number: 5,
                    title: "检验统计量的值（至少四舍五入到三位小数）",
                    correctAnswer: currentParams.tStatistic,
                    isNumerical: true,
                    tolerance: 0.01,
                    explanation: `<div class="formula">合并方差 s²p = [(n₁-1)s₁² + (n₂-1)s₂²] / (n₁+n₂-2)<br>t = (x̄₁ - x̄₂) / √[s²p(1/n₁ + 1/n₂)]<br>t ≈ <strong>${currentParams.tStatistic}</strong></div>`
                },
                {
                    number: 6,
                    title: `在 α = ${currentParams.alpha} 显著性水平下的临界值（至少四舍五入到三位小数）`,
                    correctAnswer: isTwoTailed
                        ? `${-currentParams.criticalValue} ${currentParams.criticalValue}`
                        : currentParams.criticalValue,
                    isNumerical: true,
                    tolerance: 0.01,
                    isTwoValue: isTwoTailed,  // 双尾检验需要填写两个临界值
                    explanation: isTwoTailed
                        ? `双尾检验，自由度 df = ${currentParams.df}，显著性水平 α = ${currentParams.alpha}。<div class="formula">临界值 = <span class="critical-value">${-currentParams.criticalValue}</span> 和 <span class="critical-value">${currentParams.criticalValue}</span></div>`
                        : `${testDir}检验，自由度 df = ${currentParams.df}，显著性水平 α = ${currentParams.alpha}。<div class="formula">临界值 = <span class="critical-value">${currentParams.criticalValue}</span></div>`
                },
                {
                    number: 7,
                    title: `我们能否拒绝原假设？`,
                    correctAnswer: currentParams.rejectNull,
                    options: [
                        { value: "是" },
                        { value: "否" }
                    ],
                    explanation: `检验统计量 t = ${currentParams.tStatistic}，临界值 = ${currentParams.criticalValue}。<div class="formula">${conclusionExplanation}</div>`
                }
            ];

            container.innerHTML = questions.map(q => {
                // 先洗牌选项内容，再按顺序分配ABCD字母
                const shuffledOptions = q.options ? shuffleArray(q.options).map((opt, i) => ({...opt, letter: String.fromCharCode(65 + i)})) : [];

                return `
                <div class="question-container" data-correct="${q.isNumerical ? q.correctAnswer : q.correctAnswer}" data-question="${q.number}" data-is-numerical="${q.isNumerical || false}" data-tolerance="${q.tolerance || 0}" data-is-two-value="${q.isTwoValue || false}">
                    <div class="question-title">
                        <span class="question-number">${q.number}</span>
                        <span>${q.title}</span>
                    </div>
                    ${q.isNumerical ? `
                        <div style="margin-top: 8px;">
                            <input type="text" class="fill-blank-input" data-question="${q.number}" placeholder="${q.isTwoValue ? '用空格分隔两个值，如：-2.037 2.037' : ''}">
                        </div>
                        <div class="feedback" id="feedback${q.number}"></div>
                    ` : `
                        <div class="options-container ${q.number === 7 ? 'options-container-2col' : ''}">
                            ${shuffledOptions.map(opt => `
                                <div class="option" data-value="${opt.value}" data-correct="${opt.value === q.correctAnswer}">
                                    <div class="option-letter">${opt.letter}</div>
                                    <div class="option-text">${opt.value}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="feedback" id="feedback${q.number}"></div>
                    `}
                </div>
            `}).join('');

            // 渲染合并的解析
            renderCombinedExplanation();

            // Add click events to options
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const questionContainer = this.closest('.question-container');
                    const allOptions = questionContainer.querySelectorAll('.option');

                    allOptions.forEach(opt => {
                        opt.classList.remove('selected');
                    });

                    this.classList.add('selected');
                    userAnswers[questionContainer.dataset.question] = this.dataset.value;

                    // 隐藏反馈
                    const feedback = questionContainer.querySelector('.feedback');
                    if (feedback) feedback.classList.remove('show', 'correct', 'incorrect');
                });
            });

            // Add input events for numerical inputs
            document.querySelectorAll('.fill-blank-input').forEach(input => {
                input.addEventListener('input', function() {
                    const questionContainer = this.closest('.question-container');
                    const questionNum = questionContainer.dataset.question;
                    userAnswers[questionNum] = this.value.trim();

                    // 隐藏反馈
                    const feedback = questionContainer.querySelector('.feedback');
                    if (feedback) feedback.classList.remove('show', 'correct', 'incorrect');
                    this.classList.remove('correct', 'incorrect');
                });
            });
        }

        function renderCombinedExplanation() {
            const testDir = currentParams.testDirection;
            const isRightTailed = testDir === "右尾";
            const isLeftTailed = testDir === "左尾";

            // 根据检验类型确定假设解释
            let h0Explanation, h1Explanation, conclusionExplanation;

            if (isRightTailed) {
                h0Explanation = '右尾检验中，原假设为 μ₁ ≤ μ₂ 或等价的 μ₁ - μ₂ ≤ 0。';
                h1Explanation = '右尾检验中，备择假设为 μ₁ > μ₂ 或等价的 μ₁ - μ₂ > 0。';
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 t = ${currentParams.tStatistic} > ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 t = ${currentParams.tStatistic} ≤ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            } else if (isLeftTailed) {
                h0Explanation = '左尾检验中，原假设为 μ₁ ≥ μ₂ 或等价的 μ₁ - μ₂ ≥ 0。';
                h1Explanation = '左尾检验中，备择假设为 μ₁ < μ₂ 或等价的 μ₁ - μ₂ < 0。';
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 t = ${currentParams.tStatistic} < ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 t = ${currentParams.tStatistic} ≥ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            } else {
                h0Explanation = '双尾检验中，原假设为 μ₁ = μ₂ 或等价的 μ₁ - μ₂ = 0。';
                h1Explanation = '双尾检验中，备择假设为 μ₁ ≠ μ₂ 或等价的 μ₁ - μ₂ ≠ 0。';
                conclusionExplanation = currentParams.rejectNull === "是"
                    ? `因为 |t| = ${Math.abs(currentParams.tStatistic)} > ${currentParams.criticalValue}，检验统计量落在拒绝域内，<strong>拒绝</strong>原假设。`
                    : `因为 |t| = ${Math.abs(currentParams.tStatistic)} ≤ ${currentParams.criticalValue}，检验统计量不在拒绝域内，<strong>不能拒绝</strong>原假设。`;
            }

            const questions = [
                { num: 1, title: "原假设 H₀", explanation: h0Explanation },
                { num: 2, title: "备择假设 H₁", explanation: h1Explanation },
                { num: 3, title: "检验统计量类型", explanation: `总体方差未知但相等，使用两独立样本t检验。` },
                { num: 4, title: "自由度", explanation: `<div class="formula">df = n₁ + n₂ - 2 = ${currentParams.n1} + ${currentParams.n2} - 2 = <strong>${currentParams.df}</strong></div>` },
                { num: 5, title: "检验统计量的值", explanation: `<div class="formula">合并方差 s²p = [(n₁-1)s₁² + (n₂-1)s₂²] / (n₁+n₂-2)<br>s²p = [(${currentParams.n1}-1)×${currentParams.s1}² + (${currentParams.n2}-1)×${currentParams.s2}²] / (${currentParams.n1}+${currentParams.n2}-2)<br>t = (x̄₁ - x̄₂) / √[s²p(1/n₁ + 1/n₂)]<br>t ≈ <strong>${currentParams.tStatistic}</strong></div>` },
                { num: 6, title: "临界值", explanation: isTwoTailed
                    ? `双尾检验，自由度 df = ${currentParams.df}，显著性水平 α = ${currentParams.alpha}。<div class="formula">临界值 = <span class="critical-value">${-currentParams.criticalValue}</span> 和 <span class="critical-value">${currentParams.criticalValue}</span></div>`
                    : `${testDir}检验，自由度 df = ${currentParams.df}，显著性水平 α = ${currentParams.alpha}。<div class="formula">临界值 = <span class="critical-value">${currentParams.criticalValue}</span></div>` },
                { num: 7, title: "结论", explanation: `检验统计量 t = ${currentParams.tStatistic}，临界值 = ${isTwoTailed ? -currentParams.criticalValue + ' 和 ' + currentParams.criticalValue : currentParams.criticalValue}。<div class="formula">${conclusionExplanation}</div>` }
            ];

            document.getElementById('combined-explanation-content').innerHTML = questions.map(q => `
                <div style="margin-bottom: 12px;">
                    <h5>${q.num}. ${q.title}</h5>
                    <p>${q.explanation}</p>
                </div>
            `).join('');
        }

        function updateHistoryDisplay() {
            if (quizHistory.length > 0) {
                let iconsHtml = '';
                quizHistory.forEach((result, index) => {
                    if (result) {
                        iconsHtml += `<div class="result-icon correct" title="第${index + 1}套：全对"><i class="fas fa-check"></i></div>`;
                    } else {
                        iconsHtml += `<div class="result-icon incorrect" title="第${index + 1}套：有错"><i class="fas fa-times"></i></div>`;
                    }
                });
                document.getElementById('result-icons').innerHTML = iconsHtml;
                document.getElementById('score-container').classList.add('show');
            } else {
                document.getElementById('score-container').classList.remove('show');
            }
        }

        // Submit button
        document.getElementById('submitBtn').addEventListener('click', function() {
            if (submitted) return;
            submitted = true;

            let score = 0;
            const totalQuestions = 7;

            document.querySelectorAll('.question-container').forEach((question) => {
                const correctAnswer = question.dataset.correct;
                const isNumerical = question.dataset.isNumerical === 'true';
                const tolerance = parseFloat(question.dataset.tolerance) || 0.01;
                const questionNum = question.dataset.question;
                const feedback = document.getElementById(`feedback${questionNum}`);

                if (isNumerical) {
                    const input = question.querySelector('.fill-blank-input');
                    const isTwoValue = question.dataset.isTwoValue === 'true';
                    const userAnswerStr = input.value.trim();

                    input.classList.remove('correct', 'incorrect');

                    if (isTwoValue) {
                        // 双值验证（双尾检验的临界值）
                        const userValues = userAnswerStr.split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
                        const correctValues = correctAnswer.split(/\s+/).map(v => parseFloat(v));

                        if (userValues.length === 2) {
                            // 检查两个值是否都正确（顺序可以互换）
                            const userSorted = userValues.sort((a, b) => a - b);
                            const correctSorted = correctValues.sort((a, b) => a - b);
                            const isCorrect = Math.abs(userSorted[0] - correctSorted[0]) <= tolerance &&
                                             Math.abs(userSorted[1] - correctSorted[1]) <= tolerance;

                            if (isCorrect) {
                                score++;
                                input.classList.add('correct');
                                feedback.textContent = '正确！';
                                feedback.className = 'feedback correct show';
                            } else {
                                input.classList.add('incorrect');
                                feedback.textContent = `不正确。正确答案是 ${correctAnswer}。`;
                                feedback.className = 'feedback incorrect show';
                            }
                        } else {
                            input.classList.add('incorrect');
                            feedback.textContent = `请输入两个临界值（用空格分隔）。正确答案是 ${correctAnswer}。`;
                            feedback.className = 'feedback incorrect show';
                        }
                    } else {
                        // 单值验证
                        const userAnswer = parseFloat(userAnswerStr);

                        if (!isNaN(userAnswer)) {
                            const isCorrect = Math.abs(userAnswer - parseFloat(correctAnswer)) <= tolerance;
                            if (isCorrect) {
                                score++;
                                input.classList.add('correct');
                                feedback.textContent = '正确！';
                                feedback.className = 'feedback correct show';
                            } else {
                                input.classList.add('incorrect');
                                feedback.textContent = `不正确。正确答案是 ${correctAnswer}。`;
                                feedback.className = 'feedback incorrect show';
                            }
                        } else {
                            feedback.textContent = `请输入答案。正确答案是 ${correctAnswer}。`;
                            feedback.className = 'feedback incorrect show';
                        }
                    }
                } else {
                    const selectedOption = question.querySelector('.option.selected');
                    const correctOption = question.querySelector('.option[data-correct="true"]');

                    question.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                    });

                    if (selectedOption) {
                        const isCorrect = selectedOption.dataset.correct === 'true';
                        if (isCorrect) {
                            score++;
                            selectedOption.classList.add('correct');
                            feedback.textContent = '正确！';
                            feedback.className = 'feedback correct show';
                        } else {
                            selectedOption.classList.add('incorrect');
                            if (correctOption) correctOption.classList.add('correct');
                            feedback.textContent = '不正确。';
                            feedback.className = 'feedback incorrect show';
                        }
                    } else {
                        if (correctOption) correctOption.classList.add('correct');
                        feedback.textContent = '请先选择一个答案！';
                        feedback.className = 'feedback incorrect show';
                    }
                }
            });

            // 记录历史
            const isAllCorrect = score === totalQuestions;
            quizHistory.push(isAllCorrect);

            // 更新分数显示
            document.getElementById('scoreValue').textContent = `${score}/${totalQuestions}`;
            document.getElementById('scoreMessage').textContent = isAllCorrect ? '太棒了！这套题全对了！' : `这套题答对了 ${score}/${totalQuestions} 道，继续加油！`;

            // 显示答案解析按钮
            document.getElementById('toggle-explanation-btn').classList.add('show');

            // 更新历史记录显示
            updateHistoryDisplay();
        });

        // Reset button
        document.getElementById('resetBtn').addEventListener('click', function() {
            refreshQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 显示/隐藏答案解析按钮
        document.getElementById('toggle-explanation-btn').addEventListener('click', function() {
            const explanation = document.getElementById('combined-explanation');
            if (explanation.classList.contains('show')) {
                explanation.classList.remove('show');
                this.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
            } else {
                explanation.classList.add('show');
                this.innerHTML = '<i class="fas fa-lightbulb"></i> 隐藏答案解析';
            }
        });

        // 初始化
        refreshQuestion();
    });
</script>
</body>
</html>
