<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切比雪夫定理与经验法则 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.5;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 i {
            color: #3498db;
        }

        .problem-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .problem-info p {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.1);
        }

        .question-text {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 0.95rem;
        }

        .fill-blank-input {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 100px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            font-size: 0.9rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 4px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 4px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #f39c12;
            font-size: 0.9rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .explanation h5 {
            color: #2980b9;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .explanation p {
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(52, 152, 219, 0.3);
        }

        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh-params-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .toggle-explanation-btn {
            display: none;
            margin: 15px auto;
            padding: 10px 24px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(155, 89, 182, 0.3);
        }

        .toggle-explanation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .toggle-explanation-btn.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .result-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .result-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .result-icon.correct {
            background-color: #2ecc71;
            color: white;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
            color: white;
        }

        .result-icon:hover {
            transform: scale(1.15);
        }

        .score-text {
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .score-text {
            font-size: 1rem;
            opacity: 0.9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 3px solid #3498db;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .options-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 12px;
            }

            .question-container {
                padding: 12px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bell-curve"></i> 切比雪夫定理与经验法则</h1>
        </header>

        <div class="problem-info" id="problem-info">
            <!-- 动态生成 -->
        </div>

        <!-- 问题 1 -->
        <div class="question-container" id="q1">
            <div class="question-text" id="question-text-1">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-1">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback1"></div>
        </div>

        <!-- 问题 2 -->
        <div class="question-container" id="q2">
            <div class="question-text" id="question-text-2">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-2">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback2"></div>
        </div>

        <!-- 问题 3 -->
        <div class="question-container" id="q3">
            <div class="question-text" id="question-text-3">
                <!-- 动态生成 -->
            </div>
            <div class="options-container" id="options-container-3">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback3"></div>
        </div>

        <!-- 问题 4 -->
        <div class="question-container" id="q4">
            <div class="question-text" id="question-text-4">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback4"></div>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="next-btn" class="refresh-params-btn">
                下一题 <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- 显示/隐藏答案解析按钮 -->
        <button id="toggle-explanation-btn" class="toggle-explanation-btn">
            <i class="fas fa-lightbulb"></i> 显示答案解析
        </button>

        <!-- 合并的答案解析区域 -->
        <div class="explanation" id="combined-explanation">
            <h4><i class="fas fa-calculator"></i> 答案解析</h4>
            <div id="combined-explanation-content">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="score-container" id="score-container">
            <div class="score-title">答题记录</div>
            <div class="result-icons" id="result-icons">
                <!-- 动态生成历史图标 -->
            </div>
            <div class="score-text" id="score-text"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                // 第1组
                {
                    context: "血压研究",
                    mean: 130.9,
                    std: 6.3,
                    unit: "mmHg",
                    q1: { k: 1.8, lower: 119.56, upper: 142.24, answer: 69 },
                    q2: { k: 2.2, lower: 117.04, upper: 144.76, answer: 79 },
                    q3: { k: 2, lower: 118.3, upper: 143.5, answer: 95 },
                    q4: { lower: 112.0, upper: 149.8 }
                },
                // 第2组
                {
                    context: "身高研究",
                    mean: 165.2,
                    std: 8.5,
                    unit: "cm",
                    q1: { k: 2.5, lower: 143.95, upper: 186.45, answer: 84 },
                    q2: { k: 1.6, lower: 151.6, upper: 178.8, answer: 61 },
                    q3: { k: 1, lower: 156.7, upper: 173.7, answer: 68 },
                    q4: { lower: 139.7, upper: 190.7 }
                },
                // 第3组
                {
                    context: "体重研究",
                    mean: 68.5,
                    std: 12.4,
                    unit: "kg",
                    q1: { k: 3.5, lower: 25.1, upper: 111.9, answer: 92 },
                    q2: { k: 1.4, lower: 51.14, upper: 85.86, answer: 49 },
                    q3: { k: 3, lower: 31.3, upper: 105.7, answer: 99.7 },
                    q4: { lower: 31.3, upper: 105.7 }
                },
                // 第4组
                {
                    context: "考试成绩",
                    mean: 75.0,
                    std: 10.0,
                    unit: "分",
                    q1: { k: 2.8, lower: 47.0, upper: 103.0, answer: 87 },
                    q2: { k: 1.2, lower: 63.0, upper: 87.0, answer: 31 },
                    q3: { k: 2, lower: 55.0, upper: 95.0, answer: 95 },
                    q4: { lower: 45.0, upper: 105.0 }
                },
                // 第5组
                {
                    context: "心率研究",
                    mean: 72.0,
                    std: 8.0,
                    unit: "bpm",
                    q1: { k: 4.0, lower: 40.0, upper: 104.0, answer: 94 },
                    q2: { k: 2.5, lower: 52.0, upper: 92.0, answer: 84 },
                    q3: { k: 1, lower: 64.0, upper: 80.0, answer: 68 },
                    q4: { lower: 48.0, upper: 96.0 }
                },
                // 第6组
                {
                    context: "血糖研究",
                    mean: 100.0,
                    std: 15.0,
                    unit: "mg/dL",
                    q1: { k: 1.6, lower: 76.0, upper: 124.0, answer: 61 },
                    q2: { k: 2.8, lower: 58.0, upper: 142.0, answer: 87 },
                    q3: { k: 2, lower: 70.0, upper: 130.0, answer: 95 },
                    q4: { lower: 55.0, upper: 145.0 }
                },
                // 第7组
                {
                    context: "睡眠时长研究",
                    mean: 7.5,
                    std: 1.2,
                    unit: "小时",
                    q1: { k: 2.2, lower: 4.86, upper: 10.14, answer: 79 },
                    q2: { k: 1.8, lower: 5.34, upper: 9.66, answer: 69 },
                    q3: { k: 2, lower: 5.1, upper: 9.9, answer: 95 },
                    q4: { lower: 3.9, upper: 11.1 }
                },
                // 第8组
                {
                    context: "智商研究",
                    mean: 100.0,
                    std: 15.0,
                    unit: "分",
                    q1: { k: 3.5, lower: 47.5, upper: 152.5, answer: 92 },
                    q2: { k: 1.4, lower: 79.0, upper: 121.0, answer: 49 },
                    q3: { k: 1, lower: 85.0, upper: 115.0, answer: 68 },
                    q4: { lower: 55.0, upper: 145.0 }
                },
                // 第9组
                {
                    context: "体温研究",
                    mean: 36.5,
                    std: 0.5,
                    unit: "°C",
                    q1: { k: 1.2, lower: 35.9, upper: 37.1, answer: 31 },
                    q2: { k: 4.0, lower: 34.5, upper: 38.5, answer: 94 },
                    q3: { k: 3, lower: 35.0, upper: 38.0, answer: 99.7 },
                    q4: { lower: 35.0, upper: 38.0 }
                },
                // 第10组
                {
                    context: "反应时间研究",
                    mean: 250.0,
                    std: 30.0,
                    unit: "ms",
                    q1: { k: 1.8, lower: 196.0, upper: 304.0, answer: 69 },
                    q2: { k: 3.5, lower: 145.0, upper: 355.0, answer: 92 },
                    q3: { k: 2, lower: 190.0, upper: 310.0, answer: 95 },
                    q4: { lower: 160.0, upper: 340.0 }
                },
                // 第11组
                {
                    context: "月收入研究",
                    mean: 8000.0,
                    std: 1500.0,
                    unit: "元",
                    q1: { k: 2.2, lower: 4700.0, upper: 11300.0, answer: 79 },
                    q2: { k: 1.6, lower: 5600.0, upper: 10400.0, answer: 61 },
                    q3: { k: 1, lower: 6500.0, upper: 9500.0, answer: 68 },
                    q4: { lower: 3500.0, upper: 12500.0 }
                },
                // 第12组
                {
                    context: "阅读速度研究",
                    mean: 250.0,
                    std: 40.0,
                    unit: "字/分钟",
                    q1: { k: 4.0, lower: 90.0, upper: 410.0, answer: 94 },
                    q2: { k: 1.2, lower: 202.0, upper: 298.0, answer: 31 },
                    q3: { k: 2, lower: 170.0, upper: 330.0, answer: 95 },
                    q4: { lower: 130.0, upper: 370.0 }
                }
            ];

            let currentParamIndex = 0;

            // 记录每套题目的正误历史
            let quizHistory = [];

            // 用户选择的答案
            let userAnswers = {
                1: null,
                2: null,
                3: null,
                4: { lower: null, upper: null }
            };

            // Fisher-Yates 洗牌算法
            function shuffleArray(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // 切比雪夫定理所有可能的答案（基于不同k值）
            const chebyshevAnswers = [31, 44, 49, 56, 61, 69, 75, 79, 84, 87, 89, 92, 94];
            // 经验法则的答案
            const empiricalAnswers = [68, 95, 99.7];

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染问题背景
                document.getElementById('problem-info').innerHTML = `
                    <p><strong>问题背景：</strong>某项${params.context}报告称测量值的平均值为 <span class="highlight">${params.mean} ${params.unit}</span>，标准差为 <span class="highlight">${params.std} ${params.unit}</span>。</p>
                    <p>假设报告的信息是正确的，请完成以下关于测量值分布的陈述。</p>
                `;

                // 渲染问题1
                document.getElementById('question-text-1').innerHTML = `
                    <p>(a) 根据切比雪夫定理，至少有 _____% 的测量值位于 ${params.q1.lower} ${params.unit} 和 ${params.q1.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(1, params.q1.answer);

                // 渲染问题2
                document.getElementById('question-text-2').innerHTML = `
                    <p>(b) 根据切比雪夫定理，至少有 _____% 的测量值位于 ${params.q2.lower} ${params.unit} 和 ${params.q2.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(2, params.q2.answer);

                // 渲染问题3
                document.getElementById('question-text-3').innerHTML = `
                    <p>(c) 假设分布呈钟形。根据经验法则，大约有 _____% 的测量值位于 ${params.q3.lower} ${params.unit} 和 ${params.q3.upper} ${params.unit} 之间。</p>
                `;
                renderOptions(3, params.q3.answer);

                // 渲染问题4 - 填空题
                document.getElementById('question-text-4').innerHTML = `
                    <p>(d) 假设分布呈钟形。根据经验法则，大约 99.7% 的测量值位于 _____${params.unit} 和 _____${params.unit} 之间。</p>
                    <div style="display: flex; align-items: center; gap: 15px; margin-top: 12px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span>下限：</span>
                            <input type="number" step="0.1" id="lower-bound" class="fill-blank-input">
                            <span>${params.unit}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span>上限：</span>
                            <input type="number" step="0.1" id="upper-bound" class="fill-blank-input">
                            <span>${params.unit}</span>
                        </div>
                    </div>
                `;

                // 渲染解析
                renderExplanations(params);

                // 重置用户答案
                userAnswers = {
                    1: null,
                    2: null,
                    3: null,
                    4: { lower: null, upper: null }
                };

                // 清除反馈
                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`feedback${i}`).classList.remove('show', 'correct', 'incorrect');
                }

                // 清除选项状态
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                });

                // 隐藏合并的解析区域
                document.getElementById('combined-explanation').classList.remove('show');

                // 隐藏答案解析按钮
                const toggleBtn = document.getElementById('toggle-explanation-btn');
                toggleBtn.classList.remove('show');
                toggleBtn.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';

                // 更新历史记录显示（如果有历史）
                if (quizHistory.length > 0) {
                    let iconsHtml = '';
                    quizHistory.forEach((result, index) => {
                        if (result) {
                            iconsHtml += `<div class="result-icon correct" title="第${index + 1}套：全对"><i class="fas fa-check"></i></div>`;
                        } else {
                            iconsHtml += `<div class="result-icon incorrect" title="第${index + 1}套：有错"><i class="fas fa-times"></i></div>`;
                        }
                    });
                    document.getElementById('result-icons').innerHTML = iconsHtml;
                    document.getElementById('score-text').textContent = `已完成 ${quizHistory.length} 套题目`;
                    document.getElementById('score-container').classList.add('show');
                }

                // 启用提交按钮
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.style.cursor = 'pointer';

                // 绑定事件
                bindEvents();
            }

            function renderOptions(questionNum, correctAnswer) {
                let allAnswers;
                if (questionNum === 3) {
                    // 问题3是经验法则
                    allAnswers = [...empiricalAnswers, 89];
                } else {
                    // 问题1和2是切比雪夫定理
                    allAnswers = [...chebyshevAnswers];
                }

                // 从所有答案中选择正确答案和3个干扰选项
                let options = [{ value: correctAnswer, text: correctAnswer + '%', isCorrect: true }];

                // 过滤掉正确答案，然后随机选择3个干扰项
                let distractors = allAnswers.filter(a => a !== correctAnswer);
                distractors = shuffleArray(distractors).slice(0, 3);

                distractors.forEach(d => {
                    options.push({ value: d, text: d + '%', isCorrect: false });
                });

                // 随机打乱选项顺序
                options = shuffleArray(options);

                const container = document.getElementById(`options-container-${questionNum}`);
                container.innerHTML = options.map((opt, index) => `
                    <div class="option" data-question="${questionNum}" data-value="${opt.value}" data-option="${String.fromCharCode(97 + index)}">
                        <div class="option-letter">${String.fromCharCode(65 + index)}</div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `).join('');
            }

            function renderExplanations(params) {
                // 问题1解析
                const k1 = params.q1.k;
                const k1Squared = k1 * k1;
                const answer1 = Math.round((1 - 1/k1Squared) * 100);

                // 问题2解析
                const k2 = params.q2.k;
                const k2Squared = k2 * k2;
                const answer2 = Math.round((1 - 1/k2Squared) * 100);

                // 问题3解析
                const k3 = params.q3.k;
                let empiricalDesc;
                if (k3 === 1) {
                    empiricalDesc = "68%";
                } else if (k3 === 2) {
                    empiricalDesc = "95%";
                } else {
                    empiricalDesc = "99.7%";
                }

                // 合并所有解析到一个区域
                document.getElementById('combined-explanation-content').innerHTML = `
                    <div style="margin-bottom: 18px;">
                        <h5>(a) 切比雪夫定理</h5>
                        <p>已知均值 μ = ${params.mean}，标准差 σ = ${params.std}。</p>
                        <p>计算k值：(${params.mean} - ${params.q1.lower}) / ${params.std} = ${k1}</p>
                        <div class="formula">
                            100(1 - 1/${k1}²)% = 100(1 - 1/${k1Squared})% = 100 × ${(1 - 1/k1Squared).toFixed(4)}% ≈ ${answer1}%
                        </div>
                        <p><strong>答案：${answer1}%</strong></p>
                    </div>

                    <div style="margin-bottom: 18px;">
                        <h5>(b) 切比雪夫定理</h5>
                        <p>计算k值：(${params.mean} - ${params.q2.lower}) / ${params.std} = ${k2}</p>
                        <div class="formula">
                            100(1 - 1/${k2}²)% = 100(1 - 1/${k2Squared})% = 100 × ${(1 - 1/k2Squared).toFixed(4)}% ≈ ${answer2}%
                        </div>
                        <p><strong>答案：${answer2}%</strong></p>
                    </div>

                    <div style="margin-bottom: 18px;">
                        <h5>(c) 经验法则</h5>
                        <p>${params.q3.lower}和${params.q3.upper}分别位于均值下方和上方${k3}个标准差处。</p>
                        <p>根据经验法则，对于钟形分布：</p>
                        <div class="formula">
                            <strong>大约${empiricalDesc}的测量值位于均值${k3}个标准差范围内</strong>
                        </div>
                        <p><strong>答案：${empiricalDesc}</strong></p>
                    </div>

                    <div>
                        <h5>(d) 经验法则</h5>
                        <p>根据经验法则，大约99.7%的测量值位于均值3个标准差范围内。</p>
                        <div class="formula">
                            下限：${params.mean} - 3 × ${params.std} = ${params.q4.lower} ${params.unit}<br>
                            上限：${params.mean} + 3 × ${params.std} = ${params.q4.upper} ${params.unit}
                        </div>
                        <p><strong>答案：${params.q4.lower} 和 ${params.q4.upper}</strong></p>
                    </div>
                `;
            }

            function bindEvents() {
                // 选项点击事件
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionNum = this.getAttribute('data-question');
                        const answerValue = parseFloat(this.getAttribute('data-value'));

                        // 清除同一问题的其他选项的选择状态
                        document.querySelectorAll(`.option[data-question="${questionNum}"]`).forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 设置当前选项为选中状态
                        this.classList.add('selected');

                        // 保存用户答案（存储答案值而非选项字母）
                        userAnswers[questionNum] = answerValue;

                        // 隐藏之前的反馈
                        document.getElementById(`feedback${questionNum}`).classList.remove('show', 'correct', 'incorrect');
                    });
                });

                // 第四题输入框事件
                const lowerInput = document.getElementById('lower-bound');
                const upperInput = document.getElementById('upper-bound');

                if (lowerInput) {
                    lowerInput.addEventListener('input', function() {
                        userAnswers[4].lower = parseFloat(this.value);
                        document.getElementById('feedback4').classList.remove('show', 'correct', 'incorrect');
                    });
                }

                if (upperInput) {
                    upperInput.addEventListener('input', function() {
                        userAnswers[4].upper = parseFloat(this.value);
                        document.getElementById('feedback4').classList.remove('show', 'correct', 'incorrect');
                    });
                }
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 下一题按钮
            document.getElementById('next-btn').addEventListener('click', refreshParams);

            // 显示/隐藏答案解析按钮
            document.getElementById('toggle-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('combined-explanation');
                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                } else {
                    explanation.classList.add('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 隐藏答案解析';
                }
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                // 检查是否所有题目都已完成
                let allAnswered = true;
                let unansweredQuestions = [];

                // 检查第1-3题（选择题）
                for (let i = 1; i <= 3; i++) {
                    if (userAnswers[i] === null) {
                        allAnswered = false;
                        unansweredQuestions.push(i);
                        const feedbackEl = document.getElementById(`feedback${i}`);
                        feedbackEl.textContent = '请先选择一个答案！';
                        feedbackEl.className = 'feedback incorrect';
                        feedbackEl.classList.add('show');
                    }
                }

                // 检查第4题（填空题）
                if (userAnswers[4].lower === null || userAnswers[4].upper === null) {
                    allAnswered = false;
                    unansweredQuestions.push(4);
                    const feedbackEl = document.getElementById('feedback4');
                    feedbackEl.textContent = '请填写下限和上限值！';
                    feedbackEl.className = 'feedback incorrect';
                    feedbackEl.classList.add('show');
                }

                // 如果有未完成的题目，不允许提交
                if (!allAnswered) {
                    const firstUnanswered = unansweredQuestions[0];
                    document.getElementById(`q${firstUnanswered}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }

                const params = questionParams[currentParamIndex];
                let score = 0;
                const totalQuestions = 4;
                const questionResults = {}; // 记录每道题的对错结果

                const correctAnswers = {
                    1: params.q1.answer,
                    2: params.q2.answer,
                    3: params.q3.answer,
                    4: params.q4
                };

                // 检查前3题
                for (let i = 1; i <= 3; i++) {
                    const userAnswer = userAnswers[i];
                    const correctAnswer = correctAnswers[i];
                    const feedbackEl = document.getElementById(`feedback${i}`);
                    const options = document.querySelectorAll(`.option[data-question="${i}"]`);

                    // 清除之前的正确/错误状态
                    options.forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                    });

                    if (userAnswer === correctAnswer) {
                        score++;
                        questionResults[i] = true;
                        feedbackEl.textContent = '正确！';
                        feedbackEl.className = 'feedback correct';
                        const correctOption = document.querySelector(`.option[data-question="${i}"][data-value="${correctAnswer}"]`);
                        if (correctOption) correctOption.classList.add('correct');
                    } else {
                        questionResults[i] = false;
                        const userOption = document.querySelector(`.option[data-question="${i}"][data-value="${userAnswer}"]`);
                        if (userOption) userOption.classList.add('incorrect');
                        const correctOption = document.querySelector(`.option[data-question="${i}"][data-value="${correctAnswer}"]`);
                        if (correctOption) correctOption.classList.add('correct');
                        feedbackEl.textContent = `不正确。正确答案是 ${correctAnswer}%。`;
                        feedbackEl.className = 'feedback incorrect';
                    }

                    feedbackEl.classList.add('show');
                }

                // 检查第4题
                const feedback4 = document.getElementById('feedback4');
                const lowerInput = document.getElementById('lower-bound');
                const upperInput = document.getElementById('upper-bound');
                const tolerance = 0.5;

                const lowerCorrect = Math.abs(userAnswers[4].lower - correctAnswers[4].lower) <= tolerance;
                const upperCorrect = Math.abs(userAnswers[4].upper - correctAnswers[4].upper) <= tolerance;

                lowerInput.classList.remove('correct', 'incorrect');
                upperInput.classList.remove('correct', 'incorrect');
                lowerInput.classList.add(lowerCorrect ? 'correct' : 'incorrect');
                upperInput.classList.add(upperCorrect ? 'correct' : 'incorrect');

                if (lowerCorrect && upperCorrect) {
                    score++;
                    questionResults[4] = true;
                    feedback4.textContent = '正确！';
                    feedback4.className = 'feedback correct';
                } else {
                    questionResults[4] = false;
                    feedback4.textContent = `不正确。正确答案是 ${correctAnswers[4].lower} 和 ${correctAnswers[4].upper}。`;
                    feedback4.className = 'feedback incorrect';
                }

                feedback4.classList.add('show');

                // 显示答案解析按钮
                const toggleBtn = document.getElementById('toggle-explanation-btn');
                toggleBtn.classList.add('show');
                toggleBtn.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                document.getElementById('combined-explanation').classList.remove('show');

                // 显示答题结果图标
                const scoreContainer = document.getElementById('score-container');
                const resultIcons = document.getElementById('result-icons');
                const scoreText = document.getElementById('score-text');

                // 记录这套题目的结果到历史
                const isCorrect = (score === totalQuestions);
                quizHistory.push(isCorrect);

                // 显示所有历史记录图标
                let iconsHtml = '';
                quizHistory.forEach((result, index) => {
                    if (result) {
                        iconsHtml += `<div class="result-icon correct" title="第${index + 1}套：全对"><i class="fas fa-check"></i></div>`;
                    } else {
                        iconsHtml += `<div class="result-icon incorrect" title="第${index + 1}套：有错"><i class="fas fa-times"></i></div>`;
                    }
                });
                resultIcons.innerHTML = iconsHtml;

                let message = '';
                if (isCorrect) {
                    message = '太棒了！这套题全对了！';
                } else {
                    message = `这套题答对了 ${score}/${totalQuestions} 道，继续加油！`;
                }

                scoreText.textContent = message;
                scoreContainer.classList.add('show');

                // 禁用提交按钮
                this.disabled = true;
                this.style.opacity = '0.6';
                this.style.cursor = 'not-allowed';

                scoreContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
