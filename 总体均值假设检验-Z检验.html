<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值假设检验 Z检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.5;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 i {
            color: #3498db;
        }

        .problem-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .problem-info p {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #1565c0;
        }

        .question-container {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            transition: all 0.3s ease;
        }

        .question-container:hover {
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.1);
        }

        .question-title {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .options-container-2col {
            grid-template-columns: repeat(2, 1fr);
        }

        /* 问题1和2有8个选项，使用2列布局 */
        .options-container.cols-8 {
            grid-template-columns: repeat(4, 1fr);
        }

        .option {
            background-color: white;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
            border-color: #3498db;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .option.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .option-letter {
            background-color: #3498db;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background-color: #2ecc71;
        }

        .option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-text {
            font-size: 0.9rem;
        }

        .fill-blank-input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 150px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .fill-blank-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .feedback {
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            font-size: 0.9rem;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 4px solid #2ecc71;
            color: #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 4px solid #e74c3c;
            color: #c0392b;
        }

        .feedback.show {
            display: block;
        }

        .explanation {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #f39c12;
            font-size: 0.9rem;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .explanation h5 {
            color: #2980b9;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .explanation p {
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(52, 152, 219, 0.3);
        }

        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh-params-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .toggle-explanation-btn {
            display: none;
            margin: 15px auto;
            padding: 10px 24px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(155, 89, 182, 0.3);
        }

        .toggle-explanation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .toggle-explanation-btn.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-container {
            text-align: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .result-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .result-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .result-icon.correct {
            background-color: #2ecc71;
            color: white;
        }

        .result-icon.incorrect {
            background-color: #e74c3c;
            color: white;
        }

        .result-icon:hover {
            transform: scale(1.15);
        }

        .score-text {
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .score-text {
            font-size: 1rem;
            opacity: 0.9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            font-family: 'Cambria', 'Times New Roman', serif;
            border-left: 3px solid #3498db;
            font-size: 0.9rem;
        }

        .critical-value {
            display: inline-block;
            padding: 3px 8px;
            background-color: #f1c40f;
            border-radius: 4px;
            margin: 0 3px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .options-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .options-container-2col {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 12px;
            }

            .question-container {
                padding: 12px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .fill-blank-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 总体均值假设检验：Z检验</h1>
        </header>

        <div class="problem-info" id="problem-info">
            <!-- 动态生成 -->
        </div>

        <!-- 问题 1 -->
        <div class="question-container" id="q1">
            <div class="question-title">
                <span class="question-number">1</span>
                <span>原假设：H₀</span>
            </div>
            <div class="question-text" id="question-text-1">
                <p>选择正确的原假设表达式：</p>
            </div>
            <div class="options-container" id="options-container-1">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback1"></div>
        </div>

        <!-- 问题 2 -->
        <div class="question-container" id="q2">
            <div class="question-title">
                <span class="question-number">2</span>
                <span>备择假设：H₁</span>
            </div>
            <div class="question-text" id="question-text-2">
                <p>选择正确的备择假设表达式：</p>
            </div>
            <div class="options-container" id="options-container-2">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback2"></div>
        </div>

        <!-- 问题 3 -->
        <div class="question-container" id="q3">
            <div class="question-title">
                <span class="question-number">3</span>
                <span>检验统计量的类型</span>
            </div>
            <div class="question-text" id="question-text-3">
                <p>选择正确的检验统计量类型：</p>
            </div>
            <div class="options-container" id="options-container-3">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback3"></div>
        </div>

        <!-- 问题 4 -->
        <div class="question-container" id="q4">
            <div class="question-title">
                <span class="question-number">4</span>
                <span>检验统计量的值</span>
            </div>
            <div class="question-text" id="question-text-4">
                <p>计算检验统计量的值（至少四舍五入到三位小数）：</p>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
                    <input type="text" id="answer-4" class="fill-blank-input">
                </div>
            </div>
            <div class="feedback" id="feedback4"></div>
        </div>

        <!-- 问题 5 -->
        <div class="question-container" id="q5">
            <div class="question-title">
                <span class="question-number">5</span>
                <span id="question-title-5">临界值</span>
            </div>
            <div class="question-text" id="question-text-5">
                <p>输入临界值（至少四舍五入到三位小数）。如果有两个临界值，用空格隔开：</p>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
                    <span>临界值：</span>
                    <input type="text" id="answer-5" class="fill-blank-input" style="width: 200px;">
                </div>
            </div>
            <div class="feedback" id="feedback5"></div>
        </div>

        <!-- 问题 6 -->
        <div class="question-container" id="q6">
            <div class="question-title">
                <span class="question-number">6</span>
                <span id="question-title-6">结论</span>
            </div>
            <div class="question-text" id="question-text-6">
                <p id="question-6-text">我们能否拒绝研究者的说法？</p>
            </div>
            <div class="options-container options-container-2col" id="options-container-6">
                <!-- 动态生成 -->
            </div>
            <div class="feedback" id="feedback6"></div>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="next-btn" class="refresh-params-btn">
                下一题 <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- 显示/隐藏答案解析按钮 -->
        <button id="toggle-explanation-btn" class="toggle-explanation-btn">
            <i class="fas fa-lightbulb"></i> 显示答案解析
        </button>

        <!-- 合并的答案解析区域 -->
        <div class="explanation" id="combined-explanation">
            <h4><i class="fas fa-calculator"></i> 答案解析</h4>
            <div id="combined-explanation-content">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="score-container" id="score-container">
            <div class="score-title">答题记录</div>
            <div class="result-icons" id="result-icons">
                <!-- 动态生成历史图标 -->
            </div>
            <div class="score-text" id="score-text"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 单侧检验临界值: α=0.1 → ±1.282, α=0.05 → ±1.645, α=0.01 → ±2.326
            const questionParams = [
                // ===== 左侧检验 (7组) =====
                {
                    mu0: 32, n: 70, xbar: 31, sigma: 3, alpha: 0.05,
                    zValue: -2.789, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '任务完成时间', unit: '分钟',
                    context: '某公司声称员工完成某项特定任务的平均时间至少为32分钟。有观点认为实际时间更短。为了检验这一说法，随机抽取70名员工独立完成该任务。'
                },
                {
                    mu0: 50, n: 100, xbar: 48, sigma: 8, alpha: 0.05,
                    zValue: -2.500, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '产品重量', unit: '克',
                    context: '某工厂声称其生产的某种产品的平均重量至少为50克。有投诉称产品重量不足。为了检验这一说法，随机抽取100件产品进行称重。'
                },
                {
                    mu0: 200, n: 64, xbar: 195, sigma: 20, alpha: 0.05,
                    zValue: -2.000, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '日产量', unit: '件',
                    context: '某工厂声称其日均产量至少为200件。有观点认为实际产量更低。为了检验这一说法，随机记录64个工作日的产量数据。'
                },
                {
                    mu0: 500, n: 36, xbar: 490, sigma: 30, alpha: 0.05,
                    zValue: -2.000, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '电池寿命', unit: '小时',
                    context: '某品牌声称其电池的平均寿命至少为500小时。有用户反映电池寿命不达标。为了检验这一说法，随机抽取36节电池进行寿命测试。'
                },
                {
                    mu0: 1000, n: 49, xbar: 980, sigma: 50, alpha: 0.05,
                    zValue: -2.800, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '灯泡寿命', unit: '小时',
                    context: '某品牌声称其灯泡的平均寿命至少为1000小时。有消费者质疑这一说法。为了检验这一说法，随机抽取49个灯泡进行寿命测试。'
                },
                {
                    mu0: 50, n: 100, xbar: 49.5, sigma: 2, alpha: 0.05,
                    zValue: -2.500, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '零件长度', unit: '毫米',
                    context: '某工厂声称其生产的零件平均长度至少为50毫米。有客户投诉零件偏短。为了检验这一说法，随机抽取100个零件进行长度测量。'
                },
                {
                    mu0: 150, n: 81, xbar: 143, sigma: 25, alpha: 0.05,
                    zValue: -2.521, criticalValue: -1.645, reject: true, testType: 'left',
                    description: '商品价格', unit: '元',
                    context: '某零售商声称某商品的平均售价不低于150元。有调查认为实际价格更低。为了检验这一说法，随机调查81家商店该商品的售价。'
                },
                // ===== 右侧检验 (7组) =====
                {
                    mu0: 170, n: 50, xbar: 173, sigma: 8, alpha: 0.05,
                    zValue: 2.652, criticalValue: 1.645, reject: true, testType: 'right',
                    description: '身高', unit: '厘米',
                    context: '某地区声称该地区成年男性的平均身高不超过170厘米。有观点认为实际身高更高。为了检验这一说法，随机抽取50名成年男性进行身高测量。'
                },
                {
                    mu0: 50, n: 25, xbar: 52, sigma: 4, alpha: 0.05,
                    zValue: 2.500, criticalValue: 1.645, reject: true, testType: 'right',
                    description: '含糖量', unit: '克',
                    context: '某品牌声称其每瓶饮料的平均含糖量不超过50克。有消费者认为含糖量超标。为了检验这一说法，随机抽取25瓶饮料进行含糖量检测。'
                },
                {
                    mu0: 200, n: 64, xbar: 205, sigma: 15, alpha: 0.01,
                    zValue: 2.667, criticalValue: 2.326, reject: true, testType: 'right',
                    description: '有效成分含量', unit: '毫克',
                    context: '某药厂声称其生产的药片中有效成分的平均含量不超过200毫克。有质疑认为含量超标。为了检验这一说法，随机抽取64片药片进行检测。'
                },
                {
                    mu0: 75, n: 36, xbar: 78, sigma: 6, alpha: 0.05,
                    zValue: 3.000, criticalValue: 1.645, reject: true, testType: 'right',
                    description: '体重', unit: '公斤',
                    context: '某运动队声称其运动员的平均体重不超过75公斤。有观点认为体重超标。为了检验这一说法，随机抽取36名运动员进行体重测量。'
                },
                {
                    mu0: 10, n: 36, xbar: 10.3, sigma: 1.2, alpha: 0.05,
                    zValue: 1.500, criticalValue: 1.645, reject: false, testType: 'right',
                    description: '油耗', unit: '升/百公里',
                    context: '某汽车制造商声称某款车型的平均油耗不超过10升/百公里。有用户认为油耗更高。为了检验这一说法，随机选取36辆车进行油耗测试。'
                },
                {
                    mu0: 35, n: 50, xbar: 36, sigma: 8, alpha: 0.05,
                    zValue: 0.884, criticalValue: 1.645, reject: false, testType: 'right',
                    description: '年龄', unit: '岁',
                    context: '某公司声称其员工的平均年龄不超过35岁。有观点认为员工年龄偏大。为了检验这一说法，随机抽取50名员工的年龄数据。'
                },
                {
                    mu0: 8, n: 81, xbar: 8.2, sigma: 1.5, alpha: 0.05,
                    zValue: 1.200, criticalValue: 1.645, reject: false, testType: 'right',
                    description: '睡眠时间', unit: '小时',
                    context: '某学校声称其学生每天的平均睡眠时间不超过8小时。有家长认为孩子睡眠时间更长。为了检验这一说法，随机调查81名学生的睡眠时间。'
                },

                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {

                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;

            function renderExplanations(params) {
                // 根据检验类型生成不同的解析
                let h0Text, h0Symbol, h1Text, h1Symbol, criticalText, rejectExplanation;

                if (params.testType === 'two-tailed') {
                    h0Text = `对于双尾检验，原假设是研究者声称的内容，即总体均值等于${params.mu0}${params.unit}。`;
                    h0Symbol = `H₀: μ = ${params.mu0}`;
                    h1Text = `备择假设是原假设的对立面。由于执行双尾检验，我们需要检验均值是否不等于${params.mu0}${params.unit}。`;
                    h1Symbol = `H₁: μ ≠ ${params.mu0}`;
                    criticalText = `对于双尾检验，显著性水平 α = ${params.alpha}，所以 α/2 = ${params.alpha / 2}。我们需要找到标准正态分布中两侧面积各为${params.alpha / 2}的z值。`;
                    if (params.reject) {
                        rejectExplanation = `由于 |Z| = ${Math.abs(params.zValue).toFixed(3)} > ${params.criticalValues[1]}，检验统计量落在拒绝域内，因此我们<strong>拒绝</strong>原假设。`;
                    } else {
                        rejectExplanation = `由于 |Z| = ${Math.abs(params.zValue).toFixed(3)} < ${params.criticalValues[1]}，检验统计量不在拒绝域内，因此我们<strong>不能拒绝</strong>原假设。`;
                    }
                } else if (params.testType === 'left') {
                    h0Text = `对于左尾检验，原假设是研究者声称的内容，即总体均值不小于${params.mu0}${params.unit}。`;
                    h0Symbol = `H₀: μ ≥ ${params.mu0}`;
                    h1Text = `备择假设是原假设的对立面。由于执行左尾检验，我们需要检验均值是否小于${params.mu0}${params.unit}。`;
                    h1Symbol = `H₁: μ < ${params.mu0}`;
                    criticalText = `对于左尾检验，显著性水平 α = ${params.alpha}。我们需要找到标准正态分布中左侧面积为${params.alpha}的z值。`;

                        rejectExplanation = `由于 Z = ${params.zValue.toFixed(3)} < ${params.criticalValue}，检验统计量落在拒绝域内，因此我们<strong>拒绝</strong>原假设。`;
                    } else {
                        rejectExplanation = `由于 Z = ${params.zValue.toFixed(3)} > ${params.criticalValue}，检验统计量不在拒绝域内，因此我们<strong>不能拒绝</strong>原假设。`;
                    }
                } else { // right
                    h0Text = `对于右尾检验，原假设是研究者声称的内容，即总体均值不大于${params.mu0}${params.unit}。`;
                    h0Symbol = `H₀: μ ≤ ${params.mu0}`;
                    h1Text = `备择假设是原假设的对立面。由于执行右尾检验，我们需要检验均值是否大于${params.mu0}${params.unit}。`;
                    h1Symbol = `H₁: μ > ${params.mu0}`;
                    criticalText = `对于右尾检验，显著性水平 α = ${params.alpha}。我们需要找到标准正态分布中右侧面积为${params.alpha}的z值。`;

                        rejectExplanation = `由于 Z = ${params.zValue.toFixed(3)} > ${params.criticalValue}，检验统计量落在拒绝域内，因此我们<strong>拒绝</strong>原假设。`;
                    } else {
                        rejectExplanation = `由于 Z = ${params.zValue.toFixed(3)} < ${params.criticalValue}，检验统计量不在拒绝域内，因此我们<strong>不能拒绝</strong>原假设。`;
                    }
                }

                // 临界值显示
                let criticalValueDisplay;
                if (params.testType === 'two-tailed') {

                } else {
                    criticalValueDisplay = `临界值为 <span class="critical-value">${params.criticalValue}</span>`;
                }

                // 结论中的临界值显示
                let conclusionCritical;
                if (params.testType === 'two-tailed') {
                    conclusionCritical = `${params.criticalValues[0]} 和 ${params.criticalValues[1]}`;
                } else {
                    conclusionCritical = params.criticalValue.toString();
                }

                document.getElementById('combined-explanation-content').innerHTML = `
                    <div style="margin-bottom: 18px;">
                        <h5>1. 原假设 H₀</h5>

                    <div style="margin-bottom: 18px;">

                        <div class="formula"><strong>${h1Symbol}</strong></div>
                    </div>

                    <div style="margin-bottom: 18px;">
                        <h5>3. 检验统计量类型</h5>
                        <p>由于样本量 (n = ${params.n}) 和总体标准差 (σ = ${params.sigma}) 已知，我们使用 <strong>Z 检验统计量</strong>。</p>
                    </div>

                    <div style="margin-bottom: 18px;">
                        <h5>4. 检验统计量的值</h5>
                        <p>计算过程：</p>

                            Z = (${params.xbar} - ${params.mu0}) / (${params.sigma}/√${params.n})<br>
                            Z = ${params.xbar - params.mu0} / ${(params.sigma / Math.sqrt(params.n)).toFixed(4)}<br>
                            Z ≈ <strong>${params.zValue.toFixed(3)}</strong>
                        </div>
                    </div>

                    <div style="margin-bottom: 18px;">
                        <h5>5. 临界值</h5>

                        <div class="formula">${criticalValueDisplay}</div>
                    </div>

                    <div>
                        <h5>6. 结论</h5>
                        <p>检验统计量 Z = ${params.zValue.toFixed(3)}，临界值为 ${conclusionCritical}。</p>
                        <div class="formula">${rejectExplanation}</div>
                        <p>结论：${params.reject
                            ? `有足够的证据在 ${params.alpha} 的显著性水平下拒绝关于平均${params.description}为 ${params.mu0} ${params.unit}的说法。`
                            : `没有足够的证据在 ${params.alpha} 的显著性水平下拒绝关于平均${params.description}为 ${params.mu0} ${params.unit}的说法。`
                        }</p>
                    </div>
                `;
            }

            function updateHistoryDisplay() {
                if (quizHistory.length > 0) {
                    let iconsHtml = '';
                    quizHistory.forEach((result, index) => {
                        if (result) {
                            iconsHtml += `<div class="result-icon correct" title="第${index + 1}套：全对"><i class="fas fa-check"></i></div>`;
                        } else {
                            iconsHtml += `<div class="result-icon incorrect" title="第${index + 1}套：有错"><i class="fas fa-times"></i></div>`;
                        }
                    });
                    document.getElementById('result-icons').innerHTML = iconsHtml;
                    document.getElementById('score-text').textContent = `已完成 ${quizHistory.length} 套题目`;
                    document.getElementById('score-container').classList.add('show');
                } else {
                    document.getElementById('score-container').classList.remove('show');
                }
            }

            function bindEvents() {
                // 选项点击事件
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionNum = this.getAttribute('data-question');
                        const answerValue = this.getAttribute('data-value');

                        // 清除同一问题的其他选项的选择状态
                        document.querySelectorAll(`.option[data-question="${questionNum}"]`).forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 设置当前选项为选中状态
                        this.classList.add('selected');

                        // 保存用户答案
                        userAnswers[questionNum] = answerValue;

                        // 隐藏之前的反馈
                        document.getElementById(`feedback${questionNum}`).classList.remove('show', 'correct', 'incorrect');
                    });
                });

                // 输入框事件
                const answer4 = document.getElementById('answer-4');
                const answer5 = document.getElementById('answer-5');

                if (answer4) {
                    answer4.addEventListener('input', function() {
                        userAnswers[4] = this.value.trim();
                        this.classList.remove('correct', 'incorrect');
                        document.getElementById('feedback4').classList.remove('show', 'correct', 'incorrect');
                    });
                }

                if (answer5) {
                    answer5.addEventListener('input', function() {
                        userAnswers[5] = this.value.trim();
                        this.classList.remove('correct', 'incorrect');
                        document.getElementById('feedback5').classList.remove('show', 'correct', 'incorrect');
                    });
                }
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 下一题按钮
            document.getElementById('next-btn').addEventListener('click', refreshParams);

            // 显示/隐藏答案解析按钮
            document.getElementById('toggle-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('combined-explanation');
                if (explanation.classList.contains('show')) {
                    explanation.classList.remove('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                } else {
                    explanation.classList.add('show');
                    this.innerHTML = '<i class="fas fa-lightbulb"></i> 隐藏答案解析';
                }
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const params = questionParams[currentParamIndex];
                let score = 0;
                const totalQuestions = 6;
                const questionResults = {};

                // 检查第1-3题和第6题（选择题）
                for (let i = 1; i <= 6; i++) {
                    if (i === 4 || i === 5) continue;

                    const options = document.querySelectorAll(`.option[data-question="${i}"]`);
                    const feedbackEl = document.getElementById(`feedback${i}`);
                    const correctOption = document.querySelector(`.option[data-question="${i}"][data-correct="true"]`);
                    const selectedOption = document.querySelector(`.option[data-question="${i}"].selected`);

                    // 清除之前的正确/错误状态
                    options.forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                    });

                    if (selectedOption) {
                        const isCorrect = selectedOption.getAttribute('data-correct') === 'true';
                        if (isCorrect) {
                            score++;
                            questionResults[i] = true;
                            selectedOption.classList.add('correct');
                            feedbackEl.textContent = '正确！';
                            feedbackEl.className = 'feedback correct';
                        } else {
                            questionResults[i] = false;
                            selectedOption.classList.add('incorrect');
                            if (correctOption) correctOption.classList.add('correct');
                            feedbackEl.textContent = '不正确。';
                            feedbackEl.className = 'feedback incorrect';
                        }
                    } else {
                        questionResults[i] = false;
                        if (correctOption) correctOption.classList.add('correct');
                        feedbackEl.textContent = '请先选择一个答案！';
                        feedbackEl.className = 'feedback incorrect';
                    }
                    feedbackEl.classList.add('show');
                }

                // 检查第4题
                const feedback4 = document.getElementById('feedback4');
                const input4 = document.getElementById('answer-4');
                const userAnswer4 = parseFloat(userAnswers[4]);
                const correctAnswer4 = params.zValue.toFixed(3);
                const tolerance4 = 0.01;

                input4.classList.remove('correct', 'incorrect');

                if (userAnswers[4] && !isNaN(userAnswer4)) {
                    if (Math.abs(userAnswer4 - parseFloat(correctAnswer4)) <= tolerance4) {
                        score++;
                        questionResults[4] = true;
                        input4.classList.add('correct');
                        feedback4.textContent = '正确！';
                        feedback4.className = 'feedback correct';
                    } else {
                        questionResults[4] = false;
                        input4.classList.add('incorrect');
                        feedback4.textContent = `不正确。正确答案是 ${correctAnswer4}。`;
                        feedback4.className = 'feedback incorrect';
                    }
                } else {
                    questionResults[4] = false;
                    feedback4.textContent = `请输入答案。正确答案是 ${correctAnswer4}。`;
                    feedback4.className = 'feedback incorrect';
                }
                feedback4.classList.add('show');

                // 检查第5题
                const feedback5 = document.getElementById('feedback5');
                const input5 = document.getElementById('answer-5');
                const userAnswer5 = userAnswers[5];
                const tolerance5 = 0.01;

                input5.classList.remove('correct', 'incorrect');

                if (userAnswer5) {
                    if (params.testType === 'two-tailed') {
                        // 双侧检验：验证两个临界值（用空格分隔）
                        const values = userAnswer5.split(/\s+/).map(v => parseFloat(v.trim()));
                        const correctValues = [params.criticalValues[0], params.criticalValues[1]];
                        const correctAnswer5 = `${params.criticalValues[0]} ${params.criticalValues[1]}`;

                        if (values.length === 2 &&
                            Math.abs(values[0] - correctValues[0]) <= tolerance5 &&
                            Math.abs(values[1] - correctValues[1]) <= tolerance5) {
                            score++;
                            questionResults[5] = true;
                            input5.classList.add('correct');
                            feedback5.textContent = '正确！';
                            feedback5.className = 'feedback correct';
                        } else {
                            questionResults[5] = false;
                            input5.classList.add('incorrect');
                            feedback5.textContent = `不正确。正确答案是 ${correctAnswer5}。`;
                            feedback5.className = 'feedback incorrect';
                        }
                    } else {
                        // 单侧检验：验证一个临界值
                        const value = parseFloat(userAnswer5.trim());
                        const correctValue = params.criticalValue;

                        if (!isNaN(value) && Math.abs(value - correctValue) <= tolerance5) {
                            score++;
                            questionResults[5] = true;
                            input5.classList.add('correct');
                            feedback5.textContent = '正确！';
                            feedback5.className = 'feedback correct';
                        } else {
                            questionResults[5] = false;
                            input5.classList.add('incorrect');
                            feedback5.textContent = `不正确。正确答案是 ${correctValue}。`;
                            feedback5.className = 'feedback incorrect';
                        }
                    }
                } else {
                    questionResults[5] = false;
                    const correctAnswer5 = params.testType === 'two-tailed'
                        ? `${params.criticalValues[0]} ${params.criticalValues[1]}`
                        : params.criticalValue.toString();
                    feedback5.textContent = `请输入答案。正确答案是 ${correctAnswer5}。`;
                    feedback5.className = 'feedback incorrect';
                }
                feedback5.classList.add('show');

                // 显示答案解析按钮
                const toggleBtn = document.getElementById('toggle-explanation-btn');
                toggleBtn.classList.add('show');
                toggleBtn.innerHTML = '<i class="fas fa-lightbulb"></i> 显示答案解析';
                document.getElementById('combined-explanation').classList.remove('show');

                // 记录这套题目的结果到历史
                const isAllCorrect = (score === totalQuestions);
                quizHistory.push(isAllCorrect);

                // 更新历史记录显示
                updateHistoryDisplay();

                // 更新分数文本
                let message = '';
                if (isAllCorrect) {
                    message = '太棒了！这套题全对了！';
                } else {
                    message = `这套题答对了 ${score}/${totalQuestions} 道，继续加油！`;
                }
                document.getElementById('score-text').textContent = message;

                // 禁用提交按钮
                this.disabled = true;
                this.style.opacity = '0.6';
                this.style.cursor = 'not-allowed';

                document.getElementById('score-container').scrollIntoView({ behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
