<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交集与条件概率 - 概率练习题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 60, 120, 0.15);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, #4a90e2, #63b3ed, #4a90e2);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #c3cfe2;
        }

        h1 {
            color: #2c5282;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #4a90e2;
        }

        .subtitle {
            color: #5a6c7d;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .question-section {
            margin-bottom: 35px;
        }

        .question-title {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 5px solid #4a90e2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-text {
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .question-text p {
            margin-bottom: 15px;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-weight: bold;
            color: #2b6cb0;
        }

        .answer-section {
            margin-bottom: 30px;
        }

        .input-group {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input-group.correct {
            border-color: #38a169;
            background-color: #f0fff4;
        }

        .input-group.incorrect {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }

        .input-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d3748;
            font-size: 1.1rem;
        }

        .answer-input {
            width: 100%;
            max-width: 200px;
            padding: 12px 16px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }

        .answer-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .answer-input.correct {
            border-color: #38a169;
            background-color: #c6f6d5;
        }

        .answer-input.incorrect {
            border-color: #e53e3e;
            background-color: #fed7d7;
        }

        .input-hint {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #718096;
        }

        .feedback-text {
            margin-top: 10px;
            font-weight: 600;
            display: none;
        }

        .feedback-text.correct {
            color: #38a169;
            display: block;
        }

        .feedback-text.incorrect {
            color: #e53e3e;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background: linear-gradient(to right, #4a90e2, #63b3ed);
            color: white;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }

        #submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        #reset-btn {
            background-color: white;
            color: #4a5568;
            border: 2px solid #cbd5e0;
        }

        #reset-btn:hover {
            background-color: #f7fafc;
            border-color: #a0aec0;
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: bold;
            color: #4a90e2;
            margin: 10px 0;
        }

        .score-text {
            font-size: 1.2rem;
            color: #4a5568;
        }

        .explanation {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #4a90e2;
            margin-top: 20px;
        }

        .explanation h3 {
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation p {
            margin-bottom: 15px;
        }

        .formula {
            background-color: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-input {
                max-width: 100%;
            }

            button {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-project-diagram"></i> 交集与条件概率</h1>
                <button class="refresh-btn" id="refresh-btn">
                    <i class="fas fa-sync-alt"></i> 刷新参数
                </button>
            </div>
            <p class="subtitle">概率论练习题 - 理解事件关系与条件概率</p>
        </header>
        

        
        <div class="question-section">
            <h2 class="question-title"><i class="fas fa-question-circle"></i> 题目内容</h2>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="question-section">
            <h2 class="question-title"><i class="fas fa-edit"></i> 请填写你的答案</h2>
            <div class="answer-section">
                <div class="input-group" id="input-group-a">
                    <div class="input-label" id="label-a">(a) 该学生既是三年级学生又是历史专业学生的概率是多少？</div>
                    <input type="text" class="answer-input" id="answer-a">
                    <div class="input-hint">请以分数形式输入，如：11/15</div>
                    <div class="feedback-text" id="feedback-a"></div>
                </div>

                <div class="input-group" id="input-group-b">
                    <div class="input-label" id="label-b">(b) 已知被选中的学生是三年级学生，那么他也是历史专业学生的概率是多少？</div>
                    <input type="text" class="answer-input" id="answer-b">
                    <div class="input-hint">请以分数形式输入，如：5/13</div>
                    <div class="feedback-text" id="feedback-b"></div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="reset-btn">
                <i class="fas fa-redo"></i> 重新作答
            </button>
        </div>
        
        <div class="results" id="results">
            <div class="score-display">
                <div class="score-text">你的得分</div>
                <div class="score-value" id="score-value">0/2</div>
                <div class="score-text" id="score-message"></div>
            </div>
            
            <button class="show-explanation-btn" id="show-explanation-btn">📖 查看答案解析</button>
            <div class="explanation-section explanation" id="explanation-content">
                <!-- 动态生成 -->
            </div>
        </div>
        
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const resultsDiv = document.getElementById('results');
            const scoreValue = document.getElementById('score-value');
            const scoreMessage = document.getElementById('score-message');
            const explanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-content');

            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    total: 35,
                    countA: 18,
                    countB: 18,
                    neither: 10,
                    groupA: "三年级学生",
                    groupB: "历史专业学生",
                    context: "某个大学班级"
                },
                {
                    total: 40,
                    countA: 20,
                    countB: 16,
                    neither: 12,
                    groupA: "理科生",
                    groupB: "参加社团的学生",
                    context: "某班级"
                },
                {
                    total: 50,
                    countA: 25,
                    countB: 20,
                    neither: 15,
                    groupA: "喜欢数学的学生",
                    groupB: "喜欢物理的学生",
                    context: "某中学班级"
                },
                {
                    total: 30,
                    countA: 15,
                    countB: 12,
                    neither: 8,
                    groupA: "男生",
                    groupB: "戴眼镜的学生",
                    context: "某班级"
                },
                {
                    total: 45,
                    countA: 22,
                    countB: 20,
                    neither: 11,
                    groupA: "选修音乐的学生",
                    groupB: "选修美术的学生",
                    context: "某年级"
                },
                {
                    total: 60,
                    countA: 30,
                    countB: 25,
                    neither: 18,
                    groupA: "有自行车的人",
                    groupB: "有电动车的人",
                    context: "某小区居民"
                }
            ];

            let currentParamIndex = 0;
            let currentAnswers = { a: '', b: '' };
            let answered = false;

            // ==================== 辅助函数 ====================
            function gcd(a, b) {
                a = Math.abs(a);
                b = Math.abs(b);
                while (b) {
                    let t = b;
                    b = a % b;
                    a = t;
                }
                return a;
            }

            function simplifyFraction(numerator, denominator) {
                const g = gcd(numerator, denominator);
                return `${numerator / g}/${denominator / g}`;
            }

            function calculateAnswers(params) {
                const { total, countA, countB, neither } = params;
                const union = total - neither;
                const intersection = countA + countB - union;

                return {
                    intersection: intersection,
                    pIntersection: simplifyFraction(intersection, total),
                    pConditional: simplifyFraction(intersection, countA),
                    pA: simplifyFraction(countA, total),
                    pB: simplifyFraction(countB, total),
                    pUnion: simplifyFraction(union, total),
                    pNeither: simplifyFraction(neither, total)
                };
            }

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const answers = calculateAnswers(params);

                // 保存当前正确答案
                currentAnswers = {
                    a: answers.pIntersection,
                    b: answers.pConditional
                };

                // 渲染题目文本
                document.getElementById('question-text').innerHTML = `
                    <p>假设${params.context}包含 <strong>${params.total}</strong> 名学生。其中，<strong>${params.countA}</strong> 名是${params.groupA}，<strong>${params.countB}</strong> 名是${params.groupB}，<strong>${params.neither}</strong> 名两者都不是。从班级中随机抽取一名学生。</p>
                    <p>设 A 为事件"被选中的学生是${params.groupA}"，B 为事件"被选中的学生是${params.groupB}"。</p>
                `;

                // 更新输入框标签
                document.getElementById('label-a').textContent = `(a) 该学生既是${params.groupA}又是${params.groupB}的概率是多少？`;
                document.getElementById('label-b').textContent = `(b) 已知被选中的学生是${params.groupA}，那么他也是${params.groupB}的概率是多少？`;

                // 渲染解析
                renderExplanation(params, answers);

                // 重置状态
                resetState();
            }

            function renderExplanation(params, answers) {
                const { total, countA, countB, neither, groupA, groupB } = params;
                const union = total - neither;

                document.getElementById('explanation-content').innerHTML = `
                    <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                    <p>设 A 为事件"被选中的学生是${groupA}"，B 为事件"被选中的学生是${groupB}"。</p>
                    <p>已知：班级总人数 = ${total}，P(A) = ${countA}/${total}，P(B) = ${countB}/${total}，既不是A也不是B的学生有${neither}人。</p>

                    <div class="formula">
                        P(A∪B)的补集 = ${neither}/${total}，所以 P(A∪B) = 1 - ${neither}/${total} = ${union}/${total}
                    </div>

                    <p><strong>(a) 求 P(A∩B)：</strong> 根据加法公式：</p>
                    <div class="formula">
                        P(A∩B) = P(A) + P(B) - P(A∪B) = ${countA}/${total} + ${countB}/${total} - ${union}/${total} = ${answers.pIntersection}
                    </div>

                    <p><strong>(b) 求 P(B|A)：</strong> 根据条件概率定义：</p>
                    <div class="formula">
                        P(B|A) = P(A∩B) / P(A) = (${answers.pIntersection}) / (${countA}/${total}) = ${answers.pConditional}
                    </div>

                    <p><strong>正确答案：</strong></p>
                    <ul>
                        <li>(a) ${answers.pIntersection}</li>
                        <li>(b) ${answers.pConditional}</li>
                    </ul>
                `;
            }

            function resetState() {
                answered = false;

                // 重置输入框
                document.getElementById('answer-a').value = '';
                document.getElementById('answer-b').value = '';

                // 移除所有样式
                document.getElementById('input-group-a').classList.remove('correct', 'incorrect');
                document.getElementById('input-group-b').classList.remove('correct', 'incorrect');
                document.getElementById('answer-a').classList.remove('correct', 'incorrect');
                document.getElementById('answer-b').classList.remove('correct', 'incorrect');

                // 清除反馈文本
                document.getElementById('feedback-a').textContent = '';
                document.getElementById('feedback-a').className = 'feedback-text';
                document.getElementById('feedback-b').textContent = '';
                document.getElementById('feedback-b').className = 'feedback-text';

                // 隐藏结果和解析
                resultsDiv.classList.remove('show');
                explanationSection.style.display = 'none';
                explanationBtn.textContent = '📖 查看答案解析';
            }

            // 标准化分数格式
            function normalizeFraction(input) {
                return input.trim().replace(/\s+/g, '').toLowerCase();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            refreshBtn.addEventListener('click', function() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();
            });

            // 显示答案解析按钮
            explanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '📖 隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '📖 查看答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (answered) return;

                const answerA = document.getElementById('answer-a').value;
                const answerB = document.getElementById('answer-b').value;

                if (!answerA.trim() || !answerB.trim()) {
                    alert('请先填写两个问题的答案！');
                    return;
                }

                answered = true;
                let score = 0;

                // 检查答案 (a)
                const inputGroupA = document.getElementById('input-group-a');
                const inputA = document.getElementById('answer-a');
                const feedbackA = document.getElementById('feedback-a');
                const normalizedA = normalizeFraction(answerA);

                if (normalizedA === currentAnswers.a) {
                    inputGroupA.classList.add('correct');
                    inputA.classList.add('correct');
                    feedbackA.textContent = `正确！P(A∩B) = ${currentAnswers.a}`;
                    feedbackA.className = 'feedback-text correct';
                    score++;
                } else {
                    inputGroupA.classList.add('incorrect');
                    inputA.classList.add('incorrect');
                    feedbackA.textContent = `错误。正确答案是 ${currentAnswers.a}`;
                    feedbackA.className = 'feedback-text incorrect';
                }

                // 检查答案 (b)
                const inputGroupB = document.getElementById('input-group-b');
                const inputB = document.getElementById('answer-b');
                const feedbackB = document.getElementById('feedback-b');
                const normalizedB = normalizeFraction(answerB);

                if (normalizedB === currentAnswers.b) {
                    inputGroupB.classList.add('correct');
                    inputB.classList.add('correct');
                    feedbackB.textContent = `正确！P(B|A) = ${currentAnswers.b}`;
                    feedbackB.className = 'feedback-text correct';
                    score++;
                } else {
                    inputGroupB.classList.add('incorrect');
                    inputB.classList.add('incorrect');
                    feedbackB.textContent = `错误。正确答案是 ${currentAnswers.b}`;
                    feedbackB.className = 'feedback-text incorrect';
                }

                // 显示结果
                scoreValue.textContent = `${score}/2`;

                if (score === 2) {
                    scoreMessage.textContent = '完美！你完全理解了交集与条件概率的概念。';
                    scoreMessage.style.color = '#38a169';
                } else if (score === 1) {
                    scoreMessage.textContent = '不错！但还需要加强对其中一个概念的理解。';
                    scoreMessage.style.color = '#d69e2e';
                } else {
                    scoreMessage.textContent = '需要复习一下交集与条件概率的知识点。';
                    scoreMessage.style.color = '#e53e3e';
                }

                resultsDiv.classList.add('show');
                resultsDiv.scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                resetState();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
