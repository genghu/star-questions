<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体标准差 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
        }

        .question-section {
            margin-bottom: 30px;
            background-color: #f8fbff;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
        }

        .question-title {
            color: #0052cc;
            margin-bottom: 15px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .data-points {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .data-point {
            background-color: #e6f0ff;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            color: #0052cc;
            font-size: 1.1rem;
        }

        .answer-input-container {
            margin: 30px 0;
            text-align: center;
        }

        .answer-label {
            display: block;
            font-size: 1.1rem;
            color: #0052cc;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .answer-input {
            width: 200px;
            padding: 15px 20px;
            font-size: 1.3rem;
            border: 3px solid #cce0ff;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            outline: none;
        }

        .answer-input:focus {
            border-color: #0052cc;
            box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1);
        }

        .answer-input.correct {
            border-color: #00cc66;
            background-color: #e6ffe6;
        }

        .answer-input.incorrect {
            border-color: #ff6666;
            background-color: #ffe6e6;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: translateY(-2px);
        }

        #reset-btn {
            background-color: #f0f7ff;
            color: #0052cc;
            border: 2px solid #cce0ff;
        }

        #reset-btn:hover {
            background-color: #e6f0ff;
        }

        .feedback {
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .feedback.incorrect {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .explanation {
            background-color: #f8fbff;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            border-left: 5px solid #4d94ff;
            display: none;
        }

        .explanation-title {
            color: #0052cc;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .step {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #d9e6ff;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step-title {
            font-weight: bold;
            color: #0052cc;
            margin-bottom: 8px;
        }

        .highlight {
            background-color: #fffacd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>总体标准差
                <button id="refresh-btn" style="margin-left: 15px; padding: 8px 16px; background: linear-gradient(135deg, #34a853, #2ecc71); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600;">刷新参数</button>
            </h1>
            <p class="subtitle">交互式答题与解析</p>
        </header>

        <section class="question-section">
            <h2 class="question-title">题目内容</h2>
            <div class="question-content" id="question-context">
                以下是某小型企业6名员工从工作地点到家的距离（单位：英里）：
            </div>

            <div class="data-points" id="data-points">
                <div class="data-point">6</div>
                <div class="data-point">13</div>
                <div class="data-point">18</div>
                <div class="data-point">18</div>
                <div class="data-point">3</div>
                <div class="data-point">20</div>
            </div>

            <div class="question-content">
                假设这些数据构成了一个完整的总体，求该总体的标准差。将你的答案四舍五入到两位小数。
            </div>
        </section>

        <section class="answer-section">
            <div class="answer-input-container">
                <label for="answer-input" class="answer-label">总体标准差（保留两位小数）：</label>
                <input type="text" id="answer-input" class="answer-input" placeholder="请输入答案">
            </div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedback-title"></div>
                <div id="feedback-content"></div>
            </div>

            <div class="controls">
                <button id="submit-btn">提交答案</button>
                <button id="reset-btn">重新作答</button>
            </div>
        </section>

        <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>

        <div class="explanation" id="explanation-section">
            <h3 class="explanation-title">题目解析</h3>
            <div id="explanation-content"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 20组参数 - 多样化背景
            const parameterSets = [
                {
                    context: '以下是某小型企业6名员工从工作地点到家的距离（单位：英里）：',
                    data: [6, 13, 18, 18, 3, 20],
                    mean: 13,
                    answer: 6.43,
                    squaredDiffs: [49, 0, 25, 25, 100, 49],
                    sumSquaredDiff: 248,
                    variance: 41.33
                },
                {
                    context: '某班级8名学生的数学考试成绩如下（满分100分）：',
                    data: [72, 85, 78, 92, 88, 75, 80, 90],
                    mean: 82.5,
                    answer: 7.17,
                    squaredDiffs: [110.25, 6.25, 20.25, 90.25, 30.25, 56.25, 6.25, 56.25],
                    sumSquaredDiff: 376,
                    variance: 47
                },
                {
                    context: '某餐厅一周内每天的顾客人数记录如下：',
                    data: [45, 52, 38, 60, 55, 70, 48],
                    mean: 52.57,
                    answer: 10.11,
                    squaredDiffs: [57.12, 0.32, 212.67, 55.02, 5.90, 303.68, 20.96],
                    sumSquaredDiff: 655.67,
                    variance: 93.67
                },
                {
                    context: '某工厂5台机器每天生产的产品数量（单位：件）：',
                    data: [120, 135, 128, 142, 125],
                    mean: 130,
                    answer: 8.37,
                    squaredDiffs: [100, 25, 4, 144, 25],
                    sumSquaredDiff: 298,
                    variance: 59.6
                },
                {
                    context: '某城市连续7天的气温记录（单位：°C）：',
                    data: [22, 25, 28, 24, 26, 23, 27],
                    mean: 25,
                    answer: 2.16,
                    squaredDiffs: [9, 0, 9, 1, 1, 4, 4],
                    sumSquaredDiff: 28,
                    variance: 4
                },
                {
                    context: '某商店6种商品的价格（单位：元）：',
                    data: [15, 28, 35, 42, 18, 52],
                    mean: 31.67,
                    answer: 13.62,
                    squaredDiffs: [277.79, 13.44, 11.11, 106.78, 186.79, 412.44],
                    sumSquaredDiff: 1008.35,
                    variance: 168.06
                },
                {
                    context: '某篮球队5名球员的身高（单位：厘米）：',
                    data: [185, 192, 188, 195, 190],
                    mean: 190,
                    answer: 3.74,
                    squaredDiffs: [25, 4, 4, 25, 0],
                    sumSquaredDiff: 58,
                    variance: 11.6
                },
                {
                    context: '某实验室8次实验的测量结果：',
                    data: [10.2, 10.5, 9.8, 10.3, 10.1, 9.9, 10.4, 10.0],
                    mean: 10.15,
                    answer: 0.24,
                    squaredDiffs: [0.0025, 0.1225, 0.1225, 0.0225, 0.0025, 0.0625, 0.0625, 0.0225],
                    sumSquaredDiff: 0.42,
                    variance: 0.0525
                },
                {
                    context: '某地区6个家庭的月收入（单位：千元）：',
                    data: [8, 12, 15, 10, 18, 9],
                    mean: 12,
                    answer: 3.74,
                    squaredDiffs: [16, 0, 9, 4, 36, 9],
                    sumSquaredDiff: 74,
                    variance: 12.33
                },
                {
                    context: '某果园7棵苹果树的产量（单位：公斤）：',
                    data: [45, 52, 48, 55, 50, 42, 58],
                    mean: 50,
                    answer: 5.35,
                    squaredDiffs: [25, 4, 4, 25, 0, 64, 64],
                    sumSquaredDiff: 186,
                    variance: 26.57
                },
                {
                    context: '某公司5个季度的销售额（单位：万元）：',
                    data: [120, 135, 128, 140, 132],
                    mean: 131,
                    answer: 7.35,
                    squaredDiffs: [121, 16, 9, 81, 1],
                    sumSquaredDiff: 228,
                    variance: 45.6
                },
                {
                    context: '某学校6名学生的体重（单位：公斤）：',
                    data: [52, 58, 55, 60, 54, 57],
                    mean: 56,
                    answer: 2.86,
                    squaredDiffs: [16, 4, 1, 16, 4, 1],
                    sumSquaredDiff: 42,
                    variance: 7
                },
                {
                    context: '某医院8名病人等待就诊的时间（单位：分钟）：',
                    data: [15, 22, 18, 25, 12, 30, 20, 16],
                    mean: 19.75,
                    answer: 5.74,
                    squaredDiffs: [22.56, 5.06, 3.06, 27.56, 60.06, 105.06, 0.06, 14.06],
                    sumSquaredDiff: 237.48,
                    variance: 29.69
                },
                {
                    context: '某地区5天的空气质量指数（AQI）：',
                    data: [65, 72, 58, 80, 68],
                    mean: 68.6,
                    answer: 7.77,
                    squaredDiffs: [12.96, 11.56, 112.36, 129.96, 0.36],
                    sumSquaredDiff: 267.2,
                    variance: 53.44
                },
                {
                    context: '某足球队6场比赛的进球数：',
                    data: [2, 3, 1, 4, 2, 3],
                    mean: 2.5,
                    answer: 1.05,
                    squaredDiffs: [0.25, 0.25, 2.25, 2.25, 0.25, 0.25],
                    sumSquaredDiff: 5.5,
                    variance: 0.92
                },
                {
                    context: '某书店7天的日销售额（单位：百元）：',
                    data: [35, 42, 38, 45, 40, 52, 48],
                    mean: 42.86,
                    answer: 5.79,
                    squaredDiffs: [61.78, 0.74, 23.59, 4.59, 8.16, 83.45, 26.45],
                    sumSquaredDiff: 208.76,
                    variance: 29.82
                },
                {
                    context: '某电子产品的6次电池续航测试结果（单位：小时）：',
                    data: [8.5, 9.2, 8.8, 9.0, 8.6, 9.5],
                    mean: 8.93,
                    answer: 0.37,
                    squaredDiffs: [0.18, 0.07, 0.02, 0.00, 0.11, 0.33],
                    sumSquaredDiff: 0.71,
                    variance: 0.12
                },
                {
                    context: '某城市5个区域的房价（单位：万元/平方米）：',
                    data: [3.2, 4.5, 3.8, 5.2, 4.0],
                    mean: 4.14,
                    answer: 0.73,
                    squaredDiffs: [0.88, 0.13, 0.12, 1.12, 0.02],
                    sumSquaredDiff: 2.27,
                    variance: 0.45
                },
                {
                    context: '某班级8名学生的身高（单位：厘米）：',
                    data: [160, 165, 162, 168, 163, 170, 167, 164],
                    mean: 164.88,
                    answer: 3.27,
                    squaredDiffs: [23.87, 0.02, 8.27, 9.77, 3.57, 26.27, 4.52, 0.77],
                    sumSquaredDiff: 77.06,
                    variance: 9.63
                },
                {
                    context: '某工厂6台设备的使用年限（单位：年）：',
                    data: [3, 5, 2, 7, 4, 6],
                    mean: 4.5,
                    answer: 1.71,
                    squaredDiffs: [2.25, 0.25, 6.25, 6.25, 0.25, 2.25],
                    sumSquaredDiff: 17.5,
                    variance: 2.92
                },
                {
                    context: '某咖啡店7天的日顾客量：',
                    data: [85, 92, 78, 105, 88, 95, 82],
                    mean: 92.14,
                    answer: 9.10,
                    squaredDiffs: [51.02, 0.02, 200.02, 165.02, 17.16, 8.16, 103.02],
                    sumSquaredDiff: 544.42,
                    variance: 77.77
                }
            ];

            let currentParams = parameterSets[0];
            let correctAnswer = currentParams.answer;
            const tolerance = 0.02;
            let isSubmitted = false;

            const answerInput = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackContent = document.getElementById('feedback-content');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');
            const explanationContent = document.getElementById('explanation-content');

            // 初始化题目
            function initializeQuestion() {
                const params = currentParams;
                correctAnswer = params.answer;

                document.getElementById('question-context').textContent = params.context;
                document.getElementById('data-points').innerHTML = params.data.map(d =>
                    `<div class="data-point">${d}</div>`
                ).join('');
            }

            // 生成解析内容
            function generateExplanation() {
                const params = currentParams;
                const n = params.data.length;

                let html = `
                    <div class="step">
                        <div class="step-title">步骤 1: 计算总体均值 (μ)</div>
                        <div>μ = (${params.data.join(' + ')}) / ${n} = <span class="highlight">${params.mean}</span></div>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 2: 计算每个数据点与均值的偏差平方</div>`;

                params.data.forEach((d, i) => {
                    const diff = d - params.mean;
                    const squared = params.squaredDiffs[i];
                    html += `<div>(${d} - ${params.mean})² = (${diff.toFixed(2)})² = <span class="highlight">${squared.toFixed(2)}</span></div>`;
                });

                html += `
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 3: 计算总体方差 (σ²)</div>
                        <div>σ² = (${params.squaredDiffs.map(s => s.toFixed(2)).join(' + ')}) / ${n} = <span class="highlight">${params.variance.toFixed(2)}</span></div>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 4: 计算总体标准差 (σ)</div>
                        <div>σ = √${params.variance.toFixed(2)} ≈ <span class="highlight">${correctAnswer}</span></div>
                    </div>
                `;

                explanationContent.innerHTML = html;
            }

            // 刷新参数
            refreshBtn.addEventListener('click', function() {
                let newParams;
                do {
                    newParams = parameterSets[Math.floor(Math.random() * parameterSets.length)];
                } while (newParams === currentParams && parameterSets.length > 1);

                currentParams = newParams;
                initializeQuestion();
                resetState();
            });

            // 重置状态
            function resetState() {
                answerInput.value = '';
                answerInput.disabled = false;
                answerInput.classList.remove('correct', 'incorrect');

                feedback.classList.remove('show', 'correct', 'incorrect');
                showExplanationBtn.style.display = 'none';
                explanationSection.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(answerInput.value.trim());

                if (isNaN(userAnswer)) {
                    alert('请输入一个有效的数字！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                answerInput.disabled = true;

                const isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;

                if (isCorrect) {
                    answerInput.classList.add('correct');
                    feedbackTitle.textContent = '回答正确！';
                    feedbackContent.textContent = `你正确计算了总体标准差。答案是 ${correctAnswer}。`;
                    feedback.classList.add('correct');
                } else {
                    answerInput.classList.add('incorrect');
                    feedbackTitle.textContent = '回答不正确';
                    feedbackContent.innerHTML = `你的答案: ${userAnswer}<br>正确答案: <strong>${correctAnswer}</strong>`;
                    feedback.classList.add('incorrect');
                }

                feedback.classList.add('show');
                showExplanationBtn.style.display = 'block';
                generateExplanation();
            });

            // 重新作答
            resetBtn.addEventListener('click', resetState);

            // 查看答案解析
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'block') {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 初始化
            initializeQuestion();
        });
    </script>
</body>
</html>
