                    </div>
                `;

                document.getElementById('q2-options').innerHTML = '';

                document.getElementById('q2-explanation').innerHTML = `
                    <h4>解析：</h4>
                    <p>F 统计量的分母自由度对应组内变异（误差），计算公式为 <span class="formula">df₂ = N - k</span>，其中 N 是总样本量，k 是组数。</p>
                    <p>根据题目解析，分母自由度为 <span class="highlight">${params.df2}</span>。这意味着总样本量 N = ${params.df2} + ${params.k} = ${params.df2 + params.k}。</p>
                `;

                // 渲染问题3
                document.getElementById('q3-content').innerHTML = '';

                const q3Options = `
                    <div class="option" data-value="yes">
                        <div class="option-letter">A</div>
                        <div>是</div>
                    </div>
                    <div class="option" data-value="no">
                        <div class="option-letter">B</div>
                        <div>否</div>
                    </div>
                `;
                const q3OptionsContainer = document.getElementById('q3-options');
                q3OptionsContainer.innerHTML = q3Options;
                q3OptionsContainer.className = 'options-container horizontal';

                const conclusionText = params.conclusion === 'yes' ? '能' : '不能';
                document.getElementById('q3-explanation').innerHTML = `
                    <h4>解析：</h4>
                    <p>决策规则：如果 p 值 ≤ 显著性水平 α (0.05)，则拒绝原假设（所有总体均值相等），得出结论至少有一个均值不同。</p>
                    <p>本题中，p 值 ≈ ${params.pValue}，而 α = 0.05，因此 <span class="formula">p 值 (${params.pValue}) ${params.pValue <= 0.05 ? '≤' : '>'} α (0.05)</span>。</p>
                    <p>所以，我们${params.pValue <= 0.05 ? '可以' : '不能'}拒绝原假设，<span class="highlight">${conclusionText}</span> 得出结论说至少有一位${params.role}的${params.metric}与其他人的有显著差异。</p>
                `;

                // 重新绑定选项点击事件
                bindOptionEvents();

                // 绑定填空题输入事件
                bindFillBlankEvents();
            }

            function bindFillBlankEvents() {
                // Q1 填空题
                const q1Input = document.getElementById('q1-answer');
                if (q1Input) {
                    q1Input.addEventListener('input', function() {
                        userAnswers['q1'] = this.value.trim() !== '' ? parseFloat(this.value) : null;
                    });
                }

                // Q2 填空题
                const q2Input = document.getElementById('q2-answer');
                if (q2Input) {
                    q2Input.addEventListener('input', function() {
                        userAnswers['q2'] = this.value.trim() !== '' ? parseFloat(this.value) : null;
                    });
                }
            }

            function generateOptions(values, correctValue) {
                const letters = ['A', 'B', 'C', 'D'];
                return values.map((val, idx) => `
                    <div class="option" data-value="${val}">
                        <div class="option-letter">${letters[idx]}</div>
                        <div>${val}</div>
                    </div>
                `).join('');
            }

            function bindOptionEvents() {
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        const questionId = this.closest('.options-container').id;
                        const questionNum = questionId.split('-')[0];

                        // 移除同一问题中其他选项的选中状态
                        document.querySelectorAll(`#${questionId} .option`).forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 标记当前选项为选中
                        this.classList.add('selected');

                        // 保存用户答案
                        userAnswers[questionNum] = this.getAttribute('data-value');
                    });
                });
            }

            // 更新答题历史图标显示
            function updateQuizHistory() {
                const historyContainer = document.getElementById('quiz-history');
                if (!historyContainer) return;

                let html = '';
                quizHistory.forEach((record, index) => {
                    const iconClass = record.allCorrect ? 'correct' : 'incorrect';
                    const iconSymbol = record.allCorrect ? '✓' : '✗';
                    const titleText = record.allCorrect
                        ? `第${record.round}套题：全部答对 (${record.correctCount}/${record.totalQuestions})`
                        : `第${record.round}套题：有错误 (${record.correctCount}/${record.totalQuestions})`;

                    html += `<div class="result-icon ${iconClass}" title="${titleText}">${iconSymbol}</div>`;
                });

                historyContainer.innerHTML = html;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;

                // 重置用户答案
                for (const questionId in userAnswers) {
                    userAnswers[questionId] = null;
                }

                // 重置填空题输入框
                document.querySelectorAll('.fill-blank-input').forEach(input => {
                    input.value = '';
                    input.classList.remove('correct', 'incorrect');
                });

                // 重置所有选项样式
                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                });

                // 隐藏答案解析按钮并重置状态
                const showAllBtn = document.getElementById('show-all-explanations-btn');
                showAllBtn.style.display = 'none';
                showAllBtn.textContent = '查看答案解析';
                explanationsVisible = false;

                // 隐藏解析
                document.querySelectorAll('.explanation').forEach(explanation => {
                    explanation.style.display = 'none';
                    explanation.classList.remove('show');
                });

                // 隐藏结果
                document.getElementById('results').classList.remove('show');

                // 启用提交按钮
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = false;
                submitBtn.style.backgroundColor = "#3b82f6";
                submitBtn.textContent = "提交答案";

                // 重新渲染
                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 下一题按钮
            document.getElementById('next-btn').addEventListener('click', function() {
                refreshParams();
            });

            // 显示/隐藏所有答案解析按钮点击事件
            const showAllExplanationsBtn = document.getElementById('show-all-explanations-btn');
            let explanationsVisible = false;

            showAllExplanationsBtn.addEventListener('click', function() {
                const explanations = document.querySelectorAll('.explanation');
                explanationsVisible = !explanationsVisible;

                explanations.forEach(explanation => {
                    if (explanationsVisible) {
                        explanation.classList.add('show');
                        explanation.style.display = 'block';
                    } else {
                        explanation.classList.remove('show');
                        explanation.style.display = 'none';
                    }
                });

                this.textContent = explanationsVisible ? '隐藏答案解析' : '查看答案解析';
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const params = questionParams[currentParamIndex];
                const df1 = params.k - 1;

                const correctAnswers = {
                    'q1': df1,
                    'q2': params.df2,
                    'q3': params.conclusion
                };

                let correctCount = 0;
                let totalQuestions = Object.keys(correctAnswers).length;

                // 检查每个问题
                for (const questionId in correctAnswers) {
                    const userAnswer = userAnswers[questionId];
                    const correctAnswer = correctAnswers[questionId];
                    const tolerance = tolerances[questionId];

                    // 如果用户没有回答这个问题
                    if (userAnswer === null || userAnswer === '') {
                        alert(`请先回答第 ${questionId.charAt(1)} 题！`);
                        return;
                    }

                    // 判断答案是否正确（根据题目类型）
                    let isCorrect = false;
                    if (tolerance !== null) {
                        // 填空题：使用容差比较
                        isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;
                    } else {
                        // 选择题：精确匹配
                        isCorrect = userAnswer === correctAnswer;
                    }

                    // 处理填空题的视觉反馈
                    if (questionId === 'q1' || questionId === 'q2') {
                        const inputElement = document.getElementById(`${questionId}-answer`);
                        if (inputElement) {
                            inputElement.classList.remove('correct', 'incorrect');
                            inputElement.classList.add(isCorrect ? 'correct' : 'incorrect');
                        }
                    } else {
                        // 处理选择题的视觉反馈
                        const optionsContainer = document.getElementById(`${questionId}-options`);
                        if (optionsContainer) {
                            optionsContainer.querySelectorAll('.option').forEach(option => {
                                const optionValue = option.getAttribute('data-value');
                                option.classList.remove('correct', 'incorrect');
                                if (optionValue === userAnswer && !isCorrect) {
                                    option.classList.add('incorrect');
                                }
                            });
                        }
                    }

                    // 统计正确数量
                    if (isCorrect) {
                        correctCount++;
                    }
                }

                // 显示"查看答案解析"按钮
                document.getElementById('show-all-explanations-btn').style.display = 'inline-block';

                // 显示结果
                const resultsDiv = document.getElementById('results');
                const currentResultEl = document.getElementById('current-result');

                // 记录本次答题结果到历史记录
                const allCorrect = correctCount === totalQuestions;
                quizHistory.push({
                    round: quizHistory.length + 1,
                    allCorrect: allCorrect,
                    correctCount: correctCount,
                    totalQuestions: totalQuestions
                });

                // 显示本次答题结果文本
                if (allCorrect) {
                    currentResultEl.innerHTML = `<span style="color: #10b981; font-weight: bold;">🎉 太棒了！全部答对！</span> 得分：${correctCount}/${totalQuestions}`;
                } else {
                    currentResultEl.innerHTML = `<span style="color: #ef4444; font-weight: bold;">继续努力！</span> 得分：${correctCount}/${totalQuestions}，请查看解析后重试。`;
                }

                // 更新答题历史图标显示
                updateQuizHistory();

                resultsDiv.classList.add('show');

                // 滚动到结果区域
                resultsDiv.scrollIntoView({ behavior: 'smooth' });

                // 禁用提交按钮
                this.disabled = true;
                this.style.backgroundColor = "#94a3b8";
                this.textContent = "已提交";
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
