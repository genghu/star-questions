<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散概率分布基础 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin: 5px 10px;
        }

        .info-item i {
            margin-right: 8px;
            color: #3498db;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }

        .question-text {
            background-color: #f9fbfd;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #3498db;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .probability-table {
            width: 100%;
            max-width: 500px;
            margin: 25px auto;
            border-collapse: collapse;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .probability-table th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .probability-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .probability-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .probability-table tr:hover {
            background-color: #e3f2fd;
        }

        .input-cell {
            position: relative;
        }

        .probability-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .probability-input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .constraint-box {
            background-color: #e8f4fc;
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            border-left: 5px solid #2980b9;
        }

        .constraint-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .constraint-title i {
            margin-right: 10px;
            color: #2980b9;
        }

        .equation {
            font-family: 'Cambria Math', serif;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            font-size: 1.2rem;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
        }

        .btn i {
            margin-right: 10px;
        }

        .btn-submit {
            background: linear-gradient(to right, #2ecc71, #1abc9c);
            color: white;
        }

        .btn-submit:hover {
            background: linear-gradient(to right, #27ae60, #16a085);
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(46, 204, 113, 0.3);
        }

        .btn-reset {
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
        }

        .btn-reset:hover {
            background: linear-gradient(to right, #c0392b, #a93226);
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(231, 76, 60, 0.3);
        }

        .feedback-container {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }

        .feedback-correct {
            background-color: #d5f4e6;
            border-left: 5px solid #2ecc71;
        }

        .feedback-incorrect {
            background-color: #fdeaea;
            border-left: 5px solid #e74c3c;
        }

        .feedback-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .feedback-title i {
            margin-right: 10px;
        }

        .correct-icon {
            color: #2ecc71;
        }

        .incorrect-icon {
            color: #e74c3c;
        }

        .quiz-history-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            display: none;
        }

        .history-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        .history-title i {
            margin-right: 10px;
            color: #3498db;
        }

        .history-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .result-icon:hover {
            transform: scale(1.1);
        }

        .result-icon.correct {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .result-icon.incorrect {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .history-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1rem;
            color: #555;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }

        .history-stats span {
            padding: 5px 15px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #correct-count {
            color: #27ae60;
            font-weight: 600;
        }

        #incorrect-count {
            color: #c0392b;
            font-weight: 600;
        }

        .example-solution {
            background-color: #fff8e1;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 5px solid #f39c12;
        }

        .example-title {
            font-weight: 600;
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .example-title i {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .student-info {
                flex-direction: column;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .probability-table {
                font-size: 0.9rem;
            }
            
            .probability-input {
                width: 80px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            .probability-table th, 
            .probability-table td {
                padding: 10px 5px;
            }
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 离散概率分布基础</h1>
            <p class="subtitle">交互式概率分布练习 - 填写缺失的概率值</p>
        </header>

        <div class="question-container">
            <h2 class="question-title"><i class="fas fa-question-circle"></i> 题目</h2>
            <div class="question-text">
                <p id="question-description">在下表中填入数值，为离散随机变量 X 给出一个合法的概率分布。</p>

                <table class="probability-table">
                    <thead>
                        <tr>
                            <th>X 的取值 x</th>
                            <th>P(X = x)</th>
                        </tr>
                    </thead>
                    <tbody id="probability-table-body">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>

        </div>
        
        <div class="controls">
            <button id="submitBtn" class="btn btn-submit">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="nextBtn" class="btn btn-reset" style="background: linear-gradient(to right, #3498db, #2980b9);">
                <i class="fas fa-arrow-right"></i> 下一题
            </button>
        </div>
        
        <div id="feedback" class="feedback-container">
            <h3 class="feedback-title">
                <i id="feedbackIcon" class="fas fa-check-circle"></i>
                <span id="feedbackText">您的答案正确！</span>
            </h3>
            <p id="feedbackDetail">您填写的概率分布满足所有约束条件。</p>
            <div class="equation" id="sumEquation">
                <!-- 动态生成 -->
            </div>
            <p id="constraintCheck"></p>
        </div>

        <div id="quiz-history" class="quiz-history-container">
            <h3 class="history-title"><i class="fas fa-history"></i> 答题记录</h3>
            <div id="history-icons" class="history-icons">
                <!-- 动态生成答题结果图标 -->
            </div>
            <div class="history-stats">
                <span id="correct-count">正确: 0</span>
                <span id="incorrect-count">错误: 0</span>
                <span id="total-count">总计: 0</span>
            </div>
        </div>

        <button class="show-explanation-btn" id="show-explanation-btn" style="display:none;">查看答案解析</button>
        <div class="explanation-section" id="explanation-section" style="display:none;">
            <h3 style="font-size: 1.4rem; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #9b59b6; padding-bottom: 10px;"><i class="fas fa-book-open"></i> 答案解析</h3>

            <div class="constraint-box">
                <!-- 动态生成 -->
            </div>

            <div class="example-solution">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // 20组参数配置 - 每组有不同的X取值
            // values: X的可能取值数组
            // probs: 对应的概率值数组
            // blanks: 需要填空的位置索引(0-based)，1个元素为单空格，2个元素为双空格
            const parameterSets = [
                // 单空格题目 (10组)
                { values: [0, 1, 2, 3, 4], probs: [0.15, 0.25, 0.20, 0.18, 0.22], blanks: [2] },
                { values: [1, 2, 3, 4, 5], probs: [0.12, 0.28, 0.15, 0.25, 0.20], blanks: [4] },
                { values: [2, 3, 4, 5, 6], probs: [0.17, 0.23, 0.08, 0.29, 0.23], blanks: [1] },
                { values: [3, 4, 5, 6, 7], probs: [0.22, 0.18, 0.10, 0.30, 0.20], blanks: [3] },
                { values: [5, 10, 15, 20, 25], probs: [0.10, 0.25, 0.20, 0.15, 0.30], blanks: [2] },
                { values: [0, 5, 10, 15, 20], probs: [0.19, 0.16, 0.24, 0.21, 0.20], blanks: [0] },
                { values: [1, 3, 5, 7, 9], probs: [0.14, 0.21, 0.19, 0.26, 0.20], blanks: [4] },
                { values: [2, 4, 6, 8, 10], probs: [0.25, 0.15, 0.18, 0.22, 0.20], blanks: [1] },
                { values: [10, 20, 30, 40, 50], probs: [0.11, 0.24, 0.22, 0.19, 0.24], blanks: [3] },
                { values: [100, 200, 300, 400, 500], probs: [0.20, 0.19, 0.16, 0.25, 0.20], blanks: [2] },
                // 双空格题目 (10组)
                { values: [0, 2, 4, 6, 8], probs: [0.16, 0.22, 0.12, 0.28, 0.22], blanks: [1, 3] },
                { values: [1, 4, 7, 10, 13], probs: [0.13, 0.27, 0.21, 0.17, 0.22], blanks: [0, 2] },
                { values: [5, 6, 7, 8, 9], probs: [0.23, 0.14, 0.26, 0.20, 0.17], blanks: [1, 4] },
                { values: [0, 10, 20, 30, 40], probs: [0.18, 0.20, 0.14, 0.24, 0.24], blanks: [2, 3] },
                { values: [2, 5, 8, 11, 14], probs: [0.09, 0.26, 0.23, 0.21, 0.21], blanks: [0, 1] },
                { values: [3, 6, 9, 12, 15], probs: [0.21, 0.17, 0.20, 0.23, 0.19], blanks: [2, 4] },
                { values: [4, 8, 12, 16, 20], probs: [0.15, 0.24, 0.11, 0.27, 0.23], blanks: [1, 3] },
                { values: [0.5, 1.0, 1.5, 2.0, 2.5], probs: [0.12, 0.19, 0.28, 0.16, 0.25], blanks: [0, 4] },
                { values: [1, 2, 4, 8, 16], probs: [0.24, 0.13, 0.17, 0.26, 0.20], blanks: [2, 3] },
                { values: [10, 15, 20, 25, 30], probs: [0.17, 0.21, 0.25, 0.19, 0.18], blanks: [3, 4] }
            ];

            let currentParams = null;

            // 获取表格元素
            const tableBody = document.getElementById('probability-table-body');
            const questionDesc = document.getElementById('question-description');

            // 初始化参数
            function initParameters() {
                const randomIndex = Math.floor(Math.random() * parameterSets.length);
                currentParams = parameterSets[randomIndex];
                currentQuizAnswered = false; // 重置答题状态
                updateQuestionDescription();
                updateTable();
                updateExplanation();
            }

            // 更新问题描述
            function updateQuestionDescription() {
                const valuesStr = currentParams.values.join(', ');
                questionDesc.textContent = `在下表中填入数值，为离散随机变量 X 给出一个合法的概率分布，其可能取值为 ${valuesStr}。`;
            }

            // 更新表格显示
            function updateTable() {
                tableBody.innerHTML = '';

                currentParams.values.forEach((x, index) => {
                    const row = document.createElement('tr');
                    const isBlank = currentParams.blanks.includes(index);

                    row.innerHTML = `
                        <td>${x}</td>
                        <td class="${isBlank ? 'input-cell' : ''}">
                            ${isBlank
                                ? `<input type="number" id="prob${index}" class="probability-input" min="0" max="1" step="0.01" placeholder="输入概率">`
                                : currentParams.probs[index].toFixed(2)
                            }
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // 重新绑定输入事件
                bindInputEvents();
            }

            // 绑定输入事件
            function bindInputEvents() {
                currentParams.blanks.forEach(index => {
                    const input = document.getElementById(`prob${index}`);
                    if (input) {
                        input.addEventListener('input', validateInputs);
                    }
                });
            }

            // 更新答案解析内容
            function updateExplanation() {
                const blanks = currentParams.blanks;
                const values = currentParams.values;
                const probs = currentParams.probs;

                // 计算需要填写的概率之和
                const blankSum = blanks.reduce((sum, i) => sum + probs[i], 0);

                // 计算已知概率之和
                const knownSum = probs.reduce((sum, p, i) => {
                    return blanks.includes(i) ? sum : sum + p;
                }, 0);

                // 更新约束条件说明
                const constraintBox = document.querySelector('.explanation-section .constraint-box');
                const valuesStr = values.join(', ');
                const blankLabels = blanks.map(i => `P(X=${values[i]})`).join(' + ');
                const knownLabels = probs.map((p, i) => blanks.includes(i) ? null : p.toFixed(2)).filter(x => x !== null).join(' + ');

                constraintBox.innerHTML = `
                    <div class="constraint-title">
                        <i class="fas fa-exclamation-circle"></i> 约束条件
                    </div>
                    <p>离散随机变量 X 的可能取值为 ${valuesStr}。因此，必须满足：</p>
                    <div class="equation">
                        ${values.map(x => `P(X=${x})`).join(' + ')} = 1
                    </div>
                    <p>且对于所有取值，有 0 ≤ P(X = x) ≤ 1。</p>
                    <p>根据所给信息，${blankLabels} 之和应等于：</p>
                    <div class="equation">
                        ${blankLabels} = 1 - (${knownLabels}) = ${blankSum.toFixed(2)}
                    </div>
                `;

                // 更新示例解答
                const exampleSolution = document.querySelector('.explanation-section .example-solution');

                exampleSolution.innerHTML = `
                    <div class="example-title">
                        <i class="fas fa-lightbulb"></i> 示例解答
                    </div>
                    <p>一个正确答案是：${blanks.map(i => `P(X=${values[i]}) = ${probs[i].toFixed(2)}`).join('，')}。</p>
                    <p>完整的概率分布表：</p>
                    <table class="probability-table">
                        <thead>
                            <tr>
                                <th>X 的取值 x</th>
                                <th>P(X = x)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${values.map((x, i) => `
                            <tr>
                                <td>${x}</td>
                                <td>${probs[i].toFixed(2)}</td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            // 显示答案解析按钮点击事件
            document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    var explanation = this.nextElementSibling;
                    if (explanation) {
                        if (explanation.style.display === 'none' || explanation.style.display === '') {
                            explanation.style.display = 'block';
                            this.textContent = '隐藏答案解析';
                        } else {
                            explanation.style.display = 'none';
                            this.textContent = '查看答案解析';
                        }
                    }
                });
            });

            const submitBtn = document.getElementById('submitBtn');
            const nextBtn = document.getElementById('nextBtn');
            const feedbackDiv = document.getElementById('feedback');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackDetail = document.getElementById('feedbackDetail');
            const sumEquation = document.getElementById('sumEquation');
            const constraintCheck = document.getElementById('constraintCheck');
            const quizHistoryDiv = document.getElementById('quiz-history');
            const historyIconsDiv = document.getElementById('history-icons');
            const correctCountSpan = document.getElementById('correct-count');
            const incorrectCountSpan = document.getElementById('incorrect-count');
            const totalCountSpan = document.getElementById('total-count');

            // 答题历史记录
            let quizHistory = [];
            let currentQuizAnswered = false;

            // 更新答题历史显示
            function updateHistoryDisplay() {
                if (quizHistory.length === 0) {
                    quizHistoryDiv.style.display = 'none';
                    return;
                }

                quizHistoryDiv.style.display = 'block';
                historyIconsDiv.innerHTML = '';

                let correctCount = 0;
                let incorrectCount = 0;

                quizHistory.forEach((result, index) => {
                    const icon = document.createElement('div');
                    icon.className = `result-icon ${result ? 'correct' : 'incorrect'}`;
                    icon.innerHTML = result ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>';
                    icon.title = `第${index + 1}套题: ${result ? '正确' : '错误'}`;
                    historyIconsDiv.appendChild(icon);

                    if (result) correctCount++;
                    else incorrectCount++;
                });

                correctCountSpan.textContent = `正确: ${correctCount}`;
                incorrectCountSpan.textContent = `错误: ${incorrectCount}`;
                totalCountSpan.textContent = `总计: ${quizHistory.length}`;
            }

            // 重置表单
            function resetForm() {
                feedbackDiv.style.display = 'none';
                const explanationSection = document.getElementById('explanation-section');
                const showBtn = document.getElementById('show-explanation-btn');
                if (explanationSection) {
                    explanationSection.style.display = 'none';
                }
                if (showBtn) {
                    showBtn.style.display = 'none';
                    showBtn.textContent = '查看答案解析';
                }
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const blanks = currentParams.blanks;
                const values = currentParams.values;
                const probs = currentParams.probs;
                const userValues = {};
                let allValid = true;

                blanks.forEach(index => {
                    const input = document.getElementById(`prob${index}`);
                    userValues[index] = parseFloat(input.value);
                    if (isNaN(userValues[index])) {
                        allValid = false;
                    }
                });

                if (!allValid) {
                    alert('请填写所有空格！');
                    return;
                }

                // 计算总和
                let total = 0;
                let userSum = 0;

                probs.forEach((p, i) => {
                    if (blanks.includes(i)) {
                        total += userValues[i];
                        userSum += userValues[i];
                    } else {
                        total += p;
                    }
                });

                // 检查约束条件
                const isSumValid = Math.abs(total - 1.0) <= 0.001;
                const blankSum = blanks.reduce((sum, i) => sum + probs[i], 0);
                const isUserSumValid = Math.abs(userSum - blankSum) <= 0.001;

                let allInRange = true;
                blanks.forEach(index => {
                    if (userValues[index] < 0 || userValues[index] > 1) {
                        allInRange = false;
                    }
                });

                // 判断答案是否正确
                const isCorrect = isSumValid && isUserSumValid && allInRange;

                // 更新方程显示
                let equationParts = [];
                probs.forEach((p, i) => {
                    if (blanks.includes(i)) {
                        equationParts.push(`<span style="color: #3498db; font-weight: bold;">${userValues[i].toFixed(2)}</span>`);
                    } else {
                        equationParts.push(p.toFixed(2));
                    }
                });
                sumEquation.innerHTML = equationParts.join(' + ') + ` = <span id="totalSum">${total.toFixed(2)}</span>`;

                // 显示反馈
                if (isCorrect) {
                    feedbackDiv.className = 'feedback-container feedback-correct';
                    feedbackIcon.className = 'fas fa-check-circle correct-icon';
                    feedbackText.textContent = '恭喜！您的答案正确！';
                    feedbackDetail.textContent = '您填写的概率分布满足所有约束条件：';

                    let checkHtml = '';
                    blanks.forEach(index => {
                        checkHtml += `<p><i class="fas fa-check correct-icon"></i> P(X=${values[index]}) = ${userValues[index].toFixed(2)} 在 [0, 1] 范围内</p>`;
                    });
                    checkHtml += `<p><i class="fas fa-check correct-icon"></i> ${blanks.map(i => `P(X=${values[i]})`).join(' + ')} = ${userSum.toFixed(2)} = ${blankSum.toFixed(2)}</p>`;
                    checkHtml += `<p><i class="fas fa-check correct-icon"></i> 所有概率之和 = ${total.toFixed(2)} = 1.00</p>`;
                    constraintCheck.innerHTML = checkHtml;
                } else {
                    feedbackDiv.className = 'feedback-container feedback-incorrect';
                    feedbackIcon.className = 'fas fa-times-circle incorrect-icon';
                    feedbackText.textContent = '需要调整您的答案';
                    feedbackDetail.textContent = '您填写的概率分布不满足所有约束条件：';

                    let issues = [];
                    blanks.forEach(index => {
                        if (userValues[index] < 0 || userValues[index] > 1) {
                            issues.push(`P(X=${values[index]}) = ${userValues[index].toFixed(2)} 不在 [0, 1] 范围内`);
                        }
                    });
                    if (!isUserSumValid) {
                        issues.push(`${blanks.map(i => `P(X=${values[i]})`).join(' + ')} = ${userSum.toFixed(2)}，但应该等于 ${blankSum.toFixed(2)}`);
                    }
                    if (!isSumValid) {
                        issues.push(`所有概率之和 = ${total.toFixed(2)}，但应该等于 1.00`);
                    }

                    constraintCheck.innerHTML = issues.map(issue =>
                        `<p><i class="fas fa-times incorrect-icon"></i> ${issue}</p>`
                    ).join('');
                }

                // 显示反馈
                feedbackDiv.style.display = 'block';

                // 记录答题结果（只在第一次提交时记录）
                if (!currentQuizAnswered) {
                    quizHistory.push(isCorrect);
                    currentQuizAnswered = true;
                    updateHistoryDisplay();
                }

                // 显示答案解析按钮
                var showBtn = document.getElementById('show-explanation-btn');
                if (showBtn) {
                    showBtn.style.display = 'inline-block';
                }

                // 滚动到反馈区域
                feedbackDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 下一题按钮
            nextBtn.addEventListener('click', function() {
                // 初始化新参数（刷新所有题目）
                initParameters();

                // 隐藏反馈和答案解析
                feedbackDiv.style.display = 'none';
                var explanationSection = document.getElementById('explanation-section');
                var showBtn = document.getElementById('show-explanation-btn');
                if (explanationSection) {
                    explanationSection.style.display = 'none';
                }
                if (showBtn) {
                    showBtn.style.display = 'none';
                    showBtn.textContent = '查看答案解析';
                }

                // 滚动到顶部
                document.querySelector('.question-title').scrollIntoView({ behavior: 'smooth' });
            });

            // 实时验证输入
            function validateInputs() {
                currentParams.blanks.forEach(index => {
                    const input = document.getElementById(`prob${index}`);
                    if (input) {
                        const val = parseFloat(input.value);
                        if (isNaN(val)) {
                            input.style.borderColor = '#ddd';
                        } else {
                            input.style.borderColor = (val >= 0 && val <= 1) ? '#ddd' : '#e74c3c';
                        }
                    }
                });
            }

            // 初始化
            initParameters();
        });
    </script>
</body>
</html>
