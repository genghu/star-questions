<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准正态值基础 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fbff;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
        }

        .math {
            font-family: 'Cambria Math', serif;
            font-weight: bold;
            color: #0052cc;
        }

        .formula-box {
            background-color: #f8fbff;
            border: 1px dashed #4d94ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-family: 'Cambria Math', serif;
            font-size: 1.2rem;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }

        #reset-btn {
            background-color: #f0f7ff;
            color: #0052cc;
            border: 2px solid #c2d9ff;
        }

        #reset-btn:hover {
            background-color: #e6f0ff;
            transform: scale(1.05);
        }

        .feedback-container {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #e6ffe6;
            border-left: 5px solid #00cc66;
        }

        .incorrect-feedback {
            background-color: #ffe6e6;
            border-left: 5px solid #ff6666;
        }

        .feedback-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            background-color: #e6f0ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .stat-item {
            margin: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #0052cc;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6699ff;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>标准正态值 基础</h1>
            <p class="subtitle">交互式答题与解析</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <span>问题</span>
                <button class="refresh-params-btn" id="refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                    刷新参数
                </button>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <label class="answer-label">请输入c的值（保留两位小数）：</label>
                <input type="text" class="answer-input" id="answer-input">
                <div class="tolerance-hint">容差：±0.01</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn">提交答案</button>
            <button id="reset-btn">重新作答</button>
        </div>

        <div class="feedback-container" id="feedback">
            <div class="feedback-title" id="feedback-title-text"></div>
            <p id="feedback-text"></p>
            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation" id="explanation" style="display:none;">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">得分</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="answered">0</div>
                <div class="stat-label">已回答</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct-count">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="incorrect-count">0</div>
                <div class="stat-label">错误</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 找c值使得P(Z <= c) = 给定概率
            const questionParams = [
                {
                    probability: 0.1685,
                    answer: -0.96,
                    complement: 0.8315,
                    explanation: '因为概率 0.1685 小于 0.5，所以 c 的值应为负数。'
                },
                {
                    probability: 0.2266,
                    answer: -0.75,
                    complement: 0.7734,
                    explanation: '因为概率 0.2266 小于 0.5，所以 c 的值应为负数。'
                },
                {
                    probability: 0.3085,
                    answer: -0.50,
                    complement: 0.6915,
                    explanation: '因为概率 0.3085 小于 0.5，所以 c 的值应为负数。'
                },
                {
                    probability: 0.8413,
                    answer: 1.00,
                    complement: 0.1587,
                    explanation: '因为概率 0.8413 大于 0.5，所以 c 的值应为正数。'
                },
                {
                    probability: 0.9332,
                    answer: 1.50,
                    complement: 0.0668,
                    explanation: '因为概率 0.9332 大于 0.5，所以 c 的值应为正数。'
                },
                {
                    probability: 0.0668,
                    answer: -1.50,
                    complement: 0.9332,
                    explanation: '因为概率 0.0668 小于 0.5，所以 c 的值应为负数。'
                },
                {
                    probability: 0.9772,
                    answer: 2.00,
                    complement: 0.0228,
                    explanation: '因为概率 0.9772 大于 0.5，所以 c 的值应为正数。'
                },
                {
                    probability: 0.0228,
                    answer: -2.00,
                    complement: 0.9772,
                    explanation: '因为概率 0.0228 小于 0.5，所以 c 的值应为负数。'
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionText = document.getElementById('question-text');
                const explanation = document.getElementById('explanation');

                // 渲染问题文本
                questionText.innerHTML = `
                    <p>设 <span class="math">Z</span> 为标准正态随机变量。使用提供的计算器或标准正态表确定 <span class="math">c</span> 的值。</p>
                    <div class="formula-box">
                        P(Z <= c) = ${params.probability}
                    </div>
                    <p>将你的中间计算至少保留四位小数。将你的答案四舍五入到两位小数。</p>
                    <p><em>标准正态分布，也称为 Z 分布，是一个均值为 0、标准差为 1 的正态分布。服从该分布的变量用 Z（或 z）表示。</em></p>
                `;

                // 渲染解析
                explanation.innerHTML = `
                    <h3>题目解析：</h3>
                    <p>题目要求我们找到值 <span class="math">c</span>，使得 <span class="math">P(Z <= c) = ${params.probability}</span>。也就是说，我们需要找到值 <span class="math">c</span>，使得标准正态密度曲线在 <span class="math">c</span> 左侧的面积为 ${params.probability}。</p>

                    <p>因为密度曲线下的总面积为 1，我们可以使用互补规则：</p>
                    <div class="formula-box">
                        p = 1 - ${params.probability} = ${params.complement}
                    </div>
                    <p>其中 <span class="math">p</span> 是 <span class="math">Z</span> 不小于 <span class="math">c</span> 的概率（即密度曲线在 <span class="math">c</span> 右侧的面积）。</p>

                    <p>因此，<span class="math">c</span> 是在密度曲线右侧截断面积为 ${params.complement} 的值。这个值记为 <span class="math">z<sub>${params.complement}</sub></span>。通过标准正态表或计算器查找：</p>
                    <div class="formula-box">
                        c = z<sub>${params.complement}</sub> = ${params.answer.toFixed(2)}
                    </div>
                    <p>${params.explanation}</p>

                    <p><strong>正确答案：${params.answer.toFixed(2)}</strong></p>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 清除输入和反馈
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈和解析
                const feedback = document.getElementById('feedback');
                feedback.classList.remove('show');
                const explanation = document.getElementById('explanation');
                explanation.style.display = 'none';
                const showExpBtn = document.getElementById('show-explanation-btn');
                showExpBtn.style.display = 'none';
                showExpBtn.textContent = '查看答案解析';

                isSubmitted = false;
            }

            // ==================== 事件处理 ====================

            let isSubmitted = false;
            let score = 0;
            let answered = 0;
            let correctCount = 0;
            let incorrectCount = 0;

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtnEl = document.getElementById('refresh-btn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title-text');
            const feedbackText = document.getElementById('feedback-text');
            const scoreElement = document.getElementById('score');
            const answeredElement = document.getElementById('answered');
            const correctCountElement = document.getElementById('correct-count');
            const incorrectCountElement = document.getElementById('incorrect-count');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanation = document.getElementById('explanation');
            const answerInput = document.getElementById('answer-input');
            const feedbackInline = document.getElementById('feedback-inline');

            // 刷新参数按钮
            refreshBtnEl.addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(answerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请先输入一个有效的数字答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                answered++;
                answeredElement.textContent = answered;

                const params = questionParams[currentParamIndex];
                const tolerance = 0.01;
                const isCorrect = Math.abs(userAnswer - params.answer) <= tolerance;

                // 更新统计
                if (isCorrect) {
                    score += 100;
                    correctCount++;
                    answerInput.classList.add('correct');
                    feedbackInline.textContent = '正确！';
                    feedbackInline.className = 'feedback-inline correct';
                    feedbackTitle.textContent = "回答正确！";
                    feedbackText.textContent = `您输入了 ${userAnswer.toFixed(2)}，这是正确答案。`;
                    feedback.classList.remove('incorrect-feedback');
                    feedback.classList.add('correct-feedback');
                } else {
                    incorrectCount++;
                    answerInput.classList.add('incorrect');
                    feedbackInline.textContent = `不正确。正确答案是 ${params.answer.toFixed(2)}`;
                    feedbackInline.className = 'feedback-inline incorrect';
                    feedbackTitle.textContent = "回答错误！";
                    feedbackText.textContent = `您输入了 ${userAnswer.toFixed(2)}，但正确答案是 ${params.answer.toFixed(2)}。`;
                    feedback.classList.remove('correct-feedback');
                    feedback.classList.add('incorrect-feedback');
                }

                // 更新统计显示
                scoreElement.textContent = score;
                correctCountElement.textContent = correctCount;
                incorrectCountElement.textContent = incorrectCount;

                // 显示反馈
                feedback.classList.add('show');

                // 显示解析按钮
                showExplanationBtn.style.display = 'inline-block';

                // 禁用输入
                answerInput.disabled = true;
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                // 重置输入
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 隐藏反馈
                feedback.classList.remove('show');

                // 隐藏解析按钮和内容
                showExplanationBtn.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';
                explanation.style.display = 'none';

                // 重置状态
                isSubmitted = false;
            });

            // ==================== 初始化 ====================
            renderQuestion();

            // 初始统计显示
            scoreElement.textContent = score;
            answeredElement.textContent = answered;
            correctCountElement.textContent = correctCount;
            incorrectCountElement.textContent = incorrectCount;
        });
    </script>
</body>
</html>
