<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涉及并交概率的文字题 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 6px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .question-title i {
            color: #3498db;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 25px;
            line-height: 1.8;
            color: #34495e;
        }

        .probability-formula {
            background-color: #e8f4fc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px dashed #3498db;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-input-section {
            background-color: white;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .input-group label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
        }

        .answer-input {
            width: 150px;
            padding: 12px 15px;
            font-size: 1.2rem;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .input-hint {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .feedback-container {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
            border-left: 6px solid #9b59b6;
        }

        .feedback-title {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-title i {
            color: #9b59b6;
        }

        .answer-feedback {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
        }

        .correct-feedback {
            background-color: #d5f4e6;
            color: #27ae60;
            border-left: 5px solid #2ecc71;
        }

        .incorrect-feedback {
            background-color: #fadbd8;
            color: #c0392b;
            border-left: 5px solid #e74c3c;
        }

        .explanation {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
        }

        .explanation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .explanation p {
            margin-bottom: 15px;
            color: #34495e;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            background-color: #2c3e50;
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .stats-container {
                flex-direction: column;
                gap: 20px;
            }

            .question-header {
                flex-direction: column;
                gap: 15px;
            }
        }

        .formula-step {
            margin: 10px 0;
            padding-left: 20px;
            border-left: 3px solid #3498db;
        }

        .final-answer {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }
    </style>

    <style>
    .show-explanation-btn {
        display: none;
        margin: 20px auto;
        padding: 14px 28px;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
    }
    .show-explanation-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
    }
    .explanation-section {
        display: none;
        margin-top: 20px;
    }
    </style>
    </head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 涉及并交概率的文字题</h1>
            <p class="subtitle">交互式概率问题解答与学习</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <h2 class="question-title"><i class="fas fa-question-circle"></i> 题目</h2>
                <button class="refresh-btn" onclick="refreshParams()">
                    <i class="fas fa-sync-alt"></i> 刷新参数
                </button>
            </div>
            <div class="question-text" id="question-text">
                <!-- 动态内容 -->
            </div>

            <h3 class="question-title"><i class="fas fa-list-ul"></i> 请输入你的答案：</h3>
            <div class="answer-input-section">
                <div class="input-group">
                    <label for="user-answer">概率值：</label>
                    <input type="text" id="user-answer" class="answer-input" autocomplete="off">
                </div>
                <p class="input-hint">提示：请将答案写成小数形式，使用容差为 0.01 的数值验证</p>
            </div>

            <div class="controls">
                <button id="submit-btn">
                    <i class="fas fa-paper-plane"></i> 提交答案
                </button>
                <button id="reset-btn">
                    <i class="fas fa-redo"></i> 重新作答
                </button>
            </div>
        </div>

        <div class="feedback-container" id="feedback">
            <h2 class="feedback-title"><i class="fas fa-chalkboard-teacher"></i> 题目解析</h2>
            <div id="answer-feedback" class="answer-feedback"></div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanation-section">
                <!-- 动态内容 -->
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-value" id="total-questions">1</div>
                <div class="stat-label">总题数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct-answers">0</div>
                <div class="stat-label">答对题数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">正确率</div>
            </div>
        </div>
    </div>

    <script>
        // 参数化数据集 - 5组不同的参数和预计算的答案
        const questionParams = [
            {
                context: '某次会议',
                group1: '医生',
                group2: '女性',
                pD: 0.68,
                pF: 0.56,
                pUnion: 0.78,
                correctAnswer: 0.46,
                explanation: {
                    pD: 0.68,
                    pF: 0.56,
                    pUnion: 0.78,
                    sum: 1.24,
                    answer: 0.46
                }
            },
            {
                context: '某公司员工调查',
                group1: '技术人员',
                group2: '管理人员',
                pD: 0.72,
                pF: 0.45,
                pUnion: 0.85,
                correctAnswer: 0.32,
                explanation: {
                    pD: 0.72,
                    pF: 0.45,
                    pUnion: 0.85,
                    sum: 1.17,
                    answer: 0.32
                }
            },
            {
                context: '某大学的学生群体',
                group1: '理工科学生',
                group2: '女生',
                pD: 0.55,
                pF: 0.48,
                pUnion: 0.73,
                correctAnswer: 0.30,
                explanation: {
                    pD: 0.55,
                    pF: 0.48,
                    pUnion: 0.73,
                    sum: 1.03,
                    answer: 0.30
                }
            },
            {
                context: '某医院的患者',
                group1: '高血压患者',
                group2: '糖尿病患者',
                pD: 0.35,
                pF: 0.28,
                pUnion: 0.48,
                correctAnswer: 0.15,
                explanation: {
                    pD: 0.35,
                    pF: 0.28,
                    pUnion: 0.48,
                    sum: 0.63,
                    answer: 0.15
                }
            },
            {
                context: '某社区的居民',
                group1: '养宠物的人',
                group2: '有车的人',
                pD: 0.42,
                pF: 0.58,
                pUnion: 0.76,
                correctAnswer: 0.24,
                explanation: {
                    pD: 0.42,
                    pF: 0.58,
                    pUnion: 0.76,
                    sum: 1.00,
                    answer: 0.24
                }
            }
        ];

        let currentIndex = 0;
        let currentAnswer = 0.46;
        let isSubmitted = false;
        let correctCount = 0;
        const totalQuestions = 1;
        const TOLERANCE = 0.01; // Tolerance for numerical comparison

        const userAnswerInput = document.getElementById('user-answer');

        // 生成干扰选项
        function generateDistractors(correctAnswer) {
            const distractors = new Set();
            distractors.add(correctAnswer.toFixed(2));

            // 生成3个不同的干扰项
            const offsets = [0.08, -0.06, 0.12, -0.10, 0.16, -0.14];
            let offsetIndex = 0;

            while (distractors.size < 4 && offsetIndex < offsets.length) {
                let distractor = correctAnswer + offsets[offsetIndex];
                if (distractor > 0 && distractor < 1) {
                    distractors.add(distractor.toFixed(2));
                }
                offsetIndex++;
            }

            // 如果还不够4个，添加更多随机选项
            while (distractors.size < 4) {
                let randomDistractor = Math.random() * 0.6 + 0.1;
                distractors.add(randomDistractor.toFixed(2));
            }

            // 转换为数组并打乱顺序
            return Array.from(distractors).sort(() => Math.random() - 0.5);
        }

        // 渲染题目
        function renderQuestion() {
            const params = questionParams[currentIndex];
            currentAnswer = params.correctAnswer;

            // 渲染题目文本
            document.getElementById('question-text').innerHTML = `
                <p>如果${params.context}中，有 ${(params.pD * 100).toFixed(0)}% 的人是${params.group1}，${(params.pF * 100).toFixed(0)}% 的人是${params.group2}，${(params.pUnion * 100).toFixed(0)}% 的人是${params.group1}或${params.group2}（或两者皆是），那么从中随机选择一个人，此人既是${params.group1}又是${params.group2}的概率是多少？</p>
                <p>请将答案写成小数形式（而非百分比形式）。</p>

                <div class="probability-formula">
                    <p>设 D 表示事件"被选中的人是${params.group1}"，设 F 表示事件"被选中的人是${params.group2}"。</p>
                    <p>我们需要求概率 P(D ∩ F)。</p>
                </div>
            `;

            // 清空输入框
            if (userAnswerInput) {
                userAnswerInput.value = '';
                userAnswerInput.classList.remove('correct', 'incorrect');
                userAnswerInput.disabled = false;
            }

            // 渲染解析
            document.getElementById('explanation-section').innerHTML = `
                <h3><i class="fas fa-calculator"></i> 解题步骤</h3>
                <p>已知：</p>
                <div class="formula-step">P(D) = ${params.explanation.pD}（${params.group1}概率）</div>
                <div class="formula-step">P(F) = ${params.explanation.pF}（${params.group2}概率）</div>
                <div class="formula-step">P(D ∪ F) = ${params.explanation.pUnion}（${params.group1}或${params.group2}概率）</div>

                <p>使用概率的加法公式：</p>
                <div class="formula-step">P(D ∪ F) = P(D) + P(F) − P(D ∩ F)</div>
                <div class="formula-step">${params.explanation.pUnion} = ${params.explanation.pD} + ${params.explanation.pF} − P(D ∩ F)</div>

                <p>解出 P(D ∩ F)：</p>
                <div class="formula-step">P(D ∩ F) = ${params.explanation.pD} + ${params.explanation.pF} − ${params.explanation.pUnion}</div>
                <div class="formula-step">P(D ∩ F) = ${params.explanation.sum} − ${params.explanation.pUnion}</div>

                <div class="final-answer">P(D ∩ F) = ${params.explanation.answer.toFixed(2)}</div>

                <p>因此，从中随机选择一个人，此人既是${params.group1}又是${params.group2}的概率是 <strong>${params.explanation.answer.toFixed(2)}</strong>。</p>
            `;
        }

        // 刷新参数
        function refreshParams() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questionParams.length);
            } while (newIndex === currentIndex && questionParams.length > 1);

            currentIndex = newIndex;
            isSubmitted = false;

            // 重置UI
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('show-explanation-btn').style.display = 'none';
            document.getElementById('explanation-section').classList.remove('show');
            document.getElementById('explanation-section').style.display = 'none';

            renderQuestion();
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 初始化渲染
            renderQuestion();

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanation-section');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedbackContainer = document.getElementById('feedback');
            const answerFeedback = document.getElementById('answer-feedback');
            const correctAnswersEl = document.getElementById('correct-answers');
            const accuracyEl = document.getElementById('accuracy');

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (!selectedOption) {
                    alert('请先选择一个答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;
                const userAnswer = selectedOption.getAttribute('data-value');
                const isCorrect = userAnswer === currentAnswer.toFixed(2);

                // 显示反馈
                feedbackContainer.style.display = 'block';

                // 更新选项样式
                const options = document.querySelectorAll('.option');
                options.forEach(option => {
                    const optionValue = option.getAttribute('data-value');
                    if (option === selectedOption && !isCorrect) {
                        option.classList.add('incorrect');
                    }
                });

                // 显示反馈信息
                if (isCorrect) {
                    answerFeedback.textContent = '恭喜！您的答案是正确的。';
                    answerFeedback.className = 'answer-feedback correct-feedback';
                    correctCount = 1;
                } else {
                    answerFeedback.textContent = '您的答案不正确。';
                    answerFeedback.className = 'answer-feedback incorrect-feedback';
                    correctCount = 0;
                }

                // 显示解析按钮
                document.getElementById('show-explanation-btn').style.display = 'inline-block';

                // 更新统计数据
                updateStats();

                // 滚动到反馈区域
                feedbackContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                refreshParams();
            });

            // 更新统计数据
            function updateStats() {
                correctAnswersEl.textContent = correctCount;
                const accuracy = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
                accuracyEl.textContent = `${accuracy}%`;
            }

            // 初始化统计数据
            updateStats();

            // 添加键盘支持
            document.addEventListener('keydown', function(event) {
                if (event.key >= '1' && event.key <= '4' && !isSubmitted) {
                    const options = document.querySelectorAll('.option');
                    const index = parseInt(event.key) - 1;
                    if (options[index]) {
                        options.forEach(opt => opt.classList.remove('selected'));
                        options[index].classList.add('selected');
                        selectedOption = options[index];
                    }
                }

                if (event.key === 'Enter' && !isSubmitted && selectedOption) {
                    submitBtn.click();
                }

                if (event.key === 'Escape' && isSubmitted) {
                    resetBtn.click();
                }
            });
        });
    </script>
</body>
</html>
