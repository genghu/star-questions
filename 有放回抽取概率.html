<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有放回抽取概率 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 6px solid #3498db;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        .question-title i {
            margin-right: 10px;
            color: #3498db;
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .math {
            font-family: 'Cambria Math', serif;
            background-color: #e8f4fc;
            padding: 3px 8px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
        }

        .answer-input-section {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .input-group label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
        }

        .answer-input {
            width: 150px;
            padding: 12px 15px;
            font-size: 1.2rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #d5f4e6;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        .input-hint {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button i {
            margin-right: 8px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .result-container {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-title {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .result-title i {
            margin-right: 10px;
        }

        .score {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: #3498db;
        }

        .explanation {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #2ecc71;
        }

        .explanation h3 {
            color: #27ae60;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .explanation h3 i {
            margin-right: 10px;
        }

        .step {
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 2px solid #3498db;
            padding-bottom: 15px;
        }

        .step:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .step-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dice"></i> 有放回抽取概率</h1>
            <p class="subtitle">概率论与数理统计 - 交互式答题系统</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <div class="question-title">
                    <i class="fas fa-question-circle"></i> 题目
                </div>
                <button class="refresh-params-btn" id="refreshBtn">
                    <i class="fas fa-random"></i> 刷新参数
                </button>
            </div>
            <div class="question-content" id="questionContent">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="answer-input-section">
            <div class="input-group">
                <label for="user-answer">请输入概率值：</label>
                <input type="text" id="user-answer" class="answer-input" autocomplete="off">
            </div>
            <p class="input-hint">提示：四舍五入到三位小数，使用容差为 0.001 的数值验证</p>
        </div>

        <div class="controls">
            <button id="submit-btn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button id="reset-btn">
                <i class="fas fa-redo"></i> 重新作答
            </button>
        </div>

        <div class="result-container" id="result-container">
            <div class="result-title">
                <i class="fas fa-chart-bar"></i> 答题结果
            </div>
            <div class="score" id="score">得分: 0/1</div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanationSection">
                <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                <div id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                { rolls: 6, target: 2, probNotTarget: '5/6', answer: '0.665', tolerance: 0.001 },
                { rolls: 5, target: 3, probNotTarget: '5/6', answer: '0.598', tolerance: 0.001 },
                { rolls: 4, target: 1, probNotTarget: '5/6', answer: '0.518', tolerance: 0.001 },
                { rolls: 7, target: 6, probNotTarget: '5/6', answer: '0.721', tolerance: 0.001 },
                { rolls: 8, target: 4, probNotTarget: '5/6', answer: '0.767', tolerance: 0.001 }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let submitted = false;
            const userAnswerInput = document.getElementById('user-answer');

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 计算答案
                const probNotTargetNum = 5/6;
                const probNone = Math.pow(probNotTargetNum, params.rolls);
                const probAtLeastOne = 1 - probNone;

                // 渲染问题文本
                document.getElementById('questionContent').innerHTML = `
                    <p>一颗均匀的骰子被投掷 ${params.rolls} 次。问至少有一次掷出 ${params.target} 的概率是多少？将你的答案四舍五入到三位小数。</p>
                    <p>注意，在 ${params.rolls} 次投掷中，结果要么是没有掷出 ${params.target}，要么是至少掷出一次 ${params.target}。因此，利用补集法则，我们可以写成：</p>
                    <p class="math">P(在 ${params.rolls} 次投掷中至少有一次 ${params.target}) = 1 - P(在 ${params.rolls} 次投掷中没有 ${params.target})</p>
                    <p>对于每次投掷，掷出的点数不是 ${params.target} 的概率将是 5/6，因为这个事件相当于掷出五个非 ${params.target} 的数字之一。由于所有 ${params.rolls} 次投掷是独立的，我们有：</p>
                    <p class="math">P(在 ${params.rolls} 次投掷中没有 ${params.target}) = (5/6)^${params.rolls}</p>
                    <p>因此，</p>
                    <p class="math">P(在 ${params.rolls} 次投掷中至少有一次 ${params.target}) = 1 - (5/6)^${params.rolls} ≈ ${params.answer}</p>
                `;

                // 清空输入框
                if (userAnswerInput) {
                    userAnswerInput.value = '';
                    userAnswerInput.classList.remove('correct', 'incorrect');
                    userAnswerInput.disabled = false;
                }

                // 渲染解析
                document.getElementById('explanationContent').innerHTML = `
                    <div class="step">
                        <div class="step-title">步骤 1: 理解问题</div>
                        <p>我们需要计算一颗均匀骰子投掷 ${params.rolls} 次，至少有一次掷出 ${params.target} 的概率。使用补集法则可以简化计算。</p>
                    </div>
                    <div class="step">
                        <div class="step-title">步骤 2: 计算没有 ${params.target} 的概率</div>
                        <p>单次投掷不出现 ${params.target} 的概率是 <span class="math">5/6</span>（因为骰子有6个面，5个面不是 ${params.target}）。</p>
                        <p>由于 ${params.rolls} 次投掷是独立的，${params.rolls} 次都没有 ${params.target} 的概率是：</p>
                        <p class="math">P(在 ${params.rolls} 次投掷中没有 ${params.target}) = (5/6)^${params.rolls} = ${probNone.toFixed(4)}</p>
                    </div>
                    <div class="step">
                        <div class="step-title">步骤 3: 计算至少有一次 ${params.target} 的概率</div>
                        <p>使用补集法则：</p>
                        <p class="math">P(至少有一次 ${params.target}) = 1 - P(没有 ${params.target}) = 1 - (5/6)^${params.rolls}</p>
                    </div>
                    <div class="step">
                        <div class="step-title">步骤 4: 数值计算</div>
                        <p><span class="math">1 - ${probNone.toFixed(4)} = ${probAtLeastOne.toFixed(4)}</span></p>
                        <p>四舍五入到三位小数：<span class="math">${params.answer}</span></p>
                    </div>
                    <div class="step">
                        <div class="step-title">步骤 5: 结论</div>
                        <p>一颗均匀的骰子投掷 ${params.rolls} 次，至少有一次掷出 ${params.target} 的概率约为 <span class="math">${params.answer}</span>。</p>
                    </div>
                `;

                submitted = false;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;

                // 重置UI
                document.getElementById('result-container').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';

                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refreshBtn').addEventListener('click', refreshParams);

            // 显示答案解析按钮
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanationSection');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            document.getElementById('submit-btn').addEventListener('click', function() {
                const userAnswer = parseFloat(userAnswerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请输入有效的数字答案！');
                    return;
                }

                if (submitted) return;
                submitted = true;

                const params = questionParams[currentParamIndex];
                const correctAnswer = parseFloat(params.answer);
                const tolerance = params.tolerance;

                // 使用容差验证答案
                const isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;

                // 更新输入框样式
                if (isCorrect) {
                    userAnswerInput.classList.add('correct');
                } else {
                    userAnswerInput.classList.add('incorrect');
                }

                // 禁用输入框
                userAnswerInput.disabled = true;

                // 更新分数
                document.getElementById('score').textContent = `得分: ${isCorrect ? '1/1' : '0/1'}`;

                // 显示结果
                document.getElementById('result-container').classList.add('show');
                document.getElementById('show-explanation-btn').style.display = 'inline-block';

                // 滚动到结果区域
                document.getElementById('result-container').scrollIntoView({ behavior: 'smooth' });
            });

            // 重置答题
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置输入框
                userAnswerInput.value = '';
                userAnswerInput.classList.remove('correct', 'incorrect');
                userAnswerInput.disabled = false;

                submitted = false;

                // 隐藏反馈
                document.getElementById('result-container').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
