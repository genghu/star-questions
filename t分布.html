<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t分布 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 100, 150, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #3498db;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .question-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.1);
        }

        .question-number {
            display: inline-block;
            background: #3498db;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            text-align: center;
            line-height: 36px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-style: italic;
            background: #f0f8ff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #3498db;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .explanation-title {
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        .btn-refresh:hover {
            background: linear-gradient(135deg, #219a52, #27ae60);
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(39, 174, 96, 0.3);
        }

        .results {
            text-align: center;
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            border-radius: 15px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.8s;
        }

        .score {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .highlight {
            background-color: #fffacd;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .refresh-params-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .param-badge {
            background: #e8f8ef;
            color: #27ae60;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> t分布 - 概率计算</h1>
            <p class="subtitle">使用交互式界面解答关于t分布的概率问题</p>
        </header>


        <div class="question-container">
            <div class="question-card" id="question1">
                <div class="question-header">
                    <div class="question-number">1</div>
                    <button class="refresh-params-btn" data-question="1">
                        <i class="fas fa-random"></i> 刷新参数
                    </button>
                </div>
                <div class="question-text" id="questionText1">
                    <!-- 动态生成 -->
                </div>

                <div class="answer-input-container">
                    <label class="answer-label">请输入你的答案（保留三位小数）：</label>
                    <input type="text" class="answer-input" id="answer1">
                    <div class="tolerance-hint">容差：±0.01</div>
                    <div class="feedback-inline" id="feedback1"></div>
                </div>

                <button class="show-explanation-btn" data-question="1">查看答案解析</button>
                <div class="explanation" id="explanation1">
                    <div class="explanation-title">
                        <i class="fas fa-lightbulb"></i> 知识要点与解析
                    </div>
                    <div id="explanationContent1">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>

            <div class="question-card" id="question2">
                <div class="question-header">
                    <div class="question-number">2</div>
                    <button class="refresh-params-btn" data-question="2">
                        <i class="fas fa-random"></i> 刷新参数
                    </button>
                </div>
                <div class="question-text" id="questionText2">
                    <!-- 动态生成 -->
                </div>

                <div class="answer-input-container">
                    <label class="answer-label">请输入你的答案（保留三位小数）：</label>
                    <input type="text" class="answer-input" id="answer2">
                    <div class="tolerance-hint">容差：±0.01</div>
                    <div class="feedback-inline" id="feedback2"></div>
                </div>

                <button class="show-explanation-btn" data-question="2">查看答案解析</button>
                <div class="explanation" id="explanation2">
                    <div class="explanation-title">
                        <i class="fas fa-lightbulb"></i> 知识要点与解析
                    </div>
                    <div id="explanationContent2">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="submitBtn">
                <i class="fas fa-paper-plane"></i> 提交答案
            </button>
            <button class="btn btn-secondary" id="resetBtn">
                <i class="fas fa-redo"></i> 重新作答
            </button>
        </div>

        <div class="results" id="results">
            <h2><i class="fas fa-trophy"></i> 答题结果</h2>
            <div class="score" id="score">0/2</div>
            <div class="score-text" id="scoreText"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================

            // 问题1的参数集: 计算P(-t < t < t)，给定df和t值
            const question1Params = [
                { df: 9, t: 1.55, answer: 0.844, upperTail: 0.0778 },
                { df: 12, t: 1.78, answer: 0.901, upperTail: 0.0495 },
                { df: 15, t: 2.13, answer: 0.950, upperTail: 0.025 },
                { df: 8, t: 1.86, answer: 0.898, upperTail: 0.051 },
                { df: 20, t: 1.72, answer: 0.900, upperTail: 0.050 },
                { df: 6, t: 1.94, answer: 0.900, upperTail: 0.050 },
                { df: 10, t: 2.23, answer: 0.950, upperTail: 0.025 },
                { df: 25, t: 1.71, answer: 0.900, upperTail: 0.050 }
            ];

            // 问题2的参数集: 给定df和右尾概率，求临界值c
            const question2Params = [
                { df: 13, prob: 0.01, answer: 2.650 },
                { df: 10, prob: 0.05, answer: 1.812 },
                { df: 15, prob: 0.025, answer: 2.131 },
                { df: 20, prob: 0.01, answer: 2.528 },
                { df: 8, prob: 0.025, answer: 2.306 },
                { df: 12, prob: 0.05, answer: 1.782 },
                { df: 25, prob: 0.01, answer: 2.485 },
                { df: 6, prob: 0.025, answer: 2.447 }
            ];

            // 当前参数索引
            let currentParams = {
                q1: 0,
                q2: 0
            };

            let submitted = false;

            // ==================== 渲染函数 ====================

            function renderQuestion1() {
                const params = question1Params[currentParams.q1];
                const questionText = document.getElementById('questionText1');
                const explanationContent = document.getElementById('explanationContent1');

                // 渲染问题文本
                questionText.innerHTML = `考虑一个自由度为 ${params.df} 的 t 分布。计算 <span class="math">P(-${params.t} < t < ${params.t})</span>。将你的答案四舍五入到至少三位小数。`;

                // 渲染解析
                explanationContent.innerHTML = `
                    <p>计算 <span class="math">P(-${params.t} < t < ${params.t})</span>，其中 t 服从自由度为 ${params.df} 的 t 分布。</p>
                    <p><strong>解题方法：</strong>由于 t 分布是对称的，我们可以使用以下方法：</p>
                    <ol>
                        <li><span class="math">P(-${params.t} < t < ${params.t}) = 1 - 2P(t > ${params.t}) = 1 - 2(${params.upperTail}) ≈ ${params.answer}</span></li>
                    </ol>
                    <p><strong>注意：</strong>使用 t 分布表或计算器，输入 df = ${params.df}，得到 P(t > ${params.t}) ≈ ${params.upperTail}</p>
                    <p><strong>正确答案：${params.answer.toFixed(3)}</strong></p>
                `;
            }

            function renderQuestion2() {
                const params = question2Params[currentParams.q2];
                const questionText = document.getElementById('questionText2');
                const explanationContent = document.getElementById('explanationContent2');

                // 渲染问题文本
                questionText.innerHTML = `考虑一个自由度为 ${params.df} 的 t 分布。求值 <span class="math">c</span>，使得 <span class="math">P(t >= c) = ${params.prob}</span>。将你的答案四舍五入到至少三位小数。`;

                // 渲染解析
                explanationContent.innerHTML = `
                    <p>我们需要找到 <span class="math">c</span>，使得 <span class="math">P(t >= c) = ${params.prob}</span>，其中 t 有 ${params.df} 个自由度。</p>
                    <p><strong>解题提示：</strong>这意味着 <span class="math">c</span> 是自由度为 ${params.df} 的 t 分布的右尾临界值，即 <span class="math">t_${params.prob}</span>。</p>
                    <p><strong>计算方法：</strong>使用 t 分布表或计算器，输入 <span class="math">df = ${params.df}</span> 和右尾概率 <span class="math">${params.prob}</span>，得到 <span class="math">c ≈ ${params.answer}</span>。</p>
                    <p><strong>正确答案：${params.answer.toFixed(3)}</strong></p>
                `;
            }

            function refreshParams(questionNum) {
                const paramsArray = questionNum === 1 ? question1Params : question2Params;
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * paramsArray.length);
                } while (newIndex === currentParams[`q${questionNum}`] && paramsArray.length > 1);

                currentParams[`q${questionNum}`] = newIndex;

                if (questionNum === 1) {
                    renderQuestion1();
                } else {
                    renderQuestion2();
                }

                // 清除输入和反馈
                document.getElementById(`answer${questionNum}`).value = '';
                document.getElementById(`answer${questionNum}`).classList.remove('correct', 'incorrect');
                document.getElementById(`feedback${questionNum}`).className = 'feedback-inline';
                document.getElementById(`feedback${questionNum}`).textContent = '';

                // 隐藏解析
                const explanation = document.getElementById(`explanation${questionNum}`);
                explanation.classList.remove('show');
                const btn = document.querySelector(`.show-explanation-btn[data-question="${questionNum}"]`);
                if (btn) {
                    btn.style.display = 'none';
                    btn.textContent = '查看答案解析';
                }
            }

            // ==================== 事件处理 ====================

            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const results = document.getElementById('results');
            const scoreElement = document.getElementById('score');
            const scoreTextElement = document.getElementById('scoreText');

            // 刷新参数按钮
            document.querySelectorAll('.refresh-params-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionNum = parseInt(this.getAttribute('data-question'));
                    refreshParams(questionNum);
                });
            });

            // 显示答案解析按钮点击事件
            document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionId = this.getAttribute('data-question');
                    const explanation = document.getElementById(`explanation${questionId}`);
                    if (explanation) {
                        if (explanation.classList.contains('show')) {
                            explanation.classList.remove('show');
                            this.textContent = '查看答案解析';
                        } else {
                            explanation.classList.add('show');
                            this.textContent = '隐藏答案解析';
                        }
                    }
                });
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                if (submitted) return;

                let correctCount = 0;
                const totalQuestions = 2;
                const tolerance = 0.01;

                // 检查问题1
                const answer1Input = document.getElementById('answer1');
                const userAnswer1 = parseFloat(answer1Input.value);
                const correctAnswer1 = question1Params[currentParams.q1].answer;
                const feedback1 = document.getElementById('feedback1');

                if (!isNaN(userAnswer1)) {
                    if (Math.abs(userAnswer1 - correctAnswer1) <= tolerance) {
                        correctCount++;
                        answer1Input.classList.add('correct');
                        feedback1.textContent = '正确！';
                        feedback1.className = 'feedback-inline correct';
                    } else {
                        answer1Input.classList.add('incorrect');
                        feedback1.textContent = `不正确。正确答案是 ${correctAnswer1.toFixed(3)}`;
                        feedback1.className = 'feedback-inline incorrect';
                    }
                } else {
                    answer1Input.classList.add('incorrect');
                    feedback1.textContent = '请输入有效数字';
                    feedback1.className = 'feedback-inline incorrect';
                }

                // 检查问题2
                const answer2Input = document.getElementById('answer2');
                const userAnswer2 = parseFloat(answer2Input.value);
                const correctAnswer2 = question2Params[currentParams.q2].answer;
                const feedback2 = document.getElementById('feedback2');

                if (!isNaN(userAnswer2)) {
                    if (Math.abs(userAnswer2 - correctAnswer2) <= tolerance) {
                        correctCount++;
                        answer2Input.classList.add('correct');
                        feedback2.textContent = '正确！';
                        feedback2.className = 'feedback-inline correct';
                    } else {
                        answer2Input.classList.add('incorrect');
                        feedback2.textContent = `不正确。正确答案是 ${correctAnswer2.toFixed(3)}`;
                        feedback2.className = 'feedback-inline incorrect';
                    }
                } else {
                    answer2Input.classList.add('incorrect');
                    feedback2.textContent = '请输入有效数字';
                    feedback2.className = 'feedback-inline incorrect';
                }

                // 显示答案解析按钮
                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.style.display = 'inline-block';
                });

                // 显示结果
                const score = `${correctCount}/${totalQuestions}`;
                scoreElement.textContent = score;

                let scoreText = '';
                if (correctCount === totalQuestions) {
                    scoreText = '完美！所有答案都正确！';
                } else if (correctCount >= totalQuestions / 2) {
                    scoreText = '不错！继续努力！';
                } else {
                    scoreText = '需要更多练习，加油！';
                }

                scoreTextElement.textContent = scoreText;
                results.classList.add('show');

                // 滚动到结果区域
                results.scrollIntoView({ behavior: 'smooth' });

                submitted = true;
            });

            // 重置答题
            resetBtn.addEventListener('click', function() {
                // 清除所有输入和样式
                for (let i = 1; i <= 2; i++) {
                    const input = document.getElementById(`answer${i}`);
                    input.value = '';
                    input.classList.remove('correct', 'incorrect');
                    document.getElementById(`feedback${i}`).className = 'feedback-inline';
                    document.getElementById(`feedback${i}`).textContent = '';
                }

                // 隐藏所有解析
                document.querySelectorAll('.explanation').forEach(exp => {
                    exp.classList.remove('show');
                });

                // 隐藏答案解析按钮
                document.querySelectorAll('.show-explanation-btn').forEach(btn => {
                    btn.style.display = 'none';
                    btn.textContent = '查看答案解析';
                });

                // 隐藏结果
                results.classList.remove('show');

                // 重置状态
                submitted = false;

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion1();
            renderQuestion2();
        });
    </script>
</body>
</html>
