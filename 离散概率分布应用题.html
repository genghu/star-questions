<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散概率分布应用题</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #0052cc;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e6f0ff;
        }
        .meta-info {
            background-color: #e6f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.9em;
            color: #0052cc;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .question-header h2 {
            color: #0052cc;
            margin: 0;
        }
        .question-section {
            background-color: #f9fbff;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #4d94ff;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        th, td {
            border: 1px solid #cce0ff;
            padding: 15px;
            text-align: center;
        }
        th {
            background-color: #e6f0ff;
            color: #0052cc;
            font-weight: 600;
        }
        .answer-table {
            max-width: 500px;
            margin: 30px auto;
        }
        .answer-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #cce0ff;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .answer-input:focus {
            border-color: #0052cc;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.2);
        }
        .answer-input.correct {
            border-color: #28a745;
            background-color: #d4edda;
        }
        .answer-input.incorrect {
            border-color: #dc3545;
            background-color: #f8d7da;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #submitBtn {
            background-color: #0052cc;
            color: white;
        }
        #submitBtn:hover {
            background-color: #0047b3;
            transform: scale(1.05);
        }
        #nextBtn {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
        }
        #nextBtn:hover {
            transform: scale(1.05);
        }
        .feedback {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        .feedback.correct {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .feedback.incorrect {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .quiz-history {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }
        .quiz-history-title {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        .quiz-history-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        .history-icon.correct {
            background-color: #28a745;
        }
        .history-icon.incorrect {
            background-color: #dc3545;
        }
        .explanation {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-top: 30px;
            border-left: 5px solid #17a2b8;
        }
        .explanation h3 {
            color: #17a2b8;
            margin-top: 0;
        }
        .math {
            font-family: 'Cambria Math', serif;
            font-style: italic;
        }
        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>离散概率分布应用题</h1>

    

        <div class="question-section">
            <div class="question-header">
                <h2>题目内容</h2>
            </div>
            <div id="questionContent">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="controls">
            <button id="submitBtn">提交答案</button>
            <button id="nextBtn">下一题</button>
        </div>

        <div class="feedback" id="feedback">
            <h3 id="feedbackTitle"></h3>
            <p id="feedbackText"></p>
        </div>

        <div class="quiz-history" id="quizHistory">
            <div class="quiz-history-title">答题记录</div>
            <div class="quiz-history-icons" id="historyIcons">
                <!-- 动态生成图标 -->
            </div>
        </div>

        <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
        <div class="explanation-section explanation" id="explanation-section">
            <h3>题目解析与解答</h3>
            <div id="explanationContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    // 原题: X = -2R^2 - 4R + 1
                    scenario: '假设某个家庭的三个孩子的性别即将揭晓。因此，结果是"女孩"(g)和"男孩"(b)的三元组，我们将其写作 gbg、bbb 等。对于每个结果，令 R 为随机变量，用于计算每个结果中男孩的数量。例如，如果结果是 gbg，则 R(gbg) = 1。假设随机变量 X 根据 R 定义如下：X = -2R^2 - 4R + 1。',
                    formula: 'X = -2R^2 - 4R + 1',
                    xValues: [-3, -3, -1, -1, -1, -3, -1, 5],
                    uniqueXValues: [-3, -1, 5],
                    probabilities: ['3/8', '4/8', '1/8'],
                    outcomeOrder: ['ggg', 'ggb', 'gbg', 'bgg', 'gbb', 'bgb', 'bbg', 'bbb'],
                    outcomes: {
                        '-3': ['ggg', 'ggb', 'bbg'],
                        '-1': ['gbg', 'bgg', 'bgb', 'gbb'],
                        '5': ['bbb']
                    }
                },
                {
                    // X = R^2 - 3R + 2
                    scenario: '某实验中有三个独立的硬币被同时抛掷。结果用"正面"(H)和"反面"(T)的三元组表示，如 HHT、TTT 等。对于每个结果，令 R 为随机变量，用于计算每个结果中正面的数量。假设随机变量 X 根据 R 定义如下：X = R^2 - 3R + 2。',
                    formula: 'X = R^2 - 3R + 2',
                    xValues: [2, 0, 0, 0, 0, 0, 0, 2],
                    uniqueXValues: [0, 2],
                    probabilities: ['6/8', '2/8'],
                    outcomeOrder: ['HHH', 'HHT', 'HTH', 'THH', 'HTT', 'THT', 'TTH', 'TTT'],
                    outcomes: {
                        '0': ['HHT', 'HTH', 'THH', 'HTT', 'THT', 'TTH'],
                        '2': ['HHH', 'TTT']
                    }
                },
                {
                    // X = 2R + 1
                    scenario: '某盒子里有三个球，每个球被随机抽出后放回，记录每次抽到红球(R)或蓝球(B)的结果。结果用三元组表示，如 RBB、RRR 等。对于每个结果，令 R 为随机变量，用于计算每个结果中红球的数量。假设随机变量 X 根据 R 定义如下：X = 2R + 1。',
                    formula: 'X = 2R + 1',
                    xValues: [1, 3, 3, 3, 5, 5, 5, 7],
                    uniqueXValues: [1, 3, 5, 7],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['BBB', 'RBB', 'BRB', 'BBR', 'RRB', 'RBR', 'BRR', 'RRR'],
                    outcomes: {
                        '1': ['BBB'],
                        '3': ['RBB', 'BRB', 'BBR'],
                        '5': ['RRB', 'RBR', 'BRR'],
                        '7': ['RRR']
                    }
                },
                {
                    // X = -R^2 + 4
                    scenario: '某个电子设备有三个开关，每个开关可以是开(1)或关(0)状态。结果用三元组表示，如 101、111 等。对于每个结果，令 R 为随机变量，用于计算每个结果中开启状态开关的数量。假设随机变量 X 根据 R 定义如下：X = -R^2 + 4。',
                    formula: 'X = -R^2 + 4',
                    xValues: [4, 3, 3, 3, 0, 0, 0, -5],
                    uniqueXValues: [-5, 0, 3, 4],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['000', '001', '010', '100', '011', '101', '110', '111'],
                    outcomes: {
                        '4': ['000'],
                        '3': ['001', '010', '100'],
                        '0': ['011', '101', '110'],
                        '-5': ['111']
                    }
                },
                {
                    // X = 3R - 6
                    scenario: '某骰子游戏同时掷三个骰子，只记录每个骰子是否为偶数(E)或奇数(O)。结果用三元组表示，如 EEO、OOO 等。对于每个结果，令 R 为随机变量，用于计算每个结果中偶数的数量。假设随机变量 X 根据 R 定义如下：X = 3R - 6。',
                    formula: 'X = 3R - 6',
                    xValues: [-6, -3, -3, -3, 0, 0, 0, 3],
                    uniqueXValues: [-6, -3, 0, 3],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['OOO', 'EOO', 'OEO', 'OOE', 'EEO', 'EOE', 'OEE', 'EEE'],
                    outcomes: {
                        '-6': ['OOO'],
                        '-3': ['EOO', 'OEO', 'OOE'],
                        '0': ['EEO', 'EOE', 'OEE'],
                        '3': ['EEE']
                    }
                },
                {
                    // X = R^3 - 6R
                    scenario: '某灯泡测试系统同时测试三个灯泡，每个灯泡可能是亮(L)或灭(D)状态。结果用三元组表示，如 LLD、DDD 等。对于每个结果，令 R 为随机变量，用于计算每个结果中亮灯的数量。假设随机变量 X 根据 R 定义如下：X = R^3 - 6R。',
                    formula: 'X = R^3 - 6R',
                    xValues: [0, -5, -5, -5, -4, -4, -4, 9],
                    uniqueXValues: [-5, -4, 0, 9],
                    probabilities: ['3/8', '3/8', '1/8', '1/8'],
                    outcomeOrder: ['DDD', 'LDD', 'DLD', 'DDL', 'LLD', 'LDL', 'DLL', 'LLL'],
                    outcomes: {
                        '0': ['DDD', 'LLL'],
                        '-5': ['LLD', 'LDL', 'DLL'],
                        '-4': ['LDD', 'DLD', 'DDL'],
                        '9': ['LLL']
                    }
                },
                // ========== 新增14组参数 ==========
                {
                    // 2枚硬币
                    scenario: '同时抛掷两枚硬币，记录每枚硬币是正面(H)还是反面(T)。结果用二元组表示，如 HH、HT 等。对于每个结果，令 R 为随机变量，用于计算每个结果中正面的数量。假设随机变量 X 根据 R 定义如下：X = 2R + 1。',
                    formula: 'X = 2R + 1',
                    xValues: [5, 3, 3, 1],
                    uniqueXValues: [1, 3, 5],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['HH', 'HT', 'TH', 'TT']
                },
                {
                    // 2个开关
                    scenario: '某个设备有两个开关，每个开关可以是开(1)或关(0)状态。结果用二元组表示，如 01、11 等。对于每个结果，令 R 为随机变量，用于计算每个结果中开启状态开关的数量。假设随机变量 X 根据 R 定义如下：X = R² - 2。',
                    formula: 'X = R² - 2',
                    xValues: [2, -1, -1, -2],
                    uniqueXValues: [-2, -1, 2],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['11', '10', '01', '00']
                },
                {
                    // 2个孩子
                    scenario: '某家庭有两个孩子，记录每个孩子的性别是男孩(b)还是女孩(g)。结果用二元组表示，如 bg、gg 等。对于每个结果，令 R 为随机变量，用于计算每个结果中男孩的数量。假设随机变量 X 根据 R 定义如下：X = 3R - 3。',
                    formula: 'X = 3R - 3',
                    xValues: [3, 0, 0, -3],
                    uniqueXValues: [-3, 0, 3],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['bb', 'bg', 'gb', 'gg']
                },
                {
                    // 2次射击
                    scenario: '某射击运动员进行两次射击，每次射击可能命中(H)或未命中(M)。结果用二元组表示，如 HM、HH 等。对于每个结果，令 R 为随机变量，用于计算每个结果中命中的次数。假设随机变量 X 根据 R 定义如下：X = R² + R。',
                    formula: 'X = R² + R',
                    xValues: [6, 2, 2, 0],
                    uniqueXValues: [0, 2, 6],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['HH', 'HM', 'MH', 'MM']
                },
                {
                    // 2次抽奖
                    scenario: '某人参加两次抽奖活动，每次抽奖可能中奖(W)或不中奖(L)。结果用二元组表示，如 WL、WW 等。对于每个结果，令 R 为随机变量，用于计算每个结果中中奖的次数。假设随机变量 X 根据 R 定义如下：X = 5R - 3。',
                    formula: 'X = 5R - 3',
                    xValues: [7, 2, 2, -3],
                    uniqueXValues: [-3, 2, 7],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['WW', 'WL', 'LW', 'LL']
                },
                {
                    // 2个骰子（奇偶）
                    scenario: '同时掷两个骰子，只记录每个骰子点数是偶数(E)还是奇数(O)。结果用二元组表示，如 EO、EE 等。对于每个结果，令 R 为随机变量，用于计算每个结果中偶数的个数。假设随机变量 X 根据 R 定义如下：X = 2R² - 4。',
                    formula: 'X = 2R² - 4',
                    xValues: [4, -2, -2, -4],
                    uniqueXValues: [-4, -2, 4],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['EE', 'EO', 'OE', 'OO']
                },
                {
                    // 2个灯泡
                    scenario: '某设备有两个灯泡，每个灯泡可能是亮(L)或灭(D)状态。结果用二元组表示，如 LD、LL 等。对于每个结果，令 R 为随机变量，用于计算每个结果中亮灯的数量。假设随机变量 X 根据 R 定义如下：X = R² + 2。',
                    formula: 'X = R² + 2',
                    xValues: [6, 3, 3, 2],
                    uniqueXValues: [2, 3, 6],
                    probabilities: ['1/4', '2/4', '1/4'],
                    outcomeOrder: ['LL', 'LD', 'DL', 'DD']
                },
                {
                    // 3次投篮
                    scenario: '某篮球运动员进行三次投篮，每次投篮可能进球(H)或不进球(M)。结果用三元组表示，如 HHM、MMM 等。对于每个结果，令 R 为随机变量，用于计算每个结果中进球的次数。假设随机变量 X 根据 R 定义如下：X = R² - 2R。',
                    formula: 'X = R² - 2R',
                    xValues: [3, 0, 0, 0, -1, -1, -1, 0],
                    uniqueXValues: [-1, 0, 3],
                    probabilities: ['3/8', '4/8', '1/8'],
                    outcomeOrder: ['HHH', 'HHM', 'HMH', 'MHH', 'HMM', 'MHM', 'MMH', 'MMM']
                },
                {
                    // 3个信号灯
                    scenario: '某路口有三个信号灯，每个信号灯可能是红灯(R)或绿灯(G)。结果用三元组表示，如 RGG、RRR 等。对于每个结果，令 R 为随机变量，用于计算每个结果中红灯的个数。假设随机变量 X 根据 R 定义如下：X = -R + 4。',
                    formula: 'X = -R + 4',
                    xValues: [1, 2, 2, 2, 3, 3, 3, 4],
                    uniqueXValues: [1, 2, 3, 4],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['RRR', 'RRG', 'RGR', 'GRR', 'RGG', 'GRG', 'GGR', 'GGG']
                },
                {
                    // 3道判断题
                    scenario: '某学生回答三道判断题，每道题可能判断正确(T)或错误(F)。结果用三元组表示，如 TTF、FFF 等。对于每个结果，令 R 为随机变量，用于计算每个结果中答对的题数。假设随机变量 X 根据 R 定义如下：X = 2R - 4。',
                    formula: 'X = 2R - 4',
                    xValues: [2, 0, 0, 0, -2, -2, -2, -4],
                    uniqueXValues: [-4, -2, 0, 2],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['TTT', 'TTF', 'TFT', 'FTT', 'TFF', 'FTF', 'FFT', 'FFF']
                },
                {
                    // 3只股票
                    scenario: '某投资者持有三只股票，每只股票今天可能上涨(U)或下跌(D)。结果用三元组表示，如 UUD、DDD 等。对于每个结果，令 R 为随机变量，用于计算每个结果中上涨的股票数。假设随机变量 X 根据 R 定义如下：X = R² - 3。',
                    formula: 'X = R² - 3',
                    xValues: [6, 1, 1, 1, -2, -2, -2, -3],
                    uniqueXValues: [-3, -2, 1, 6],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['UUU', 'UUD', 'UDU', 'DUU', 'UDD', 'DUD', 'DDU', 'DDD']
                },
                {
                    // 3个电池
                    scenario: '某手电筒需要三个电池，每个电池可能是好(G)或坏(B)。结果用三元组表示，如 GGB、BBB 等。对于每个结果，令 R 为随机变量，用于计算每个结果中好电池的数量。假设随机变量 X 根据 R 定义如下：X = 4R - 5。',
                    formula: 'X = 4R - 5',
                    xValues: [7, 3, 3, 3, -1, -1, -1, -5],
                    uniqueXValues: [-5, -1, 3, 7],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['GGG', 'GGB', 'GBG', 'BGG', 'GBB', 'BGB', 'BBG', 'BBB']
                },
                {
                    // 3次掷骰子（>3）
                    scenario: '同时掷三个骰子，只记录每个骰子点数是否大于3（H表示大于3，L表示不大于3）。结果用三元组表示，如 HHL、LLL 等。对于每个结果，令 R 为随机变量，用于计算每个结果中点数大于3的次数。假设随机变量 X 根据 R 定义如下：X = R² + R。',
                    formula: 'X = R² + R',
                    xValues: [12, 6, 6, 6, 2, 2, 2, 0],
                    uniqueXValues: [0, 2, 6, 12],
                    probabilities: ['1/8', '3/8', '3/8', '1/8'],
                    outcomeOrder: ['HHH', 'HHL', 'HLH', 'LHH', 'HLL', 'LHL', 'LLH', 'LLL']
                },
                {
                    // 3次射箭
                    scenario: '某射箭运动员进行三次射箭，每次射箭可能命中靶心(H)或未命中(M)。结果用三元组表示，如 HHM、MMM 等。对于每个结果，令 R 为随机变量，用于计算每个结果中命中靶心的次数。假设随机变量 X 根据 R 定义如下：X = -R² + 4R。',
                    formula: 'X = -R² + 4R',
                    xValues: [3, 4, 4, 4, 3, 3, 3, 0],
                    uniqueXValues: [0, 3, 4],
                    probabilities: ['1/8', '4/8', '3/8'],
                    outcomeOrder: ['HHH', 'HHM', 'HMH', 'MHH', 'HMM', 'MHM', 'MMH', 'MMM']
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let answered = false;
            let quizHistory = []; // 答题历史记录

            const submitBtn = document.getElementById('submitBtn');
            const nextBtn = document.getElementById('nextBtn');
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');
            const historyIcons = document.getElementById('historyIcons');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanation-section');
            const explanationContent = document.getElementById('explanationContent');

            // ==================== 渲染答题历史 ====================
            function renderHistory() {
                historyIcons.innerHTML = quizHistory.map((result, index) => {
                    if (result) {
                        // 正确 - 绿色圆圈带勾
                        return `<div class="history-icon" style="background-color: #28a745;" title="第${index + 1}题: 正确">✓</div>`;
                    } else {
                        // 错误 - 红色圆圈带叉
                        return `<div class="history-icon" style="background-color: #dc3545;" title="第${index + 1}题: 错误">✗</div>`;
                    }
                }).join('');
            }

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染题目内容
                const questionContent = document.getElementById('questionContent');

                // 使用参数集中的结果顺序
                const outcomes = params.outcomeOrder || ['ggg', 'ggb', 'gbg', 'bgg', 'gbb', 'bgb', 'bbg', 'bbb'];

                questionContent.innerHTML = `
                    <p>${params.scenario} X 的值因此为：</p>

                    <table>
                        <thead>
                            <tr>
                                <th>结果</th>
                                ${outcomes.map(o => `<th>${o}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>X 的值</strong></td>
                                ${params.xValues.map(v => `<td>${v}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>

                    <p>计算 X 的概率分布函数，即函数 p<sub>X</sub>(x)。首先，在第一行填入 X 的值。然后在第二行填入相应的概率。</p>

                    <table class="answer-table">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                ${(() => {
                                    const uniqueCount = params.uniqueXValues ? params.uniqueXValues.length : new Set(params.xValues).size;
                                    return Array(uniqueCount).fill(0).map((_, i) => `<th><input type="text" id="xValue${i}" class="answer-input" placeholder="?"></th>`).join('');
                                })()}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>P<sub>X</sub>(x)</strong></td>
                                ${(() => {
                                    const uniqueCount = params.uniqueXValues ? params.uniqueXValues.length : new Set(params.xValues).size;
                                    return Array(uniqueCount).fill(0).map((_, i) => `<td><input type="text" id="probValue${i}" class="answer-input" placeholder="?"></td>`).join('');
                                })()}
                            </tr>
                        </tbody>
                    </table>
                `;

                // 渲染解析
                const uniqueValues = params.xValues.filter((v, i, a) => a.indexOf(v) === i);
                const probMap = {};
                params.xValues.forEach(v => {
                    probMap[v] = (probMap[v] || 0) + 1;
                });

                explanationContent.innerHTML = `
                    <p>要计算 X 的概率分布 p<sub>X</sub>(x) 的值，我们使用定义 p<sub>X</sub>(x) = P(X = x)。由于所有结果等可能，后者的概率可以直接从 X 的定义得出。</p>
                    <p>根据公式 <span class="math">${params.formula}</span>，统计各X值对应的结果数量：</p>
                    <ul>
                        ${uniqueValues.map(v => {
                            const count = probMap[v];
                            return `<li>X 取值 ${v} 的结果共有 <strong>${count}</strong> 个</li>`;
                        }).join('')}
                    </ul>
                    <p>总共有 8 种等可能的结果，因此：</p>
                    <ul>
                        ${uniqueValues.map(v => {
                            const count = probMap[v];
                            return `<li>p<sub>X</sub>(${v}) = ${count}/8</li>`;
                        }).join('')}
                    </ul>
                    <p>因此，正确的概率分布表为：</p>
                    <table style="max-width: 400px; margin: 10px auto;">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                ${uniqueValues.map(v => `<th>${v}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>P<sub>X</sub>(x)</strong></td>
                                ${uniqueValues.map(v => `<td>${probMap[v]}/8</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                    <p>注意这些概率之和为 1 (${uniqueValues.map(v => `${probMap[v]}/8`).join(' + ')} = 8/8 = 1)。</p>
                `;

                // 重置状态
                answered = false;
                feedback.style.display = 'none';
                showExplanationBtn.style.display = 'none';
                explanationSection.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';
            }

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const params = questionParams[currentParamIndex];

                // 获取正确答案
                const uniqueValues = params.uniqueXValues || [...new Set(params.xValues)];
                const probMap = {};
                params.xValues.forEach(v => {
                    probMap[v] = (probMap[v] || 0) + 1;
                });

                // 检查学生填写的答案
                let xValuesCorrect = true;
                let probsCorrect = true;

                // 收集学生填写的X值
                const studentXValues = [];
                for (let i = 0; i < uniqueValues.length; i++) {
                    const input = document.getElementById(`xValue${i}`);
                    if (input) {
                        const value = input.value.trim();
                        const numValue = parseFloat(value);
                        if (!isNaN(numValue)) {
                            studentXValues.push(numValue);
                        } else {
                            studentXValues.push(value);
                        }
                    }
                }

                // 检查X值是否完全匹配（不考虑顺序）
                const sortedStudent = [...studentXValues].sort((a, b) => a - b);
                const sortedCorrect = [...uniqueValues].sort((a, b) => a - b);

                for (let i = 0; i < uniqueValues.length; i++) {
                    const input = document.getElementById(`xValue${i}`);
                    if (input) {
                        const numValue = parseFloat(input.value.trim());
                        // 检查是否在正确答案中
                        if (uniqueValues.includes(numValue)) {
                            input.classList.add('correct');
                        } else {
                            xValuesCorrect = false;
                            input.classList.add('incorrect');
                        }
                    }
                }

                // 检查是否所有X值都正确且无重复
                if (sortedStudent.length !== sortedCorrect.length ||
                    !sortedStudent.every((v, i) => v === sortedCorrect[i])) {
                    xValuesCorrect = false;
                }

                // 检查概率值
                for (let i = 0; i < uniqueValues.length; i++) {
                    const input = document.getElementById(`probValue${i}`);
                    const xInput = document.getElementById(`xValue${i}`);
                    if (input && xInput) {
                        const probValue = input.value.trim();
                        const xValue = parseFloat(xInput.value.trim());

                        // 获取对应X值的正确概率
                        const correctCount = probMap[xValue];
                        const correctProb = `${correctCount}/8`;

                        // 检查概率格式 (支持 x/8 格式)
                        if (probValue === correctProb) {
                            input.classList.add('correct');
                        } else {
                            probsCorrect = false;
                            input.classList.add('incorrect');
                        }
                    }
                }

                allCorrect = xValuesCorrect && probsCorrect;
                answered = true;

                // 记录答题结果到历史
                quizHistory.push(allCorrect);
                renderHistory();

                feedback.style.display = 'block';
                showExplanationBtn.style.display = 'inline-block';

                if (allCorrect) {
                    feedback.classList.remove('incorrect');
                    feedback.classList.add('correct');
                    feedbackTitle.textContent = '回答正确！';
                    feedbackText.textContent = '你填写的概率分布表完全正确！';
                } else {
                    feedback.classList.remove('correct');
                    feedback.classList.add('incorrect');
                    feedbackTitle.textContent = '回答错误！';
                    let errorMsg = '';
                    if (!xValuesCorrect) errorMsg += 'X的值有误。';
                    if (!probsCorrect) errorMsg += '概率值有误。';
                    feedbackText.textContent = errorMsg + '请查看答案解析了解正确答案。';
                }

                feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 下一题按钮
            nextBtn.addEventListener('click', function() {
                // 切换到下一组参数
                currentParamIndex = (currentParamIndex + 1) % questionParams.length;
                renderQuestion();
            });

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
