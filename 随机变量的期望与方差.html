<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机变量的期望与方差 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 100, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-section {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-title i {
            color: #3498db;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .probability-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .probability-table th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .probability-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .probability-table tr:last-child td {
            border-bottom: none;
        }

        .probability-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Cambria Math', serif;
            text-align: center;
            border-left: 4px solid #3498db;
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-title i {
            color: #2ecc71;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .answer-option {
            background-color: white;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .answer-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.15);
            border-color: #3498db;
        }

        .answer-option.selected {
            border-color: #3498db;
            background-color: #e8f4fc;
        }

        .answer-option.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-option.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .answer-option.correct .option-letter {
            background-color: #2ecc71;
        }

        .answer-option.incorrect .option-letter {
            background-color: #e74c3c;
        }

        .option-content {
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submit-btn {
            background-color: #3498db;
            color: white;
        }

        .submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        .reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        .reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .result-section {
            margin-top: 40px;
            padding: 25px;
            background-color: #f8fafc;
            border-radius: 15px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title i {
            color: #9b59b6;
        }

        .score-display {
            font-size: 1.8rem;
            text-align: center;
            margin: 20px 0;
            color: #2c3e50;
        }

        .score-value {
            font-weight: bold;
            color: #3498db;
        }

        .explanation {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #9b59b6;
        }

        .explanation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation h3 i {
            color: #9b59b6;
        }

        .calculation {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Cambria Math', serif;
        }

        .correct-answer {
            color: #2ecc71;
            font-weight: bold;
        }

        .incorrect-answer {
            color: #e74c3c;
            font-weight: bold;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-options {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            .question-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 随机变量的期望与方差</h1>
            <p class="subtitle">交互式数学答题 - 离散随机变量的期望与方差计算</p>
        </header>

        <div class="question-container">
            <div class="question-section">
                <div class="question-header">
                    <h2 class="question-title"><i class="fas fa-question-circle"></i> 题目</h2>
                    <button class="refresh-params-btn" id="refreshParamsBtn">
                        <i class="fas fa-random"></i> 刷新参数
                    </button>
                </div>
                <div class="question-content" id="questionContent">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="answer-section">
                <h2 class="answer-title"><i class="fas fa-pencil-alt"></i> 请选择正确答案</h2>

                <div class="answer-options" id="answerOptions">
                    <!-- 动态生成 -->
                </div>

                <div class="controls">
                    <button class="submit-btn" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> 提交答案
                    </button>
                    <button class="reset-btn" id="resetBtn">
                        <i class="fas fa-redo"></i> 重新作答
                    </button>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <h2 class="result-title"><i class="fas fa-chart-line"></i> 答题结果</h2>

            <div class="score-display">
                您的得分: <span class="score-value" id="scoreValue">0</span> / 100
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanationSection">
                <!-- 动态生成 -->
            </div>
        </div>


    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    values: [-20, -10, 0, 10, 20],
                    probs: [0.45, 0.10, 0.10, 0.10, 0.25],
                    expectedValue: -4,
                    variance: 284,
                    options: [
                        { letter: 'A', text: 'E(X) = -4, Var(X) = 284', correct: true },
                        { letter: 'B', text: 'E(X) = 0, Var(X) = 200', correct: false },
                        { letter: 'C', text: 'E(X) = -2, Var(X) = 196', correct: false },
                        { letter: 'D', text: 'E(X) = 4, Var(X) = 284', correct: false }
                    ]
                },
                {
                    values: [-15, -5, 5, 15, 25],
                    probs: [0.30, 0.15, 0.20, 0.20, 0.15],
                    expectedValue: 3,
                    variance: 196,
                    options: [
                        { letter: 'A', text: 'E(X) = 0, Var(X) = 200', correct: false },
                        { letter: 'B', text: 'E(X) = 3, Var(X) = 196', correct: true },
                        { letter: 'C', text: 'E(X) = 5, Var(X) = 180', correct: false },
                        { letter: 'D', text: 'E(X) = -3, Var(X) = 196', correct: false }
                    ]
                },
                {
                    values: [-30, -10, 0, 10, 30],
                    probs: [0.20, 0.20, 0.20, 0.20, 0.20],
                    expectedValue: 0,
                    variance: 320,
                    options: [
                        { letter: 'A', text: 'E(X) = 0, Var(X) = 320', correct: true },
                        { letter: 'B', text: 'E(X) = 10, Var(X) = 280', correct: false },
                        { letter: 'C', text: 'E(X) = -10, Var(X) = 300', correct: false },
                        { letter: 'D', text: 'E(X) = 5, Var(X) = 310', correct: false }
                    ]
                },
                {
                    values: [-25, -15, 5, 15, 25],
                    probs: [0.25, 0.15, 0.25, 0.20, 0.15],
                    expectedValue: 0,
                    variance: 340,
                    options: [
                        { letter: 'A', text: 'E(X) = -5, Var(X) = 300', correct: false },
                        { letter: 'B', text: 'E(X) = 5, Var(X) = 320', correct: false },
                        { letter: 'C', text: 'E(X) = 0, Var(X) = 340', correct: true },
                        { letter: 'D', text: 'E(X) = 10, Var(X) = 280', correct: false }
                    ]
                },
                {
                    values: [-18, -8, 2, 12, 22],
                    probs: [0.35, 0.15, 0.20, 0.15, 0.15],
                    expectedValue: -2.5,
                    variance: 217.75,
                    options: [
                        { letter: 'A', text: 'E(X) = 0, Var(X) = 200', correct: false },
                        { letter: 'B', text: 'E(X) = -2.5, Var(X) = 217.75', correct: true },
                        { letter: 'C', text: 'E(X) = 2.5, Var(X) = 217.75', correct: false },
                        { letter: 'D', text: 'E(X) = -5, Var(X) = 230', correct: false }
                    ]
                }
            ];

            let currentParamIndex = 0;
            let selectedOption = null;
            let isSubmitted = false;

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionContent = document.getElementById('questionContent');
                const answerOptions = document.getElementById('answerOptions');

                // 渲染问题文本和表格
                let tableRows = '';
                for (let i = 0; i < params.values.length; i++) {
                    tableRows += `<tr><td>${params.values[i]}</td><td>${params.probs[i]}</td></tr>`;
                }

                questionContent.innerHTML = `
                    <p>设 X 为具有以下概率分布的随机变量：</p>
                    <table class="probability-table">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                <th>P(X = x)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <p>求 X 的期望 E(X) 和方差 Var(X)。</p>
                    <div class="formula">
                        <p>离散随机变量的期望公式：E(X) = Σ xᵢ P(X = xᵢ)</p>
                        <p>离散随机变量的方差公式：Var(X) = Σ (xᵢ - E(X))² P(X = xᵢ)</p>
                    </div>
                `;

                // 渲染选项
                let optionsHtml = '';
                params.options.forEach(opt => {
                    optionsHtml += `
                        <div class="answer-option" data-option="${opt.letter}" data-correct="${opt.correct}">
                            <div class="option-letter">${opt.letter}</div>
                            <div class="option-content">${opt.text}</div>
                        </div>
                    `;
                });
                answerOptions.innerHTML = optionsHtml;

                // 重新绑定选项点击事件
                bindOptionEvents();
            }

            function renderExplanation() {
                const params = questionParams[currentParamIndex];
                const explanationSection = document.getElementById('explanationSection');

                let calcEV = '';
                for (let i = 0; i < params.values.length; i++) {
                    calcEV += `(${params.values[i]})(${params.probs[i]})`;
                    if (i < params.values.length - 1) calcEV += ' + ';
                }

                let terms = [];
                for (let i = 0; i < params.values.length; i++) {
                    terms.push(`${params.values[i]} × ${params.probs[i]}`);
                }

                let calcVar = '';
                for (let i = 0; i < params.values.length; i++) {
                    const diff = params.values[i] - params.expectedValue;
                    calcVar += `(${diff})²(${params.probs[i]})`;
                    if (i < params.values.length - 1) calcVar += ' + ';
                }

                const correctOption = params.options.find(o => o.correct);

                explanationSection.innerHTML = `
                    <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                    <p><strong>1. 计算期望 E(X)：</strong></p>
                    <div class="calculation">
                        E(X) = Σ xᵢ P(X = xᵢ)<br>
                        = ${terms.join(' + ')}<br>
                        = <strong>${params.expectedValue}</strong>
                    </div>
                    <p><strong>2. 计算方差 Var(X)：</strong></p>
                    <div class="calculation">
                        Var(X) = Σ (xᵢ - E(X))² P(X = xᵢ)<br>
                        = ${calcVar}<br>
                        = <strong>${params.variance}</strong>
                    </div>
                    <p><strong>3. 正确答案：</strong> <span class="correct-answer">${correctOption.text}</span> (选项${correctOption.letter})</p>
                    <p><strong>4. 您的选择：</strong> <span id="userChoiceText">未选择</span> - <span id="correctnessText">未提交</span></p>
                `;
            }

            function bindOptionEvents() {
                const answerOptions = document.querySelectorAll('.answer-option');
                answerOptions.forEach(option => {
                    option.addEventListener('click', function() {
                        if (isSubmitted) return;

                        // 移除之前选中的样式
                        answerOptions.forEach(opt => {
                            opt.classList.remove('selected');
                        });

                        // 添加当前选中的样式
                        this.classList.add('selected');
                        selectedOption = this;
                    });
                });
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                selectedOption = null;

                // 清除所有选项状态
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                    option.style.pointerEvents = 'auto';
                });

                // 隐藏结果区域
                document.getElementById('resultSection').classList.remove('show');

                // 隐藏解析
                document.getElementById('explanationSection').style.display = 'none';
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('show-explanation-btn').textContent = '查看答案解析';

                isSubmitted = false;

                // 重新渲染问题和解释
                renderQuestion();
                renderExplanation();
            }

            // ==================== 事件处理 ====================

            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const refreshParamsBtn = document.getElementById('refreshParamsBtn');
            const resultSection = document.getElementById('resultSection');
            const scoreValue = document.getElementById('scoreValue');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanationSection');

            // 刷新参数按钮
            refreshParamsBtn.addEventListener('click', function() {
                refreshParams();
            });

            // 提交按钮事件
            submitBtn.addEventListener('click', function() {
                if (!selectedOption) {
                    alert('请先选择一个答案！');
                    return;
                }

                isSubmitted = true;

                // 渲染解释
                renderExplanation();

                // 显示结果区域
                resultSection.classList.add('show');

                // 计算得分
                const isCorrect = selectedOption.getAttribute('data-correct') === 'true';
                const score = isCorrect ? 100 : 0;

                // 更新得分显示
                scoreValue.textContent = score;

                // 更新用户选择显示
                const params = questionParams[currentParamIndex];
                const selectedOptionData = params.options.find(o => o.letter === selectedOption.getAttribute('data-option'));
                const userChoiceText = document.getElementById('userChoiceText');
                const correctnessText = document.getElementById('correctnessText');

                userChoiceText.textContent = selectedOptionData.text;

                if (isCorrect) {
                    correctnessText.textContent = '回答正确！';
                    correctnessText.className = 'correct-answer';
                } else {
                    correctnessText.textContent = '回答错误！';
                    correctnessText.className = 'incorrect-answer';
                    selectedOption.classList.add('incorrect');
                }

                // 禁用选项点击
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.style.pointerEvents = 'none';
                });

                // 显示答案解析按钮
                showExplanationBtn.style.display = 'inline-block';

                // 滚动到结果区域
                resultSection.scrollIntoView({ behavior: 'smooth' });
            });

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 重置按钮事件
            resetBtn.addEventListener('click', function() {
                // 清除所有选项状态
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.classList.remove('selected', 'correct', 'incorrect');
                    option.style.pointerEvents = 'auto';
                });

                // 隐藏结果区域
                resultSection.classList.remove('show');

                // 隐藏解析
                explanationSection.style.display = 'none';
                showExplanationBtn.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';

                // 重置状态
                selectedOption = null;
                isSubmitted = false;

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
            renderExplanation();
        });
    </script>
</body>
</html>
