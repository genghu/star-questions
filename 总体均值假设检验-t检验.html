<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体均值假设检验 t检验 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #7f8c8d;
            font-style: italic;
        }
        .refresh-params-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }
        .question-block {
            background-color: #f8fafd;
            border-left: 5px solid #4a90e2;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 10px 10px 0;
            transition: transform 0.3s ease;
        }
        .question-block:hover {
            transform: translateX(5px);
        }
        .question-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        .question-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #4a90e2;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin-right: 10px;
            font-size: 0.9rem;
        }
        .options-container {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }
        .option {
            padding: 15px;
            border: 2px solid #d1e3ff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: white;
            display: flex;
            align-items: center;
        }
        .option:hover {
            border-color: #4a90e2;
            background-color: #edf4ff;
        }
        .option.selected {
            border-color: #4a90e2;
            background-color: #e3eeff;
            font-weight: bold;
        }
        .option.correct {
            border-color: #27ae60;
            background-color: #d5f4e6;
        }
        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: #ecf0f1;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: bold;
            color: #2c3e50;
            flex-shrink: 0;
        }
        .option.correct .option-letter {
            background-color: #27ae60;
            color: white;
        }
        .option.incorrect .option-letter {
            background-color: #e74c3c;
            color: white;
        }
        .math {
            font-family: 'Cambria Math', serif;
            font-style: italic;
            margin: 0 2px;
        }
        .data-summary {
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 10px;
            margin: 25px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .data-item {
            text-align: center;
        }
        .data-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .data-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #submitBtn {
            background-color: #4a90e2;
            color: white;
        }
        #submitBtn:hover {
            background-color: #357ae8;
            transform: translateY(-2px);
        }
        #resetBtn {
            background-color: #95a5a6;
            color: white;
        }
        #resetBtn:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
        }
        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .feedback.correct {
            background-color: #d5f4e6;
            border-left: 5px solid #27ae60;
        }
        .feedback.incorrect {
            background-color: #fadbd8;
            border-left: 5px solid #e74c3c;
        }
        .score-container {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .score-value {
            color: #4a90e2;
            font-size: 1.8rem;
        }
        .explanation {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 5px solid #f39c12;
        }
        .explanation h3 {
            color: #e67e22;
            margin-top: 0;
        }
        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .data-summary {
                grid-template-columns: 1fr;
            }
            .controls {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- 动态生成 -->
    </div>

    <script>
        // 参数化数据集
        const questionParams = [
            {
                scenario: '一位心理学家正在研究吸烟者的自我形象（SI）分数。',
                mu0: 140,
                n: 15,
                xbar: 147,
                s: 40,
                alpha: 0.05,
                df: 14,
                tValue: 0.678,
                criticalValue: 2.145,
                rejectH0: '否',
                conclusion: '没有足够证据表明吸烟者的平均SI分数与140不同'
            },
            {
                scenario: '一位营养学家正在研究某种饮食对体重的影响。',
                mu0: 75,
                n: 20,
                xbar: 72,
                s: 12,
                alpha: 0.05,
                df: 19,
                tValue: -1.118,
                criticalValue: 2.093,
                rejectH0: '否',
                conclusion: '没有足够证据表明平均体重与75公斤不同'
            },
            {
                scenario: '某教育机构研究新教学方法对学生成绩的影响。',
                mu0: 70,
                n: 25,
                xbar: 75,
                s: 15,
                alpha: 0.01,
                df: 24,
                tValue: 1.667,
                criticalValue: 2.797,
                rejectH0: '否',
                conclusion: '在0.01显著性水平下没有足够证据表明平均成绩与70分不同'
            },
            {
                scenario: '某医院研究某种药物对患者血压降低效果的影响。',
                mu0: 10,
                n: 18,
                xbar: 14,
                s: 8,
                alpha: 0.05,
                df: 17,
                tValue: 2.121,
                criticalValue: 2.110,
                rejectH0: '是',
                conclusion: '平均血压降低效果与10mmHg不同'
            },
            {
                scenario: '某工厂研究新工艺对产品重量的影响。',
                mu0: 50,
                n: 16,
                xbar: 52,
                s: 4,
                alpha: 0.05,
                df: 15,
                tValue: 2.000,
                criticalValue: 2.131,
                rejectH0: '否',
                conclusion: '没有足够证据表明平均重量与50克不同'
            }
        ];

        let currentParamIndex = 0;
        let userAnswers = {};
        let correctAnswers = {};
        let submitted = false;

        function renderQuestion() {
            const params = questionParams[currentParamIndex];
            const container = document.getElementById('main-container');

            // 设置正确答案
            correctAnswers = {
                q1: 'a', // μ = mu0
                q2: 'b', // μ ≠ mu0
                q3: 'b', // t
                q4: 'b', // t值
                q5: 'b', // 临界值
                q6: params.rejectH0 === '是' ? 'a' : 'b'
            };

            // 计算错误的选项
            const wrongT1 = (params.tValue - 1.5).toFixed(3);
            const wrongT2 = (params.tValue + 1.5).toFixed(3);
            const wrongCV1 = (params.criticalValue - 0.5).toFixed(3);
            const wrongCV2 = (params.criticalValue + 0.5).toFixed(3);

            container.innerHTML = `
                <header>
                    <div>
                        <h1>总体均值假设检验：t 检验</h1>
                        <p class="subtitle">${params.scenario}请根据题目信息进行假设检验并回答问题。</p>
                    </div>
                    <button class="refresh-params-btn" onclick="refreshParams()">
                        <i class="fas fa-sync-alt"></i> 刷新参数
                    </button>
                </header>

                <div class="data-summary">
                    <div class="data-item">
                        <div class="data-label">总体均值 (μ₀)</div>
                        <div class="data-value">${params.mu0}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">样本容量 (n)</div>
                        <div class="data-value">${params.n}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">样本均值 (x̄)</div>
                        <div class="data-value">${params.xbar}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">样本标准差 (s)</div>
                        <div class="data-value">${params.s}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">显著性水平 (α)</div>
                        <div class="data-value">${params.alpha}</div>
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">1</span> 原假设：H₀:</div>
                    <div class="options-container" id="q1">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>μ = ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>μ ≠ ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="c">
                            <span class="option-letter">C</span>
                            <span>μ > ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="d">
                            <span class="option-letter">D</span>
                            <span>μ < ${params.mu0}</span>
                        </div>
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">2</span> 备择假设：H₁:</div>
                    <div class="options-container" id="q2">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>μ = ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>μ ≠ ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="c">
                            <span class="option-letter">C</span>
                            <span>μ > ${params.mu0}</span>
                        </div>
                        <div class="option" data-value="d">
                            <span class="option-letter">D</span>
                            <span>μ < ${params.mu0}</span>
                        </div>
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">3</span> 检验统计量的类型：</div>
                    <div class="options-container" id="q3">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>Z</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>t</span>
                        </div>
                        <div class="option" data-value="c">
                            <span class="option-letter">C</span>
                            <span>卡方</span>
                        </div>
                        <div class="option" data-value="d">
                            <span class="option-letter">D</span>
                            <span>F</span>
                        </div>
                    </div>
                    <div style="margin-top: 15px; padding-left: 10px;">
                        <label for="dfInput">自由度（如适用）: </label>
                        <input type="number" id="dfInput" min="0" value="${params.df}" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 80px;">
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">4</span> 检验统计量的值（至少四舍五入到三位小数）:</div>
                    <div class="options-container" id="q4">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>${wrongT1}</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>${Math.abs(params.tValue).toFixed(3)}</span>
                        </div>
                        <div class="option" data-value="c">
                            <span class="option-letter">C</span>
                            <span>${params.criticalValue.toFixed(3)}</span>
                        </div>
                        <div class="option" data-value="d">
                            <span class="option-letter">D</span>
                            <span>${wrongT2}</span>
                        </div>
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">5</span> 在 ${params.alpha} 显著性水平下的两个临界值（至少四舍五入到三位小数）:</div>
                    <div class="options-container" id="q5">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>-${wrongCV1} 和 ${wrongCV1}</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>-${params.criticalValue.toFixed(3)} 和 ${params.criticalValue.toFixed(3)}</span>
                        </div>
                        <div class="option" data-value="c">
                            <span class="option-letter">C</span>
                            <span>-${wrongCV2} 和 ${wrongCV2}</span>
                        </div>
                        <div class="option" data-value="d">
                            <span class="option-letter">D</span>
                            <span>-1.960 和 1.960</span>
                        </div>
                    </div>
                </div>

                <div class="question-block">
                    <div class="question-title"><span class="question-num">6</span> 在 ${params.alpha} 的显著性水平下，能否得出结论认为总体均值与 ${params.mu0} 不同？</div>
                    <div class="options-container" id="q6">
                        <div class="option" data-value="a">
                            <span class="option-letter">A</span>
                            <span>是</span>
                        </div>
                        <div class="option" data-value="b">
                            <span class="option-letter">B</span>
                            <span>否</span>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="submitBtn">提交答案</button>
                    <button id="resetBtn">重新作答</button>
                </div>

                <div class="score-container">
                    得分: <span class="score-value" id="score">0</span> / 6
                </div>

                <div class="feedback" id="feedback">
                    <h3 id="feedbackTitle">反馈标题</h3>
                    <p id="feedbackText">反馈内容</p>
                </div>

                <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
                <div class="explanation" id="explanation-section" style="display:none;">
                    <h3>题目解析与计算过程</h3>
                    <p><strong>1. 假设建立：</strong> 研究问题是判断总体均值(μ)是否与${params.mu0}不同，因此是双尾检验。</p>
                    <p>原假设 H₀: μ = ${params.mu0} (假设没有差异)</p>
                    <p>备择假设 H₁: μ ≠ ${params.mu0} (假设有差异)</p>

                    <p><strong>2. 检验统计量选择：</strong> 总体标准差σ未知，样本量n=${params.n}，因此使用t检验统计量。</p>
                    <p>自由度 df = n - 1 = ${params.n} - 1 = ${params.df}</p>

                    <p><strong>3. 计算检验统计量：</strong></p>
                    <p>t = (x̄ - μ₀) / (s/√n) = (${params.xbar} - ${params.mu0}) / (${params.s}/√${params.n}) = ${params.tValue.toFixed(3)}</p>

                    <p><strong>4. 确定临界值：</strong> 对于双尾检验，α=${params.alpha}，df=${params.df}。</p>
                    <p>查t分布表得：临界值为 -${params.criticalValue.toFixed(3)} 和 ${params.criticalValue.toFixed(3)}。</p>

                    <p><strong>5. 决策：</strong> 计算得到的|t|值(${Math.abs(params.tValue).toFixed(3)}) ${Math.abs(params.tValue) > params.criticalValue ? '>' : '<'} 临界值${params.criticalValue.toFixed(3)}，因此${params.rejectH0 === '是' ? '拒绝' : '不拒绝'}原假设。</p>
                    <p><strong>结论：</strong> 在${params.alpha}的显著性水平下，${params.conclusion}。</p>
                </div>
            `;

            bindEvents();
        }

        function bindEvents() {
            // 初始化选项点击事件
            document.querySelectorAll('.options-container').forEach(container => {
                const options = container.querySelectorAll('.option');
                const questionId = container.id;

                options.forEach(option => {
                    option.addEventListener('click', () => {
                        if (submitted) return;

                        // 移除同一问题中其他选项的选中状态
                        options.forEach(opt => opt.classList.remove('selected'));

                        // 添加当前选项的选中状态
                        option.classList.add('selected');

                        // 保存用户答案
                        userAnswers[questionId] = option.getAttribute('data-value');
                    });
                });
            });

            // 提交按钮事件
            document.getElementById('submitBtn').addEventListener('click', () => {
                submitted = true;
                let score = 0;
                const totalQuestions = Object.keys(correctAnswers).length;
                let allAnswered = true;

                // 检查是否所有问题都已回答
                for (const questionId in userAnswers) {
                    if (userAnswers[questionId] === null || userAnswers[questionId] === undefined) {
                        allAnswered = false;
                    }
                }

                // 检查每个问题的答案并计算得分
                for (const questionId in correctAnswers) {
                    const userAnswer = userAnswers[questionId];
                    const correctAnswer = correctAnswers[questionId];
                    const container = document.getElementById(questionId);
                    const options = container.querySelectorAll('.option');

                    // 标记正确和错误的答案
                    options.forEach(option => {
                        const optionValue = option.getAttribute('data-value');

                        if (optionValue === userAnswer && userAnswer !== correctAnswer) {
                            option.classList.add('incorrect');
                        }
                    });

                    // 如果答案正确，增加分数
                    if (userAnswer === correctAnswer) {
                        score++;
                    }
                }

                // 更新分数显示
                document.getElementById('score').textContent = score;

                // 显示反馈
                const feedback = document.getElementById('feedback');
                const feedbackTitle = document.getElementById('feedbackTitle');
                const feedbackText = document.getElementById('feedbackText');

                feedback.style.display = 'block';

                // 显示答案解析按钮
                document.getElementById('show-explanation-btn').style.display = 'inline-block';

                if (score === totalQuestions) {
                    feedback.className = 'feedback correct';
                    feedbackTitle.textContent = '优秀！';
                    feedbackText.textContent = `您答对了所有 ${totalQuestions} 道题！您已经掌握了t检验的基本原理和应用。`;
                } else if (score >= totalQuestions * 0.7) {
                    feedback.className = 'feedback correct';
                    feedbackTitle.textContent = '良好！';
                    feedbackText.textContent = `您答对了 ${score} 道题，共 ${totalQuestions} 道。您对t检验的理解较好，但还有一些细节需要加强。`;
                } else {
                    feedback.className = 'feedback incorrect';
                    feedbackTitle.textContent = '需要继续学习';
                    feedbackText.textContent = `您答对了 ${score} 道题，共 ${totalQuestions} 道。请仔细阅读题目解析，理解t检验的步骤和原理。`;
                }

                // 滚动到反馈区域
                feedback.scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答按钮事件
            document.getElementById('resetBtn').addEventListener('click', () => {
                refreshParams();
            });

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanationSection = document.getElementById('explanation-section');
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });
        }

        function refreshParams() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questionParams.length);
            } while (newIndex === currentParamIndex && questionParams.length > 1);

            currentParamIndex = newIndex;
            userAnswers = {};
            submitted = false;
            renderQuestion();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderQuestion();
        });
    </script>
</body>
</html>
