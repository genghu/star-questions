<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总体比例置信区间 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.08);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0f2fe;
        }

        h1 {
            color: #1e40af;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        .question-section {
            margin-bottom: 35px;
        }

        .section-title {
            color: #1e40af;
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #dbeafe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-text {
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #3b82f6;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .question-text p {
            margin-bottom: 15px;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }

        .answer-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-group input.correct {
            border-color: #10b981;
            background-color: #f0fdf4;
        }

        .input-group input.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #submit-btn {
            background-color: #3b82f6;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        #reset-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        #reset-btn:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .feedback-section {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .feedback-section.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-feedback {
            background-color: #f0fdf4;
            border-left: 5px solid #10b981;
        }

        .incorrect-feedback {
            background-color: #fef2f2;
            border-left: 5px solid #ef4444;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .correct-feedback .feedback-title {
            color: #047857;
        }

        .incorrect-feedback .feedback-title {
            color: #dc2626;
        }

        .score-container {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }

        .score-container.show {
            display: block;
        }

        .score-text {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .explanation-section {
            margin-top: 30px;
            padding: 25px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .explanation-title {
            color: #1e40af;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .step {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step-title {
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .formula {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #dbeafe;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-size: 1.1rem;
        }

        .result-box {
            background-color: #dbeafe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            color: #1e40af;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-inputs {
                flex-direction: column;
            }

            .input-group {
                min-width: 100%;
            }

            button {
                flex: 1;
                min-width: 100%;
            }

            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>总体比例置信区间</h1>
            <p class="subtitle">交互式答题练习 - 置信区间与假设检验</p>
        </header>

        <div class="question-section">
            <h2 class="section-title">
                <span>题目</span>
                <button class="refresh-params-btn" id="refreshBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                    刷新参数
                </button>
            </h2>
            <div class="question-text" id="questionText">
                <!-- 动态生成 -->
            </div>

            <div class="answer-inputs">
                <div class="input-group">
                    <label for="lower-bound" id="lowerLabel">该置信区间的下限是多少？</label>
                    <input type="text" id="lower-bound">
                </div>

                <div class="input-group">
                    <label for="upper-bound" id="upperLabel">该置信区间的上限是多少？</label>
                    <input type="text" id="upper-bound">
                </div>
            </div>

            <div class="button-container">
                <button id="submit-btn">提交答案</button>
                <button id="reset-btn">重新作答</button>
            </div>

            <div id="feedback" class="feedback-section">
                <!-- 反馈内容将通过JavaScript动态插入 -->
            </div>

            <div id="score-container" class="score-container">
                <div class="score-text">你的得分</div>
                <div class="score-value">0/2</div>
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn" style="display:none;">查看答案解析</button>
            <div class="explanation-section" id="explanation-section" style="display:none;">
                <h2 class="explanation-title">题目解析与计算步骤</h2>
                <div id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    n: 125, x: 71, confidence: 90, zValue: 1.645,
                    pHat: 0.568, se: 0.0443, margin: 0.0729,
                    lower: '0.50', upper: '0.64',
                    subject: '啮齿动物',
                    attribute: '携带特定病毒感染',
                    context: '为了估计某种啮齿动物物种中携带特定病毒感染的比例'
                },
                {
                    n: 200, x: 120, confidence: 95, zValue: 1.960,
                    pHat: 0.600, se: 0.0346, margin: 0.0679,
                    lower: '0.53', upper: '0.67',
                    subject: '消费者',
                    attribute: '对某品牌产品满意',
                    context: '为了估计消费者对某品牌产品的满意度比例'
                },
                {
                    n: 150, x: 45, confidence: 99, zValue: 2.576,
                    pHat: 0.300, se: 0.0374, margin: 0.0964,
                    lower: '0.20', upper: '0.40',
                    subject: '员工',
                    attribute: '支持新的工作制度',
                    context: '为了估计员工支持新工作制度的比例'
                },
                {
                    n: 400, x: 280, confidence: 90, zValue: 1.645,
                    pHat: 0.700, se: 0.0229, margin: 0.0377,
                    lower: '0.66', upper: '0.74',
                    subject: '学生',
                    attribute: '通过资格考试',
                    context: '为了估计学生通过某项资格考试的比例'
                },
                {
                    n: 100, x: 32, confidence: 95, zValue: 1.960,
                    pHat: 0.320, se: 0.0467, margin: 0.0915,
                    lower: '0.23', upper: '0.41',
                    subject: '顾客',
                    attribute: '使用优惠券',
                    context: '为了估计顾客使用优惠券购物的比例'
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            const lowerBoundInput = document.getElementById('lower-bound');
            const upperBoundInput = document.getElementById('upper-bound');
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedbackDiv = document.getElementById('feedback');
            const scoreContainer = document.getElementById('score-container');

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染题目
                document.getElementById('questionText').innerHTML = `
                    <p>${params.context}，随机抽取并检查了 <span class="math">${params.n}</span> 只${params.subject}，发现其中 <span class="math">${params.x}</span> 只${params.attribute}。基于此，求该${params.subject}中${params.attribute}比例的 ${params.confidence}% 置信区间。</p>
                    <p>中间计算至少保留三位小数。最终答案四舍五入到两位小数。</p>
                    <p>请在下表中填写该 ${params.confidence}% 置信区间的下限和上限：</p>
                `;

                // 更新标签
                document.getElementById('lowerLabel').textContent = `该 ${params.confidence}% 置信区间的下限是多少？`;
                document.getElementById('upperLabel').textContent = `该 ${params.confidence}% 置信区间的上限是多少？`;

                // 更新输入框placeholder
                lowerBoundInput.placeholder = `输入下限，如：${params.lower}`;
                upperBoundInput.placeholder = `输入上限，如：${params.upper}`;

                // 渲染解析
                renderExplanation(params);
            }

            function renderExplanation(params) {
                const qHat = 1 - params.pHat;
                document.getElementById('explanationContent').innerHTML = `
                    <div class="step">
                        <div class="step-title">步骤 1: 确定样本比例 p̂</div>
                        <p>样本中${params.attribute}的${params.subject}比例：</p>
                        <div class="formula">p̂ = ${params.x} / ${params.n} = ${params.pHat.toFixed(3)}</div>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 2: 计算标准误</div>
                        <p>p̂ 的标准误估计为：</p>
                        <div class="formula">√[p̂(1-p̂)/n] = √[${params.pHat.toFixed(3)}(1-${params.pHat.toFixed(3)})/${params.n}] = √[${params.pHat.toFixed(3)}×${qHat.toFixed(3)}/${params.n}] = √${(params.pHat * qHat / params.n).toFixed(6)} = ${params.se.toFixed(4)}</div>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 3: 确定 z 临界值</div>
                        <p>对于 ${params.confidence}% 置信区间，α = ${(100 - params.confidence) / 100}，α/2 = ${(100 - params.confidence) / 200}</p>
                        <p>标准正态分布中，z<sub>${((100 - params.confidence) / 200).toFixed(3)}</sub> = ${params.zValue.toFixed(3)}</p>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 4: 计算置信区间</div>
                        <p>总体比例 p 的 ${params.confidence}% 置信区间公式：</p>
                        <div class="formula">p̂ ± z<sub>α/2</sub> × √[p̂(1-p̂)/n]</div>
                        <p>代入数值计算：</p>
                        <div class="formula">
                            下限 = ${params.pHat.toFixed(3)} - ${params.zValue.toFixed(3)} × ${params.se.toFixed(4)} = ${params.pHat.toFixed(3)} - ${params.margin.toFixed(4)} = ${(params.pHat - params.margin).toFixed(4)} ≈ ${params.lower}<br>
                            上限 = ${params.pHat.toFixed(3)} + ${params.zValue.toFixed(3)} × ${params.se.toFixed(4)} = ${params.pHat.toFixed(3)} + ${params.margin.toFixed(4)} = ${(params.pHat + params.margin).toFixed(4)} ≈ ${params.upper}
                        </div>
                    </div>

                    <div class="step">
                        <div class="step-title">步骤 5: 最终答案</div>
                        <div class="result-box">
                            该 ${params.confidence}% 置信区间为 (${params.lower}, ${params.upper})<br>
                            即我们有 ${params.confidence}% 的把握认为该${params.subject}中${params.attribute}的比例在 ${(parseFloat(params.lower) * 100).toFixed(0)}% 到 ${(parseFloat(params.upper) * 100).toFixed(0)}% 之间。
                        </div>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;

                // 重置输入
                lowerBoundInput.value = '';
                upperBoundInput.value = '';
                lowerBoundInput.classList.remove('correct', 'incorrect');
                upperBoundInput.classList.remove('correct', 'incorrect');
                feedbackDiv.classList.remove('show');
                scoreContainer.classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanation-section').style.display = 'none';

                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refreshBtn').addEventListener('click', refreshParams);

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanation-section');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const params = questionParams[currentParamIndex];
                const userLower = lowerBoundInput.value.trim();
                const userUpper = upperBoundInput.value.trim();
                let score = 0;
                let feedbackHTML = '';

                // 检查下限
                const lowerCorrect = userLower === params.lower;
                if (lowerCorrect) {
                    score++;
                    lowerBoundInput.classList.add('correct');
                    lowerBoundInput.classList.remove('incorrect');
                } else {
                    lowerBoundInput.classList.add('incorrect');
                    lowerBoundInput.classList.remove('correct');
                }

                // 检查上限
                const upperCorrect = userUpper === params.upper;
                if (upperCorrect) {
                    score++;
                    upperBoundInput.classList.add('correct');
                    upperBoundInput.classList.remove('incorrect');
                } else {
                    upperBoundInput.classList.add('incorrect');
                    upperBoundInput.classList.remove('correct');
                }

                // 显示反馈
                if (score === 2) {
                    feedbackHTML = `
                        <div class="correct-feedback">
                            <div class="feedback-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                                完全正确！
                            </div>
                            <p>你正确地计算出了置信区间的下限和上限。该${params.subject}中${params.attribute}比例的 ${params.confidence}% 置信区间为 (${params.lower}, ${params.upper})。</p>
                        </div>
                    `;
                } else if (score === 1) {
                    feedbackHTML = `
                        <div class="incorrect-feedback">
                            <div class="feedback-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="15" y1="9" x2="9" y2="15"></line>
                                    <line x1="9" y1="9" x2="15" y2="15"></line>
                                </svg>
                                部分正确
                            </div>
                            <p>你只答对了一部分。正确答案是 (${params.lower}, ${params.upper})。请查看下方的解析，了解完整的计算过程。</p>
                        </div>
                    `;
                } else {
                    feedbackHTML = `
                        <div class="incorrect-feedback">
                            <div class="feedback-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="15" y1="9" x2="9" y2="15"></line>
                                    <line x1="9" y1="9" x2="15" y2="15"></line>
                                </svg>
                                答案不正确
                            </div>
                            <p>你的答案不正确。正确答案是 (${params.lower}, ${params.upper})。请查看下方的解析，了解完整的计算过程。</p>
                        </div>
                    `;
                }

                feedbackDiv.innerHTML = feedbackHTML;
                feedbackDiv.classList.add('show');

                // 显示得分
                scoreContainer.querySelector('.score-value').textContent = `${score}/2`;
                scoreContainer.classList.add('show');

                // Show explanation buttons after submit
                document.getElementById('show-explanation-btn').style.display = 'block';

                // 滚动到反馈区域
                feedbackDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // 重置答案
            resetBtn.addEventListener('click', function() {
                lowerBoundInput.value = '';
                upperBoundInput.value = '';
                lowerBoundInput.classList.remove('correct', 'incorrect');
                upperBoundInput.classList.remove('correct', 'incorrect');
                feedbackDiv.classList.remove('show');
                scoreContainer.classList.remove('show');

                // Hide explanation buttons and sections
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanation-section').style.display = 'none';

                lowerBoundInput.focus();
            });

            // 允许按Enter键提交
            lowerBoundInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });

            upperBoundInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });

            // 输入时移除错误/正确标记
            lowerBoundInput.addEventListener('input', function() {
                this.classList.remove('correct', 'incorrect');
            });

            upperBoundInput.addEventListener('input', function() {
                this.classList.remove('correct', 'incorrect');
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
