<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准正态值进阶 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 100, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-title i {
            color: #3498db;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #34495e;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-weight: bold;
            color: #2c3e50;
        }

        .highlight {
            background-color: #e3f2fd;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .answer-input-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
        }

        .answer-label {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .tolerance-hint {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .feedback-inline {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-inline.correct {
            background-color: #e8f8ef;
            color: #27ae60;
            display: block;
        }

        .feedback-inline.incorrect {
            background-color: #fdedec;
            color: #e74c3c;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background-color: #f8fafc;
            display: none;
            border-left: 5px solid #9b59b6;
        }

        .result-title {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title i {
            color: #9b59b6;
        }

        .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin: 20px 0;
        }

        .score-value {
            color: #3498db;
            font-size: 2.5rem;
        }

        .explanation {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #f1c40f;
        }

        .explanation-title {
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-title i {
            color: #f1c40f;
        }

        .explanation-content {
            color: #34495e;
            line-height: 1.7;
        }

        .step {
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #3498db;
            padding-bottom: 15px;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> 标准正态值进阶</h1>
            <p class="subtitle">交互式答题 - 测试你对标准正态分布的理解</p>
        </header>

        <div class="question-container">
            <div class="question-header">
                <div class="question-title">
                    <i class="fas fa-question-circle"></i> 题目
                </div>
                <button class="refresh-params-btn" id="refreshBtn">
                    <i class="fas fa-random"></i> 刷新参数
                </button>
            </div>
            <div class="question-content" id="questionContent">
                <!-- 动态生成 -->
            </div>

            <div class="answer-input-container">
                <label class="answer-label">请输入c的值（保留两位小数）：</label>
                <input type="text" class="answer-input" id="answer-input">
                <div class="tolerance-hint">容差：±0.01</div>
                <div class="feedback-inline" id="feedback-inline"></div>
            </div>

            <div class="controls">
                <button id="submit-btn"><i class="fas fa-paper-plane"></i> 提交答案</button>
                <button id="reset-btn"><i class="fas fa-redo"></i> 重新作答</button>
            </div>
        </div>

        <div class="result-container" id="result-container">
            <div class="result-title">
                <i class="fas fa-chart-bar"></i> 答题结果
            </div>
            <div class="score">
                你的得分: <span class="score-value" id="score-value">0</span> / 1
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanationSection">
                <div class="explanation-title"><i class="fas fa-lightbulb"></i> 题目解析</div>
                <div class="explanation-content" id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 每个参数集包含：z1(下界), probability(区间概率), answer(c的值)
            const questionParams = [
                {
                    z1: -0.96,
                    probability: 0.7923,
                    probZ1: 0.1685,
                    probZ1Right: 0.8315,
                    probTail: 0.0392,
                    answer: 1.76
                },
                {
                    z1: -1.25,
                    probability: 0.7549,
                    probZ1: 0.1056,
                    probZ1Right: 0.8944,
                    probTail: 0.1395,
                    answer: 1.07
                },
                {
                    z1: -0.52,
                    probability: 0.6862,
                    probZ1: 0.3015,
                    probZ1Right: 0.6985,
                    probTail: 0.0123,
                    answer: 2.24
                },
                {
                    z1: -1.65,
                    probability: 0.8212,
                    probZ1: 0.0495,
                    probZ1Right: 0.9505,
                    probTail: 0.1293,
                    answer: 1.13
                },
                {
                    z1: -0.84,
                    probability: 0.7305,
                    probZ1: 0.2005,
                    probZ1Right: 0.7995,
                    probTail: 0.0690,
                    answer: 1.48
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;
            let submitted = false;

            const answerInput = document.getElementById('answer-input');
            const feedbackInline = document.getElementById('feedback-inline');

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];

                // 渲染问题文本
                document.getElementById('questionContent').innerHTML = `
                    <p>设 <span class="math">Z</span> 为标准正态随机变量。使用所提供的计算器或标准正态表确定 <span class="math">c</span> 的值。</p>
                    <p>你的中间计算至少保留四位小数。将你的答案四舍五入至两位小数。</p>
                    <p>标准正态分布，也称为 <span class="math">Z</span> 分布，是一个均值为 0、标准差为 1 的正态分布。服从该分布的变量记为 <span class="math">Z</span>（或 <span class="math">z</span>）。我们需要找到值 <span class="math">c</span>，使得</p>
                    <p class="highlight"><span class="math">P(${params.z1} <= Z <= c) = ${params.probability}</span>。</p>
                    <p>也就是说，我们需要找到值 <span class="math">c</span>，使得标准正态密度曲线在 <span class="math">${params.z1}</span> 和 <span class="math">c</span> 之间的面积为 <span class="math">${params.probability}</span>。</p>
                `;

                // 渲染解析
                document.getElementById('explanationContent').innerHTML = `
                    <div class="step">
                        <p><strong>步骤 1:</strong> 已知 <span class="math">P(${params.z1} <= Z <= c) = ${params.probability}</span>。我们需要找到 <span class="math">P(Z > c)</span>。</p>
                    </div>
                    <div class="step">
                        <p><strong>步骤 2:</strong> 使用互补法则计算 <span class="math">P(Z > ${params.z1})</span>：</p>
                        <p><span class="math">P(Z > ${params.z1}) = 1 - P(Z <= ${params.z1}) = 1 - ${params.probZ1.toFixed(5)} = ${params.probZ1Right.toFixed(4)}</span></p>
                    </div>
                    <div class="step">
                        <p><strong>步骤 3:</strong> 计算 <span class="math">P(Z > c)</span>：</p>
                        <p><span class="math">P(Z > c) = P(Z > ${params.z1}) - P(${params.z1} <= Z <= c) = ${params.probZ1Right.toFixed(4)} - ${params.probability} = ${params.probTail.toFixed(4)}</span></p>
                    </div>
                    <div class="step">
                        <p><strong>步骤 4:</strong> 密度曲线在 <span class="math">c</span> 右侧的面积为 <span class="math">${params.probTail.toFixed(4)}</span>。因此，<span class="math">c</span> 是值 <span class="math">z_${params.probTail.toFixed(4)}</span>。</p>
                    </div>
                    <div class="step">
                        <p><strong>步骤 5:</strong> 使用标准正态表或计算器查找对应的 z 值：</p>
                        <p><span class="math">c = ${params.answer.toFixed(2)}</span> (四舍五入至两位小数)</p>
                    </div>
                    <div class="step">
                        <p><strong>正确答案:</strong> <span class="math">c = ${params.answer.toFixed(2)}</span></p>
                    </div>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                submitted = false;

                // 清除输入和反馈
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                // 重置UI
                document.getElementById('result-container').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';

                renderQuestion();
            }

            // ==================== 事件处理 ====================

            // 刷新参数按钮
            document.getElementById('refreshBtn').addEventListener('click', refreshParams);

            // 显示答案解析按钮
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                const explanation = document.getElementById('explanationSection');
                if (explanation.style.display === 'block') {
                    explanation.style.display = 'none';
                    this.textContent = '查看答案解析';
                } else {
                    explanation.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                }
            });

            // 提交答案
            document.getElementById('submit-btn').addEventListener('click', function() {
                const userAnswer = parseFloat(answerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请先输入一个有效的数字答案！');
                    return;
                }

                if (submitted) return;
                submitted = true;

                const params = questionParams[currentParamIndex];
                const tolerance = 0.01;
                const isCorrect = Math.abs(userAnswer - params.answer) <= tolerance;

                // 更新分数
                document.getElementById('score-value').textContent = isCorrect ? '1' : '0';
                document.getElementById('score-value').style.color = isCorrect ? '#27ae60' : '#e74c3c';

                if (isCorrect) {
                    answerInput.classList.add('correct');
                    feedbackInline.textContent = '正确！';
                    feedbackInline.className = 'feedback-inline correct';
                } else {
                    answerInput.classList.add('incorrect');
                    feedbackInline.textContent = `不正确。正确答案是 ${params.answer.toFixed(2)}`;
                    feedbackInline.className = 'feedback-inline incorrect';
                }

                // 禁用输入
                answerInput.disabled = true;

                // 显示结果
                document.getElementById('result-container').classList.add('show');
                document.getElementById('show-explanation-btn').style.display = 'inline-block';

                // 滚动到结果区域
                document.getElementById('result-container').scrollIntoView({ behavior: 'smooth' });
            });

            // 重置答题
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置输入
                answerInput.value = '';
                answerInput.classList.remove('correct', 'incorrect');
                answerInput.disabled = false;

                feedbackInline.className = 'feedback-inline';
                feedbackInline.textContent = '';

                submitted = false;

                // 隐藏反馈
                document.getElementById('result-container').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('explanationSection').style.display = 'none';
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
