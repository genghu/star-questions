<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百分位数 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {

            margin: 0;
            padding: 0;

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 100, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .problem-info {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .data-set {
            background-color: #f0f7ff;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            border: 1px dashed #a0c8f0;
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .answer-input {
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 2px solid #3498db;
            border-radius: 10px;
            width: 150px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            outline: none;
            border-color: #2980b9;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .answer-input.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .unit-label {
            font-size: 1.1rem;
            color: #5a6c7d;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(52, 152, 219, 0.3);
        }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        #reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(149, 165, 166, 0.3);
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .score-value {
            font-weight: bold;
            color: #3498db;
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .feedback.correct {
            background-color: #e8f8ef;
            border-left: 4px solid #2ecc71;
        }

        .feedback.incorrect {
            background-color: #fdedec;
            border-left: 4px solid #e74c3c;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .explanation-section {
            display: none;
            margin-top: 20px;
            padding: 25px;
            background-color: #f9fbfd;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .explanation-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .method-section {
            margin: 20px 0;
            padding: 20px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .method-title {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eaeff5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .method-title i {
            color: #3498db;
        }

        .step {
            margin: 10px 0;
            padding-left: 20px;
            border-left: 3px solid #a0c8f0;
        }

        .step-number {
            display: inline-block;
            background-color: #3498db;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            margin-right: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .calculation {
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }

        .result {
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            padding: 10px 15px;
            background-color: #e8f4fc;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }

        .note {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            .input-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .answer-input {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="container">

        let currentParamIndex = Math.floor(Math.random() * questionParams.length);

        // 渲染问题的函数
        function renderQuestion() {
            const params = questionParams[currentParamIndex];

            // 更新问题描述
            document.getElementById('context').textContent = params.context;
            document.getElementById('unit').textContent = params.unit;
            document.getElementById('percentile').textContent = params.percentile;
            document.getElementById('raw-data').textContent = params.rawData.join(', ');

            // 更新问题文本
            document.getElementById('q-percentile').textContent = params.percentile;
            document.getElementById('unit-1').textContent = params.unit;

            // 清空输入框
            document.getElementById('answer-1').value = '';

            // 重置输入框样式
            document.getElementById('answer-1').classList.remove('correct', 'incorrect');

            // 隐藏结果和解析
            document.getElementById('results').classList.remove('show');
            document.getElementById('explanation-section').classList.remove('show');
            document.getElementById('show-explanation-btn').style.display = 'none';
            document.getElementById('score-display').innerHTML = '';
        }

        // 刷新参数函数
        function refreshParams() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questionParams.length);
            } while (newIndex === currentParamIndex && questionParams.length > 1);
            currentParamIndex = newIndex;

            renderQuestion();
        }

        // 生成答案解析内容
        function generateExplanation() {
            const params = questionParams[currentParamIndex];

            return `
                <h3 style="color: #2c3e50; margin-bottom: 20px; text-align: center;">
                    <i class="fas fa-lightbulb" style="color: #f39c12;"></i> 答案解析
                </h3>

                <div class="method-section">
                    <h4 class="method-title"><i class="fas fa-calculator"></i> 方法A</h4>
                    <div class="step">
                        <span class="step-number">1</span>
                        <span>将 n 个观测值从小到大排序。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">2</span>
                        <span>确定值 n × p / 100。此值用于确定第 p 百分位数在有序列表中的位置。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">3</span>
                        <span>如果 n × p / 100 不是整数，则向上取整到下一个整数。位于此位置的观测值即为一个第 p 百分位数。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">4</span>
                        <span>如果 n × p / 100 是整数，则计算位于此位置和下一个（更高）位置的观测值的平均值。</span>
                    </div>

                    <div class="calculation">
                        <p><strong>第${params.percentile}百分位数：</strong></p>
                        <p>n = ${params.n}, p = ${params.percentile}</p>
                        <p>n × p / 100 = ${params.n} × ${params.percentile} / 100 = ${(params.n * params.percentile / 100).toFixed(2)}</p>
                        <p>${params.explanationA}</p>
                        <p><strong>结果：${params.methodA}</strong></p>
                    </div>
                </div>

                <div class="method-section">
                    <h4 class="method-title"><i class="fas fa-calculator"></i> 方法B</h4>
                    <div class="step">
                        <span class="step-number">1</span>
                        <span>将 n 个观测值从小到大排序。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">2</span>
                        <span>确定值 (n+1) × p / 100。此值用于确定第 p 百分位数在有序列表中的位置。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">3</span>
                        <span>如果 (n+1) × p / 100 是整数，则位于此位置的观测值即为一个第 p 百分位数。</span>
                    </div>
                    <div class="step">
                        <span class="step-number">4</span>
                        <span>如果 (n+1) × p / 100 不是整数，但等于 k 加上某个真分数 d，则第 p 百分位数是位于第 k 位和第 (k+1) 位观测值之间距离 d 处的值。</span>
                    </div>

                    <div class="calculation">
                        <p><strong>第${params.percentile}百分位数：</strong></p>
                        <p>n = ${params.n}, p = ${params.percentile}</p>
                        <p>(n+1) × p / 100 = (${params.n}+1) × ${params.percentile} / 100 = ${((params.n + 1) * params.percentile / 100).toFixed(2)}</p>
                        <p>${params.explanationB}</p>
                        <p><strong>结果：${params.methodB}</strong></p>
                    </div>
                </div>

                <div class="result" style="margin-top: 20px;">

                <p class="note" style="margin-top: 15px;">
                    <i class="fas fa-check-circle" style="color: #2ecc71;"></i>
                    方法A和方法B的计算结果都被视为正确答案。
                </p>
            `;
        }

            // 初始化渲染
            renderQuestion();

            // 查看答案解析按钮

                const explanationSection = document.getElementById('explanation-section');

                    explanationSection.classList.remove('show');
                    this.innerHTML = '<i class="fas fa-book-open"></i> 查看答案解析';
                } else {
                    explanationSection.innerHTML = generateExplanation();
                    explanationSection.classList.add('show');
                    this.innerHTML = '<i class="fas fa-book-close"></i> 隐藏答案解析';
                }
            });

            // 提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const params = questionParams[currentParamIndex];

                // 容差设置
                const tolerance = 0.5;

                const userAnswer = parseFloat(document.getElementById('answer-1').value);

                // 检查答案是否匹配方法A或方法B
                const isCorrectA = !isNaN(userAnswer) && Math.abs(userAnswer - params.methodA) <= tolerance;
                const isCorrectB = !isNaN(userAnswer) && Math.abs(userAnswer - params.methodB) <= tolerance;
                const isCorrect = isCorrectA || isCorrectB;

                // 更新输入框样式
                const inputEl = document.getElementById('answer-1');
                inputEl.classList.remove('correct', 'incorrect');
                inputEl.classList.add(isCorrect ? 'correct' : 'incorrect');

                // 生成反馈内容
                let correctAnswerText;
                if (params.methodA === params.methodB) {
                    correctAnswerText = `<strong>${params.methodA}</strong>`;
                } else {
                    correctAnswerText = `<strong>${params.methodA}</strong>（方法A）或 <strong>${params.methodB}</strong>（方法B）`;
                }

                const feedbackClass = isCorrect ? 'correct' : 'incorrect';
                const feedbackIcon = isCorrect ? 'fa-check-circle' : 'fa-times-circle';
                const feedbackColor = isCorrect ? '#2ecc71' : '#e74c3c';

                document.getElementById('score-display').innerHTML = `
                    <div class="feedback ${feedbackClass}">
                        <p><i class="fas ${feedbackIcon}" style="color: ${feedbackColor}; margin-right: 10px;"></i>
                        ${isCorrect ? '回答正确！' : '回答错误'}</p>
                        <p style="margin-top: 10px;">您的答案: <strong>${isNaN(userAnswer) ? '未作答' : userAnswer}</strong></p>
                        <p>正确答案: ${correctAnswerText}</p>
                    </div>
                `;

                // 显示结果
                document.getElementById('results').classList.add('show');

                // 显示查看答案解析按钮
                document.getElementById('show-explanation-btn').style.display = 'flex';

                // 滚动到结果区域
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            });

            // 重新作答按钮事件
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 清空输入框
                document.getElementById('answer-1').value = '';

                // 重置输入框样式

                // 隐藏结果和解析
                document.getElementById('results').classList.remove('show');
                document.getElementById('explanation-section').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('score-display').innerHTML = '';

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
