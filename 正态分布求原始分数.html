<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正态分布求原始分数 - 交互式答题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e6f0ff;
        }

        h1 {
            color: #0052cc;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6699ff;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .question-section {
            margin-bottom: 40px;
        }

        .section-title {
            color: #0052cc;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e6f0ff;
        }

        .question-content {
            background-color: #f8fbff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #4d94ff;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-size: 1.1em;
            color: #0066cc;
            background-color: #f0f7ff;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .answer-input-section {
            background-color: white;
            border: 2px solid #c2d6ff;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0052cc;
            white-space: nowrap;
        }

        .answer-input {
            flex: 1;
            padding: 12px 15px;
            font-size: 1.2rem;
            border: 2px solid #c2d6ff;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            border-color: #0052cc;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .answer-input.correct {
            border-color: #00cc66;
            background-color: #e6ffe6;
        }

        .answer-input.incorrect {
            border-color: #ff6666;
            background-color: #ffe6e6;
        }

        .input-unit {
            font-size: 1.1rem;
            color: #666;
        }

        .input-hint {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn {
            background-color: #0052cc;
            color: white;
        }

        #submit-btn:hover {
            background-color: #003d99;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.3);
        }

        #reset-btn {
            background-color: #f0f7ff;
            color: #0052cc;
            border: 2px solid #c2d6ff;
        }

        #reset-btn:hover {
            background-color: #e6f0ff;
            transform: translateY(-2px);
        }

        .feedback-section {
            margin-top: 40px;
            padding: 25px;
            border-radius: 12px;
            background-color: #f8fbff;
            display: none;
        }

        .feedback-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback-title {
            color: #0052cc;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0052cc;
            margin-bottom: 20px;
        }

        .explanation {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 5px solid #00cc66;
        }

        .explanation-title {
            color: #00994d;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .explanation-content {
            line-height: 1.7;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e6f0ff;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #0052cc;
        }

        .stat-label {
            color: #6699ff;
            margin-top: 5px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .answer-options {
                grid-template-columns: 1fr;
            }

            button {
                padding: 12px 24px;
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>正态分布求原始分数</h1>
            <p class="subtitle">交互式答题与解析</p>
        </header>

        <main>
            <section class="question-section">
                <div class="question-header">
                    <h2 class="section-title">题目内容</h2>
                    <button class="refresh-params-btn" id="refresh-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                        </svg>
                        刷新参数
                    </button>
                </div>

                <div class="question-content" id="question-content">
                    <!-- 动态生成 -->
                </div>

                <h2 class="section-title">请输入你的答案</h2>

                <div class="answer-input-section" id="answer-input-section">
                    <div class="input-group">
                        <label for="user-answer">答案（保留一位小数）：</label>
                        <input type="text" id="user-answer" class="answer-input" autocomplete="off">
                        <span class="input-unit">小时</span>
                    </div>
                    <p class="input-hint">提示：使用容差为 0.05 的数值验证</p>
                </div>

                <div class="controls">
                    <button id="submit-btn">提交答案</button>
                    <button id="reset-btn">重新作答</button>
                </div>
            </section>

            <section class="feedback-section" id="feedback-section">
                <h2 class="feedback-title">答题结果</h2>
                <div class="score-display" id="score-display"></div>

                <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
                <div class="explanation-section explanation">
                    <h3 class="explanation-title">题目解析</h3>
                    <div class="explanation-content" id="explanation-content">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="total-questions">1</div>
                        <div class="stat-label">总题数</div>
                    </div>

                    <div class="stat-item">
                        <div class="stat-value" id="correct-answers">0</div>
                        <div class="stat-label">答对题数</div>
                    </div>

                    <div class="stat-item">
                        <div class="stat-value" id="accuracy-rate">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            // 找x使得P(X > x) = 给定概率，X ~ N(mean, sigma^2)
            const questionParams = [
                {
                    context: '看电视时间',
                    mean: 6.5,
                    sigma: 1.7,
                    percentage: 15,
                    answer: '8.3',
                    zValue: 1.0364,
                    options: ['7.8', '8.3', '8.9', '9.2'],
                    correctOption: 'B'
                },
                {
                    context: '睡眠时间',
                    mean: 7.2,
                    sigma: 1.3,
                    percentage: 10,
                    answer: '8.9',
                    zValue: 1.2816,
                    options: ['8.5', '8.9', '9.3', '9.7'],
                    correctOption: 'B'
                },
                {
                    context: '阅读时间',
                    mean: 3.5,
                    sigma: 1.2,
                    percentage: 5,
                    answer: '5.5',
                    zValue: 1.6449,
                    options: ['4.9', '5.2', '5.5', '5.8'],
                    correctOption: 'C'
                },
                {
                    context: '运动时间',
                    mean: 2.0,
                    sigma: 0.8,
                    percentage: 20,
                    answer: '2.7',
                    zValue: 0.8416,
                    options: ['2.3', '2.5', '2.7', '3.0'],
                    correctOption: 'C'
                },
                {
                    context: '上网时间',
                    mean: 4.5,
                    sigma: 1.5,
                    percentage: 25,
                    answer: '5.5',
                    zValue: 0.6745,
                    options: ['4.9', '5.2', '5.5', '5.9'],
                    correctOption: 'C'
                },
                {
                    context: '学习时间',
                    mean: 5.0,
                    sigma: 1.4,
                    percentage: 10,
                    answer: '6.8',
                    zValue: 1.2816,
                    options: ['6.2', '6.5', '6.8', '7.2'],
                    correctOption: 'C'
                },
                {
                    context: '工作时间',
                    mean: 8.0,
                    sigma: 1.5,
                    percentage: 15,
                    answer: '9.6',
                    zValue: 1.0364,
                    options: ['9.0', '9.3', '9.6', '10.0'],
                    correctOption: 'C'
                },
                {
                    context: '通勤时间',
                    mean: 1.2,
                    sigma: 0.5,
                    percentage: 5,
                    answer: '2.0',
                    zValue: 1.6449,
                    options: ['1.6', '1.8', '2.0', '2.3'],
                    correctOption: 'C'
                }
            ];

            // 当前参数索引
            let currentParamIndex = 0;

            // 状态变量
            let isSubmitted = false;
            let totalQuestions = 1;
            let correctAnswers = 0;
            const TOLERANCE = 0.05; // Tolerance for numerical comparison

            // 获取DOM元素
            const submitBtn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');
            const refreshBtnEl = document.getElementById('refresh-btn');
            const feedbackSection = document.getElementById('feedback-section');
            const scoreDisplay = document.getElementById('score-display');
            const totalQuestionsEl = document.getElementById('total-questions');
            const correctAnswersEl = document.getElementById('correct-answers');
            const accuracyRateEl = document.getElementById('accuracy-rate');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.querySelector('.explanation-section');
            const userAnswerInput = document.getElementById('user-answer');

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionContent = document.getElementById('question-content');
                const explanationContent = document.getElementById('explanation-content');

                // 渲染问题内容
                questionContent.innerHTML = `
                    <p class="question-text">
                        一篇报纸文章报道，人们平均每天花费 <span class="math">${params.mean}</span> 小时${params.context}，标准差为 <span class="math">${params.sigma}</span> 小时。一位心理学家希望采访每天${params.context}最多的 <span class="math">${params.percentage}%</span> 的人群。她假设人们每天${params.context}服从正态分布。一个人每天至少要进行多少小时${params.context}才有资格接受采访？将中间计算至少保留到四位小数。将你的答案四舍五入到一位小数。
                    </p>

                    <p class="question-text">
                        假设每天${params.context}服从均值为 <span class="math">${params.mean}</span> 小时、标准差为 <span class="math">${params.sigma}</span> 小时的正态分布，我们必须找出将${params.context}最多的 <span class="math">${params.percentage}%</span> 的人群与其余人口分开的时间点。换句话说，我们必须找到数字 <span class="math">x</span>，使得相应密度曲线下、<span class="math">x</span> 右侧的面积为 <span class="math">${params.percentage / 100}</span>。
                    </p>

                    <p class="question-text">
                        令 <span class="math">X</span> 为表示每天${params.context}的随机变量，我们正在寻找满足 <span class="math">P(X > x) = ${params.percentage / 100}</span> 的数字 <span class="math">x</span>。
                    </p>
                `;

                // 清空输入框
                if (userAnswerInput) {
                    userAnswerInput.value = '';
                    userAnswerInput.classList.remove('correct', 'incorrect');
                    userAnswerInput.disabled = false;
                }

                // 渲染解析
                explanationContent.innerHTML = `
                    <p>根据题目，我们需要找到标准正态分布的上${params.percentage}%分位数 <span class="math">z_{${params.percentage / 100}}</span>，使得 <span class="math">P(Z > z_{${params.percentage / 100}}) = ${params.percentage / 100}</span>。</p>

                    <p>通过查表或计算器可得：<span class="math">z_{${params.percentage / 100}} = ${params.zValue}</span></p>

                    <p>然后使用逆z变换公式：<span class="math">x = mu + z * sigma</span></p>

                    <p>代入已知值：<span class="math">mu = ${params.mean}</span>, <span class="math">sigma = ${params.sigma}</span>, <span class="math">z = ${params.zValue}</span></p>

                    <p>计算：<span class="math">x = ${params.mean} + ${params.zValue} * ${params.sigma} = ${params.mean} + ${(params.zValue * params.sigma).toFixed(4)} = ${(params.mean + params.zValue * params.sigma).toFixed(4)}</span></p>

                    <p>四舍五入到一位小数：<span class="math">x = ${params.answer}</span> 小时</p>

                    <p>因此，一个人每天至少要进行 <span class="math">${params.answer}</span> 小时${params.context}才有资格接受采访。</p>
                `;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;
                renderQuestion();

                // 隐藏反馈和解析
                feedbackSection.classList.remove('show');
                explanationSection.style.display = 'none';
                showExplanationBtn.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';

                // 重置统计
                correctAnswers = 0;
                correctAnswersEl.textContent = '0';
                accuracyRateEl.textContent = '0%';
                scoreDisplay.textContent = '';
                isSubmitted = false;
            }

            // 刷新参数按钮
            refreshBtnEl.addEventListener('click', refreshParams);

            // 提交答案
            submitBtn.addEventListener('click', function() {
                const userAnswer = parseFloat(userAnswerInput.value);

                if (isNaN(userAnswer)) {
                    alert('请输入有效的数字答案！');
                    return;
                }

                if (isSubmitted) return;

                isSubmitted = true;

                const params = questionParams[currentParamIndex];
                const correctAnswer = parseFloat(params.answer);

                // 使用容差验证答案
                const isCorrect = Math.abs(userAnswer - correctAnswer) <= TOLERANCE;

                // 更新输入框样式
                if (isCorrect) {
                    userAnswerInput.classList.add('correct');
                    correctAnswers = 1;
                    scoreDisplay.textContent = '恭喜！回答正确。';
                } else {
                    userAnswerInput.classList.add('incorrect');
                    correctAnswers = 0;
                    scoreDisplay.textContent = '回答不正确。正确答案是 ' + correctAnswer + ' 小时。';
                }

                // 禁用输入框
                userAnswerInput.disabled = true;

                // 更新统计显示
                correctAnswersEl.textContent = correctAnswers;
                accuracyRateEl.textContent = Math.round((correctAnswers / totalQuestions) * 100) + '%';

                // 显示反馈区域
                feedbackSection.classList.add('show');

                // 显示答案解析按钮
                showExplanationBtn.style.display = 'inline-block';
            });

            // 答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 重新作答
            resetBtn.addEventListener('click', function() {
                // 重置输入框
                userAnswerInput.value = '';
                userAnswerInput.classList.remove('correct', 'incorrect');
                userAnswerInput.disabled = false;

                // 重置状态
                isSubmitted = false;
                correctAnswers = 0;

                // 隐藏反馈区域
                feedbackSection.classList.remove('show');

                // 隐藏答案解析按钮和内容
                showExplanationBtn.style.display = 'none';
                explanationSection.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';

                // 重置统计显示
                correctAnswersEl.textContent = '0';
                accuracyRateEl.textContent = '0%';
                scoreDisplay.textContent = '';
            });

            // ==================== 初始化 ====================
            renderQuestion();
        });
    </script>
</body>
</html>
