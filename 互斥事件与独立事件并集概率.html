<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互斥事件与独立事件并集概率 - 概率练习题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f0f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 82, 204, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #4a90e2, #63b3ed);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e1f0ff;
        }

        h1 {
            color: #2c5282;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 1rem;
            font-weight: normal;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-section {
            background-color: #f7fafc;
            border-left: 4px solid #4299e1;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 25px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-title {
            color: #2d3748;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
        }

        .question-title::before {
            content: '题目';
            background-color: #4299e1;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-content {
            font-size: 1.1rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-weight: bold;
            color: #2b6cb0;
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-title {
            color: #2d3748;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .answer-title::before {
            content: '作答区';
            background-color: #38a169;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 30px;
        }

        .input-group {
            background-color: white;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .input-group:hover {
            border-color: #90cdf4;
        }

        .input-group.correct {
            border-color: #38a169;
            background-color: #f0fff4;
        }

        .input-group.incorrect {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }

        .input-label {
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 12px;
            display: block;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .answer-input {
            width: 150px;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background-color: #f7fafc;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #4299e1;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .answer-input.correct {
            border-color: #38a169;
            background-color: #c6f6d5;
        }

        .answer-input.incorrect {
            border-color: #e53e3e;
            background-color: #fed7d7;
        }

        .input-feedback {
            font-size: 1rem;
            padding: 5px 12px;
            border-radius: 5px;
            display: none;
        }

        .input-feedback.show {
            display: inline-block;
        }

        .input-feedback.correct {
            background-color: #c6f6d5;
            color: #276749;
        }

        .input-feedback.incorrect {
            background-color: #fed7d7;
            color: #c53030;
        }

        .correct-answer-display {
            font-size: 0.95rem;
            color: #718096;
            margin-top: 8px;
            display: none;
        }

        .correct-answer-display.show {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn {
            background-color: #4299e1;
            color: white;
        }

        .submit-btn:hover {
            background-color: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.3);
        }

        .reset-btn {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .reset-btn:hover {
            background-color: #cbd5e0;
            transform: translateY(-2px);
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background-color: #f7fafc;
            border-radius: 12px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .results-title {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .results-title::before {
            content: '结果';
            background-color: #d69e2e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c5282;
            text-align: center;
            margin: 20px 0;
        }

        .score-value {
            font-size: 2.5rem;
            color: #4299e1;
        }

        .explanation {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #38a169;
        }

        .explanation-title {
            color: #2d3748;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .explanation-title::before {
            content: '解析';
            background-color: #38a169;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .explanation-content {
            color: #4a5568;
            line-height: 1.7;
        }

        .explanation-step {
            margin-bottom: 15px;
            padding-left: 10px;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        .explanation-section.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .answer-options {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>互斥事件与独立事件并集概率</h1>
            <p class="subtitle">概率论练习题 - 理解互斥事件与独立事件的区别</p>
        </header>

        <div class="question-container">
            <div class="question-section">
                <div class="question-header">
                    <div class="question-title">问题描述</div>
                    <button class="refresh-params-btn" id="refreshBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        刷新参数
                    </button>
                </div>
                <div class="question-content" id="questionContent">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="answer-section">
                <div class="answer-title">请填写答案</div>

                <div class="answer-options" id="answerOptions">
                    <div class="input-group" id="input-group-a">
                        <label class="input-label">(a) 当 A 和 B 独立时，P(A ∪ B) = </label>
                        <div class="input-wrapper">
                            <input type="number" step="0.0001" class="answer-input" id="answer-a" placeholder="请输入答案">
                            <span class="input-feedback" id="feedback-a"></span>
                        </div>
                        <div class="correct-answer-display" id="correct-display-a">
                            正确答案：<strong id="correct-value-a"></strong>
                        </div>
                    </div>

                    <div class="input-group" id="input-group-b">
                        <label class="input-label">(b) 当 A 和 B 互斥时，P(A ∪ B) = </label>
                        <div class="input-wrapper">
                            <input type="number" step="0.0001" class="answer-input" id="answer-b" placeholder="请输入答案">
                            <span class="input-feedback" id="feedback-b"></span>
                        </div>
                        <div class="correct-answer-display" id="correct-display-b">
                            正确答案：<strong id="correct-value-b"></strong>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button class="submit-btn" id="submitBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        提交答案
                    </button>
                    <button class="reset-btn" id="resetBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                        重新作答
                    </button>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="results-title">答题结果</div>

            <div class="score">
                得分: <span class="score-value" id="scoreValue">0</span> / 100
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanation">
                <div class="explanation-title">知识要点与解析</div>
                <div class="explanation-content" id="explanationContent">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const parameterSets = [
                { pA: 0.35, pB: 0.40, aIndependent: 0.61, aMutuallyExclusive: 0.75, intersection: 0.14 },
                { pA: 0.30, pB: 0.45, aIndependent: 0.615, aMutuallyExclusive: 0.75, intersection: 0.135 },
                { pA: 0.25, pB: 0.50, aIndependent: 0.625, aMutuallyExclusive: 0.75, intersection: 0.125 },
                { pA: 0.40, pB: 0.35, aIndependent: 0.61, aMutuallyExclusive: 0.75, intersection: 0.14 },
                { pA: 0.20, pB: 0.55, aIndependent: 0.64, aMutuallyExclusive: 0.75, intersection: 0.11 },
                { pA: 0.45, pB: 0.30, aIndependent: 0.615, aMutuallyExclusive: 0.75, intersection: 0.135 },
                { pA: 0.28, pB: 0.42, aIndependent: 0.6024, aMutuallyExclusive: 0.70, intersection: 0.1176 },
                { pA: 0.32, pB: 0.38, aIndependent: 0.5984, aMutuallyExclusive: 0.70, intersection: 0.1216 }
            ];

            let currentParamIndex = 0;
            let submitted = false;
            const tolerance = 0.01; // 容差

            // ==================== 渲染函数 ====================
            function renderQuestion() {
                const params = parameterSets[currentParamIndex];
                const questionContent = document.getElementById('questionContent');
                const explanationContent = document.getElementById('explanationContent');

                // 渲染问题文本
                questionContent.innerHTML = `
                    <p>设 A 和 B 为两个事件，使得 <span class="math">P(A) = ${params.pA}</span> 且 <span class="math">P(B) = ${params.pB}</span>。</p>
                    <p>(a) 假设 A 和 B 独立，求 <span class="math">P(A ∪ B)</span>。</p>
                    <p>(b) 假设 A 和 B 互斥，求 <span class="math">P(A ∪ B)</span>。</p>
                    <p><em>请勿四舍五入你的答案。</em></p>
                `;

                // 设置正确答案显示
                document.getElementById('correct-value-a').textContent = params.aIndependent;
                document.getElementById('correct-value-b').textContent = params.aMutuallyExclusive;

                // 渲染解析
                explanationContent.innerHTML = `
                    <div class="explanation-step">
                        <p><strong>核心概念：</strong></p>
                        <ul style="margin-left: 20px; margin-bottom: 15px;">
                            <li><strong>独立事件</strong>：两个事件的发生互不影响，即 <span class="math">P(A∩B) = P(A) · P(B)</span></li>
                            <li><strong>互斥事件</strong>：两个事件不能同时发生，即 <span class="math">P(A∩B) = 0</span></li>
                            <li><strong>并集概率公式</strong>：<span class="math">P(A∪B) = P(A) + P(B) - P(A∩B)</span></li>
                        </ul>
                    </div>

                    <div class="explanation-step">
                        <p><strong>(a) A和B独立时，求 P(A∪B)：</strong></p>
                        <p><em>第一步：计算交集概率</em></p>
                        <p>当A和B独立时，<span class="math">P(A∩B) = P(A) · P(B) = ${params.pA} × ${params.pB} = ${params.intersection}</span></p>
                        <p><em>第二步：应用加法公式</em></p>
                        <p><span class="math">P(A∪B) = P(A) + P(B) - P(A∩B)</span></p>
                        <p><span class="math">P(A∪B) = ${params.pA} + ${params.pB} - ${params.intersection}</span></p>
                        <p><em>第三步：得出结果</em></p>
                        <p><span class="math">P(A∪B) = <strong>${params.aIndependent}</strong></span></p>
                    </div>

                    <div class="explanation-step">
                        <p><strong>(b) A和B互斥时，求 P(A∪B)：</strong></p>
                        <p><em>第一步：确定交集概率</em></p>
                        <p>当A和B互斥时，它们不能同时发生，因此 <span class="math">P(A∩B) = 0</span></p>
                        <p><em>第二步：应用加法公式（简化形式）</em></p>
                        <p>由于 <span class="math">P(A∩B) = 0</span>，加法公式简化为：</p>
                        <p><span class="math">P(A∪B) = P(A) + P(B)</span></p>
                        <p><span class="math">P(A∪B) = ${params.pA} + ${params.pB}</span></p>
                        <p><em>第三步：得出结果</em></p>
                        <p><span class="math">P(A∪B) = <strong>${params.aMutuallyExclusive}</strong></span></p>
                    </div>

                    <div class="explanation-step" style="background-color: #ebf8ff; padding: 15px; border-radius: 8px; margin-top: 15px;">
                        <p><strong>关键区别总结：</strong></p>
                        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                            <tr style="background-color: #bee3f8;">
                                <th style="border: 1px solid #90cdf4; padding: 10px;">条件</th>
                                <th style="border: 1px solid #90cdf4; padding: 10px;">P(A∩B)</th>
                                <th style="border: 1px solid #90cdf4; padding: 10px;">P(A∪B) 计算式</th>
                            </tr>
                            <tr>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">独立</td>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">P(A) · P(B)</td>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">P(A) + P(B) - P(A)·P(B)</td>
                            </tr>
                            <tr>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">互斥</td>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">0</td>
                                <td style="border: 1px solid #90cdf4; padding: 10px; text-align: center;">P(A) + P(B)</td>
                            </tr>
                        </table>
                    </div>

                    <div class="explanation-step" style="margin-top: 15px; padding: 15px; background-color: #f0fff4; border-radius: 8px; border-left: 4px solid #38a169;">
                        <p><strong>答题结果：</strong></p>
                        <p>• (a) 独立情况下的 P(A∪B) = <strong>${params.aIndependent}</strong></p>
                        <p>• (b) 互斥情况下的 P(A∪B) = <strong>${params.aMutuallyExclusive}</strong></p>
                        <p style="margin-top: 10px; color: #276749;"><em>注意：由于互斥事件的交集为0，所以互斥情况下的并集概率通常大于独立情况。</em></p>
                    </div>
                `;
            }

            // 检查数值答案是否正确
            function checkNumericAnswer(userAnswer, correctAnswer) {
                const userNum = parseFloat(userAnswer);
                if (isNaN(userNum)) return false;
                return Math.abs(userNum - correctAnswer) <= tolerance;
            }

            // 刷新参数
            document.getElementById('refreshBtn').addEventListener('click', function() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * parameterSets.length);
                } while (newIndex === currentParamIndex && parameterSets.length > 1);

                currentParamIndex = newIndex;
                submitted = false;

                // 清除输入框状态
                ['a', 'b'].forEach(id => {
                    const input = document.getElementById(`answer-${id}`);
                    input.value = '';
                    input.classList.remove('correct', 'incorrect');
                    input.disabled = false;

                    const feedback = document.getElementById(`feedback-${id}`);
                    feedback.classList.remove('show', 'correct', 'incorrect');
                    feedback.textContent = '';

                    const correctDisplay = document.getElementById(`correct-display-${id}`);
                    correctDisplay.classList.remove('show');

                    const inputGroup = document.getElementById(`input-group-${id}`);
                    inputGroup.classList.remove('correct', 'incorrect');
                });

                // 隐藏结果和解析
                document.getElementById('results').classList.remove('show');
                document.getElementById('explanation').classList.remove('show');
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('show-explanation-btn').textContent = '查看答案解析';

                renderQuestion();
            });

            // 提交答案
            document.getElementById('submitBtn').addEventListener('click', function() {
                const params = parameterSets[currentParamIndex];
                const answerA = document.getElementById('answer-a').value.trim();
                const answerB = document.getElementById('answer-b').value.trim();

                if (answerA === '' || answerB === '') {
                    alert('请填写所有答案！');
                    return;
                }

                if (submitted) return;
                submitted = true;

                let correctCount = 0;
                const totalQuestions = 2;

                // 检查答案 (a)
                const isCorrectA = checkNumericAnswer(answerA, params.aIndependent);
                const inputA = document.getElementById('answer-a');
                const feedbackA = document.getElementById('feedback-a');
                const correctDisplayA = document.getElementById('correct-display-a');
                const inputGroupA = document.getElementById('input-group-a');

                inputA.disabled = true;
                if (isCorrectA) {
                    inputA.classList.add('correct');
                    inputGroupA.classList.add('correct');
                    feedbackA.textContent = '正确！';
                    feedbackA.classList.add('show', 'correct');
                    correctCount++;
                } else {
                    inputA.classList.add('incorrect');
                    inputGroupA.classList.add('incorrect');
                    feedbackA.textContent = '错误';
                    feedbackA.classList.add('show', 'incorrect');
                    correctDisplayA.classList.add('show');
                }

                // 检查答案 (b)
                const isCorrectB = checkNumericAnswer(answerB, params.aMutuallyExclusive);
                const inputB = document.getElementById('answer-b');
                const feedbackB = document.getElementById('feedback-b');
                const correctDisplayB = document.getElementById('correct-display-b');
                const inputGroupB = document.getElementById('input-group-b');

                inputB.disabled = true;
                if (isCorrectB) {
                    inputB.classList.add('correct');
                    inputGroupB.classList.add('correct');
                    feedbackB.textContent = '正确！';
                    feedbackB.classList.add('show', 'correct');
                    correctCount++;
                } else {
                    inputB.classList.add('incorrect');
                    inputGroupB.classList.add('incorrect');
                    feedbackB.textContent = '错误';
                    feedbackB.classList.add('show', 'incorrect');
                    correctDisplayB.classList.add('show');
                }

                // 显示结果
                document.getElementById('results').classList.add('show');

                // 显示答案解析按钮
                document.getElementById('show-explanation-btn').style.display = 'inline-block';

                // 计算得分
                const score = Math.round((correctCount / totalQuestions) * 100);
                document.getElementById('scoreValue').textContent = score;

                // 滚动到结果区域
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            });

            // 重置答题
            document.getElementById('resetBtn').addEventListener('click', function() {
                // 清除输入框状态
                ['a', 'b'].forEach(id => {
                    const input = document.getElementById(`answer-${id}`);
                    input.value = '';
                    input.classList.remove('correct', 'incorrect');
                    input.disabled = false;

                    const feedback = document.getElementById(`feedback-${id}`);
                    feedback.classList.remove('show', 'correct', 'incorrect');
                    feedback.textContent = '';

                    const correctDisplay = document.getElementById(`correct-display-${id}`);
                    correctDisplay.classList.remove('show');

                    const inputGroup = document.getElementById(`input-group-${id}`);
                    inputGroup.classList.remove('correct', 'incorrect');
                });

                // 隐藏结果
                document.getElementById('results').classList.remove('show');

                // 隐藏答案解析按钮和解析内容
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('show-explanation-btn').textContent = '查看答案解析';
                document.getElementById('explanation').classList.remove('show');

                // 重置变量
                submitted = false;

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // 显示答案解析按钮点击事件
            document.getElementById('show-explanation-btn').addEventListener('click', function() {
                var explanation = document.getElementById('explanation');
                if (explanation) {
                    if (explanation.classList.contains('show')) {
                        explanation.classList.remove('show');
                        this.textContent = '查看答案解析';
                    } else {
                        explanation.classList.add('show');
                        this.textContent = '隐藏答案解析';
                    }
                }
            });

            // 初始化渲染
            renderQuestion();
        });
    </script>
</body>
</html>
