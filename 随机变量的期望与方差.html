<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机变量的期望与方差 - 交互式答题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 100, 0.1);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeff5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h1 i {
            color: #3498db;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .question-container {
            margin-bottom: 40px;
        }

        .question-section {
            background-color: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-title {
            color: #2c3e50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-title i {
            color: #3498db;
        }

        .refresh-params-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-params-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .question-content {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .probability-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .probability-table th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .probability-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .probability-table tr:last-child td {
            border-bottom: none;
        }

        .probability-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .formula {
            background-color: #f1f8ff;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Cambria Math', serif;
            text-align: center;
            border-left: 4px solid #3498db;
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-title i {
            color: #2ecc71;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 2px solid #e0e6ed;
            transition: all 0.3s ease;
            flex-wrap: wrap;
        }

        .input-group:hover {
            border-color: #3498db;
        }

        .input-group.correct {
            border-color: #2ecc71;
            background-color: #e8f8ef;
        }

        .input-group.incorrect {
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .input-label {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 600;
            white-space: nowrap;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .answer-input {
            width: 120px;
            padding: 10px 12px;
            font-size: 1.1rem;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .answer-input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .input-feedback {
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-feedback.correct {
            color: #27ae60;
            background-color: #e8f8ef;
        }

        .input-feedback.incorrect {
            color: #e74c3c;
            background-color: #fdedec;
        }

        .correct-answer-display {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .correct-answer-display span {
            color: #27ae60;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submit-btn {
            background-color: #3498db;
            color: white;
        }

        .submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(52, 152, 219, 0.3);
        }

        .reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        .reset-btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(149, 165, 166, 0.3);
        }

        .result-section {
            margin-top: 40px;
            padding: 25px;
            background-color: #f8fafc;
            border-radius: 15px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title i {
            color: #9b59b6;
        }

        .score-display {
            font-size: 1.8rem;
            text-align: center;
            margin: 20px 0;
            color: #2c3e50;
        }

        .score-value {
            font-weight: bold;
            color: #3498db;
        }

        .explanation {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #9b59b6;
        }

        .explanation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation h3 i {
            color: #9b59b6;
        }

        .calculation {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Cambria Math', serif;
        }

        .correct-answer {
            color: #2ecc71;
            font-weight: bold;
        }

        .incorrect-answer {
            color: #e74c3c;
            font-weight: bold;
        }

        .show-explanation-btn {
            display: none;
            margin: 20px auto;
            padding: 14px 28px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .show-explanation-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }
        .explanation-section {
            display: none;
            margin-top: 20px;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 10px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            .question-header {
                flex-direction: column;
                gap: 15px;
            }

            .input-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .answer-input {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> 随机变量的期望与方差</h1>
            <p class="subtitle">交互式数学答题 - 离散随机变量的期望与方差计算</p>
        </header>

        <div class="question-container">
            <div class="question-section">
                <div class="question-header">
                    <h2 class="question-title"><i class="fas fa-question-circle"></i> 题目</h2>
                    <button class="refresh-params-btn" id="refreshParamsBtn">
                        <i class="fas fa-random"></i> 刷新参数
                    </button>
                </div>
                <div class="question-content" id="questionContent">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="answer-section">
                <h2 class="answer-title"><i class="fas fa-pencil-alt"></i> 请填写正确答案</h2>

                <div class="input-group" id="expectedValueGroup">
                    <span class="input-label">期望值 E(X) =</span>
                    <input type="number" step="0.01" class="answer-input" id="expectedValueInput" placeholder="请输入">
                    <span class="input-feedback" id="expectedValueFeedback"></span>
                    <span class="correct-answer-display" id="expectedValueCorrect" style="display: none;"></span>
                </div>

                <div class="input-group" id="varianceGroup">
                    <span class="input-label">方差 Var(X) =</span>
                    <input type="number" step="0.01" class="answer-input" id="varianceInput" placeholder="请输入">
                    <span class="input-feedback" id="varianceFeedback"></span>
                    <span class="correct-answer-display" id="varianceCorrect" style="display: none;"></span>
                </div>

                <p class="hint-text"><i class="fas fa-info-circle"></i> 提示：答案保留两位小数，误差允许范围为 ±0.01</p>

                <div class="controls">
                    <button class="submit-btn" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> 提交答案
                    </button>
                    <button class="reset-btn" id="resetBtn">
                        <i class="fas fa-redo"></i> 重新作答
                    </button>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <h2 class="result-title"><i class="fas fa-chart-line"></i> 答题结果</h2>

            <div class="score-display">
                您的得分: <span class="score-value" id="scoreValue">0</span> / 100
            </div>

            <button class="show-explanation-btn" id="show-explanation-btn">查看答案解析</button>
            <div class="explanation-section explanation" id="explanationSection">
                <!-- 动态生成 -->
            </div>
        </div>


    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== 参数化数据集 ====================
            const questionParams = [
                {
                    values: [-20, -10, 0, 10, 20],
                    probs: [0.45, 0.10, 0.10, 0.10, 0.25],
                    expectedValue: -4,
                    variance: 284
                },
                {
                    values: [-15, -5, 5, 15, 25],
                    probs: [0.30, 0.15, 0.20, 0.20, 0.15],
                    expectedValue: 2.5,
                    variance: 208.75
                },
                {
                    values: [-30, -10, 0, 10, 30],
                    probs: [0.20, 0.20, 0.20, 0.20, 0.20],
                    expectedValue: 0,
                    variance: 400
                },
                {
                    values: [-25, -15, 5, 15, 25],
                    probs: [0.25, 0.15, 0.25, 0.20, 0.15],
                    expectedValue: -0.5,
                    variance: 334.75
                },
                {
                    values: [-18, -8, 2, 12, 22],
                    probs: [0.35, 0.15, 0.20, 0.15, 0.15],
                    expectedValue: -2,
                    variance: 214
                },
                // 数据集 6-25
                {
                    values: [-12, -2, 8, 18, 28],
                    probs: [0.20, 0.25, 0.25, 0.15, 0.15],
                    expectedValue: 6,
                    variance: 176
                },
                {
                    values: [-50, -25, 0, 25, 50],
                    probs: [0.15, 0.20, 0.30, 0.20, 0.15],
                    expectedValue: 0,
                    variance: 1000
                },
                {
                    values: [-5, 0, 5, 10, 15],
                    probs: [0.10, 0.15, 0.30, 0.25, 0.20],
                    expectedValue: 6.5,
                    variance: 37.75
                },
                {
                    values: [-100, -50, 0, 50, 100],
                    probs: [0.10, 0.20, 0.40, 0.20, 0.10],
                    expectedValue: 0,
                    variance: 3000
                },
                {
                    values: [-3, -1, 1, 3, 5],
                    probs: [0.15, 0.20, 0.30, 0.20, 0.15],
                    expectedValue: 1,
                    variance: 6.4
                },
                {
                    values: [-8, -3, 2, 7, 12],
                    probs: [0.25, 0.20, 0.15, 0.20, 0.20],
                    expectedValue: 1.5,
                    variance: 54.75
                },
                {
                    values: [-40, -20, 0, 20, 40],
                    probs: [0.10, 0.15, 0.50, 0.15, 0.10],
                    expectedValue: 0,
                    variance: 440
                },
                {
                    values: [-6, -2, 2, 6, 10],
                    probs: [0.30, 0.15, 0.20, 0.20, 0.15],
                    expectedValue: 1,
                    variance: 33.4
                },
                {
                    values: [-14, -4, 6, 16, 26],
                    probs: [0.40, 0.10, 0.20, 0.15, 0.15],
                    expectedValue: 1.5,
                    variance: 224.75
                },
                {
                    values: [-2, 1, 4, 7, 10],
                    probs: [0.10, 0.25, 0.30, 0.20, 0.15],
                    expectedValue: 4.15,
                    variance: 13.0275
                },
                {
                    values: [-35, -15, 5, 25, 45],
                    probs: [0.20, 0.25, 0.20, 0.20, 0.15],
                    expectedValue: 2,
                    variance: 731
                },
                {
                    values: [-9, -4, 1, 6, 11],
                    probs: [0.15, 0.25, 0.20, 0.25, 0.15],
                    expectedValue: 1,
                    variance: 42.5
                },
                {
                    values: [-22, -12, -2, 8, 18],
                    probs: [0.30, 0.20, 0.15, 0.20, 0.15],
                    expectedValue: -5,
                    variance: 211
                },
                {
                    values: [-7, 0, 7, 14, 21],
                    probs: [0.20, 0.30, 0.25, 0.15, 0.10],
                    expectedValue: 4.55,
                    variance: 74.8775
                },
                {
                    values: [-60, -30, 0, 30, 60],
                    probs: [0.25, 0.15, 0.20, 0.20, 0.20],
                    expectedValue: -1.5,
                    variance: 1926.75
                },
                {
                    values: [-4, 2, 8, 14, 20],
                    probs: [0.25, 0.25, 0.20, 0.15, 0.15],
                    expectedValue: 6.2,
                    variance: 68.76
                },
                {
                    values: [-11, -6, -1, 4, 9],
                    probs: [0.20, 0.20, 0.20, 0.20, 0.20],
                    expectedValue: -1,
                    variance: 50
                },
                {
                    values: [-45, -25, -5, 15, 35],
                    probs: [0.15, 0.25, 0.20, 0.25, 0.15],
                    expectedValue: -5,
                    variance: 680
                },
                {
                    values: [-1, 3, 7, 11, 15],
                    probs: [0.15, 0.30, 0.25, 0.20, 0.10],
                    expectedValue: 6.2,
                    variance: 23.36
                },
                {
                    values: [-55, -35, -15, 5, 25],
                    probs: [0.20, 0.20, 0.20, 0.20, 0.20],
                    expectedValue: -15,
                    variance: 800
                }
            ];

            let currentParamIndex = 0;
            let isSubmitted = false;
            const tolerance = 0.01;

            // ==================== 渲染函数 ====================

            function renderQuestion() {
                const params = questionParams[currentParamIndex];
                const questionContent = document.getElementById('questionContent');

                // 渲染问题文本和表格
                let tableRows = '';
                for (let i = 0; i < params.values.length; i++) {
                    tableRows += `<tr><td>${params.values[i]}</td><td>${params.probs[i]}</td></tr>`;
                }

                questionContent.innerHTML = `
                    <p>设 X 为具有以下概率分布的随机变量：</p>
                    <table class="probability-table">
                        <thead>
                            <tr>
                                <th>X 的值 x</th>
                                <th>P(X = x)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <p>求 X 的期望 E(X) 和方差 Var(X)。</p>
                `;
            }

            function renderExplanation() {
                const params = questionParams[currentParamIndex];
                const explanationSection = document.getElementById('explanationSection');

                let terms = [];
                for (let i = 0; i < params.values.length; i++) {
                    terms.push(`${params.values[i]} × ${params.probs[i]}`);
                }

                let calcVar = '';
                for (let i = 0; i < params.values.length; i++) {
                    const diff = params.values[i] - params.expectedValue;
                    calcVar += `(${diff})² × ${params.probs[i]}`;
                    if (i < params.values.length - 1) calcVar += ' + ';
                }

                explanationSection.innerHTML = `
                    <h3><i class="fas fa-lightbulb"></i> 题目解析</h3>
                    <p><strong>1. 计算期望 E(X)：</strong></p>
                    <div class="calculation">
                        E(X) = Σ xᵢ P(X = xᵢ)<br>
                        = ${terms.join(' + ')}<br>
                        = <strong>${params.expectedValue}</strong>
                    </div>
                    <p><strong>2. 计算方差 Var(X)：</strong></p>
                    <div class="calculation">
                        Var(X) = Σ (xᵢ - E(X))² P(X = xᵢ)<br>
                        = ${calcVar}<br>
                        = <strong>${params.variance}</strong>
                    </div>
                    <p><strong>3. 正确答案：</strong></p>
                    <p>期望 E(X) = <span class="correct-answer">${params.expectedValue}</span></p>
                    <p>方差 Var(X) = <span class="correct-answer">${params.variance}</span></p>
                `;
            }

            function checkAnswer(userAnswer, correctAnswer) {
                return Math.abs(userAnswer - correctAnswer) <= tolerance;
            }

            function refreshParams() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * questionParams.length);
                } while (newIndex === currentParamIndex && questionParams.length > 1);

                currentParamIndex = newIndex;

                // 重置输入框
                const expectedValueInput = document.getElementById('expectedValueInput');
                const varianceInput = document.getElementById('varianceInput');
                const expectedValueGroup = document.getElementById('expectedValueGroup');
                const varianceGroup = document.getElementById('varianceGroup');
                const expectedValueFeedback = document.getElementById('expectedValueFeedback');
                const varianceFeedback = document.getElementById('varianceFeedback');
                const expectedValueCorrect = document.getElementById('expectedValueCorrect');
                const varianceCorrect = document.getElementById('varianceCorrect');

                expectedValueInput.value = '';
                varianceInput.value = '';
                expectedValueInput.disabled = false;
                varianceInput.disabled = false;

                expectedValueGroup.classList.remove('correct', 'incorrect');
                varianceGroup.classList.remove('correct', 'incorrect');

                expectedValueFeedback.textContent = '';
                expectedValueFeedback.classList.remove('correct', 'incorrect');
                varianceFeedback.textContent = '';
                varianceFeedback.classList.remove('correct', 'incorrect');

                expectedValueCorrect.style.display = 'none';
                varianceCorrect.style.display = 'none';

                // 隐藏结果区域
                document.getElementById('resultSection').classList.remove('show');

                // 隐藏解析
                document.getElementById('explanationSection').style.display = 'none';
                document.getElementById('show-explanation-btn').style.display = 'none';
                document.getElementById('show-explanation-btn').textContent = '查看答案解析';

                isSubmitted = false;

                // 重新渲染问题和解释
                renderQuestion();
                renderExplanation();
            }

            // ==================== 事件处理 ====================

            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const refreshParamsBtn = document.getElementById('refreshParamsBtn');
            const resultSection = document.getElementById('resultSection');
            const scoreValue = document.getElementById('scoreValue');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const explanationSection = document.getElementById('explanationSection');

            const expectedValueInput = document.getElementById('expectedValueInput');
            const varianceInput = document.getElementById('varianceInput');
            const expectedValueGroup = document.getElementById('expectedValueGroup');
            const varianceGroup = document.getElementById('varianceGroup');
            const expectedValueFeedback = document.getElementById('expectedValueFeedback');
            const varianceFeedback = document.getElementById('varianceFeedback');
            const expectedValueCorrect = document.getElementById('expectedValueCorrect');
            const varianceCorrect = document.getElementById('varianceCorrect');

            // 刷新参数按钮
            refreshParamsBtn.addEventListener('click', function() {
                refreshParams();
            });

            // 提交按钮事件
            submitBtn.addEventListener('click', function() {
                const evValue = parseFloat(expectedValueInput.value);
                const varValue = parseFloat(varianceInput.value);

                if (isNaN(evValue) || isNaN(varValue)) {
                    alert('请填写所有答案！');
                    return;
                }

                if (isSubmitted) return;
                isSubmitted = true;

                const params = questionParams[currentParamIndex];

                // 检查期望值
                const evCorrect = checkAnswer(evValue, params.expectedValue);
                if (evCorrect) {
                    expectedValueGroup.classList.add('correct');
                    expectedValueFeedback.textContent = '✓ 正确';
                    expectedValueFeedback.classList.add('correct');
                } else {
                    expectedValueGroup.classList.add('incorrect');
                    expectedValueFeedback.textContent = '✗ 错误';
                    expectedValueFeedback.classList.add('incorrect');
                    expectedValueCorrect.innerHTML = `正确答案: <span>${params.expectedValue}</span>`;
                    expectedValueCorrect.style.display = 'block';
                }

                // 检查方差
                const varCorrect = checkAnswer(varValue, params.variance);
                if (varCorrect) {
                    varianceGroup.classList.add('correct');
                    varianceFeedback.textContent = '✓ 正确';
                    varianceFeedback.classList.add('correct');
                } else {
                    varianceGroup.classList.add('incorrect');
                    varianceFeedback.textContent = '✗ 错误';
                    varianceFeedback.classList.add('incorrect');
                    varianceCorrect.innerHTML = `正确答案: <span>${params.variance}</span>`;
                    varianceCorrect.style.display = 'block';
                }

                // 禁用输入
                expectedValueInput.disabled = true;
                varianceInput.disabled = true;

                // 计算得分
                let score = 0;
                if (evCorrect) score += 50;
                if (varCorrect) score += 50;

                // 渲染解释
                renderExplanation();

                // 显示结果区域
                resultSection.classList.add('show');
                scoreValue.textContent = score;

                // 显示答案解析按钮
                showExplanationBtn.style.display = 'inline-block';

                // 滚动到结果区域
                resultSection.scrollIntoView({ behavior: 'smooth' });
            });

            // 显示答案解析按钮点击事件
            showExplanationBtn.addEventListener('click', function() {
                if (explanationSection.style.display === 'none' || explanationSection.style.display === '') {
                    explanationSection.style.display = 'block';
                    this.textContent = '隐藏答案解析';
                } else {
                    explanationSection.style.display = 'none';
                    this.textContent = '查看答案解析';
                }
            });

            // 重置按钮事件
            resetBtn.addEventListener('click', function() {
                // 重置输入框
                expectedValueInput.value = '';
                varianceInput.value = '';
                expectedValueInput.disabled = false;
                varianceInput.disabled = false;

                expectedValueGroup.classList.remove('correct', 'incorrect');
                varianceGroup.classList.remove('correct', 'incorrect');

                expectedValueFeedback.textContent = '';
                expectedValueFeedback.classList.remove('correct', 'incorrect');
                varianceFeedback.textContent = '';
                varianceFeedback.classList.remove('correct', 'incorrect');

                expectedValueCorrect.style.display = 'none';
                varianceCorrect.style.display = 'none';

                // 隐藏结果区域
                resultSection.classList.remove('show');

                // 隐藏解析
                explanationSection.style.display = 'none';
                showExplanationBtn.style.display = 'none';
                showExplanationBtn.textContent = '查看答案解析';

                // 重置状态
                isSubmitted = false;

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            renderQuestion();
            renderExplanation();
        });
    </script>
</body>
</html>
